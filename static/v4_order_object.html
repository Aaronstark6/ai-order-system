<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 标准订单结构</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f4f6f3;
            color: #1f2933;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .topbar {
            background: #23423a;
            color: #ffffff;
            padding: 18px 24px;
        }

        .topbar-inner {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin: 0 auto;
            max-width: 1180px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .back-link {
            color: #d9eee7;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .page {
            margin: 0 auto;
            max-width: 1180px;
            padding: 24px;
        }

        .toolbar {
            align-items: center;
            background: #ffffff;
            border: 1px solid #dbe3df;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 14px 16px;
        }

        .status {
            color: #52605a;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            min-height: 36px;
            padding: 8px 14px;
        }

        .btn-primary {
            background: #1f6f5b;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #185d4c;
        }

        .btn-secondary {
            background: #ffffff;
            border-color: #bac8c2;
            color: #23423a;
        }

        .btn-secondary:hover {
            background: #edf4f1;
        }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .section {
            background: #ffffff;
            border: 1px solid #dbe3df;
            border-radius: 8px;
            overflow: hidden;
        }

        .section-header {
            align-items: center;
            background: #f9fbfa;
            border-bottom: 1px solid #dbe3df;
            display: flex;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
        }

        .section-body {
            display: grid;
            gap: 14px;
            padding: 16px;
        }

        .form-row {
            display: grid;
            gap: 6px;
        }

        label {
            color: #52605a;
            font-size: 13px;
            font-weight: 600;
        }

        input,
        select {
            border: 1px solid #c7d2cd;
            border-radius: 6px;
            color: #1f2933;
            font-size: 14px;
            min-height: 38px;
            padding: 8px 10px;
            width: 100%;
        }

        input:focus,
        select:focus {
            border-color: #1f6f5b;
            box-shadow: 0 0 0 3px rgba(31, 111, 91, 0.12);
            outline: none;
        }

        .field-list {
            display: grid;
            gap: 10px;
        }

        .field-row {
            align-items: end;
            border: 1px solid #dbe3df;
            border-radius: 8px;
            display: grid;
            gap: 8px;
            grid-template-columns: minmax(150px, 1fr) minmax(180px, 2fr);
            padding: 12px;
        }

        .field-label {
            color: #1f2933;
            font-size: 14px;
            font-weight: 700;
        }

        .field-hint {
            color: #66736d;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 6px;
        }

        .field-hint strong {
            color: #43514b;
        }

        .required-badge {
            background: #fff3cc;
            border-radius: 4px;
            color: #8a5a00;
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            margin-left: 6px;
            padding: 2px 6px;
        }

        .field-empty {
            color: #7a8781;
            font-size: 14px;
        }

        .unknown-note {
            background: #fff8e5;
            border: 1px solid #f1d492;
            border-radius: 8px;
            color: #775100;
            font-size: 13px;
            line-height: 1.5;
            padding: 10px 12px;
        }

        details {
            background: #ffffff;
            border: 1px solid #dbe3df;
            border-radius: 8px;
            margin-top: 16px;
            overflow: hidden;
        }

        summary {
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 16px;
        }

        pre {
            background: #17211d;
            color: #d8f3e9;
            font-size: 13px;
            line-height: 1.5;
            max-height: 360px;
            overflow: auto;
            padding: 16px;
            white-space: pre-wrap;
        }

        @media (max-width: 820px) {
            .page {
                padding: 16px;
            }

            .topbar-inner,
            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <h1>V4 标准订单结构</h1>
            <a class="back-link" href="/">返回首页</a>
        </div>
    </header>

    <main class="page">
        <div class="toolbar">
            <div class="status" id="statusText">准备加载</div>
            <div class="actions">
                <button class="btn btn-secondary" type="button" onclick="loadOrderObject()">重新加载</button>
                <button class="btn btn-primary" type="button" onclick="saveOrderObject()">保存 Order Object</button>
            </div>
        </div>

        <div class="grid">
            <section class="section">
                <div class="section-header">
                    <div class="section-title">客户信息</div>
                </div>
                <div class="section-body">
                    <div class="form-row">
                        <label for="customerName">客户名称</label>
                        <input id="customerName" type="text">
                    </div>
                    <div class="form-row">
                        <label for="customerCountry">国家/地区</label>
                        <input id="customerCountry" type="text">
                    </div>
                    <div class="form-row">
                        <label for="customerType">客户类型</label>
                        <input id="customerType" type="text">
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <div class="section-title">订单信息</div>
                </div>
                <div class="section-body">
                    <div class="form-row">
                        <label for="orderNo">订单编号</label>
                        <input id="orderNo" type="text">
                    </div>
                    <div class="form-row">
                        <label for="orderQuantity">数量</label>
                        <input id="orderQuantity" type="text">
                    </div>
                    <div class="form-row">
                        <label for="orderDate">订单日期</label>
                        <input id="orderDate" type="date">
                    </div>
                    <div class="form-row">
                        <label for="salesOwner">业务负责人</label>
                        <input id="salesOwner" type="text">
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <div class="section-title">产品信息</div>
                </div>
                <div class="section-body">
                    <div class="form-row">
                        <label for="productType">产品类型</label>
                        <select id="productType"></select>
                    </div>
                    <div class="form-row">
                        <label for="productName">产品名称</label>
                        <input id="productName" type="text">
                    </div>
                    <div class="form-row">
                        <label>产品字段</label>
                        <div class="field-list" id="productFields"></div>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <div class="section-title">文档信息</div>
                </div>
                <div class="section-body">
                    <div class="form-row">
                        <label for="salespersonCode">业务员代码</label>
                        <input id="salespersonCode" type="text">
                    </div>
                    <div class="form-row">
                        <label for="companyCode">公司代码</label>
                        <input id="companyCode" type="text">
                    </div>
                    <div class="form-row">
                        <label for="sequence">序号</label>
                        <input id="sequence" type="text">
                    </div>
                    <div class="form-row">
                        <label for="ingredientInitials">成分首字母</label>
                        <input id="ingredientInitials" type="text">
                    </div>
                </div>
            </section>
        </div>

        <details>
            <summary>高级信息</summary>
            <pre id="jsonPreview">{}</pre>
        </details>
    </main>

    <script>
        const defaultProductTypes = [{ key: 'default', name: '默认产品类型', fields: [] }];
        let productTypes = defaultProductTypes;
        let unknownProductFields = {};

        function setStatus(text) {
            document.getElementById('statusText').textContent = text;
        }

        function getValue(id) {
            return document.getElementById(id).value.trim();
        }

        function setValue(id, value) {
            document.getElementById(id).value = value || '';
        }

        function normalizeOrderObject(data) {
            return {
                customer: {
                    name: data?.customer?.name || '',
                    country: data?.customer?.country || '',
                    type: data?.customer?.type || ''
                },
                order: {
                    order_no: data?.order?.order_no || '',
                    quantity: data?.order?.quantity || '',
                    order_date: data?.order?.order_date || '',
                    sales_owner: data?.order?.sales_owner || ''
                },
                product: {
                    product_type: data?.product?.product_type || '',
                    product_name: data?.product?.product_name || '',
                    fields: data?.product?.fields && typeof data.product.fields === 'object'
                        ? data.product.fields
                        : {}
                },
                document: {
                    salesperson_code: data?.document?.salesperson_code || '',
                    company_code: data?.document?.company_code || '',
                    sequence: data?.document?.sequence || '',
                    ingredient_initials: data?.document?.ingredient_initials || ''
                }
            };
        }

        async function loadProductTypes() {
            try {
                const response = await fetch('/api/v4/product-types');
                const result = await response.json();
                if (result.success && Array.isArray(result.data) && result.data.length > 0) {
                    productTypes = result.data.map(normalizeProductType);
                } else {
                    productTypes = defaultProductTypes;
                }
            } catch (error) {
                productTypes = defaultProductTypes;
            }
            renderProductTypeOptions();
        }

        function normalizeProductType(type) {
            return {
                key: type.key || type.name || 'default',
                name: type.name || '默认产品类型',
                fields: Array.isArray(type.fields) ? type.fields.map(normalizeProductField) : []
            };
        }

        function normalizeProductField(field) {
            return {
                key: field.key || field.name || '',
                name: field.name || field.key || '未命名字段',
                required: Boolean(field.required),
                type: field.type || 'string',
                description: field.description || '',
                allowed_values: Array.isArray(field.allowed_values) ? field.allowed_values : [],
                forbidden_values: Array.isArray(field.forbidden_values) ? field.forbidden_values : []
            };
        }

        function findProductType(value) {
            return productTypes.find(type => type.key === value || type.name === value) || null;
        }

        function renderProductTypeOptions(selectedValue = '') {
            const select = document.getElementById('productType');
            const options = [...productTypes];
            const selectedType = findProductType(selectedValue);
            const selectedKey = selectedType ? selectedType.key : selectedValue;
            if (selectedValue && !selectedType) {
                options.push({ key: selectedValue, name: selectedValue, fields: [] });
            }

            select.innerHTML = options.map(type => (
                `<option value="${escapeHtml(type.key)}">${escapeHtml(type.name)}</option>`
            )).join('');

            select.value = selectedKey || options[0]?.key || 'default';
        }

        function fillForm(orderObject) {
            const data = normalizeOrderObject(orderObject);
            setValue('customerName', data.customer.name);
            setValue('customerCountry', data.customer.country);
            setValue('customerType', data.customer.type);
            setValue('orderNo', data.order.order_no);
            setValue('orderQuantity', data.order.quantity);
            setValue('orderDate', data.order.order_date);
            setValue('salesOwner', data.order.sales_owner);
            renderProductTypeOptions(data.product.product_type);
            setValue('productName', data.product.product_name);
            renderProductFields(data.product.fields, { preserveUnknown: true });
            setValue('salespersonCode', data.document.salesperson_code);
            setValue('companyCode', data.document.company_code);
            setValue('sequence', data.document.sequence);
            setValue('ingredientInitials', data.document.ingredient_initials);
            updateJsonPreview();
        }

        function collectOrderObject() {
            return {
                customer: {
                    name: getValue('customerName'),
                    country: getValue('customerCountry'),
                    type: getValue('customerType')
                },
                order: {
                    order_no: getValue('orderNo'),
                    quantity: getValue('orderQuantity'),
                    order_date: getValue('orderDate'),
                    sales_owner: getValue('salesOwner')
                },
                product: {
                    product_type: getValue('productType'),
                    product_name: getValue('productName'),
                    fields: collectProductFields()
                },
                document: {
                    salesperson_code: getValue('salespersonCode'),
                    company_code: getValue('companyCode'),
                    sequence: getValue('sequence'),
                    ingredient_initials: getValue('ingredientInitials')
                }
            };
        }

        function renderProductFields(fields, options = {}) {
            const preserveUnknown = Boolean(options.preserveUnknown);
            const container = document.getElementById('productFields');
            const sourceFields = fields || {};
            const selectedType = findProductType(getValue('productType'));
            const fieldDefs = selectedType ? selectedType.fields : [];
            container.innerHTML = '';
            unknownProductFields = {};

            if (fieldDefs.length === 0) {
                container.innerHTML = '<div class="field-empty">当前产品类型暂无字段定义</div>';
                if (preserveUnknown) {
                    unknownProductFields = collectUnknownFields(sourceFields, fieldDefs);
                    renderUnknownFieldNote(container);
                }
                return;
            }

            fieldDefs.forEach(field => {
                const value = fieldValueFromSource(field, sourceFields);
                addProductField(field, value);
            });

            if (preserveUnknown) {
                unknownProductFields = collectUnknownFields(sourceFields, fieldDefs);
                renderUnknownFieldNote(container);
            }
        }

        function addProductField(field, value = '') {
            const container = document.getElementById('productFields');
            const row = document.createElement('div');
            row.className = 'field-row';
            row.dataset.fieldKey = field.key;
            row.innerHTML = `
                <div>
                    <div class="field-label">
                        ${escapeHtml(field.name)}
                        ${field.required ? '<span class="required-badge">必填</span>' : ''}
                    </div>
                    ${renderFieldHints(field)}
                </div>
                <input class="field-value-input" type="text" placeholder="请输入${escapeAttribute(field.name)}" value="${escapeAttribute(value)}">
            `;
            row.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', updateJsonPreview);
            });
            container.appendChild(row);
            updateJsonPreview();
        }

        function renderFieldHints(field) {
            const hints = [];
            if (field.description) {
                hints.push(`<div>${escapeHtml(field.description)}</div>`);
            }
            if (field.allowed_values.length > 0) {
                hints.push(`<div><strong>推荐/允许值：</strong>${escapeHtml(field.allowed_values.join('、'))}</div>`);
            }
            if (field.forbidden_values.length > 0) {
                hints.push(`<div><strong>禁止值：</strong>${escapeHtml(field.forbidden_values.join('、'))}</div>`);
            }
            return hints.length ? `<div class="field-hint">${hints.join('')}</div>` : '';
        }

        function fieldValueFromSource(field, sourceFields) {
            if (Object.prototype.hasOwnProperty.call(sourceFields, field.key)) {
                return sourceFields[field.key];
            }
            if (Object.prototype.hasOwnProperty.call(sourceFields, field.name)) {
                return sourceFields[field.name];
            }
            return '';
        }

        function collectUnknownFields(sourceFields, fieldDefs) {
            const knownKeys = new Set();
            fieldDefs.forEach(field => {
                knownKeys.add(field.key);
                knownKeys.add(field.name);
            });

            return Object.fromEntries(
                Object.entries(sourceFields || {}).filter(([key]) => !knownKeys.has(key))
            );
        }

        function renderUnknownFieldNote(container) {
            const count = Object.keys(unknownProductFields).length;
            if (count === 0) {
                return;
            }

            const note = document.createElement('div');
            note.className = 'unknown-note';
            note.textContent = `检测到 ${count} 个旧数据中的未定义字段，保存时会保留，并由 Validator 给出提醒。`;
            container.appendChild(note);
        }

        function collectProductFields() {
            const fields = { ...unknownProductFields };
            document.querySelectorAll('.field-row').forEach(row => {
                const key = row.dataset.fieldKey;
                const value = row.querySelector('.field-value-input').value.trim();
                if (key) {
                    fields[key] = value;
                }
            });
            return fields;
        }

        async function loadOrderObject() {
            setStatus('加载中');
            await loadProductTypes();
            try {
                const response = await fetch('/api/v4/order-object');
                const result = await response.json();
                if (result.success) {
                    fillForm(result.data);
                    setStatus('已加载');
                } else {
                    setStatus(result.error || '加载失败');
                }
            } catch (error) {
                setStatus('加载失败');
            }
        }

        async function saveOrderObject() {
            const data = collectOrderObject();
            setStatus('保存中');
            try {
                const response = await fetch('/api/v4/order-object', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    fillForm(result.data);
                    setStatus('已保存');
                } else {
                    setStatus(result.error || '保存失败');
                }
            } catch (error) {
                setStatus('保存失败');
            }
        }

        function updateJsonPreview() {
            document.getElementById('jsonPreview').textContent = JSON.stringify(collectOrderObject(), null, 2);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttribute(text) {
            return escapeHtml(String(text ?? '')).replace(/"/g, '&quot;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('input, select').forEach(element => {
                element.addEventListener('input', updateJsonPreview);
                element.addEventListener('change', updateJsonPreview);
            });
            document.getElementById('productType').addEventListener('change', () => {
                renderProductFields({}, { preserveUnknown: false });
            });
            loadOrderObject();
        });
    </script>
</body>
</html>
