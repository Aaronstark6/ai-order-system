<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 产品类型管理系统</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: #f4f6f8;
        }

        .page {
            width: min(1400px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.25;
            color: #111827;
        }

        .home-link {
            color: #1677ff;
            text-decoration: none;
            font-size: 15px;
            white-space: nowrap;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        .button {
            height: 36px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #111827;
            font-size: 14px;
            cursor: pointer;
        }

        .button:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .button.primary {
            border-color: #1677ff;
            background: #1677ff;
            color: #fff;
        }

        .button.primary:hover {
            border-color: #0958d9;
            background: #0958d9;
        }

        .button.danger {
            border-color: #dc2626;
            background: #fff;
            color: #dc2626;
        }

        .button.danger:hover {
            background: #fef2f2;
            border-color: #b91c1c;
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .message.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .message.success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .panel-title {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #111827;
        }

        .panel-body {
            padding: 16px;
        }

        .product-type-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .product-type-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #f1f3f6;
            cursor: pointer;
            transition: background 0.15s;
        }

        .product-type-item:last-child {
            border-bottom: none;
        }

        .product-type-item:hover {
            background: #f8fafc;
        }

        .product-type-item.active {
            background: #eff6ff;
            border-left: 3px solid #1677ff;
        }

        .product-type-info {
            flex: 1;
            min-width: 0;
        }

        .product-type-name {
            font-weight: 600;
            color: #111827;
            margin-bottom: 2px;
        }

        .product-type-key {
            font-size: 12px;
            color: #6b7280;
            font-family: Consolas, monospace;
        }

        .product-type-actions {
            display: flex;
            gap: 4px;
        }

        .product-type-actions .button {
            height: 28px;
            padding: 0 8px;
            font-size: 12px;
        }

        .empty-message {
            padding: 24px 16px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            background: #fafafa;
        }

        .detail-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        .detail-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            background: #dbeafe;
            color: #1e40af;
            font-size: 12px;
            font-weight: 600;
            margin-left: 12px;
        }

        .current-type-info {
            padding: 16px;
            background: #eff6ff;
            border-bottom: 1px solid #dbeafe;
        }

        .current-type-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .current-type-name {
            font-size: 16px;
            font-weight: 700;
            color: #1e40af;
        }

        .fields-section {
            padding: 16px;
        }

        .fields-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .fields-title {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: #374151;
        }

        .fields-count {
            color: #6b7280;
            font-size: 13px;
            font-weight: normal;
            margin-left: 8px;
        }

        .field-list {
            display: grid;
            gap: 8px;
        }

        .field-card {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #fff;
        }

        .field-card:hover {
            border-color: #cbd5e1;
        }

        .field-info {
            min-width: 0;
        }

        .field-name {
            font-weight: 600;
            color: #111827;
            margin-bottom: 2px;
        }

        .field-key {
            font-size: 12px;
            color: #6b7280;
            font-family: Consolas, monospace;
        }

        .field-type {
            font-size: 12px;
            color: #374151;
            padding: 4px 8px;
            background: #f3f4f6;
            border-radius: 4px;
        }

        .field-required {
            font-size: 12px;
            color: #dc2626;
            padding: 4px 8px;
            background: #fef2f2;
            border-radius: 4px;
        }

        .field-actions {
            display: flex;
            gap: 4px;
        }

        .field-actions .button {
            height: 28px;
            padding: 0 10px;
            font-size: 12px;
        }

        .no-fields-message {
            padding: 32px 16px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 6px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #fff;
            border-radius: 12px;
            width: min(480px, calc(100% - 40px));
            max-height: calc(100vh - 80px);
            overflow: auto;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
            color: #6b7280;
            border-radius: 4px;
        }

        .modal-close:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 16px 20px;
            border-top: 1px solid #e5e7eb;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #111827;
            outline: none;
        }

        .form-input:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
        }

        .form-textarea {
            min-height: 80px;
            padding: 10px 12px;
            resize: vertical;
        }

        .form-select {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #111827;
            background: #fff;
            cursor: pointer;
        }

        .form-checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-hint {
            margin-top: 4px;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="topbar-left">
                <h1>V4 产品类型管理系统</h1>
                <a href="/" class="home-link">← 返回首页</a>
            </div>
            <button id="reloadButton" class="button">重新加载</button>
        </div>

        <div id="messageArea"></div>

        <div class="layout">
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">产品类型</h2>
                    <button id="addProductTypeButton" class="button primary">新增类型</button>
                </div>
                <div class="panel-body" id="productTypeList">
                    <div class="empty-message">加载中...</div>
                </div>
            </div>

            <div class="panel" id="detailPanel" style="display: none;">
                <div class="detail-header">
                    <div>
                        <h2 class="detail-title">
                            字段管理
                            <span class="detail-badge" id="currentTypeName"></span>
                        </h2>
                    </div>
                    <button id="editProductTypeButton" class="button">编辑类型</button>
                </div>
                <div class="current-type-info">
                    <div class="current-type-label">当前产品类型</div>
                    <div class="current-type-name" id="currentProductTypeName"></div>
                </div>
                <div class="fields-section">
                    <div class="fields-header">
                        <h3 class="fields-title">
                            字段列表
                            <span class="fields-count" id="fieldsCount"></span>
                        </h3>
                        <button id="addFieldButton" class="button primary">新增字段</button>
                    </div>
                    <div class="field-list" id="fieldList">
                        <div class="no-fields-message">暂无字段，请点击"新增字段"添加</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="productTypeModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="productTypeModalTitle">新增产品类型</h3>
                <button class="modal-close" id="closeProductTypeModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="productTypeKey">类型标识 *</label>
                    <input type="text" id="productTypeKey" class="form-input" placeholder="如：solid_drink">
                    <div class="form-hint">用于程序识别的唯一标识，建议使用英文下划线</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="productTypeName">类型名称 *</label>
                    <input type="text" id="productTypeName" class="form-input" placeholder="如：固体饮料">
                </div>
                <div class="form-group">
                    <label class="form-label" for="productTypeDescription">类型描述</label>
                    <textarea id="productTypeDescription" class="form-input form-textarea" placeholder="描述此产品类型的用途"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelProductTypeButton" class="button">取消</button>
                <button id="saveProductTypeButton" class="button primary">保存</button>
            </div>
        </div>
    </div>

    <div id="fieldModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="fieldModalTitle">新增字段</h3>
                <button class="modal-close" id="closeFieldModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="fieldKey">字段标识 *</label>
                    <input type="text" id="fieldKey" class="form-input" placeholder="如：product_name">
                    <div class="form-hint">用于程序识别的唯一标识</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="fieldName">字段名称 *</label>
                    <input type="text" id="fieldName" class="form-input" placeholder="如：产品名称">
                </div>
                <div class="form-group">
                    <label class="form-label" for="fieldType">字段类型</label>
                    <select id="fieldType" class="form-select">
                        <option value="string">字符串</option>
                        <option value="number">数字</option>
                        <option value="boolean">布尔值</option>
                        <option value="date">日期</option>
                        <option value="array">数组</option>
                        <option value="object">对象</option>
                    </select>
                </div>
                <div class="form-group">
                    <div class="form-checkbox-group">
                        <input type="checkbox" id="fieldRequired" class="form-checkbox">
                        <label for="fieldRequired">必填字段</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelFieldButton" class="button">取消</button>
                <button id="saveFieldButton" class="button primary">保存</button>
            </div>
        </div>
    </div>

    <script>
        const messageArea = document.getElementById("messageArea");
        const productTypeList = document.getElementById("productTypeList");
        const detailPanel = document.getElementById("detailPanel");
        const currentTypeName = document.getElementById("currentTypeName");
        const currentProductTypeName = document.getElementById("currentProductTypeName");
        const fieldsCount = document.getElementById("fieldsCount");
        const fieldList = document.getElementById("fieldList");

        let productTypes = [];
        let currentProductTypeKey = null;
        let editingProductTypeKey = null;
        let editingFieldKey = null;

        function showMessage(text, type = "error") {
            messageArea.innerHTML = `<div class="message ${type}">${escapeHtml(text)}</div>`;
            setTimeout(() => {
                messageArea.innerHTML = "";
            }, 5000);
        }

        function escapeHtml(text) {
            if (!text) return "";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function loadProductTypes() {
            try {
                const response = await fetch("/api/v4/product-types");
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "加载产品类型失败");
                }
                productTypes = result.data || [];
                renderProductTypeList();
                if (productTypes.length > 0 && !currentProductTypeKey) {
                    selectProductType(productTypes[0].key);
                }
            } catch (error) {
                showMessage(`加载产品类型失败：${error.message}`);
                productTypeList.innerHTML = `<div class="empty-message">加载失败：${escapeHtml(error.message)}</div>`;
            }
        }

        function renderProductTypeList() {
            if (!productTypes.length) {
                productTypeList.innerHTML = `<div class="empty-message">暂无产品类型，请点击"新增类型"添加</div>`;
                detailPanel.style.display = "none";
                return;
            }

            productTypeList.innerHTML = `
                <ul class="product-type-list">
                    ${productTypes.map(pt => `
                        <li class="product-type-item ${pt.key === currentProductTypeKey ? "active" : ""}" data-key="${escapeHtml(pt.key)}">
                            <div class="product-type-info">
                                <div class="product-type-name">${escapeHtml(pt.name)}</div>
                                <div class="product-type-key">${escapeHtml(pt.key)}</div>
                            </div>
                            <div class="product-type-actions">
                                <button class="button edit-pt-btn" data-key="${escapeHtml(pt.key)}">编辑</button>
                                <button class="button danger delete-pt-btn" data-key="${escapeHtml(pt.key)}">删除</button>
                            </div>
                        </li>
                    `).join("")}
                </ul>
            `;
        }

        function selectProductType(key) {
            currentProductTypeKey = key;
            const productType = productTypes.find(pt => pt.key === key);
            if (!productType) return;

            detailPanel.style.display = "block";
            currentTypeName.textContent = productType.name;
            currentProductTypeName.textContent = productType.name;
            renderProductTypeList();
            renderFieldList(productType.fields || []);
        }

        function renderFieldList(fields) {
            fieldsCount.textContent = `共 ${fields.length} 个字段`;

            if (!fields.length) {
                fieldList.innerHTML = `<div class="no-fields-message">暂无字段，请点击"新增字段"添加</div>`;
                return;
            }

            fieldList.innerHTML = fields.map(field => `
                <div class="field-card">
                    <div class="field-info">
                        <div class="field-name">${escapeHtml(field.name)}</div>
                        <div class="field-key">${escapeHtml(field.key)}</div>
                    </div>
                    <div class="field-type">${escapeHtml(field.type || "string")}</div>
                    ${field.required ? '<div class="field-required">必填</div>' : ""}
                    <div class="field-actions">
                        <button class="button edit-field-btn" data-key="${escapeHtml(field.key)}">编辑</button>
                        <button class="button danger delete-field-btn" data-key="${escapeHtml(field.key)}">删除</button>
                    </div>
                </div>
            `).join("");
        }

        document.getElementById("reloadButton").addEventListener("click", loadProductTypes);

        document.getElementById("addProductTypeButton").addEventListener("click", () => {
            editingProductTypeKey = null;
            document.getElementById("productTypeModalTitle").textContent = "新增产品类型";
            document.getElementById("productTypeKey").value = "";
            document.getElementById("productTypeKey").disabled = false;
            document.getElementById("productTypeName").value = "";
            document.getElementById("productTypeDescription").value = "";
            document.getElementById("productTypeModal").style.display = "flex";
        });

        productTypeList.addEventListener("click", event => {
            const li = event.target.closest(".product-type-item");
            const editBtn = event.target.closest(".edit-pt-btn");
            const deleteBtn = event.target.closest(".delete-pt-btn");

            if (li && !editBtn && !deleteBtn) {
                selectProductType(li.dataset.key);
                return;
            }

            if (editBtn) {
                const key = editBtn.dataset.key;
                const pt = productTypes.find(p => p.key === key);
                if (pt) {
                    editingProductTypeKey = key;
                    document.getElementById("productTypeModalTitle").textContent = "编辑产品类型";
                    document.getElementById("productTypeKey").value = pt.key;
                    document.getElementById("productTypeKey").disabled = true;
                    document.getElementById("productTypeName").value = pt.name;
                    document.getElementById("productTypeDescription").value = pt.description || "";
                    document.getElementById("productTypeModal").style.display = "flex";
                }
                return;
            }

            if (deleteBtn) {
                const key = deleteBtn.dataset.key;
                if (confirm(`确定要删除产品类型"${key}"吗？`)) {
                    deleteProductType(key);
                }
            }
        });

        async function deleteProductType(key) {
            try {
                const response = await fetch(`/api/v4/product-type/${encodeURIComponent(key)}`, {
                    method: "DELETE"
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "删除失败");
                }
                showMessage(`产品类型"${key}"已删除`, "success");
                if (currentProductTypeKey === key) {
                    currentProductTypeKey = null;
                    detailPanel.style.display = "none";
                }
                await loadProductTypes();
            } catch (error) {
                showMessage(`删除失败：${error.message}`);
            }
        }

        document.getElementById("closeProductTypeModal").addEventListener("click", () => {
            document.getElementById("productTypeModal").style.display = "none";
        });

        document.getElementById("cancelProductTypeButton").addEventListener("click", () => {
            document.getElementById("productTypeModal").style.display = "none";
        });

        document.getElementById("saveProductTypeButton").addEventListener("click", async () => {
            const key = document.getElementById("productTypeKey").value.trim();
            const name = document.getElementById("productTypeName").value.trim();
            const description = document.getElementById("productTypeDescription").value.trim();

            if (!key) {
                showMessage("类型标识不能为空");
                return;
            }
            if (!name) {
                showMessage("类型名称不能为空");
                return;
            }

            const payload = {
                key: key,
                name: name,
                description: description
            };

            try {
                let response;
                if (editingProductTypeKey) {
                    response = await fetch(`/api/v4/product-type/${encodeURIComponent(editingProductTypeKey)}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                } else {
                    response = await fetch("/api/v4/product-types", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                }

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "保存失败");
                }

                showMessage(editingProductTypeKey ? "产品类型已更新" : "产品类型已新增", "success");
                document.getElementById("productTypeModal").style.display = "none";
                await loadProductTypes();
            } catch (error) {
                showMessage(`保存失败：${error.message}`);
            }
        });

        document.getElementById("editProductTypeButton").addEventListener("click", () => {
            if (!currentProductTypeKey) return;
            const pt = productTypes.find(p => p.key === currentProductTypeKey);
            if (pt) {
                editingProductTypeKey = pt.key;
                document.getElementById("productTypeModalTitle").textContent = "编辑产品类型";
                document.getElementById("productTypeKey").value = pt.key;
                document.getElementById("productTypeKey").disabled = true;
                document.getElementById("productTypeName").value = pt.name;
                document.getElementById("productTypeDescription").value = pt.description || "";
                document.getElementById("productTypeModal").style.display = "flex";
            }
        });

        document.getElementById("addFieldButton").addEventListener("click", () => {
            if (!currentProductTypeKey) return;
            editingFieldKey = null;
            document.getElementById("fieldModalTitle").textContent = "新增字段";
            document.getElementById("fieldKey").value = "";
            document.getElementById("fieldKey").disabled = false;
            document.getElementById("fieldName").value = "";
            document.getElementById("fieldType").value = "string";
            document.getElementById("fieldRequired").checked = false;
            document.getElementById("fieldModal").style.display = "flex";
        });

        fieldList.addEventListener("click", event => {
            const editBtn = event.target.closest(".edit-field-btn");
            const deleteBtn = event.target.closest(".delete-field-btn");

            if (editBtn) {
                const key = editBtn.dataset.key;
                const pt = productTypes.find(p => p.key === currentProductTypeKey);
                const field = pt?.fields?.find(f => f.key === key);
                if (field) {
                    editingFieldKey = key;
                    document.getElementById("fieldModalTitle").textContent = "编辑字段";
                    document.getElementById("fieldKey").value = field.key;
                    document.getElementById("fieldKey").disabled = true;
                    document.getElementById("fieldName").value = field.name;
                    document.getElementById("fieldType").value = field.type || "string";
                    document.getElementById("fieldRequired").checked = !!field.required;
                    document.getElementById("fieldModal").style.display = "flex";
                }
                return;
            }

            if (deleteBtn) {
                const key = deleteBtn.dataset.key;
                if (confirm(`确定要删除字段"${key}"吗？`)) {
                    deleteField(key);
                }
            }
        });

        async function deleteField(key) {
            if (!currentProductTypeKey) return;

            try {
                const response = await fetch(
                    `/api/v4/product-type/${encodeURIComponent(currentProductTypeKey)}/field/${encodeURIComponent(key)}`,
                    { method: "DELETE" }
                );
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "删除失败");
                }
                showMessage(`字段"${key}"已删除`, "success");
                await loadProductTypes();
                selectProductType(currentProductTypeKey);
            } catch (error) {
                showMessage(`删除失败：${error.message}`);
            }
        }

        document.getElementById("closeFieldModal").addEventListener("click", () => {
            document.getElementById("fieldModal").style.display = "none";
        });

        document.getElementById("cancelFieldButton").addEventListener("click", () => {
            document.getElementById("fieldModal").style.display = "none";
        });

        document.getElementById("saveFieldButton").addEventListener("click", async () => {
            if (!currentProductTypeKey) return;

            const key = document.getElementById("fieldKey").value.trim();
            const name = document.getElementById("fieldName").value.trim();
            const type = document.getElementById("fieldType").value;
            const required = document.getElementById("fieldRequired").checked;

            if (!key) {
                showMessage("字段标识不能为空");
                return;
            }
            if (!name) {
                showMessage("字段名称不能为空");
                return;
            }

            const payload = {
                key: key,
                name: name,
                type: type,
                required: required
            };

            try {
                let response;
                if (editingFieldKey) {
                    response = await fetch(
                        `/api/v4/product-type/${encodeURIComponent(currentProductTypeKey)}/field/${encodeURIComponent(editingFieldKey)}`,
                        {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        }
                    );
                } else {
                    response = await fetch(
                        `/api/v4/product-type/${encodeURIComponent(currentProductTypeKey)}/fields`,
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        }
                    );
                }

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "保存失败");
                }

                showMessage(editingFieldKey ? "字段已更新" : "字段已新增", "success");
                document.getElementById("fieldModal").style.display = "none";
                await loadProductTypes();
                selectProductType(currentProductTypeKey);
            } catch (error) {
                showMessage(`保存失败：${error.message}`);
            }
        });

        document.addEventListener("click", event => {
            if (event.target.classList.contains("modal-overlay")) {
                event.target.style.display = "none";
            }
        });

        loadProductTypes();
    </script>
</body>
</html>
