<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 &#20135;&#21697;&#32467;&#26500;&#27169;&#22411;&#39044;&#35272;</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: #f4f6f8;
        }

        .page {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        .topbar,
        .top-actions,
        .editor-actions,
        .section-header,
        .example-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .topbar {
            margin-bottom: 22px;
        }

        .top-actions,
        .editor-actions {
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.25;
            color: #111827;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 20px;
            line-height: 1.3;
            color: #111827;
        }

        .home-link {
            color: #1677ff;
            text-decoration: none;
            font-size: 15px;
            white-space: nowrap;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        .button {
            height: 36px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #111827;
            font-size: 14px;
            cursor: pointer;
        }

        .button:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .button.primary {
            border-color: #1677ff;
            background: #1677ff;
            color: #fff;
        }

        .button.primary:hover {
            border-color: #0958d9;
            background: #0958d9;
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .summary-item,
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
        }

        .summary-item {
            padding: 14px 16px;
        }

        .label {
            margin-bottom: 6px;
            color: #6b7280;
            font-size: 13px;
        }

        .value {
            color: #111827;
            font-size: 16px;
            line-height: 1.5;
            word-break: break-word;
        }

        .section {
            margin-top: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .card {
            padding: 16px;
            min-width: 0;
        }

        .card-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #eef0f4;
        }

        .card-title {
            margin: 0;
            font-size: 17px;
            color: #111827;
        }

        .code {
            color: #64748b;
            font-family: Consolas, "Microsoft YaHei", monospace;
            font-size: 13px;
            word-break: break-all;
        }

        .field-list {
            display: grid;
            gap: 8px;
        }

        .field-row {
            display: grid;
            grid-template-columns: minmax(90px, 1.1fr) minmax(80px, 1fr) minmax(64px, auto);
            gap: 8px;
            align-items: start;
            padding: 9px 0;
            border-bottom: 1px solid #f1f3f6;
        }

        .field-row:last-child {
            border-bottom: none;
        }

        .field-name {
            font-weight: 600;
            color: #374151;
            word-break: break-word;
        }

        .field-meta {
            color: #64748b;
            font-size: 13px;
            line-height: 1.45;
            word-break: break-word;
        }

        .badge {
            justify-self: start;
            padding: 3px 8px;
            border-radius: 999px;
            background: #eef6ff;
            color: #2563eb;
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
        }

        .state {
            padding: 14px 16px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #4b5563;
        }

        .error {
            border-color: #fecaca;
            color: #b91c1c;
            background: #fff5f5;
        }

        .success {
            border-color: #bbf7d0;
            color: #15803d;
            background: #f0fdf4;
        }

        .notice {
            margin-bottom: 12px;
            border-color: #bfdbfe;
            color: #1d4ed8;
            background: #eff6ff;
        }

        .schema-editor {
            margin-bottom: 20px;
        }

        .schema-editor textarea {
            width: 100%;
            min-height: 400px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #111827;
            background: #fff;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }

        .schema-editor textarea:focus {
            border-color: #1677ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
        }

        .editor-actions {
            margin-top: 10px;
        }

        #schemaEditorMessage {
            margin-top: 10px;
        }

        .example-toolbar {
            justify-content: flex-start;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .example-toolbar label {
            color: #374151;
            font-weight: 600;
        }

        .example-toolbar select {
            min-width: 280px;
            height: 36px;
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #111827;
            font-size: 14px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f1f3f6;
            text-align: left;
            vertical-align: top;
        }

        .table th {
            color: #475569;
            font-size: 13px;
            background: #f8fafc;
        }

        .table td {
            color: #111827;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
        }

        .validation-card {
            border-left: 4px solid #16a34a;
        }

        .validation-card.warning {
            border-left-color: #f59e0b;
        }

        .validation-card.failed {
            border-left-color: #dc2626;
        }

        .validation-title {
            margin: 0;
            font-size: 17px;
        }

        .validation-title.passed {
            color: #15803d;
        }

        .validation-title.warning {
            color: #b45309;
        }

        .validation-title.failed {
            color: #b91c1c;
        }

        .validation-list {
            margin: 10px 0 0;
            padding-left: 20px;
            color: #374151;
            line-height: 1.6;
        }

        @media (max-width: 720px) {
            .page {
                width: min(100% - 24px, 1180px);
                padding-top: 18px;
            }

            .topbar,
            .summary {
                display: block;
            }

            .top-actions {
                justify-content: flex-start;
                margin-top: 10px;
            }

            .home-link {
                display: inline-block;
            }

            .summary-item + .summary-item {
                margin-top: 10px;
            }

            .field-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="topbar">
            <h1>V4 &#20135;&#21697;&#32467;&#26500;&#27169;&#22411;&#39044;&#35272;</h1>
            <div class="top-actions">
                <button id="editSchemaButton" class="button" type="button" disabled>&#32534;&#36753; Schema</button>
                <a class="home-link" href="/">&#36820;&#22238;&#39318;&#39029;</a>
            </div>
        </div>

        <div class="state notice">&#24403;&#21069;&#20026; V4 &#23454;&#39564;&#21151;&#33021;&#65292;&#20445;&#23384;&#21069;&#20250;&#33258;&#21160;&#22791;&#20221;&#26087; schema&#12290;</div>
        <section id="schemaEditor" class="schema-editor" style="display: none;">
            <textarea id="schemaTextarea" spellcheck="false"></textarea>
            <div class="editor-actions">
                <button id="saveSchemaButton" class="button primary" type="button">&#20445;&#23384; Schema</button>
                <button id="cancelSchemaButton" class="button" type="button">&#21462;&#28040;&#32534;&#36753;</button>
            </div>
            <div id="schemaEditorMessage" class="state" style="display: none;"></div>
        </section>

        <div id="schemaStatus" class="state">&#27491;&#22312;&#21152;&#36733; V4 Product Schema...</div>
        <div id="schemaContent" style="display: none;"></div>

        <section class="section">
            <div class="section-header">
                <h2>V4 &#31034;&#20363;&#35746;&#21333;</h2>
            </div>
            <div class="example-toolbar">
                <label for="exampleSelect">&#31034;&#20363;&#35746;&#21333;</label>
                <select id="exampleSelect" disabled>
                    <option value="">&#27491;&#22312;&#21152;&#36733;&#31034;&#20363;...</option>
                </select>
            </div>
            <div id="exampleStatus" class="state">&#27491;&#22312;&#21152;&#36733; V4 examples...</div>
            <div id="exampleContent" style="display: none;"></div>
        </section>
    </main>

    <script>
        const DEFAULT_EXAMPLE = "soft_capsule_order_example";
        let currentProductSchema = {};

        function t(key) {
            const messages = {
                loadingFailed: "\u52a0\u8f7d\u5931\u8d25",
                noFields: "\u6682\u65e0\u5b57\u6bb5",
                noForms: "\u6682\u65e0\u4ea7\u54c1\u5f62\u5f0f\u914d\u7f6e",
                noTargets: "\u6682\u65e0\u6e32\u67d3\u76ee\u6807\u914d\u7f6e",
                example: "\u793a\u4f8b",
                options: "\u9009\u9879",
                enabledField: "\u542f\u7528\u5b57\u6bb5",
                orderInfo: "\u8ba2\u5355\u4fe1\u606f",
                documentInfo: "\u6587\u6863\u4fe1\u606f",
                productStructure: "\u4ea7\u54c1\u7ed3\u6784",
                formulaRequirements: "\u914d\u65b9\u8981\u6c42",
                packagingRequirements: "\u5305\u88c5\u8981\u6c42",
                imageFields: "\u56fe\u7247\u5b57\u6bb5",
                noExamples: "\u6682\u65e0\u793a\u4f8b\u8ba2\u5355",
                loadSchemaFailed: "V4 Product Schema \u52a0\u8f7d\u5931\u8d25",
                loadExamplesFailed: "V4 examples \u52a0\u8f7d\u5931\u8d25",
                loadExampleFailed: "\u793a\u4f8b\u8ba2\u5355\u52a0\u8f7d\u5931\u8d25",
                validationPassed: "\u7ed3\u6784\u6821\u9a8c\u901a\u8fc7",
                validationFailed: "\u7ed3\u6784\u6821\u9a8c\u5931\u8d25",
                validationRequestFailed: "\u6821\u9a8c\u63a5\u53e3\u8bf7\u6c42\u5931\u8d25",
                warnings: "\u8b66\u544a",
                errors: "\u9519\u8bef",
                invalidJson: "JSON \u4e0d\u5408\u6cd5",
                saveSchemaFailed: "Schema \u4fdd\u5b58\u5931\u8d25",
                saveSchemaSucceeded: "\u4fdd\u5b58\u6210\u529f",
                saving: "\u6b63\u5728\u4fdd\u5b58..."
            };
            return messages[key] || key;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function displayValue(value) {
            if (value === null || value === undefined) {
                return "";
            }
            if (typeof value === "boolean") {
                return String(value);
            }
            if (typeof value === "object") {
                return JSON.stringify(value);
            }
            return String(value);
        }

        function formatExample(field) {
            if (!Object.prototype.hasOwnProperty.call(field, "example")) {
                return "";
            }
            return `${t("example")}: ${escapeHtml(displayValue(field.example))}`;
        }

        function formatOptions(field) {
            if (!Array.isArray(field.options) || field.options.length === 0) {
                return "";
            }
            return `${t("options")}: ${field.options.map(escapeHtml).join(" / ")}`;
        }

        function renderFields(fields) {
            const entries = Object.entries(fields || {});
            if (!entries.length) {
                return `<div class="field-meta">${t("noFields")}</div>`;
            }

            return `
                <div class="field-list">
                    ${entries.map(([key, field]) => `
                        <div class="field-row">
                            <div>
                                <div class="field-name">${escapeHtml(field.label || key)}</div>
                                <div class="code">${escapeHtml(key)}</div>
                            </div>
                            <div class="field-meta">
                                <div>${formatExample(field)}</div>
                                <div>${formatOptions(field)}</div>
                            </div>
                            <span class="badge">${escapeHtml(field.type || "unknown")}</span>
                        </div>
                    `).join("")}
                </div>
            `;
        }

        function renderProductForms(productForms) {
            const entries = Object.entries(productForms || {});
            if (!entries.length) {
                return `<div class="state">${t("noForms")}</div>`;
            }

            return `
                <div class="grid">
                    ${entries.map(([key, form]) => `
                        <article class="card">
                            <div class="card-header">
                                <h3 class="card-title">${escapeHtml(form.label || key)}</h3>
                                <span class="code">${escapeHtml(key)}</span>
                            </div>
                            <div class="field-meta">${t("enabledField")}: ${escapeHtml(form.enabled_field || "")}</div>
                            ${renderFields(form.fields || {})}
                        </article>
                    `).join("")}
                </div>
            `;
        }

        function renderFieldSection(title, fields) {
            return `
                <section class="section">
                    <h2>${escapeHtml(title)}</h2>
                    <article class="card">${renderFields(fields || {})}</article>
                </section>
            `;
        }

        function renderTargets(targets) {
            const entries = Object.entries(targets || {});
            if (!entries.length) {
                return `<div class="state">${t("noTargets")}</div>`;
            }

            return `
                <div class="grid">
                    ${entries.map(([key, target]) => `
                        <article class="card">
                            <div class="card-header">
                                <h3 class="card-title">${escapeHtml(key)}</h3>
                                <span class="badge">${escapeHtml(target.status || "unknown")}</span>
                            </div>
                            <div class="value">${escapeHtml(target.description || "")}</div>
                        </article>
                    `).join("")}
                </div>
            `;
        }

        function renderSchema(schema) {
            const content = document.getElementById("schemaContent");
            content.innerHTML = `
                <section class="summary">
                    <div class="summary-item">
                        <div class="label">version</div>
                        <div class="value">${escapeHtml(schema.version || "")}</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">description</div>
                        <div class="value">${escapeHtml(schema.description || "")}</div>
                    </div>
                </section>

                <section class="section">
                    <h2>product_forms</h2>
                    ${renderProductForms(schema.product_forms || {})}
                </section>

                ${renderFieldSection("packaging", schema.packaging && schema.packaging.fields)}
                ${renderFieldSection("images", schema.images && schema.images.fields)}

                <section class="section">
                    <h2>render_targets</h2>
                    ${renderTargets(schema.render_targets || {})}
                </section>
            `;
        }

        function showSchemaEditorMessage(message, type) {
            const messageBox = document.getElementById("schemaEditorMessage");
            messageBox.classList.remove("error", "success");
            if (type) {
                messageBox.classList.add(type);
            }
            messageBox.textContent = message;
            messageBox.style.display = "block";
        }

        function clearSchemaEditorMessage() {
            const messageBox = document.getElementById("schemaEditorMessage");
            messageBox.classList.remove("error", "success");
            messageBox.textContent = "";
            messageBox.style.display = "none";
        }

        function showSchemaEditor() {
            const editor = document.getElementById("schemaEditor");
            const textarea = document.getElementById("schemaTextarea");
            textarea.value = JSON.stringify(currentProductSchema || {}, null, 2);
            editor.style.display = "block";
            clearSchemaEditorMessage();
            textarea.focus();
        }

        function hideSchemaEditor() {
            document.getElementById("schemaEditor").style.display = "none";
            clearSchemaEditorMessage();
        }

        async function saveSchemaFromEditor() {
            const textarea = document.getElementById("schemaTextarea");
            const saveButton = document.getElementById("saveSchemaButton");
            let parsedSchema;

            try {
                parsedSchema = JSON.parse(textarea.value);
            } catch (error) {
                showSchemaEditorMessage(`${t("invalidJson")}: ${error.message || error}`, "error");
                return;
            }

            saveButton.disabled = true;
            showSchemaEditorMessage(t("saving"), "");

            try {
                const response = await fetch("/api/v4/product-schema", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(parsedSchema)
                });
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || t("saveSchemaFailed"));
                }

                currentProductSchema = result.data || {};
                textarea.value = JSON.stringify(currentProductSchema, null, 2);
                await loadSchema();

                const select = document.getElementById("exampleSelect");
                if (select.value) {
                    await loadExample(select.value);
                }

                showSchemaEditorMessage(t("saveSchemaSucceeded"), "success");
            } catch (error) {
                showSchemaEditorMessage(`${t("saveSchemaFailed")}: ${error.message || error}`, "error");
            } finally {
                saveButton.disabled = false;
            }
        }

        function renderKeyValueCard(title, data, keys) {
            return `
                <article class="card">
                    <div class="card-header">
                        <h3 class="card-title">${escapeHtml(title)}</h3>
                    </div>
                    <div class="field-list">
                        ${keys.map(key => `
                            <div class="field-row">
                                <div class="field-name">${escapeHtml(key)}</div>
                                <div class="value">${escapeHtml(displayValue((data || {})[key]))}</div>
                                <span class="badge">value</span>
                            </div>
                        `).join("")}
                    </div>
                </article>
            `;
        }

        function renderFormulaTable(requirements) {
            const rows = Array.isArray(requirements) ? requirements : [];
            if (!rows.length) {
                return `<article class="card"><div class="field-meta">${t("noFields")}</div></article>`;
            }

            return `
                <article class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>name_en</th>
                                <th>name_cn</th>
                                <th>amount</th>
                                <th>percentage</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(item => `
                                <tr>
                                    <td>${escapeHtml(item.name_en || "")}</td>
                                    <td>${escapeHtml(item.name_cn || "")}</td>
                                    <td>${escapeHtml(item.amount || "")}</td>
                                    <td>${escapeHtml(item.percentage || "")}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </article>
            `;
        }

        function renderValidationResult(validationResult, requestError) {
            if (requestError) {
                return `
                    <article class="card validation-card failed">
                        <h3 class="validation-title failed">${t("validationRequestFailed")}</h3>
                    </article>
                `;
            }

            const result = validationResult || {};
            const errors = Array.isArray(result.errors) ? result.errors : [];
            const warnings = Array.isArray(result.warnings) ? result.warnings : [];
            const stateClass = result.success === false ? "failed" : (warnings.length ? "warning" : "passed");
            const title = result.success === false ? t("validationFailed") : t("validationPassed");

            return `
                <article class="card validation-card ${stateClass}">
                    <h3 class="validation-title ${stateClass}">${title}</h3>
                    ${errors.length ? `
                        <div class="field-meta">${t("errors")}:</div>
                        <ul class="validation-list">
                            ${errors.map(error => `<li>${escapeHtml(error)}</li>`).join("")}
                        </ul>
                    ` : ""}
                    ${warnings.length ? `
                        <div class="field-meta">${t("warnings")}:</div>
                        <ul class="validation-list">
                            ${warnings.map(warning => `<li>${escapeHtml(warning)}</li>`).join("")}
                        </ul>
                    ` : ""}
                </article>
            `;
        }

        function renderExample(example, validationResult, validationRequestFailed) {
            const product = example.product || {};
            const productForm = product.form || "";
            const productFields = productForm && product[productForm] ? product[productForm] : {};
            const content = document.getElementById("exampleContent");

            content.innerHTML = `
                ${renderValidationResult(validationResult, validationRequestFailed)}

                <div class="grid">
                    ${renderKeyValueCard(t("orderInfo"), example.order, [
                        "customer_name",
                        "quantity",
                        "order_date",
                        "customer_type",
                        "sales_owner"
                    ])}
                    ${renderKeyValueCard(t("documentInfo"), example.document, [
                        "sales_name",
                        "salesperson_code",
                        "company_code",
                        "sequence",
                        "ingredient_initials",
                        "product_form"
                    ])}
                </div>

                <section class="section">
                    <h2>${t("productStructure")}</h2>
                    <div class="grid">
                        ${renderKeyValueCard("product", product, ["form"])}
                        ${renderKeyValueCard(productForm || "product_form", productFields, Object.keys(productFields || {}))}
                    </div>
                </section>

                <section class="section">
                    <h2>${t("formulaRequirements")}</h2>
                    ${renderFormulaTable(example.formula && example.formula.requirements)}
                </section>

                <section class="section">
                    <h2>${t("packagingRequirements")}</h2>
                    ${renderKeyValueCard("packaging", example.packaging, [
                        "container_type",
                        "capacity",
                        "container_color",
                        "cap_color",
                        "quantity_per_unit",
                        "seal_method",
                        "label_requirement"
                    ])}
                </section>

                <section class="section">
                    <h2>${t("imageFields")}</h2>
                    ${renderKeyValueCard("images", example.images, [
                        "product_photo",
                        "front_label",
                        "back_label",
                        "capsule_photo"
                    ])}
                </section>
            `;
        }

        async function loadSchema() {
            const status = document.getElementById("schemaStatus");
            const content = document.getElementById("schemaContent");

            try {
                const response = await fetch("/api/v4/product-schema");
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || t("loadingFailed"));
                }

                currentProductSchema = result.data || {};
                renderSchema(currentProductSchema);
                status.style.display = "none";
                content.style.display = "block";
                document.getElementById("editSchemaButton").disabled = false;
            } catch (error) {
                status.classList.add("error");
                status.textContent = `${t("loadSchemaFailed")}: ${error.message || error}`;
            }
        }

        async function loadExample(exampleName) {
            const status = document.getElementById("exampleStatus");
            const content = document.getElementById("exampleContent");
            status.classList.remove("error");
            status.style.display = "block";
            status.textContent = `${t("example")} ${exampleName} loading...`;
            content.style.display = "none";

            try {
                const [exampleResponse, validateResponse] = await Promise.all([
                    fetch(`/api/v4/examples/${encodeURIComponent(exampleName)}`),
                    fetch(`/api/v4/examples/${encodeURIComponent(exampleName)}/validate`)
                ]);
                const result = await exampleResponse.json();

                if (!result.success) {
                    throw new Error(result.error || t("loadingFailed"));
                }

                let validationResult = null;
                let validationRequestFailed = false;
                try {
                    const validateResult = await validateResponse.json();
                    if (!validateResult.success) {
                        validationRequestFailed = true;
                    } else {
                        validationResult = validateResult.data || {};
                    }
                } catch (validationError) {
                    validationRequestFailed = true;
                }

                renderExample(result.data || {}, validationResult, validationRequestFailed);
                status.style.display = "none";
                content.style.display = "block";
            } catch (error) {
                status.classList.add("error");
                status.textContent = `${t("loadExampleFailed")}: ${error.message || error}`;
            }
        }

        async function loadExamples() {
            const status = document.getElementById("exampleStatus");
            const select = document.getElementById("exampleSelect");

            try {
                const response = await fetch("/api/v4/examples");
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || t("loadingFailed"));
                }

                const examples = Array.isArray(result.data) ? result.data : [];
                if (!examples.length) {
                    select.innerHTML = `<option value="">${t("noExamples")}</option>`;
                    status.textContent = t("noExamples");
                    return;
                }

                select.innerHTML = examples.map(example => `
                    <option value="${escapeHtml(example.name)}">${escapeHtml(example.name)}</option>
                `).join("");

                const defaultExists = examples.some(example => example.name === DEFAULT_EXAMPLE);
                select.value = defaultExists ? DEFAULT_EXAMPLE : examples[0].name;
                select.disabled = false;
                select.addEventListener("change", () => {
                    if (select.value) {
                        loadExample(select.value);
                    }
                });

                await loadExample(select.value);
            } catch (error) {
                status.classList.add("error");
                status.textContent = `${t("loadExamplesFailed")}: ${error.message || error}`;
            }
        }

        document.getElementById("editSchemaButton").addEventListener("click", showSchemaEditor);
        document.getElementById("saveSchemaButton").addEventListener("click", saveSchemaFromEditor);
        document.getElementById("cancelSchemaButton").addEventListener("click", hideSchemaEditor);

        loadSchema();
        loadExamples();
    </script>
</body>
</html>
