<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>字段库管理</title>
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            padding: 30px;
            margin: 0;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        label {
            font-weight: bold;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            background: #1677ff;
            color: white;
            cursor: pointer;
            margin-right: 6px;
        }

        button.save {
            background: #52c41a;
        }

        button.delete {
            background: #ff4d4f;
        }

        button.gray {
            background: #666;
        }

        button.warning {
            background: #faad14;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border-bottom: 1px solid #eee;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #fafafa;
        }

        .tips {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .success {
            color: green;
            margin-top: 10px;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .nav {
            margin-bottom: 20px;
        }

        .nav a {
            margin-right: 15px;
        }

        .disabled-row {
            color: #999;
            background: #fafafa;
        }

        .edit-box {
            display: none;
            background: #f7f9fc;
            border: 1px solid #e6edf7;
            padding: 15px;
            margin-top: 10px;
            border-radius: 6px;
        }

        .small-text {
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

<h1>字段库管理</h1>

<div class="nav">
    <a href="/config">返回模板映射管理</a>
    <a href="/">返回首页</a>
</div>

<div class="card">
    <h2>新增字段</h2>

    <p class="tips">
        字段库是全局字段池。AI解析、首页确认表单、模板映射都会使用这里的字段。
    </p>

    <label>字段 key（英文，例如 customer_phone）</label>
    <input id="key" placeholder="customer_phone">

    <label>字段中文名</label>
    <input id="label" placeholder="客户电话">

    <label>字段类型</label>
    <select id="type">
        <option value="text">文本</option>
        <option value="number">数字</option>
        <option value="date">日期</option>
    </select>

    <label>是否必填</label>
    <select id="required">
        <option value="false">否</option>
        <option value="true">是</option>
    </select>

    <label>字段说明</label>
    <textarea id="description" placeholder="例如：客户联系电话、手机号、WhatsApp等"></textarea>

    <button onclick="addField()">新增字段</button>

    <div id="addResult"></div>
</div>

<div class="card">
    <h2>字段列表</h2>

    <p class="tips">
        编辑字段不会改变 key。key 是系统内部标识，建议不要随意删除字段；临时不用请点击“禁用”。
    </p>

    <table>
        <thead>
        <tr>
            <th>状态</th>
            <th>中文名</th>
            <th>Key</th>
            <th>类型</th>
            <th>必填</th>
            <th>说明</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="fieldTable"></tbody>
    </table>
</div>

<script>
    let fields = [];

    async function loadFields() {
        const response = await fetch("/api/fields");
        const result = await response.json();

        if (!result.success) {
            alert("字段库加载失败");
            return;
        }

        fields = result.fields || [];
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById("fieldTable");
        tbody.innerHTML = "";

        fields.forEach(field => {
            const enabled = field.enabled !== false;

            const tr = document.createElement("tr");
            tr.className = enabled ? "" : "disabled-row";

            tr.innerHTML = `
                <td>${enabled ? "启用" : "禁用"}</td>
                <td>${field.label}</td>
                <td>
                    ${field.key}
                    <div class="small-text">key 不可编辑</div>
                </td>
                <td>${field.type}</td>
                <td>${field.required ? "是" : "否"}</td>
                <td>${field.description || ""}</td>
                <td>
                    <button onclick="showEditBox('${field.key}')">编辑</button>
                    <button class="${enabled ? 'warning' : 'save'}" onclick="toggleField('${field.key}')">
                        ${enabled ? "禁用" : "启用"}
                    </button>
                    <button class="delete" onclick="deleteField('${field.key}')">删除</button>
                </td>
            `;

            const editTr = document.createElement("tr");
            editTr.id = "edit_row_" + field.key;
            editTr.style.display = "none";

            editTr.innerHTML = `
                <td colspan="7">
                    <div class="edit-box" id="edit_box_${field.key}">
                        <h3>编辑字段：${field.key}</h3>

                        <label>字段中文名</label>
                        <input id="edit_label_${field.key}" value="${escapeHtml(field.label)}">

                        <label>字段类型</label>
                        <select id="edit_type_${field.key}">
                            <option value="text" ${field.type === "text" ? "selected" : ""}>文本</option>
                            <option value="number" ${field.type === "number" ? "selected" : ""}>数字</option>
                            <option value="date" ${field.type === "date" ? "selected" : ""}>日期</option>
                        </select>

                        <label>是否必填</label>
                        <select id="edit_required_${field.key}">
                            <option value="false" ${field.required ? "" : "selected"}>否</option>
                            <option value="true" ${field.required ? "selected" : ""}>是</option>
                        </select>

                        <label>字段说明</label>
                        <textarea id="edit_description_${field.key}">${escapeHtml(field.description || "")}</textarea>

                        <button class="save" onclick="saveField('${field.key}')">保存修改</button>
                        <button class="gray" onclick="hideEditBox('${field.key}')">取消</button>
                    </div>
                </td>
            `;

            tbody.appendChild(tr);
            tbody.appendChild(editTr);
        });
    }

    function showEditBox(key) {
        const row = document.getElementById("edit_row_" + key);
        const box = document.getElementById("edit_box_" + key);

        if (row && box) {
            row.style.display = "";
            box.style.display = "block";
        }
    }

    function hideEditBox(key) {
        const row = document.getElementById("edit_row_" + key);

        if (row) {
            row.style.display = "none";
        }
    }

    async function addField() {
        const resultDiv = document.getElementById("addResult");
        resultDiv.innerHTML = "";

        const field = {
            key: document.getElementById("key").value.trim(),
            label: document.getElementById("label").value.trim(),
            type: document.getElementById("type").value,
            required: document.getElementById("required").value === "true",
            description: document.getElementById("description").value.trim(),
            enabled: true
        };

        if (!field.key || !field.label) {
            resultDiv.innerHTML = `<p class="error">字段 key 和中文名不能为空</p>`;
            return;
        }

        const response = await fetch("/api/fields", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(field)
        });

        const result = await response.json();

        if (!result.success) {
            resultDiv.innerHTML = `<p class="error">${result.error || "新增失败"}</p>`;
            return;
        }

        document.getElementById("key").value = "";
        document.getElementById("label").value = "";
        document.getElementById("description").value = "";
        document.getElementById("required").value = "false";
        document.getElementById("type").value = "text";

        resultDiv.innerHTML = `<p class="success">新增字段成功</p>`;

        await loadFields();
    }

    async function saveField(key) {
        const field = {
            label: document.getElementById("edit_label_" + key).value.trim(),
            type: document.getElementById("edit_type_" + key).value,
            required: document.getElementById("edit_required_" + key).value === "true",
            description: document.getElementById("edit_description_" + key).value.trim(),
            enabled: getCurrentEnabled(key)
        };

        if (!field.label) {
            alert("字段中文名不能为空");
            return;
        }

        const response = await fetch("/api/fields/" + key, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(field)
        });

        const result = await response.json();

        if (!result.success) {
            alert(result.error || "保存失败");
            return;
        }

        await loadFields();
    }

    async function toggleField(key) {
        const response = await fetch("/api/fields/" + key + "/toggle", {
            method: "POST"
        });

        const result = await response.json();

        if (!result.success) {
            alert(result.error || "操作失败");
            return;
        }

        await loadFields();
    }

    async function deleteField(key) {
        if (!confirm("确定要删除字段：" + key + " 吗？删除可能影响已有模板映射，建议优先使用禁用。")) {
            return;
        }

        const response = await fetch("/api/fields/" + key, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!result.success) {
            alert(result.error || "删除失败");
            return;
        }

        await loadFields();
    }

    function getCurrentEnabled(key) {
        const field = fields.find(item => item.key === key);
        return field ? field.enabled !== false : true;
    }

    function escapeHtml(text) {
        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    loadFields();
</script>

</body>
</html>
