<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 Core 回归测试中心</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111820;
            color: #e6edf3;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }

        header {
            background: #1d2630;
            border-bottom: 1px solid #31404f;
            padding: 18px 24px;
        }

        .header-inner,
        main {
            margin: 0 auto;
            max-width: 1160px;
        }

        .header-inner {
            align-items: center;
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 0;
        }

        .home-link {
            color: #b8c7d6;
            font-size: 14px;
            text-decoration: none;
        }

        .home-link:hover {
            color: #ffffff;
        }

        main {
            display: grid;
            gap: 16px;
            padding: 24px;
        }

        .toolbar,
        .panel,
        details {
            background: #18222d;
            border: 1px solid #31404f;
            border-radius: 8px;
        }

        .toolbar {
            align-items: center;
            display: flex;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .status {
            color: #b8c7d6;
            font-size: 14px;
        }

        button {
            background: #4f7cac;
            border: 1px solid transparent;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
            min-height: 36px;
            padding: 8px 14px;
        }

        button:hover {
            background: #416b97;
        }

        .summary-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .summary-card {
            background: #18222d;
            border: 1px solid #31404f;
            border-radius: 8px;
            padding: 14px 16px;
        }

        .summary-label {
            color: #b8c7d6;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 700;
        }

        .panel {
            overflow: hidden;
        }

        .panel-header {
            align-items: center;
            border-bottom: 1px solid #31404f;
            display: flex;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
        }

        .panel-body {
            display: grid;
            gap: 8px;
            padding: 12px;
        }

        .check-row {
            align-items: flex-start;
            background: #111820;
            border: 1px solid #2a3948;
            border-radius: 7px;
            display: grid;
            gap: 10px;
            grid-template-columns: 96px minmax(180px, 1fr) 2fr;
            padding: 10px 12px;
        }

        .badge {
            border-radius: 999px;
            display: inline-flex;
            font-size: 12px;
            font-weight: 700;
            justify-content: center;
            padding: 4px 10px;
            text-transform: uppercase;
        }

        .badge-ok {
            background: #173f2a;
            color: #8be0ad;
        }

        .badge-warning {
            background: #4a3a13;
            color: #ffd36a;
        }

        .badge-error {
            background: #4b1d1d;
            color: #ff9b9b;
        }

        .check-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .check-message {
            color: #b8c7d6;
            font-size: 14px;
            line-height: 1.5;
        }

        summary {
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 16px;
        }

        pre {
            background: #0e141b;
            color: #cfe1f1;
            font-size: 13px;
            line-height: 1.5;
            max-height: 360px;
            overflow: auto;
            padding: 16px;
            white-space: pre-wrap;
        }

        .empty {
            color: #8fa3b6;
            padding: 16px;
        }

        @media (max-width: 820px) {
            main {
                padding: 16px;
            }

            .header-inner,
            .toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .summary-grid,
            .check-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>V4 Core 回归测试中心</h1>
            <a class="home-link" href="/v4-core-pipeline">返回 Core Pipeline</a>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <div class="status" id="statusText">准备运行回归检查</div>
            <button type="button" onclick="runRegression()">运行回归检查</button>
        </div>

        <section class="summary-grid" id="summaryGrid">
            <div class="summary-card">
                <div class="summary-label">OK</div>
                <div class="summary-value">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">WARNING</div>
                <div class="summary-value">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">ERROR</div>
                <div class="summary-value">0</div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">页面检查</div>
            </div>
            <div class="panel-body" id="pagesBody">
                <div class="empty">尚未运行</div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">规则文件检查</div>
            </div>
            <div class="panel-body" id="ruleFilesBody">
                <div class="empty">尚未运行</div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">Pipeline State 检查</div>
            </div>
            <div class="panel-body" id="pipelineStateBody">
                <div class="empty">尚未运行</div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">Operations 检查</div>
            </div>
            <div class="panel-body" id="operationsBody">
                <div class="empty">尚未运行</div>
            </div>
        </section>

        <details>
            <summary>高级信息</summary>
            <pre id="rawJson">{}</pre>
        </details>
    </main>

    <script>
        let latestResult = null;

        function setStatus(text) {
            document.getElementById('statusText').textContent = text;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderRows(containerId, items) {
            const container = document.getElementById(containerId);
            if (!Array.isArray(items) || !items.length) {
                container.innerHTML = '<div class="empty">暂无检查项</div>';
                return;
            }

            container.innerHTML = items.map(item => {
                const status = item.status || 'warning';
                return `
                    <div class="check-row">
                        <div><span class="badge badge-${escapeHtml(status)}">${escapeHtml(status)}</span></div>
                        <div class="check-name">${escapeHtml(item.name || '')}</div>
                        <div class="check-message">${escapeHtml(item.message || '')}</div>
                    </div>
                `;
            }).join('');
        }

        function countStatuses(result) {
            const allItems = []
                .concat(result.pages || [])
                .concat(result.rule_files || [])
                .concat(result.pipeline_state || [])
                .concat(result.operations || []);
            return allItems.reduce((counts, item) => {
                const status = item.status || 'warning';
                counts[status] = (counts[status] || 0) + 1;
                return counts;
            }, { ok: 0, warning: 0, error: 0 });
        }

        function renderSummary(result) {
            const counts = countStatuses(result);
            document.getElementById('summaryGrid').innerHTML = `
                <div class="summary-card">
                    <div class="summary-label">OK</div>
                    <div class="summary-value">${counts.ok || 0}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">WARNING</div>
                    <div class="summary-value">${counts.warning || 0}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">ERROR</div>
                    <div class="summary-value">${counts.error || 0}</div>
                </div>
            `;
        }

        function renderResult(result) {
            latestResult = result;
            renderSummary(result);
            renderRows('pagesBody', result.pages);
            renderRows('ruleFilesBody', result.rule_files);
            renderRows('pipelineStateBody', result.pipeline_state);
            renderRows('operationsBody', result.operations);
            document.getElementById('rawJson').textContent = JSON.stringify(result, null, 2);
        }

        async function runRegression() {
            setStatus('正在运行回归检查');
            try {
                const response = await fetch('/api/v4/core-regression-status');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const result = await response.json();
                if (!result.success) {
                    setStatus(result.error || '回归检查失败');
                    return;
                }
                renderResult(result);
                const counts = countStatuses(result);
                setStatus(`检查完成：OK ${counts.ok || 0}，WARNING ${counts.warning || 0}，ERROR ${counts.error || 0}`);
            } catch (error) {
                setStatus('回归检查失败');
            }
        }

        document.addEventListener('DOMContentLoaded', runRegression);
    </script>
</body>
</html>
