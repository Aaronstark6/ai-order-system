<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新建模板映射</title>
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        label {
            font-weight: bold;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            background: #1677ff;
            color: white;
            cursor: pointer;
        }

        .tips {
            color: #666;
            font-size: 14px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .nav {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h1>新建模板映射</h1>

<div class="nav">
    <a href="/config">返回模板映射管理</a>
</div>

<div class="card">
    <p class="tips">
        这里用于新建一个模板映射。每个映射都需要一个名称和一个对应的 Excel 模板文件。
    </p>

    <label>映射名</label>
    <input id="profileName" placeholder="例如：固体饮料订单模板">

    <label>Excel模板文件</label>
    <input id="templateFile" type="file" accept=".xlsx,.xlsm">

    <button onclick="createAndUpload()">保存并返回</button>

    <div id="result"></div>
</div>

<script>
    async function createAndUpload() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "";

        const name = document.getElementById("profileName").value.trim();
        const fileInput = document.getElementById("templateFile");

        if (!name) {
            resultDiv.innerHTML = `<p class="error">映射名不能为空</p>`;
            return;
        }

        if (!fileInput.files || fileInput.files.length === 0) {
            resultDiv.innerHTML = `<p class="error">请选择 Excel 模板文件</p>`;
            return;
        }

        resultDiv.innerHTML = `<p>正在保存，请稍候...</p>`;

        const createResponse = await fetch("/api/template-profiles", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name })
        });

        const createResult = await createResponse.json();

        if (!createResult.success) {
            resultDiv.innerHTML = `<p class="error">${createResult.error || "新建映射失败"}</p>`;
            return;
        }

        const profile = createResult.profile;

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        const uploadResponse = await fetch(`/api/template-profiles/${profile.id}/upload-template`, {
            method: "POST",
            body: formData
        });

        const uploadResult = await uploadResponse.json();

        if (!uploadResult.success) {
            resultDiv.innerHTML = `
                <p class="error">映射已创建，但模板上传失败：${uploadResult.error || ""}</p>
                <p><a href="/config">返回模板映射管理</a></p>
            `;
            return;
        }

        resultDiv.innerHTML = `<p class="success">保存成功，正在返回...</p>`;

        setTimeout(() => {
            window.location.href = "/config";
        }, 800);
    }
</script>

</body>
</html>
