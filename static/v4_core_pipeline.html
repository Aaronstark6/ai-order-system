<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 Core Pipeline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f6f7f5;
            color: #1f2933;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }

        header {
            background: #2d3542;
            color: #ffffff;
            padding: 18px 24px;
        }

        .header-inner,
        main {
            margin: 0 auto;
            max-width: 1120px;
        }

        .header-inner {
            align-items: center;
            display: flex;
            justify-content: space-between;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 0;
        }

        .home-link {
            color: #dfe7ee;
            font-size: 14px;
            text-decoration: none;
        }

        .home-link:hover {
            color: #ffffff;
        }

        main {
            padding: 24px;
        }

        .toolbar,
        .template-upload,
        .panel,
        details {
            background: #ffffff;
            border: 1px solid #d9e1dc;
            border-radius: 8px;
        }

        .template-upload {
            display: grid;
            gap: 10px;
            margin-bottom: 16px;
            padding: 14px 16px;
        }

        .template-upload-title {
            color: #2d3542;
            font-size: 16px;
            font-weight: 700;
        }

        .template-upload-row {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .template-file-name {
            color: #58665f;
            font-size: 14px;
        }

        .toolbar {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 14px 16px;
        }

        .status {
            color: #58665f;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            min-height: 36px;
            padding: 8px 14px;
        }

        .btn-primary {
            background: #3e5f8a;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #314f76;
        }

        .btn-secondary {
            background: #ffffff;
            border-color: #bcc8c3;
            color: #2d3542;
        }

        .btn-secondary:hover {
            background: #eef2f6;
        }

        .btn-download {
            background: #ffffff;
            border: 1px solid #7ca58e;
            color: #176039;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
            padding: 8px 14px;
            text-decoration: none;
        }

        .btn-download:hover {
            background: #eef8f1;
        }

        .section-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr;
        }

        .panel {
            overflow: hidden;
        }

        .panel-header {
            align-items: center;
            background: #fbfcfb;
            border-bottom: 1px solid #d9e1dc;
            display: flex;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
        }

        .badge {
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 10px;
        }

        .badge-neutral {
            background: #edf1f3;
            color: #4f5e66;
        }

        .badge-success {
            background: #dff5e6;
            color: #176039;
        }

        .badge-error {
            background: #ffe2e0;
            color: #a8201a;
        }

        .panel-body {
            display: grid;
            gap: 12px;
            padding: 16px;
        }

        .message {
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.55;
            padding: 12px;
        }

        .error {
            background: #ffe2e0;
            color: #a8201a;
        }

        .warning {
            background: #fff3cc;
            color: #8a5a00;
        }

        .success {
            background: #dff5e6;
            color: #176039;
        }

        .export-actions {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-control {
            align-items: center;
            border: 1px dashed #aebbb5;
            border-radius: 6px;
            color: #2d3542;
            display: inline-flex;
            font-size: 14px;
            gap: 8px;
            min-height: 36px;
            padding: 7px 10px;
        }

        .file-control input {
            max-width: 260px;
        }

        .result-meta {
            color: #58665f;
            font-size: 13px;
        }

        .empty {
            color: #7a8781;
            font-size: 14px;
        }

        .render-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .operations-table {
            border-collapse: collapse;
            font-size: 13px;
            width: 100%;
        }

        .operations-table th,
        .operations-table td {
            border: 1px solid #d9e1dc;
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }

        .operations-table th {
            background: #fbfcfb;
            font-weight: 700;
        }

        .value-preview {
            max-width: 420px;
            white-space: pre-wrap;
        }

        .render-card {
            border: 1px solid #d9e1dc;
            border-radius: 8px;
            overflow: hidden;
        }

        .render-title {
            background: #fbfcfb;
            border-bottom: 1px solid #d9e1dc;
            font-size: 14px;
            font-weight: 700;
            padding: 10px 12px;
        }

        .render-body {
            font-size: 14px;
            line-height: 1.7;
            min-height: 96px;
            padding: 12px;
            white-space: pre-wrap;
        }

        details {
            margin-top: 16px;
            overflow: hidden;
        }

        summary {
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 16px;
        }

        pre {
            background: #172126;
            color: #d7eef5;
            font-size: 13px;
            line-height: 1.5;
            max-height: 380px;
            overflow: auto;
            padding: 16px;
            white-space: pre-wrap;
        }

        @media (max-width: 820px) {
            main {
                padding: 16px;
            }

            .header-inner,
            .template-upload-row,
            .toolbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .render-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>V4 Core Pipeline</h1>
            <a class="home-link" href="/">返回首页</a>
        </div>
    </header>

    <main>
        <section class="template-upload">
            <div class="template-upload-title">Excel 模板上传</div>
            <div class="template-upload-row">
                <label class="file-control">
                    选择 Excel 模板
                    <input id="templateFileInput" type="file" accept=".xlsx" onchange="handleTemplateFileChange(event)">
                </label>
                <div class="template-file-name" id="templateFileName">当前模板：未选择</div>
            </div>
        </section>

        <div class="toolbar">
            <div class="status" id="statusText">准备加载当前 Order Object</div>
            <div class="actions">
                <button class="btn-secondary" type="button" onclick="loadOrderObject()">加载当前 Order Object</button>
                <button class="btn-primary" type="button" onclick="runPipeline()">执行核心流水线</button>
            </div>
        </div>

        <div class="section-grid">
            <section class="panel">
                <div class="panel-header">
                    <div class="panel-title">结构校验结果</div>
                    <div class="badge badge-neutral" id="validationBadge">未执行</div>
                </div>
                <div class="panel-body" id="validationBody">
                    <div class="empty">尚未执行核心流水线</div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <div class="panel-title">渲染结果</div>
                    <div class="badge badge-neutral" id="renderBadge">未执行</div>
                </div>
                <div class="panel-body" id="renderBody">
                    <div class="empty">校验通过后会显示 description_fields</div>
                </div>
            </section>
        </div>

        <details>
            <summary>高级信息</summary>
            <pre id="jsonPreview">{}</pre>
        </details>
    </main>

    <script>
        let currentOrderObject = null;
        let currentPipelineResult = null;
        let currentExportResult = null;
        let currentOperationsResult = null;
        let currentRealExcelResult = null;
        let currentStructuredOperationsResult = null;
        let currentStructuredExcelResult = null;
        let currentTableOperationsResult = null;
        let currentBlockOperationsResult = null;
        let currentCombinedExcelResult = null;
        let currentTemplateFile = null;

        function setStatus(text) {
            document.getElementById('statusText').textContent = text;
        }

        async function loadOrderObject() {
            setStatus('正在加载 Order Object');
            try {
                const response = await fetch('/api/v4/order-object');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const result = await response.json();
                if (result.success) {
                    currentOrderObject = result.data;
                    updatePreview();
                    setStatus('已加载当前 Order Object');
                    return currentOrderObject;
                }
                setStatus(result.error || '加载失败');
            } catch (error) {
                setStatus('加载失败');
            }
            return null;
        }

        async function runPipeline() {
            const orderObject = await loadOrderObject();
            if (!orderObject) {
                setStatus('没有可执行的 Order Object');
                return;
            }

            setStatus('正在执行核心流水线');
            try {
                const response = await fetch('/api/v4/core-pipeline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderObject)
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                currentPipelineResult = await response.json();
                currentExportResult = null;
                currentOperationsResult = null;
                currentRealExcelResult = null;
                currentStructuredOperationsResult = null;
                currentStructuredExcelResult = null;
                currentTableOperationsResult = null;
                currentBlockOperationsResult = null;
                currentCombinedExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus(currentPipelineResult.success ? '核心流水线执行完成' : '核心流水线校验失败');
            } catch (error) {
                currentPipelineResult = {
                    success: false,
                    stage: 'request_failed',
                    validation: {
                        valid: false,
                        errors: [{ field: 'pipeline', message: '核心流水线请求失败' }],
                        warnings: []
                    },
                    render: null
                };
                currentExportResult = null;
                currentOperationsResult = null;
                currentRealExcelResult = null;
                currentStructuredOperationsResult = null;
                currentStructuredExcelResult = null;
                currentTableOperationsResult = null;
                currentBlockOperationsResult = null;
                currentCombinedExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus('核心流水线执行失败');
            }
        }

        function renderPipelineResult(result) {
            renderValidation(result.validation || {});
            renderRenderResult(result);
            updatePreview();
        }

        function renderValidation(validation) {
            const valid = Boolean(validation.valid);
            const errors = Array.isArray(validation.errors) ? validation.errors : [];
            const warnings = Array.isArray(validation.warnings) ? validation.warnings : [];
            const badge = document.getElementById('validationBadge');
            badge.className = valid ? 'badge badge-success' : 'badge badge-error';
            badge.textContent = valid ? '校验通过' : '校验失败';

            const body = document.getElementById('validationBody');
            const items = [];
            if (errors.length === 0) {
                items.push('<div class="message badge-success">没有结构错误</div>');
            } else {
                errors.forEach(item => {
                    items.push(`<div class="message error"><strong>${escapeHtml(item.field || 'order_object')}</strong><br>${escapeHtml(item.message || '')}</div>`);
                });
            }
            warnings.forEach(item => {
                items.push(`<div class="message warning"><strong>${escapeHtml(item.field || 'warning')}</strong><br>${escapeHtml(item.message || '')}</div>`);
            });
            body.innerHTML = items.join('');
        }

        function renderRenderResult(result) {
            const badge = document.getElementById('renderBadge');
            const body = document.getElementById('renderBody');
            if (!result.success || result.stage === 'validation_failed' || !result.render) {
                badge.className = 'badge badge-neutral';
                badge.textContent = '未执行';
                body.innerHTML = '<div class="empty">请先修复订单结构错误，暂不执行渲染。</div>';
                return;
            }

            const render = result.render;
            const fields = render.description_fields || {};
            badge.className = render.success ? 'badge badge-success' : 'badge badge-error';
            badge.textContent = render.success ? '已渲染' : '渲染失败';
            body.innerHTML = `
                ${renderWarnings(render.warnings || [])}
                ${renderExportControls(fields)}
                ${renderOperationsControls(fields)}
                ${renderOperationsPreview()}
                ${renderRealExcelControls()}
                ${renderStructuredOperationsControls()}
                ${renderStructuredOperationsPreview()}
                ${renderStructuredRealExcelControls()}
                ${renderTableOperationsControls()}
                ${renderTableOperationsPreview()}
                ${renderBlockOperationsControls()}
                ${renderBlockOperationsPreview()}
                ${renderCombinedRealExcelControls()}
                <div class="render-grid">
                    ${renderFieldCard('product_form', fields.product_form)}
                    ${renderFieldCard('product_requirements', fields.product_requirements)}
                    ${renderFieldCard('formula_requirements', fields.formula_requirements)}
                    ${renderFieldCard('packaging_requirements', fields.packaging_requirements)}
                </div>
            `;
        }

        function renderExportControls(fields) {
            const hasDescriptionFields = fields && Object.keys(fields).length > 0;
            if (!hasDescriptionFields) {
                return '';
            }

            const downloadLink = currentExportResult?.download_url
                ? `<a class="btn-download" href="${escapeHtml(currentExportResult.download_url)}" target="_blank" rel="noopener">下载调试 Excel</a>`
                : '';
            const successMessage = currentExportResult?.download_url
                ? '<div class="message success">调试 Excel 已生成</div>'
                : '';

            return `
                <div class="export-actions">
                    <button class="btn-secondary" type="button" onclick="exportDebugExcel()">导出调试 Excel</button>
                    ${downloadLink}
                </div>
                ${successMessage}
            `;
        }

        async function exportDebugExcel() {
            const descriptionFields = currentPipelineResult?.render?.description_fields;
            if (!descriptionFields) {
                setStatus('暂无渲染结果，无法导出');
                return;
            }

            setStatus('正在生成调试 Excel');
            try {
                const response = await fetch('/api/v4/core-pipeline/export-debug-excel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(descriptionFields)
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const result = await response.json();
                if (!result.success) {
                    setStatus(result.error || 'Excel 生成失败');
                    return;
                }
                if (!result.download_url) {
                    setStatus('下载链接生成失败');
                    return;
                }

                currentExportResult = result;
                setStatus('调试 Excel 已生成');
                renderPipelineResult(currentPipelineResult);
            } catch (error) {
                setStatus('Excel 生成失败');
            }
        }

        function renderOperationsControls(fields) {
            const hasDescriptionFields = fields && Object.keys(fields).length > 0;
            if (!hasDescriptionFields) {
                return '';
            }
            return `
                <div class="export-actions">
                    <button class="btn-secondary" type="button" onclick="generateOperationsPreview()">生成 Operations 预览</button>
                </div>
            `;
        }

        async function generateOperationsPreview() {
            const descriptionFields = currentPipelineResult?.render?.description_fields;
            if (!descriptionFields) {
                setStatus('暂无渲染结果，无法生成 Operations');
                return;
            }

            setStatus('正在生成 Operations 预览');
            try {
                const response = await fetch('/api/v4/core-pipeline/operations-preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(descriptionFields)
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                currentOperationsResult = await response.json();
                currentRealExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus(currentOperationsResult.success ? 'Operations 预览已生成' : 'Operations 预览生成失败');
            } catch (error) {
                currentOperationsResult = {
                    success: false,
                    operations: [],
                    warnings: ['Operations 预览请求失败']
                };
                currentRealExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus('Operations 预览生成失败');
            }
        }

        function renderStructuredOperationsControls() {
            if (!currentPipelineResult?.render?.description_fields) {
                return '';
            }
            return `
                <div class="export-actions">
                    <button class="btn-secondary" type="button" onclick="generateStructuredOperationsPreview()">生成结构化 Operations</button>
                </div>
            `;
        }

        async function generateStructuredOperationsPreview() {
            let orderObject = currentOrderObject;
            if (!orderObject) {
                orderObject = await loadOrderObject();
            }
            if (!orderObject) {
                setStatus('没有可用于结构化映射的 Order Object');
                return;
            }

            setStatus('正在生成结构化 Operations');
            try {
                const response = await fetch('/api/v4/core-pipeline/structured-operations-preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderObject)
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                currentStructuredOperationsResult = await response.json();
                currentStructuredExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus(currentStructuredOperationsResult.success ? '结构化 Operations 已生成' : '结构化 Operations 生成失败');
            } catch (error) {
                currentStructuredOperationsResult = {
                    success: false,
                    operations: [],
                    warnings: ['结构化 Operations 请求失败']
                };
                currentStructuredExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus('结构化 Operations 生成失败');
            }
        }

        function renderTableOperationsControls() {
            if (!currentPipelineResult?.render?.description_fields) {
                return '';
            }
            return `
                <div class="export-actions">
                    <button class="btn-secondary" type="button" onclick="generateTableOperationsPreview()">生成动态表格 Operations</button>
                </div>
            `;
        }

        async function generateTableOperationsPreview() {
            let orderObject = currentOrderObject;
            if (!orderObject) {
                orderObject = await loadOrderObject();
            }
            if (!orderObject) {
                setStatus('没有可用于动态表格的 Order Object');
                return;
            }

            setStatus('正在生成动态表格 Operations');
            try {
                const response = await fetch('/api/v4/core-pipeline/table-operations-preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderObject)
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                currentTableOperationsResult = await response.json();
                currentCombinedExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus(currentTableOperationsResult.success ? '动态表格 Operations 已生成' : '动态表格 Operations 生成失败');
            } catch (error) {
                currentTableOperationsResult = {
                    success: false,
                    operations: [],
                    warnings: ['动态表格 Operations 请求失败']
                };
                currentCombinedExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus('动态表格 Operations 生成失败');
            }
        }

        function renderBlockOperationsControls() {
            if (!currentPipelineResult?.render?.description_fields) {
                return '';
            }
            return `
                <div class="export-actions">
                    <button class="btn-secondary" type="button" onclick="generateBlockOperationsPreview()">生成区块 Operations</button>
                </div>
            `;
        }

        async function generateBlockOperationsPreview() {
            let orderObject = currentOrderObject;
            if (!orderObject) {
                orderObject = await loadOrderObject();
            }
            if (!orderObject) {
                setStatus('没有可用于区块合并的 Order Object');
                return;
            }

            setStatus('正在生成区块 Operations');
            try {
                const response = await fetch('/api/v4/core-pipeline/block-operations-preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderObject)
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                currentBlockOperationsResult = await response.json();
                currentCombinedExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus(currentBlockOperationsResult.success ? '区块 Operations 已生成' : '区块 Operations 生成失败');
            } catch (error) {
                currentBlockOperationsResult = {
                    success: false,
                    operations: [],
                    warnings: ['区块 Operations 请求失败']
                };
                currentCombinedExcelResult = null;
                renderPipelineResult(currentPipelineResult);
                setStatus('区块 Operations 生成失败');
            }
        }

        function renderOperationsPreview() {
            if (!currentOperationsResult) {
                return '';
            }

            const warnings = Array.isArray(currentOperationsResult.warnings) ? currentOperationsResult.warnings : [];
            const operations = Array.isArray(currentOperationsResult.operations) ? currentOperationsResult.operations : [];
            return `
                ${warnings.map(item => `<div class="message warning">${escapeHtml(item)}</div>`).join('')}
                <table class="operations-table">
                    <thead>
                        <tr>
                            <th>source_field</th>
                            <th>target_cell</th>
                            <th>operation</th>
                            <th>value 预览</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${operations.map(operation => `
                            <tr>
                                <td>${escapeHtml(operation.source_field || '')}</td>
                                <td>${escapeHtml(operation.target_cell || '')}</td>
                                <td>${escapeHtml(operation.operation || '')}</td>
                                <td class="value-preview">${escapeHtml(operation.value || '')}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderStructuredOperationsPreview() {
            if (!currentStructuredOperationsResult) {
                return '';
            }

            const warnings = Array.isArray(currentStructuredOperationsResult.warnings) ? currentStructuredOperationsResult.warnings : [];
            const operations = Array.isArray(currentStructuredOperationsResult.operations) ? currentStructuredOperationsResult.operations : [];
            return `
                <div class="message success">当前 target_cell 来源：手动配置 / 标签自动定位（取自结构化映射配置）</div>
                ${warnings.map(item => `<div class="message warning">${escapeHtml(item)}</div>`).join('')}
                <table class="operations-table">
                    <thead>
                        <tr>
                            <th>字段名称</th>
                            <th>来源路径</th>
                            <th>目标单元格</th>
                            <th>值预览</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${operations.map(operation => `
                            <tr>
                                <td>${escapeHtml(operation.label || '')}</td>
                                <td>${escapeHtml(operation.source_path || '')}</td>
                                <td>${escapeHtml(operation.target_cell || '')}</td>
                                <td class="value-preview">${escapeHtml(operation.value || '')}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderTableOperationsPreview() {
            if (!currentTableOperationsResult) {
                return '';
            }

            const warnings = Array.isArray(currentTableOperationsResult.warnings) ? currentTableOperationsResult.warnings : [];
            const operations = Array.isArray(currentTableOperationsResult.operations) ? currentTableOperationsResult.operations : [];
            return `
                <div class="message success">动态表格 Operations</div>
                ${warnings.map(item => `<div class="message warning">${escapeHtml(item)}</div>`).join('')}
                <table class="operations-table">
                    <thead>
                        <tr>
                            <th>table_name</th>
                            <th>target_cell</th>
                            <th>field</th>
                            <th>value</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${operations.map(operation => `
                            <tr>
                                <td>${escapeHtml(operation.table_name || '')}</td>
                                <td>${escapeHtml(operation.target_cell || '')}</td>
                                <td>${escapeHtml(operation.field || '')}</td>
                                <td class="value-preview">${escapeHtml(operation.value || '')}</td>
                            </tr>
                        `).join('') || '<tr><td colspan="4">暂无动态表格 Operations</td></tr>'}
                    </tbody>
                </table>
            `;
        }

        function renderBlockOperationsPreview() {
            if (!currentBlockOperationsResult) {
                return '';
            }

            const warnings = Array.isArray(currentBlockOperationsResult.warnings) ? currentBlockOperationsResult.warnings : [];
            const operations = Array.isArray(currentBlockOperationsResult.operations) ? currentBlockOperationsResult.operations : [];
            return `
                <div class="message success">区块 Operations</div>
                ${warnings.map(item => `<div class="message warning">${escapeHtml(item)}</div>`).join('')}
                <table class="operations-table">
                    <thead>
                        <tr>
                            <th>block_name</th>
                            <th>target_cell</th>
                            <th>value</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${operations.map(operation => `
                            <tr>
                                <td>${escapeHtml(operation.block_name || '')}</td>
                                <td>${escapeHtml(operation.target_cell || '')}</td>
                                <td class="value-preview">${escapeHtml(operation.value || '')}</td>
                            </tr>
                        `).join('') || '<tr><td colspan="3">暂无区块 Operations</td></tr>'}
                    </tbody>
                </table>
            `;
        }

        function renderRealExcelControls() {
            const operations = Array.isArray(currentOperationsResult?.operations) ? currentOperationsResult.operations : [];
            if (!operations.length) {
                return '';
            }

            const warnings = Array.isArray(currentRealExcelResult?.warnings) ? currentRealExcelResult.warnings : [];
            const downloadLink = currentRealExcelResult?.download_url
                ? `<a class="btn-download" href="${escapeHtml(currentRealExcelResult.download_url)}" target="_blank" rel="noopener">下载真实 Excel</a>`
                : '';
            const successMessage = currentRealExcelResult?.download_url
                ? `<div class="message success">真实 Excel 已生成</div>
                   <div class="result-meta">operations_count：${escapeHtml(currentRealExcelResult.operations_count || 0)}，warnings_count：${escapeHtml(warnings.length)}</div>`
                : '';

            return `
                <div class="export-actions">
                    <button class="btn-primary" type="button" onclick="exportRealExcel()">生成真实 Excel</button>
                    ${downloadLink}
                </div>
                ${successMessage}
                ${warnings.map(item => `<div class="message warning">${escapeHtml(item)}</div>`).join('')}
            `;
        }

        function renderStructuredRealExcelControls() {
            const operations = Array.isArray(currentStructuredOperationsResult?.operations) ? currentStructuredOperationsResult.operations : [];
            if (!operations.length) {
                return '';
            }

            const warnings = Array.isArray(currentStructuredExcelResult?.warnings) ? currentStructuredExcelResult.warnings : [];
            const downloadLink = currentStructuredExcelResult?.download_url
                ? `<a class="btn-download" href="${escapeHtml(currentStructuredExcelResult.download_url)}" target="_blank" rel="noopener">下载结构化 Excel</a>`
                : '';
            const successMessage = currentStructuredExcelResult?.download_url
                ? `<div class="message success">结构化 Excel 已生成</div>
                   <div class="result-meta">operations_count：${escapeHtml(currentStructuredExcelResult.operations_count || 0)}，warnings_count：${escapeHtml(warnings.length)}</div>`
                : '';

            return `
                <div class="export-actions">
                    <button class="btn-primary" type="button" onclick="exportStructuredRealExcel()">使用结构化 Operations 生成 Excel</button>
                    ${downloadLink}
                </div>
                ${successMessage}
                ${warnings.map(item => `<div class="message warning">${escapeHtml(item)}</div>`).join('')}
            `;
        }

        function renderCombinedRealExcelControls() {
            const structuredOperations = Array.isArray(currentStructuredOperationsResult?.operations) ? currentStructuredOperationsResult.operations : [];
            const tableOperations = Array.isArray(currentTableOperationsResult?.operations) ? currentTableOperationsResult.operations : [];
            const blockOperations = Array.isArray(currentBlockOperationsResult?.operations) ? currentBlockOperationsResult.operations : [];
            if (!structuredOperations.length && !tableOperations.length && !blockOperations.length) {
                return '';
            }

            const warnings = Array.isArray(currentCombinedExcelResult?.warnings) ? currentCombinedExcelResult.warnings : [];
            const downloadLink = currentCombinedExcelResult?.download_url
                ? `<a class="btn-download" href="${escapeHtml(currentCombinedExcelResult.download_url)}" target="_blank" rel="noopener">下载结构化表格 Excel</a>`
                : '';
            const successMessage = currentCombinedExcelResult?.download_url
                ? `<div class="message success">结构化 + 动态表格 + 区块 Excel 已生成</div>
                   <div class="result-meta">operations_count：${escapeHtml(currentCombinedExcelResult.operations_count || 0)}，warnings_count：${escapeHtml(warnings.length)}</div>`
                : '';

            return `
                <div class="export-actions">
                    <button class="btn-primary" type="button" onclick="exportCombinedRealExcel()">使用结构化 + 动态表格 + 区块 Operations 生成 Excel</button>
                    ${downloadLink}
                </div>
                ${successMessage}
                ${warnings.map(item => `<div class="message warning">${escapeHtml(item)}</div>`).join('')}
            `;
        }

        function handleTemplateFileChange(event) {
            currentTemplateFile = event.target.files && event.target.files.length ? event.target.files[0] : null;
            const fileNameNode = document.getElementById('templateFileName');
            if (fileNameNode) {
                fileNameNode.textContent = currentTemplateFile ? `当前模板：${currentTemplateFile.name}` : '当前模板：未选择';
            }
            setStatus(currentTemplateFile ? `已选择模板：${currentTemplateFile.name}` : '请先上传 Excel 模板。');
        }

        async function exportOperationsToRealExcel(operations) {
            if (!currentTemplateFile) {
                setStatus('请先上传 Excel 模板。');
                return null;
            }
            if (!operations.length) {
                setStatus('尚未生成 operations');
                return null;
            }

            setStatus('正在生成真实 Excel');
            try {
                const formData = new FormData();
                formData.append('template_file', currentTemplateFile);
                formData.append('operations', JSON.stringify(operations));

                const response = await fetch('/api/v4/core-pipeline/export-real-excel', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();
                if (!result.success) {
                    setStatus(result.error || 'Excel 写入失败');
                    return;
                }
                if (!result.download_url) {
                    setStatus('无法保存 Excel');
                    return null;
                }

                return result;
            } catch (error) {
                setStatus('Excel 写入失败');
                return null;
            }
        }

        async function exportRealExcel() {
            const operations = Array.isArray(currentOperationsResult?.operations) ? currentOperationsResult.operations : [];
            const result = await exportOperationsToRealExcel(operations);
            if (!result) {
                return;
            }

            currentRealExcelResult = result;
            setStatus('真实 Excel 已生成');
            renderPipelineResult(currentPipelineResult);
        }

        async function exportStructuredRealExcel() {
            const operations = Array.isArray(currentStructuredOperationsResult?.operations) ? currentStructuredOperationsResult.operations : [];
            const result = await exportOperationsToRealExcel(operations);
            if (!result) {
                return;
            }

            currentStructuredExcelResult = result;
            setStatus('结构化 Excel 已生成');
            renderPipelineResult(currentPipelineResult);
        }

        async function exportCombinedRealExcel() {
            const structuredOperations = Array.isArray(currentStructuredOperationsResult?.operations) ? currentStructuredOperationsResult.operations : [];
            const tableOperations = Array.isArray(currentTableOperationsResult?.operations) ? currentTableOperationsResult.operations : [];
            const blockOperations = Array.isArray(currentBlockOperationsResult?.operations) ? currentBlockOperationsResult.operations : [];
            if (!structuredOperations.length && !tableOperations.length && !blockOperations.length) {
                setStatus('尚未生成结构化、动态表格或区块 operations');
                return;
            }

            const result = await exportOperationsToRealExcel(structuredOperations.concat(tableOperations, blockOperations));
            if (!result) {
                return;
            }

            currentCombinedExcelResult = result;
            setStatus('结构化 + 动态表格 + 区块 Excel 已生成');
            renderPipelineResult(currentPipelineResult);
        }

        function renderWarnings(warnings) {
            if (!warnings.length) {
                return '';
            }
            return warnings.map(item => `<div class="message warning">${escapeHtml(item)}</div>`).join('');
        }

        function renderFieldCard(title, value) {
            return `
                <div class="render-card">
                    <div class="render-title">${title}</div>
                    <div class="render-body ${value ? '' : 'empty'}">${escapeHtml(value || '无内容')}</div>
                </div>
            `;
        }

        function updatePreview() {
            document.getElementById('jsonPreview').textContent = JSON.stringify({
                order_object: currentOrderObject,
                pipeline_result: currentPipelineResult,
                export_result: currentExportResult,
                operations_result: currentOperationsResult,
                real_excel_result: currentRealExcelResult,
                structured_operations_result: currentStructuredOperationsResult,
                structured_excel_result: currentStructuredExcelResult,
                table_operations_result: currentTableOperationsResult,
                block_operations_result: currentBlockOperationsResult,
                combined_excel_result: currentCombinedExcelResult,
                current_template_file: currentTemplateFile ? currentTemplateFile.name : ''
            }, null, 2);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', loadOrderObject);
    </script>
</body>
</html>
