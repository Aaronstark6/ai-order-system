<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 Validator Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f6f7f5;
            color: #1f2933;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }

        header {
            background: #24372f;
            color: #ffffff;
            padding: 18px 24px;
        }

        .header-inner,
        main {
            margin: 0 auto;
            max-width: 1080px;
        }

        .header-inner {
            align-items: center;
            display: flex;
            justify-content: space-between;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 0;
        }

        .home-link {
            color: #dbe9e3;
            font-size: 14px;
            text-decoration: none;
        }

        .home-link:hover {
            color: #ffffff;
        }

        main {
            padding: 24px;
        }

        .toolbar,
        .panel {
            background: #ffffff;
            border: 1px solid #d9e1dc;
            border-radius: 8px;
        }

        .toolbar {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 14px 16px;
        }

        .status-text {
            color: #58665f;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            min-height: 36px;
            padding: 8px 14px;
        }

        .btn-primary {
            background: #246b59;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1d594a;
        }

        .btn-secondary {
            background: #ffffff;
            border-color: #bcc8c3;
            color: #24372f;
        }

        .btn-secondary:hover {
            background: #edf3f0;
        }

        .summary {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin-bottom: 16px;
        }

        .summary-item {
            border-radius: 8px;
            padding: 16px;
        }

        .summary-label {
            font-size: 13px;
            margin-bottom: 8px;
            opacity: 0.82;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 700;
        }

        .valid {
            background: #dff5e6;
            color: #176039;
        }

        .invalid {
            background: #ffe2e0;
            color: #a8201a;
        }

        .warning {
            background: #fff3cc;
            color: #8a5a00;
        }

        .neutral {
            background: #edf1f3;
            color: #4f5e66;
        }

        .content-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr 1fr;
        }

        .panel {
            overflow: hidden;
        }

        .panel-header {
            background: #fbfcfb;
            border-bottom: 1px solid #d9e1dc;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 16px;
        }

        .panel-body {
            display: grid;
            gap: 10px;
            min-height: 140px;
            padding: 16px;
        }

        .result-item {
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
            padding: 12px;
        }

        .result-field {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .empty-state {
            align-items: center;
            color: #7a8781;
            display: flex;
            font-size: 14px;
            min-height: 96px;
        }

        details {
            background: #ffffff;
            border: 1px solid #d9e1dc;
            border-radius: 8px;
            margin-top: 16px;
            overflow: hidden;
        }

        summary {
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 16px;
        }

        pre {
            background: #17211d;
            color: #d8f3e9;
            font-size: 13px;
            line-height: 1.5;
            max-height: 340px;
            overflow: auto;
            padding: 16px;
            white-space: pre-wrap;
        }

        @media (max-width: 820px) {
            main {
                padding: 16px;
            }

            .header-inner,
            .toolbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .summary,
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>V4 Validator Engine</h1>
            <a class="home-link" href="/">返回首页</a>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <div class="status-text" id="statusText">准备加载当前 Order Object</div>
            <div class="actions">
                <button class="btn-secondary" type="button" onclick="loadOrderObject()">加载当前 Order Object</button>
                <button class="btn-primary" type="button" onclick="runValidation()">执行结构校验</button>
            </div>
        </div>

        <section class="summary">
            <div class="summary-item neutral" id="validCard">
                <div class="summary-label">校验状态</div>
                <div class="summary-value" id="validText">未校验</div>
            </div>
            <div class="summary-item invalid">
                <div class="summary-label">错误</div>
                <div class="summary-value" id="errorCount">0</div>
            </div>
            <div class="summary-item warning">
                <div class="summary-label">提醒</div>
                <div class="summary-value" id="warningCount">0</div>
            </div>
        </section>

        <section class="content-grid">
            <div class="panel">
                <div class="panel-header">Errors</div>
                <div class="panel-body" id="errorsList">
                    <div class="empty-state">尚未执行校验</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Warnings</div>
                <div class="panel-body" id="warningsList">
                    <div class="empty-state">尚未执行校验</div>
                </div>
            </div>
        </section>

        <details>
            <summary>当前 Order Object</summary>
            <pre id="orderObjectPreview">{}</pre>
        </details>
    </main>

    <script>
        let currentOrderObject = null;

        function setStatus(message) {
            document.getElementById('statusText').textContent = message;
        }

        async function loadOrderObject(options = {}) {
            const shouldReset = options.reset !== false;
            setStatus('正在加载 Order Object');
            try {
                const response = await fetch('/api/v4/order-object');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const result = await response.json();
                if (result.success) {
                    currentOrderObject = result.data;
                    document.getElementById('orderObjectPreview').textContent = JSON.stringify(currentOrderObject, null, 2);
                    setStatus('已加载当前 Order Object');
                    if (shouldReset) {
                        resetResult();
                    }
                    return currentOrderObject;
                } else {
                    setStatus(result.error || '加载失败');
                }
            } catch (error) {
                setStatus('加载失败');
            }
            return null;
        }

        async function runValidation() {
            const loadedOrderObject = await loadOrderObject({ reset: false });

            if (!loadedOrderObject) {
                setStatus('没有可校验的 Order Object');
                return;
            }

            setStatus('正在执行结构校验');
            try {
                const response = await fetch('/api/v4/validate-order-object', {
                    method: 'POST'
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const result = await response.json();
                renderResult(result);
                await fetch('/api/v4/pipeline-state').catch(() => null);
                setStatus(result.valid ? '校验通过' : '校验失败');
            } catch (error) {
                renderResult({
                    valid: false,
                    errors: [{
                        field: 'validator',
                        message: '结构校验请求失败'
                    }],
                    warnings: []
                });
                setStatus('结构校验失败');
            }
        }

        function resetResult() {
            document.getElementById('validCard').className = 'summary-item neutral';
            document.getElementById('validText').textContent = '未校验';
            document.getElementById('errorCount').textContent = '0';
            document.getElementById('warningCount').textContent = '0';
            document.getElementById('errorsList').innerHTML = '<div class="empty-state">尚未执行校验</div>';
            document.getElementById('warningsList').innerHTML = '<div class="empty-state">尚未执行校验</div>';
        }

        function renderResult(result) {
            const valid = Boolean(result.valid);
            const errors = Array.isArray(result.errors) ? result.errors : [];
            const warnings = Array.isArray(result.warnings) ? result.warnings : [];

            document.getElementById('validCard').className = valid ? 'summary-item valid' : 'summary-item invalid';
            document.getElementById('validText').textContent = valid ? '校验通过' : '校验失败';
            document.getElementById('errorCount').textContent = String(errors.length);
            document.getElementById('warningCount').textContent = String(warnings.length);
            renderList('errorsList', errors, 'invalid', '没有错误');
            renderList('warningsList', warnings, 'warning', '没有提醒');
        }

        function renderList(containerId, items, className, emptyText) {
            const container = document.getElementById(containerId);
            if (items.length === 0) {
                container.innerHTML = `<div class="empty-state">${emptyText}</div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="result-item ${className}">
                    <div class="result-field">${escapeHtml(item.field || 'order_object')}</div>
                    <div>${escapeHtml(item.message || '')}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', loadOrderObject);
    </script>
</body>
</html>
