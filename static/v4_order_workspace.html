<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外贸订单解析系统 V4</title>
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            background: #f5f6f8;
            color: #333;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 24px;
        }
        .app-header {
            align-items: center;
            display: flex;
            gap: 18px;
            margin: 0 auto 18px;
            max-width: 1440px;
        }
        h1 {
            color: #333;
            flex: 1 1 auto;
            font-size: 30px;
            line-height: 1.2;
            margin: 0;
        }
        .nav-link {
            color: #1677ff;
            font-size: 15px;
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-link:hover { text-decoration: underline; }
        .layout {
            align-items: stretch;
            display: grid;
            gap: 24px;
            grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
            margin: 0 auto;
            max-width: 1440px;
            min-height: calc(100vh - 96px);
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-height: 0;
            padding: 22px;
        }
        .left-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .right-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: auto;
            max-height: none;
            overflow: visible;
        }
        h2 {
            color: #222;
            font-size: 22px;
            margin: 0 0 6px;
        }
        h3 {
            border-top: 1px solid #edf0f4;
            color: #333;
            font-size: 17px;
            margin: 0;
            padding-top: 16px;
        }
        h3:first-child {
            border-top: none;
            padding-top: 0;
        }
        label {
            color: #333;
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
        }
        textarea, input, select {
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 15px;
            padding: 10px;
            width: 100%;
        }
        textarea {
            flex: 0 0 auto;
            height: 420px;
            line-height: 1.6;
            max-height: 55vh;
            min-height: 300px;
            resize: vertical;
        }
        input, select { min-height: 42px; }
        button, .download-link {
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-flex;
            font-size: 15px;
            justify-content: center;
            min-height: 40px;
            padding: 10px 18px;
            text-decoration: none;
        }
        button { background: #1677ff; color: #fff; }
        button.secondary { background: #52c41a; }
        button.ghost {
            background: #eef2f7;
            color: #344054;
        }
        .download-link {
            background: #e9f8ef;
            color: #16713b;
        }
        .actions {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status {
            border-radius: 7px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            min-height: 22px;
            padding: 10px 12px;
        }
        .status.info { background: #f2f6ff; color: #315c9c; }
        .status.success { background: #e9f8ef; color: #16713b; }
        .status.warning { background: #fff7db; color: #8a6100; }
        .status.error { background: #ffe9e7; color: #b42318; }
        .smart-debug-panel {
            background: #f8fafc;
            border: 1px solid #d8e0ea;
            border-radius: 6px;
            color: #2b3a4a;
            font-size: 12px;
            line-height: 1.45;
            margin-top: 10px;
            padding: 10px;
        }
        .smart-debug-title {
            color: #1f2a37;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .smart-debug-grid {
            display: grid;
            gap: 6px;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            margin-bottom: 10px;
        }
        .smart-debug-metric {
            background: #fff;
            border: 1px solid #e4e7ec;
            border-radius: 5px;
            padding: 7px;
        }
        .smart-debug-metric strong {
            display: block;
            font-size: 15px;
        }
        .smart-debug-table {
            border-collapse: collapse;
            margin-top: 6px;
            width: 100%;
        }
        .smart-debug-table th,
        .smart-debug-table td {
            border: 1px solid #e4e7ec;
            padding: 5px 6px;
            text-align: left;
            vertical-align: top;
            word-break: break-word;
        }
        .smart-debug-table th {
            background: #eef2f7;
            color: #344054;
            font-weight: 700;
        }
        .preview-notice {
            background: #f2f6ff;
            border: 1px solid #dbe7ff;
            border-radius: 8px;
            color: #315c9c;
            font-size: 14px;
            line-height: 1.5;
            padding: 10px 12px;
        }
        .section {
            background: #fafbfd;
            border: 1px solid #e0e4ec;
            border-radius: 10px;
            display: grid;
            gap: 12px;
            padding: 16px;
        }
        .profile-section {
            flex: 0 0 auto;
        }
        .confirmation-section-wrap {
            flex: 1 1 auto;
            min-height: 420px;
            overflow: visible;
        }
        .operation-section {
            background: #fafbfd;
            flex: 0 0 auto;
            margin-top: 18px;
            position: static;
        }
        .profile-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        .profile-grid > div { min-width: 0; }
        .confirmation-area {
            display: grid;
            gap: 18px;
            min-height: auto;
            overflow: visible;
            padding-bottom: 12px;
        }
        .native-template-hint {
            background: #f2f6ff;
            border: 1px solid #d6e4ff;
            border-radius: 8px;
            color: #315c9c;
            font-size: 13px;
            line-height: 1.5;
            padding: 10px 12px;
        }
        .native-template-wrap {
            background: #fff;
            border: 1px solid #d8dee8;
            border-radius: 8px;
            min-height: 360px;
            overflow: auto;
        }
        .native-template-grid {
            border-collapse: collapse;
            font-size: 12px;
            min-width: 100%;
        }
        .native-template-grid th,
        .native-template-grid td {
            border: 1px solid #edf0f4;
            padding: 4px 6px;
            position: relative;
            vertical-align: middle;
            white-space: nowrap;
        }
        .native-template-grid th {
            background: #f2f4f7;
            color: #667085;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .native-template-grid .corner-cell,
        .native-template-grid .row-head {
            background: #f2f4f7;
            color: #667085;
            left: 0;
            position: sticky;
            text-align: center;
            z-index: 2;
        }
        .native-cell {
            background: #fff;
            color: #1d2939;
            cursor: pointer;
            max-width: 260px;
            min-width: 48px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .native-cell.editable {
            box-shadow: inset 0 -3px 0 #1677ff;
        }
        .native-cell.selected {
            border: 2px solid #1890ff;
            box-shadow: inset 0 0 0 2px #1890ff, 0 0 0 2px rgba(24,144,255,0.28) !important;
            outline: 2px solid #0050b3;
            outline-offset: -2px;
        }
        .native-cell-input {
            background: rgba(255,255,255,0.86);
            border: 1px solid #8cc8ff;
            border-radius: 4px;
            color: #1d2939;
            font-size: 12px;
            min-height: 28px;
            padding: 4px 6px;
            width: 100%;
        }
        .native-cell-meta {
            color: #667085;
            font-size: 10px;
            line-height: 1.3;
            margin-top: 2px;
            white-space: normal;
        }
        .confirmation-row {
            align-items: center;
            background: #fff;
            border: 1px solid #e0e4ec;
            border-radius: 8px;
            display: grid;
            gap: 12px;
            grid-template-columns: 76px minmax(120px, 180px) minmax(180px, 1fr);
            padding: 12px;
        }
        .cell-code {
            color: #1677ff;
            font-weight: 700;
        }
        .field-label {
            color: #555;
            font-size: 14px;
            line-height: 1.4;
        }
        .confirmation-row input { margin: 0; }
        .confirmation-section-card {
            background: #fff;
            border: 1px solid #e0e4ec;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(16,24,40,0.06);
            margin-bottom: 18px;
            overflow: hidden;
        }
        .confirmation-section-header {
            align-items: center;
            background: #fafbfd;
            border-bottom: 1px solid #edf0f4;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            padding: 12px 14px;
        }
        .confirmation-section-name {
            color: #222;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
        }
        .confirmation-section-count {
            background: #eef2f7;
            border-radius: 999px;
            color: #475467;
            flex: 0 0 auto;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 8px;
        }
        .confirmation-section-body {
            display: grid;
            gap: 0;
            grid-template-columns: 1fr;
        }
        .business-form-card .confirmation-section-body {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            padding: 18px;
        }
        .business-field-card {
            background: #fff;
            border: 1px solid #e6eaf0;
            border-radius: 10px;
            display: grid;
            gap: 8px;
            min-width: 0;
            padding: 16px;
        }
        .business-field-card label {
            color: #344054;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
        }
        .business-field-card input {
            box-sizing: border-box;
            margin: 0;
            min-height: 44px;
            width: 100%;
        }
        .business-field-meta {
            color: #667085;
            font-size: 12px;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }
        .business-field-debug {
            color: #98a2b3;
            display: block;
            font-size: 11px;
            margin-top: 2px;
        }
        .confirmation-form-row {
            align-items: center;
            border-bottom: 1px solid #f0f2f5;
            display: grid;
            gap: 12px;
            grid-template-columns: minmax(130px, 220px) minmax(0, 1fr) minmax(80px, auto);
            min-width: 0;
            padding: 10px 14px;
        }
        .confirmation-form-row:last-child {
            border-bottom: none;
        }
        .confirmation-form-row label {
            color: #344054;
            line-height: 1.4;
            margin: 0;
        }
        .confirmation-form-row input {
            margin: 0;
        }
        .preview-value {
            color: #1d2939;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            min-width: 0;
            overflow-wrap: anywhere;
        }
        .field-meta {
            color: #888;
            font-size: 12px;
            line-height: 1.4;
            text-align: right;
            white-space: nowrap;
        }
        .preview-form-row {
            grid-template-columns: minmax(130px, 1fr) minmax(80px, auto);
        }
        .preview-field-meta {
            text-align: right;
        }
        .fallback-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .fallback-card {
            background: #fff;
            border: 1px solid #e0e4ec;
            border-radius: 8px;
            padding: 12px;
        }
        .fallback-card h4 {
            font-size: 15px;
            margin: 0 0 10px;
        }
        .small {
            color: #777;
            font-size: 13px;
            line-height: 1.45;
        }
        @media (max-width: 900px) {
            body { padding: 16px; }
            .app-header { align-items: flex-start; flex-direction: column; gap: 8px; }
            .layout { grid-template-columns: 1fr; }
            .right-card { max-height: none; }
            textarea {
                height: 320px;
                max-height: none;
                min-height: 260px;
            }
            .confirmation-section-wrap { min-height: 320px; }
            .profile-grid, .fallback-grid { grid-template-columns: 1fr; }
            .confirmation-row { grid-template-columns: 1fr; }
            .confirmation-section-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }
            .confirmation-form-row {
                align-items: stretch;
                gap: 6px;
                grid-template-columns: 1fr;
            }
            .smart-debug-grid { grid-template-columns: 1fr 1fr; }
            .field-meta {
                text-align: left;
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>外贸订单解析系统 V4</h1>
        <a class="nav-link" href="/">返回首页</a>
        <a class="nav-link" href="/v4-core-pipeline">V4 Core Pipeline</a>
        <a class="nav-link" href="/v4-render-preview">V4 Render Preview</a>
    </header>

    <main class="layout">
        <section class="card left-card">
            <h2>客户聊天内容</h2>
            <textarea id="v4ChatText" placeholder="例如：客户Anna要做50000瓶固体饮料，日期2026-05-18，草莓味，使用赤藓糖醇。"></textarea>
            <div>
                <label for="v4ChatFileInput">导入聊天文件</label>
                <input id="v4ChatFileInput" type="file" accept=".txt,.html,.htm">
                <div class="small">支持 .txt .html .htm，导入后可继续编辑。</div>
            </div>
            <div class="actions">
                <button id="v4ParseBtn" type="button" onclick="parseChatToConfirmation()">AI解析</button>
                <button id="v4ClearBtn" class="ghost" type="button" onclick="clearV4Chat()">清空</button>
            </div>
            <div id="v4ParseStatus" class="status info">等待输入客户聊天内容。</div>
            <div id="v4SmartMappingDebug" class="smart-debug-panel" style="display:none;"></div>
        </section>

        <section class="card right-card">
            <h2>订单信息确认</h2>

            <div class="section profile-section">
                <h3>选择系统模板</h3>
                <div class="profile-grid">
                    <div>
                        <label for="v4ProfileSelect">系统模板</label>
                        <select id="v4ProfileSelect"></select>
                    </div>
                </div>
                <div id="v4ProfileStatus" class="status info">正在加载系统模板...</div>
            </div>

            <div class="section confirmation-section-wrap">
                <h3>订单信息确认</h3>
                <div id="v4ConfirmationArea" class="confirmation-area">
                    <div class="native-template-hint">AI解析后会自动填入表单，可直接修改确认。</div>
                    <div class="status warning">请先粘贴聊天内容并点击 AI解析。</div>
                </div>
            </div>

            <div class="section operation-section">
                <h3>操作区</h3>
                <div class="actions">
                    <button id="v4GenerateBtn" class="secondary" type="button" onclick="generateExcelFromConfirmation()">确认生成 Excel</button>
                    <a id="v4DownloadLink" class="download-link" href="#" target="_blank" rel="noopener" style="display:none;">下载 Excel</a>
                </div>
                <div id="v4GenerateStatus" class="status info">确认信息后可生成 Excel。</div>
            </div>
        </section>
    </main>

    <script>
        let v4Profiles = [];
        let activeV4Profile = null;
        let latestV4ParseResult = null;
        let confirmedCells = [];
        let originalConfirmedCells = [];
        let v4LayoutSections = [];
        let v4WorkspaceFields = [];
        let v4VisualGrid = null;
        let selectedNativeCell = "";
        window.confirmedCells = confirmedCells;
        window.originalConfirmedCells = originalConfirmedCells;
        window.v4LayoutSections = v4LayoutSections;
        window.v4WorkspaceFields = v4WorkspaceFields;
        window.v4VisualGrid = v4VisualGrid;

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        function setStatus(elementId, text, type = "info") {
            const element = document.getElementById(elementId);
            element.textContent = text;
            element.className = `status ${type}`;
        }

        function isSmartDebugMode() {
            const params = new URLSearchParams(window.location.search);
            const mode = String(params.get("mode") || "").toLowerCase();
            return mode === "debug" || params.get("debug") === "1" || params.get("v4_debug") === "1";
        }

        function shortDebugValue(value) {
            const text = String(value ?? "");
            return text.length > 80 ? `${text.slice(0, 77)}...` : text;
        }

        function renderSmartDebugTable(headers, rows) {
            if (!Array.isArray(rows) || !rows.length) {
                return '<div class="small">无数据</div>';
            }
            return `
                <table class="smart-debug-table">
                    <thead>
                        <tr>${headers.map(header => `<th>${escapeHtml(header.label)}</th>`).join("")}</tr>
                    </thead>
                    <tbody>
                        ${rows.slice(0, 10).map(row => `
                            <tr>
                                ${headers.map(header => `<td>${escapeHtml(shortDebugValue(row[header.key]))}</td>`).join("")}
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function renderSmartMappingDebug(result) {
            const panel = document.getElementById("v4SmartMappingDebug");
            if (!panel) return;
            if (!isSmartDebugMode()) {
                panel.style.display = "none";
                panel.innerHTML = "";
                return;
            }
            if (!result) {
                panel.style.display = "none";
                panel.innerHTML = "";
                return;
            }

            const parseResult = result && result.parse_result ? result.parse_result : {};
            const pipelineResult = result && result.pipeline_result ? result.pipeline_result : {};
            const contract = Array.isArray(parseResult.last_extraction_contract)
                ? parseResult.last_extraction_contract
                : [];
            const fieldBoundOperations = Array.isArray(parseResult.field_bound_operations)
                ? parseResult.field_bound_operations
                : [];
            const processedOperations = Array.isArray(pipelineResult.processed_operations)
                ? pipelineResult.processed_operations
                : [];
            const metrics = [
                ["Contract", contract.length],
                ["Bound Ops", fieldBoundOperations.length],
                ["Added", Number(pipelineResult.field_bound_added_count || 0)],
                ["Override", Number(pipelineResult.field_bound_override_count || 0)],
                ["Processed", processedOperations.length],
            ];

            panel.innerHTML = `
                <div class="smart-debug-title">E2E Smart Mapping Debug</div>
                <div class="smart-debug-grid">
                    ${metrics.map(([label, value]) => `
                        <div class="smart-debug-metric">
                            <span>${escapeHtml(label)}</span>
                            <strong>${escapeHtml(value)}</strong>
                        </div>
                    `).join("")}
                </div>
                <div>
                    <strong>Extraction Contract（前 10 条）</strong>
                    ${renderSmartDebugTable([
                        { key: "field_key", label: "field_key" },
                        { key: "field_label", label: "field_label" },
                        { key: "cell", label: "cell" },
                        { key: "ai_extract_hint", label: "ai_extract_hint" },
                    ], contract)}
                </div>
                <div style="margin-top:10px;">
                    <strong>Field Bound Operations（前 10 条）</strong>
                    ${renderSmartDebugTable([
                        { key: "field_key", label: "field_key" },
                        { key: "field_label", label: "field_label" },
                        { key: "target_cell", label: "target_cell" },
                        { key: "value", label: "value" },
                    ], fieldBoundOperations)}
                </div>
            `;
            panel.style.display = "block";
        }

        function columnIndexFromCell(cell) {
            const column = String(cell || "").match(/^[A-Z]+/i)?.[0]?.toUpperCase() || "";
            return column.split("").reduce((total, char) => total * 26 + char.charCodeAt(0) - 64, 0);
        }

        function rowIndexFromCell(cell) {
            return Number(String(cell || "").match(/\d+/)?.[0] || 0);
        }

        function getVisualCell(item) {
            return item.display_cell || item.cell || "";
        }

        function visualCellSort(left, right) {
            const leftCell = getVisualCell(left);
            const rightCell = getVisualCell(right);
            const leftRow = rowIndexFromCell(leftCell);
            const rightRow = rowIndexFromCell(rightCell);
            const leftHasCell = Boolean(leftCell);
            const rightHasCell = Boolean(rightCell);

            if (leftHasCell !== rightHasCell) {
                return leftHasCell ? -1 : 1;
            }
            if (leftRow !== rightRow) {
                return leftRow - rightRow;
            }

            const leftColumn = columnIndexFromCell(leftCell);
            const rightColumn = columnIndexFromCell(rightCell);
            if (leftColumn !== rightColumn) {
                return leftColumn - rightColumn;
            }

            return String(left.label || "").localeCompare(String(right.label || ""), "zh-CN");
        }

        function sortCells(left, right) {
            return visualCellSort(left, right);
        }

        function displaySystemTemplateName(profile, fallback = "") {
            const rawName = profile && (profile.profile_name || profile.profile_id) ? (profile.profile_name || profile.profile_id) : fallback;
            return String(rawName || "未选择")
                .replace(new RegExp(["Template", "Profile"].join(" "), "g"), "系统模板")
                .replace(new RegExp(["Pro", "file"].join(""), "g"), "模板");
        }

        function findLayoutSectionForItem(item) {
            if (!Array.isArray(v4LayoutSections) || !v4LayoutSections.length) return null;

            const cell = getVisualCell(item);
            const row = rowIndexFromCell(cell);
            const col = columnIndexFromCell(cell);
            if (!row || !col) return null;

            return v4LayoutSections.find(section => {
                const bounds = section.bounds || {};
                const startRow = Number(bounds.start_row || 0);
                const endRow = Number(bounds.end_row || 0);
                const startCol = Number(bounds.start_col || 0);
                const endCol = Number(bounds.end_col || 0);
                if (!startRow || !endRow || !startCol || !endCol) return false;
                return row >= startRow && row <= endRow && col >= startCol && col <= endCol;
            }) || null;
        }

        function friendlyLabel(item) {
            const rawLabel = item.label || item.field_label || item.display_note || item.field || "";
            if (rawLabel) return rawLabel;
            const cell = item.display_cell || item.cell || "";
            const knownLabels = {
                C5: "客户名称",
                C6: "数量",
                F4: "日期",
                C4: "文档编号",
                F5: "客户性质",
                F6: "负责人",
                B13: "包装要求",
                B20: "包装要求",
                B23: "生产日期批号"
            };
            return knownLabels[cell] || item.source || "字段";
        }

        function normalizeConfigCell(value) {
            return String(value || "").trim().toUpperCase();
        }

        function columnName(index) {
            let value = Number(index || 0);
            let letters = "";
            while (value > 0) {
                const remainder = (value - 1) % 26;
                letters = String.fromCharCode(65 + remainder) + letters;
                value = Math.floor((value - 1) / 26);
            }
            return letters || "";
        }

        function clampNumber(value, min, max) {
            const number = Number(value);
            if (!Number.isFinite(number)) return min;
            return Math.min(max, Math.max(min, number));
        }

        function visualColumnWidthPx(grid, col) {
            const letter = columnName(col);
            const width = Number(grid?.col_widths?.[letter] || 8.43);
            return Math.round(clampNumber(width * 8, 48, 260));
        }

        function visualRowHeightPx(grid, row) {
            const height = Number(grid?.row_heights?.[String(row)] || 15);
            return Math.round(clampNumber(height * 1.35, 24, 120));
        }

        function renderNativeColGroup(grid, cols) {
            const columns = Array.from({ length: cols }, (_, index) => {
                return `<col style="width:${visualColumnWidthPx(grid, index + 1)}px">`;
            }).join("");
            return `<colgroup><col style="width:44px">${columns}</colgroup>`;
        }

        function visualCellStyle(cell) {
            const styles = [];
            if (cell.font_bold) styles.push("font-weight:700");
            if (cell.align) styles.push(`text-align:${escapeHtml(cell.align)}`);
            const color = String(cell.fill_color || "");
            if (/^[A-Fa-f0-9]{8}$/.test(color) && color !== "00000000") {
                styles.push(`background-color:#${color.slice(2)}`);
            } else if (/^[A-Fa-f0-9]{6}$/.test(color)) {
                styles.push(`background-color:#${color}`);
            }
            return styles.join(";");
        }

        function cellToPoint(cell) {
            const match = String(cell || "").trim().match(/^([A-Z]+)(\d+)$/i);
            if (!match) return null;
            const letters = match[1].toUpperCase();
            let col = 0;
            for (const char of letters) col = col * 26 + char.charCodeAt(0) - 64;
            return { row: Number(match[2]), col };
        }

        function parseCellRange(rangeText) {
            const parts = String(rangeText || "").split(":");
            if (parts.length !== 2) return null;
            const start = cellToPoint(parts[0]);
            const end = cellToPoint(parts[1]);
            if (!start || !end) return null;
            return {
                startCell: normalizeConfigCell(parts[0]),
                startRow: Math.min(start.row, end.row),
                startCol: Math.min(start.col, end.col),
                endRow: Math.max(start.row, end.row),
                endCol: Math.max(start.col, end.col),
            };
        }

        function buildNativeMergeLookup(grid) {
            const skip = new Set();
            const start = {};
            const merges = Array.isArray(grid?.merges) ? grid.merges : [];
            const cells = Array.isArray(grid?.cells) ? grid.cells : [];

            function addMerge(range) {
                if (!range) return;
                const startCell = normalizeConfigCell(range.start_cell || range.startCell || columnName(range.start_col || range.startCol) + (range.start_row || range.startRow || ""));
                const startRow = Number(range.start_row || range.startRow || 0);
                const startCol = Number(range.start_col || range.startCol || 0);
                const endRow = Number(range.end_row || range.endRow || 0);
                const endCol = Number(range.end_col || range.endCol || 0);
                if (!startCell || !startRow || !startCol || !endRow || !endCol) return;
                const rowspan = Math.max(1, endRow - startRow + 1);
                const colspan = Math.max(1, endCol - startCol + 1);
                if (rowspan <= 1 && colspan <= 1) return;
                start[startCell] = { rowspan, colspan };
                for (let row = startRow; row <= endRow; row += 1) {
                    for (let col = startCol; col <= endCol; col += 1) {
                        const cellRef = `${columnName(col)}${row}`;
                        if (cellRef !== startCell) skip.add(cellRef);
                    }
                }
            }

            merges.forEach(addMerge);
            cells.forEach((cell) => {
                if (!cell?.is_merged || !cell?.merged_range) return;
                const parsed = parseCellRange(cell.merged_range);
                if (parsed) {
                    addMerge({
                        start_cell: parsed.startCell,
                        start_row: parsed.startRow,
                        start_col: parsed.startCol,
                        end_row: parsed.endRow,
                        end_col: parsed.endCol,
                    });
                }
            });
            return { skip, start };
        }

        function getTemplateConfiguration() {
            const renderConfig = activeV4Profile && typeof activeV4Profile.render_config === "object"
                ? activeV4Profile.render_config
                : {};
            const configuration = renderConfig.template_configuration;
            return configuration && typeof configuration === "object" ? configuration : {};
        }

        function getSectionConfiguration() {
            const renderConfig = activeV4Profile && typeof activeV4Profile.render_config === "object"
                ? activeV4Profile.render_config
                : {};
            const configuration = renderConfig.section_configuration;
            return configuration && typeof configuration === "object" ? configuration : {};
        }

        function getSectionConfig(sectionKey) {
            return getSectionConfiguration()[sectionKey] || null;
        }

        function getItemTemplateConfiguration(item) {
            const configuration = getTemplateConfiguration();
            const cell = normalizeConfigCell(item.cell);
            const displayCell = normalizeConfigCell(item.display_cell);
            return configuration[cell] || configuration[displayCell] || null;
        }

        function applyTemplateConfiguration(item) {
            const config = getItemTemplateConfiguration(item);
            if (!config) {
                return {
                    ...item,
                    workspaceVisible: true,
                    workspaceOrder: null,
                };
            }

            const order = Number(config.display_order);
            return {
                ...item,
                label: typeof config.label === "string" && config.label.trim() ? config.label.trim() : item.label,
                workspaceVisible: config.show_in_workspace !== false,
                workspaceOrder: Number.isFinite(order) && order > 0 ? order : null,
            };
        }

        function normalizeWorkspaceField(field) {
            if (!field || typeof field !== "object") return null;
            const fieldKey = String(field.field_key || field.candidate_field_key || "").trim();
            const cell = normalizeConfigCell(field.cell || field.target_cell);
            if (!fieldKey || !cell) return null;
            const intentType = String(field.intent_type || "").trim();
            const writeMode = String(field.write_mode || "").trim();
            if (["title", "section_header", "note_instruction", "image_area", "attachment_hint", "readonly_example"].includes(intentType)) return null;
            if (["skip", "none"].includes(writeMode)) return null;
            const sourceCell = normalizeConfigCell(field.source_cell || field.label_cell || field.cell || "");
            const label = String(field.label || field.candidate_field_label || field.field_label || fieldKey).trim() || fieldKey;
            const displayOrder = Number(field.display_order || 0);
            const cellMeta = sourceCell && sourceCell !== cell ? `${sourceCell} → ${cell}` : cell;
            return {
                cell,
                display_cell: cell,
                source_cell: sourceCell || cell,
                cell_meta: cellMeta,
                field_key: fieldKey,
                label,
                intent_type: intentType,
                write_mode: writeMode,
                option_value: field.option_value || "",
                ai_extract_hint: field.ai_extract_hint || "",
                section: field.section || "",
                workspaceOrder: Number.isFinite(displayOrder) && displayOrder > 0 ? displayOrder : null,
                source: "Visual Mapping",
            };
        }

        function getWorkspaceFieldsFromResult(result = null) {
            const candidates = [
                result && Array.isArray(result.workspace_fields) ? result.workspace_fields : null,
                result?.parse_result && Array.isArray(result.parse_result.workspace_fields) ? result.parse_result.workspace_fields : null,
                result?.pipeline_result && Array.isArray(result.pipeline_result.workspace_fields) ? result.pipeline_result.workspace_fields : null,
                Array.isArray(v4WorkspaceFields) ? v4WorkspaceFields : null,
            ];
            const fields = candidates.find(items => Array.isArray(items) && items.length) || [];
            return fields.map(normalizeWorkspaceField).filter(Boolean);
        }

        function businessSectionKey(value) {
            return String(value || "other").trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5.-]+/g, "_") || "other";
        }

        function businessGroupForField(field) {
            const explicitSection = String(field.section || "").trim();
            if (explicitSection) {
                return { key: `section_${businessSectionKey(explicitSection)}`, title: explicitSection };
            }

            const layoutSection = findLayoutSectionForItem({
                cell: field.source_cell || field.cell,
                display_cell: field.source_cell || field.cell,
                label: field.label,
            });
            if (layoutSection) {
                const title = layoutSection.title || layoutSection.section_name || layoutSection.section_key || "";
                if (title) return { key: layoutSection.section_key || businessSectionKey(title), title };
            }

            const intentType = String(field.intent_type || "");
            const writeMode = String(field.write_mode || "");
            const labelText = String(field.label || "").toLowerCase();
            const row = rowIndexFromCell(field.source_cell || field.cell);
            const documentKeywords = ["编号", "日期", "客户", "负责人", "业务员", "document", "date", "customer"];

            if (["option_checkbox", "option_text_choice"].includes(intentType)) {
                return { key: "options", title: "选择字段确认" };
            }
            if (intentType === "unknown") {
                return { key: "other", title: "其他字段确认" };
            }
            if (intentType.includes("table") || writeMode.includes("table") || writeMode.includes("row_field")) {
                return { key: "product", title: "产品规格确认" };
            }
            if (row >= 12 || labelText.includes("包装") || labelText.includes("要求")) {
                return { key: "packaging", title: "包装要求确认" };
            }
            if (row && row <= 8 || documentKeywords.some(keyword => labelText.includes(keyword))) {
                return { key: "document", title: "文档编号信息" };
            }
            return { key: "structured", title: "普通字段确认" };
        }

        function cellValue(value) {
            return value && typeof value === "object" ? value.value : value;
        }

        function flattenValueMap(prefix, value, output) {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
                if (prefix) output[prefix] = cellValue(value) ?? "";
                return output;
            }
            Object.entries(value).forEach(([key, nestedValue]) => {
                const nextKey = prefix ? `${prefix}_${key}` : key;
                flattenValueMap(nextKey, nestedValue, output);
            });
            return output;
        }

        function getParsedFieldValues(result = null) {
            const values = {};
            const parseResult = result?.parse_result || result || {};
            if (parseResult.parsed && typeof parseResult.parsed === "object") {
                flattenValueMap("", parseResult.parsed, values);
            }
            if (parseResult.order_object && typeof parseResult.order_object === "object") {
                flattenValueMap("", parseResult.order_object, values);
            }
            return values;
        }

        function parsedValueForField(fieldKey, parsedValues) {
            if (!fieldKey || !parsedValues || typeof parsedValues !== "object") return "";
            if (Object.prototype.hasOwnProperty.call(parsedValues, fieldKey)) {
                return parsedValues[fieldKey];
            }
            const lowerKey = String(fieldKey).toLowerCase();
            const matchKey = Object.keys(parsedValues).find(key => String(key).toLowerCase() === lowerKey);
            return matchKey ? parsedValues[matchKey] : "";
        }

        function workspaceFieldByCell(workspaceFields) {
            const byCell = {};
            (Array.isArray(workspaceFields) ? workspaceFields : []).forEach(field => {
                const cell = normalizeConfigCell(field.cell);
                if (cell && !byCell[cell]) byCell[cell] = field;
            });
            return byCell;
        }

        function renderNativeCellContent(cell, field, parsedValues) {
            const displayText = cell.display_value || cell.value || "";
            if (!field) return escapeHtml(displayText);

            const rawValue = parsedValueForField(field.field_key, parsedValues);
            const value = rawValue == null ? "" : String(rawValue);
            const debugMeta = isSmartDebugMode()
                ? `<div class="native-cell-meta">${escapeHtml(field.field_key)} · ${escapeHtml(field.intent_type || "-")}</div>`
                : "";
            return `
                <input
                    class="native-cell-input"
                    type="text"
                    value="${escapeHtml(value)}"
                    data-cell="${escapeHtml(field.cell)}"
                    data-display-cell="${escapeHtml(field.cell)}"
                    data-source-cell="${escapeHtml(field.source_cell || "")}"
                    data-field-key="${escapeHtml(field.field_key || "")}"
                    data-source="${escapeHtml(field.source || "Visual Mapping")}"
                    data-label="${escapeHtml(field.label || field.field_key || "")}"
                    oninput="syncConfirmedCellsFromInputs()"
                    onfocus="selectedNativeCell='${escapeHtml(field.cell)}';"
                    onclick="event.stopPropagation();"
                >
                ${debugMeta}
            `;
        }

        function renderNativeTemplateConfirmation(result = null) {
            const grid = v4VisualGrid && typeof v4VisualGrid === "object" ? v4VisualGrid : null;
            const rows = Number(grid?.rows || 0);
            const cols = Number(grid?.cols || 0);
            const cells = Array.isArray(grid?.cells) ? grid.cells : [];
            const workspaceFields = getWorkspaceFieldsFromResult(result);
            if (!grid || !rows || !cols || !cells.length || !workspaceFields.length) return false;

            const parsedValues = getParsedFieldValues(result);
            const editableByCell = workspaceFieldByCell(workspaceFields);
            const byCell = {};
            cells.forEach(cell => { byCell[cell.cell] = cell; });
            const mergeLookup = buildNativeMergeLookup(grid);
            const header = Array.from({ length: cols }, (_, index) => {
                const col = index + 1;
                return `<th style="width:${visualColumnWidthPx(grid, col)}px">${columnName(col)}</th>`;
            }).join("");
            const bodyRows = [];

            for (let row = 1; row <= rows; row += 1) {
                const tds = [];
                const rowHeight = visualRowHeightPx(grid, row);
                for (let col = 1; col <= cols; col += 1) {
                    const cellRef = `${columnName(col)}${row}`;
                    if (mergeLookup.skip.has(cellRef)) continue;
                    const cell = byCell[cellRef] || { cell: cellRef, display_value: "" };
                    const field = editableByCell[cellRef] || null;
                    const mergeSize = mergeLookup.start[cellRef] || {};
                    const rowspan = Number(mergeSize.rowspan || 1);
                    const colspan = Number(mergeSize.colspan || 1);
                    const classes = [
                        "native-cell",
                        field ? "editable" : "",
                        selectedNativeCell === cellRef ? "selected" : "",
                    ].filter(Boolean).join(" ");
                    const spanAttrs = `${rowspan > 1 ? ` rowspan="${rowspan}"` : ""}${colspan > 1 ? ` colspan="${colspan}"` : ""}`;
                    const cellStyle = [`height:${rowHeight}px`, visualCellStyle(cell)].filter(Boolean).join(";");
                    tds.push(`<td class="${classes}"${spanAttrs} style="${cellStyle}" onclick="selectedNativeCell='${escapeHtml(cellRef)}'; renderNativeTemplateConfirmation(latestV4ParseResult);" title="${escapeHtml(cellRef)}">${renderNativeCellContent(cell, field, parsedValues)}</td>`);
                }
                bodyRows.push(`<tr style="height:${rowHeight}px"><th class="row-head" style="height:${rowHeight}px">${row}</th>${tds.join("")}</tr>`);
            }

            document.getElementById("v4ConfirmationArea").innerHTML = `
                <div class="native-template-hint">AI解析后会自动填入模板，可直接在模板中修改确认。</div>
                <div class="native-template-wrap">
                    <table class="native-template-grid">
                        ${renderNativeColGroup(grid, cols)}
                        <thead><tr><th class="corner-cell"></th>${header}</tr></thead>
                        <tbody>${bodyRows.join("")}</tbody>
                    </table>
                </div>
            `;
            confirmedCells = collectConfirmedCellsFromInputs();
            originalConfirmedCells = confirmedCells.map(item => ({ ...item }));
            window.confirmedCells = confirmedCells;
            window.originalConfirmedCells = originalConfirmedCells;
            const area = document.getElementById("v4ConfirmationArea");
            area.dataset.confirmedCellsCount = String(confirmedCells.length);
            area.dataset.hasManualChanges = "false";
            return true;
        }

        function inferConfirmationSection(item) {
            const layoutSection = findLayoutSectionForItem(item);
            if (layoutSection) {
                return layoutSection.section_key || layoutSection.semantic_type || "other";
            }

            const cell = getVisualCell(item);
            const rowNumber = rowIndexFromCell(cell);
            const sourceText = String(item.source || "").toLowerCase();
            const typeText = String(item.operation_type || item.op_type || item.type || "").toLowerCase();
            const labelText = String(`${item.label || ""} ${item.field_label || ""} ${item.display_note || ""} ${cell}`).toLowerCase();
            const isTable = typeText.includes("table") || sourceText.includes("table");
            const isBlock = typeText.includes("block") || sourceText.includes("block");
            const isDocument = [
                "文档编号",
                "订单编号",
                "编号",
                "日期",
                "负责人",
                "业务员",
                "客户性质"
            ].some(keyword => labelText.includes(keyword.toLowerCase()));

            if (rowNumber >= 18) {
                if (isTable) return "table";
                if (isBlock) return "block";
                return "other";
            }
            if (isDocument) return "document";
            if (isTable) return "table";
            if (isBlock) return "block";
            return "structured";
        }

        function sectionTitle(sectionKey) {
            const sectionConfig = getSectionConfig(sectionKey);
            if (sectionConfig && typeof sectionConfig.section_label === "string" && sectionConfig.section_label.trim()) {
                return sectionConfig.section_label.trim();
            }

            const layoutSection = Array.isArray(v4LayoutSections)
                ? v4LayoutSections.find(section => section && section.section_key === sectionKey)
                : null;
            if (layoutSection && layoutSection.title) {
                return layoutSection.title;
            }

            const titles = {
                document: "文档编号信息",
                structured: "普通字段确认",
                table: "表格字段确认",
                block: "组合单元格确认",
                other: "其他字段确认"
            };
            return titles[sectionKey] || titles.other;
        }

        function getSectionDisplayOrder(sectionKey, fallbackIndex) {
            const sectionConfig = getSectionConfig(sectionKey);
            const configuredOrder = Number(sectionConfig && sectionConfig.section_order);
            if (Number.isFinite(configuredOrder) && configuredOrder > 0) {
                return configuredOrder;
            }

            const layoutSection = Array.isArray(v4LayoutSections)
                ? v4LayoutSections.find(section => section && section.section_key === sectionKey)
                : null;
            const layoutOrder = Number(layoutSection && layoutSection.order);
            if (Number.isFinite(layoutOrder) && layoutOrder > 0) {
                return layoutOrder;
            }

            return 900 + fallbackIndex;
        }

        function getConfirmationSectionOrder() {
            const fallbackOrder = ["document", "structured", "table", "block", "other"];
            let order = fallbackOrder;
            if (!Array.isArray(v4LayoutSections) || !v4LayoutSections.length) {
                order = fallbackOrder;
            } else {
                const layoutOrder = v4LayoutSections
                    .map(section => section && section.section_key)
                    .filter(Boolean);
                order = Array.from(new Set([...layoutOrder, ...fallbackOrder]));
            }

            const orderIndex = Object.fromEntries(order.map((key, index) => [key, index]));
            return order.sort((left, right) => {
                const leftOrder = getSectionDisplayOrder(left, orderIndex[left] || 0);
                const rightOrder = getSectionDisplayOrder(right, orderIndex[right] || 0);
                if (leftOrder !== rightOrder) return leftOrder - rightOrder;
                return (orderIndex[left] || 0) - (orderIndex[right] || 0);
            });
        }

        function buildConfirmationSections(cells) {
            const sectionOrder = getConfirmationSectionOrder();
            const grouped = sectionOrder.reduce((result, key) => {
                result[key] = [];
                return result;
            }, {});

            const safeCells = Array.isArray(cells) ? cells.filter(item => item && !item.skipped) : [];
            safeCells.forEach(item => {
                const label = friendlyLabel(item);
                const normalized = applyTemplateConfiguration({
                    cell: item.cell || "",
                    display_cell: item.display_cell || item.cell || "",
                    source: item.source || "",
                    label,
                    value: String(cellValue(item.value) ?? ""),
                    section: inferConfirmationSection({ ...item, label })
                });
                if (!normalized.workspaceVisible) return;

                if (!grouped[normalized.section]) {
                    grouped[normalized.section] = [];
                    sectionOrder.push(normalized.section);
                }
                grouped[normalized.section].push(normalized);
            });

            sectionOrder.forEach(key => {
                grouped[key].sort((left, right) => {
                    const leftOrder = Number(left.workspaceOrder || 0);
                    const rightOrder = Number(right.workspaceOrder || 0);
                    if (leftOrder && rightOrder && leftOrder !== rightOrder) return leftOrder - rightOrder;
                    if (leftOrder && !rightOrder) return -1;
                    if (!leftOrder && rightOrder) return 1;
                    return visualCellSort(left, right);
                });
            });

            const orderedSections = getConfirmationSectionOrder();
            const orderedSectionIndex = Object.fromEntries(orderedSections.map((key, index) => [key, index]));
            sectionOrder.sort((left, right) => {
                const leftOrder = getSectionDisplayOrder(left, orderedSections.indexOf(left));
                const rightOrder = getSectionDisplayOrder(right, orderedSections.indexOf(right));
                if (leftOrder !== rightOrder) return leftOrder - rightOrder;
                return (orderedSectionIndex[left] || 0) - (orderedSectionIndex[right] || 0);
            });

            return sectionOrder
                .map(key => ({ key, title: sectionTitle(key), items: grouped[key] }))
                .filter(section => section.items.length);
        }

        function renderConfirmationSection(section) {
            return `
                <div class="confirmation-section-card" data-section="${escapeHtml(section.key)}">
                    <div class="confirmation-section-header">
                        <div class="confirmation-section-name">${escapeHtml(section.title)}</div>
                        <div class="confirmation-section-count">${section.items.length}项</div>
                    </div>
                    <div class="confirmation-section-body">
                        ${section.items.map(item => `
                            <div class="confirmation-form-row">
                                <label>${escapeHtml(item.label)}</label>
                                <input
                                    type="text"
                                    value="${escapeHtml(item.value)}"
                                    data-cell="${escapeHtml(item.cell)}"
                                    data-display-cell="${escapeHtml(item.display_cell)}"
                                    data-source-cell="${escapeHtml(item.source_cell || "")}"
                                    data-field-key="${escapeHtml(item.field_key || "")}"
                                    data-source="${escapeHtml(item.source)}"
                                    data-label="${escapeHtml(item.label)}"
                                    oninput="syncConfirmedCellsFromInputs()"
                                >
                                <div class="field-meta">${escapeHtml(item.cell_meta || item.display_cell || item.cell)}${item.source ? ` · ${escapeHtml(item.source)}` : ""}</div>
                            </div>
                        `).join("")}
                    </div>
                </div>
            `;
        }

        function renderBusinessFormSection(section) {
            return `
                <div class="confirmation-section-card business-form-card" data-section="${escapeHtml(section.key)}">
                    <div class="confirmation-section-header">
                        <div class="confirmation-section-name">${escapeHtml(section.title)}</div>
                        <div class="confirmation-section-count">${section.items.length}项</div>
                    </div>
                    <div class="confirmation-section-body">
                        ${section.items.map(item => `
                            <div class="business-field-card">
                                <label>${escapeHtml(item.label)}</label>
                                <input
                                    type="text"
                                    value="${escapeHtml(item.value)}"
                                    data-cell="${escapeHtml(item.cell)}"
                                    data-display-cell="${escapeHtml(item.display_cell || item.cell)}"
                                    data-source-cell="${escapeHtml(item.source_cell || "")}"
                                    data-field-key="${escapeHtml(item.field_key || "")}"
                                    data-source="${escapeHtml(item.source || "Visual Mapping")}"
                                    data-label="${escapeHtml(item.label)}"
                                    oninput="syncConfirmedCellsFromInputs()"
                                >
                                ${isSmartDebugMode() ? `
                                    <div class="business-field-meta">
                                        ${escapeHtml(item.source_cell && item.source_cell !== item.cell ? `${item.source_cell} → ${item.cell}` : item.cell)}
                                        <span class="business-field-debug">${escapeHtml(item.field_key || "-")} · ${escapeHtml(item.intent_type || "-")} · ${escapeHtml(item.write_mode || "-")}</span>
                                    </div>
                                ` : ""}
                            </div>
                        `).join("")}
                    </div>
                </div>
            `;
        }

        function renderPreviewSection(section) {
            return `
                <div class="confirmation-section-card" data-section="${escapeHtml(section.key)}">
                    <div class="confirmation-section-header">
                        <div class="confirmation-section-name">${escapeHtml(section.title)}</div>
                        <div class="confirmation-section-count">${section.items.length}项</div>
                    </div>
                    <div class="confirmation-section-body">
                        ${section.items.map(item => `
                            <div class="confirmation-form-row preview-form-row">
                                <label>${escapeHtml(item.label)}</label>
                                <div class="field-meta preview-field-meta">${escapeHtml(item.display_cell || item.cell || "-")}${item.section ? ` · ${escapeHtml(item.section)}` : ""}</div>
                            </div>
                        `).join("")}
                    </div>
                </div>
            `;
        }

        function getLayoutSectionByKey(sectionKey) {
            return Array.isArray(v4LayoutSections)
                ? v4LayoutSections.find(section => section && section.section_key === sectionKey)
                : null;
        }

        function sectionKeyForConfiguredCell(cell) {
            const item = { cell, display_cell: cell };
            const section = findLayoutSectionForItem(item);
            return section ? section.section_key || section.semantic_type || "other" : "other";
        }

        function buildConfigurationPreviewSections() {
            const workspaceSections = buildWorkspaceFieldSections(getWorkspaceFieldsFromResult(), {});
            if (workspaceSections.length) return workspaceSections;

            const configuration = getTemplateConfiguration();
            const sectionKeys = getConfirmationSectionOrder();
            const grouped = sectionKeys.reduce((result, key) => {
                result[key] = [];
                return result;
            }, {});

            Object.entries(configuration).forEach(([cell, config]) => {
                if (!config || config.show_in_workspace === false) return;
                const normalizedCell = normalizeConfigCell(cell);
                if (!normalizedCell) return;
                const sectionKey = sectionKeyForConfiguredCell(normalizedCell);
                if (!grouped[sectionKey]) {
                    grouped[sectionKey] = [];
                    sectionKeys.push(sectionKey);
                }
                const order = Number(config.display_order);
                grouped[sectionKey].push({
                    cell: normalizedCell,
                    display_cell: normalizedCell,
                    label: typeof config.label === "string" && config.label.trim() ? config.label.trim() : normalizedCell,
                    section: sectionTitle(sectionKey),
                    workspaceOrder: Number.isFinite(order) && order > 0 ? order : null,
                });
            });

            sectionKeys.forEach(key => {
                grouped[key].sort((left, right) => {
                    const leftOrder = Number(left.workspaceOrder || 0);
                    const rightOrder = Number(right.workspaceOrder || 0);
                    if (leftOrder && rightOrder && leftOrder !== rightOrder) return leftOrder - rightOrder;
                    if (leftOrder && !rightOrder) return -1;
                    if (!leftOrder && rightOrder) return 1;
                    return visualCellSort(left, right);
                });
            });

            const orderedSections = getConfirmationSectionOrder();
            const orderedSectionIndex = Object.fromEntries(orderedSections.map((key, index) => [key, index]));
            sectionKeys.sort((left, right) => {
                const leftOrder = getSectionDisplayOrder(left, orderedSections.indexOf(left));
                const rightOrder = getSectionDisplayOrder(right, orderedSections.indexOf(right));
                if (leftOrder !== rightOrder) return leftOrder - rightOrder;
                return (orderedSectionIndex[left] || 0) - (orderedSectionIndex[right] || 0);
            });

            return sectionKeys
                .map(key => ({ key, title: sectionTitle(key), items: grouped[key] || [] }))
                .filter(section => section.items.length);
        }

        function buildWorkspaceFieldSections(workspaceFields, parsedValues) {
            const fields = Array.isArray(workspaceFields) ? workspaceFields : [];
            if (!fields.length) return [];

            const preferredOrder = ["document", "structured", "product", "packaging", "options", "other"];
            const grouped = {};
            const titles = {};
            const sectionOrder = [];

            fields.forEach(field => {
                const group = businessGroupForField(field);
                const sectionKey = group.key || "other";
                if (!grouped[sectionKey]) {
                    grouped[sectionKey] = [];
                    sectionOrder.push(sectionKey);
                    titles[sectionKey] = group.title || sectionTitle(sectionKey);
                }
                const rawValue = parsedValueForField(field.field_key, parsedValues);
                grouped[sectionKey].push({
                    ...field,
                    section: sectionKey,
                    value: rawValue == null ? "" : String(rawValue),
                });
            });

            sectionOrder.forEach(key => {
                grouped[key].sort((left, right) => {
                    const leftOrder = Number(left.workspaceOrder || 0);
                    const rightOrder = Number(right.workspaceOrder || 0);
                    if (leftOrder && rightOrder && leftOrder !== rightOrder) return leftOrder - rightOrder;
                    if (leftOrder && !rightOrder) return -1;
                    if (!leftOrder && rightOrder) return 1;
                    return visualCellSort(left, right);
                });
            });

            const orderedSectionIndex = Object.fromEntries(preferredOrder.map((key, index) => [key, index]));
            sectionOrder.sort((left, right) => {
                const leftKnown = Object.prototype.hasOwnProperty.call(orderedSectionIndex, left);
                const rightKnown = Object.prototype.hasOwnProperty.call(orderedSectionIndex, right);
                if (leftKnown !== rightKnown) return leftKnown ? -1 : 1;
                if (leftKnown && orderedSectionIndex[left] !== orderedSectionIndex[right]) {
                    return orderedSectionIndex[left] - orderedSectionIndex[right];
                }
                return String(titles[left] || left).localeCompare(String(titles[right] || right), "zh-CN");
            });

            return sectionOrder
                .map(key => ({ key, title: titles[key] || sectionTitle(key), items: grouped[key] || [] }))
                .filter(section => section.items.length);
        }

        function renderConfigurationPreview() {
            if (latestV4ParseResult) return;

            confirmedCells = [];
            originalConfirmedCells = [];
            window.confirmedCells = confirmedCells;
            window.originalConfirmedCells = originalConfirmedCells;

            const sections = buildConfigurationPreviewSections();
            const area = document.getElementById("v4ConfirmationArea");
            area.dataset.confirmedCellsCount = "0";
            area.dataset.hasManualChanges = "false";

            if (!sections.length) {
                area.innerHTML = `
                    <div class="preview-notice">当前为模板配置预览。AI解析后将在这里显示可确认和修改的订单信息。</div>
                    <div class="status warning">当前映射尚未生成可预览的模板配置。请先在模板映射管理中上传模板并保存配置。</div>
                `;
                return;
            }

            area.innerHTML = `
                <div class="preview-notice">AI解析后会自动填入表单，可直接修改确认。</div>
                ${sections.map(renderBusinessFormSection).join("")}
            `;
        }

        function hasConfirmedCellChanges() {
            if (!Array.isArray(confirmedCells) || !Array.isArray(originalConfirmedCells)) {
                return false;
            }
            if (confirmedCells.length !== originalConfirmedCells.length) {
                return true;
            }
            return confirmedCells.some((item, index) => {
                const original = originalConfirmedCells[index] || {};
                return String(item.value ?? "") !== String(original.value ?? "");
            });
        }

        function updateConfirmedEditNotice() {
            const changed = hasConfirmedCellChanges();
            const area = document.getElementById("v4GenerateStatus");
            const confirmationArea = document.getElementById("v4ConfirmationArea");
            if (confirmationArea) {
                confirmationArea.dataset.hasManualChanges = changed ? "true" : "false";
            }
            if (!area) return;

            if (changed) {
                setStatus(
                    "v4GenerateStatus",
                    "已检测到人工修改。生成 Excel 时将尝试把确认值写入对应模板单元格。",
                    "warning"
                );
            }
        }

        function collectConfirmedCellsFromInputs() {
            return Array.from(document.querySelectorAll("#v4ConfirmationArea input[data-cell]")).map(input => ({
                cell: input.dataset.cell || "",
                display_cell: input.dataset.displayCell || input.dataset.cell || "",
                source_cell: input.dataset.sourceCell || "",
                field_key: input.dataset.fieldKey || "",
                source: input.dataset.source || "",
                label: input.dataset.label || "",
                value: input.value
            }));
        }

        function syncConfirmedCellsFromInputs() {
            confirmedCells = collectConfirmedCellsFromInputs();
            window.confirmedCells = confirmedCells;
            document.getElementById("v4ConfirmationArea").dataset.confirmedCellsCount = String(confirmedCells.length);
            updateConfirmedEditNotice();
        }

        function renderCellConfirmation(cells) {
            const sections = buildConfirmationSections(cells);
            if (!sections.length) return false;

            confirmedCells = sections.flatMap(section => section.items.map(item => ({
                cell: item.cell,
                display_cell: item.display_cell,
                source: item.source,
                label: item.label,
                value: item.value
            })));
            originalConfirmedCells = confirmedCells.map(item => ({ ...item }));
            window.originalConfirmedCells = originalConfirmedCells;

            document.getElementById("v4ConfirmationArea").innerHTML = sections.map(renderConfirmationSection).join("");
            syncConfirmedCellsFromInputs();
            return true;
        }

        function renderBusinessFormWorkspace(result) {
            const workspaceFields = getWorkspaceFieldsFromResult(result);
            if (!workspaceFields.length) return false;

            const sections = buildWorkspaceFieldSections(workspaceFields, getParsedFieldValues(result));
            if (!sections.length) return false;

            confirmedCells = sections.flatMap(section => section.items.map(item => ({
                cell: item.cell,
                display_cell: item.display_cell || item.cell,
                source_cell: item.source_cell || "",
                field_key: item.field_key || "",
                source: item.source || "Visual Mapping",
                label: item.label,
                value: item.value
            })));
            originalConfirmedCells = confirmedCells.map(item => ({ ...item }));
            window.originalConfirmedCells = originalConfirmedCells;

            document.getElementById("v4ConfirmationArea").innerHTML = `
                <div class="preview-notice">AI解析后会自动填入表单，可直接修改确认。</div>
                ${sections.map(renderBusinessFormSection).join("")}
            `;
            syncConfirmedCellsFromInputs();
            return true;
        }

        function renderWorkspaceFieldConfirmation(result) {
            return renderBusinessFormWorkspace(result);
        }

        function flattenObject(prefix, value) {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
                return [{ label: prefix, value: value ?? "" }];
            }
            return Object.entries(value).flatMap(([key, nestedValue]) => flattenObject(key, nestedValue));
        }

        function renderOrderObjectFallback(orderObject) {
            const safeOrder = orderObject || {};
            const groups = [
                ["客户信息", safeOrder.customer || {}],
                ["订单信息", safeOrder.order || {}],
                ["产品信息", safeOrder.product || {}]
            ];
            confirmedCells = [];
            originalConfirmedCells = [];
            window.confirmedCells = confirmedCells;
            window.originalConfirmedCells = originalConfirmedCells;
            document.getElementById("v4ConfirmationArea").innerHTML = `
                <div class="fallback-grid">
                    ${groups.map(([title, data]) => `
                        <div class="fallback-card">
                            <h4>${escapeHtml(title)}</h4>
                            ${flattenObject("", data).map(item => `
                                <label>${escapeHtml(item.label)}</label>
                                <input type="text" value="${escapeHtml(item.value)}" oninput="syncConfirmedCellsFromInputs()">
                            `).join("") || '<div class="small">暂无数据</div>'}
                        </div>
                    `).join("")}
                </div>
            `;
        }

        function renderConfirmation(result) {
            const parseResult = result.parse_result || {};
            const pipelineResult = result.pipeline_result || {};
            if (renderBusinessFormWorkspace(result)) return;
            const renderPreview = pipelineResult.render_preview || {};
            const cells = renderPreview.cells || renderPreview.cell_preview || [];
            if (renderCellConfirmation(cells)) return;
            renderOrderObjectFallback(parseResult.order_object || {});
        }

        async function loadV4Profiles() {
            try {
                const profilesResponse = await fetch("/api/v4/template-profiles");
                const profilesResult = await profilesResponse.json();
                if (!profilesResponse.ok || !profilesResult.success) {
                    throw new Error(profilesResult.error || "系统模板加载失败");
                }

                v4Profiles = Array.isArray(profilesResult.profiles) ? profilesResult.profiles : [];
                document.getElementById("v4ProfileSelect").innerHTML = v4Profiles.map(profile => {
                    const profileId = profile.profile_id || "";
                    const label = displaySystemTemplateName(profile, profileId);
                    return `<option value="${escapeHtml(profileId)}">${escapeHtml(label)}</option>`;
                }).join("");

                const currentResponse = await fetch("/api/v4/current-template-profile");
                const currentResult = await currentResponse.json();
                if (!currentResponse.ok || !currentResult.success) {
                    throw new Error(currentResult.error || "当前系统模板加载失败");
                }

                activeV4Profile = currentResult.profile || {};
                v4WorkspaceFields = Array.isArray(currentResult.workspace_fields) ? currentResult.workspace_fields : [];
                window.v4WorkspaceFields = v4WorkspaceFields;
                if (activeV4Profile.profile_id) {
                    document.getElementById("v4ProfileSelect").value = activeV4Profile.profile_id;
                }
                setStatus("v4ProfileStatus", `当前系统模板：${displaySystemTemplateName(activeV4Profile)}`, "success");
                renderConfigurationPreview();
            } catch (error) {
                setStatus("v4ProfileStatus", error.message || "系统模板加载失败", "error");
            }
        }

        async function loadV4VisualGrid(profileId) {
            const activeProfileId = profileId || activeV4Profile?.profile_id || "";
            if (!activeProfileId) {
                v4VisualGrid = null;
                window.v4VisualGrid = v4VisualGrid;
                return null;
            }
            try {
                const response = await fetch(`/api/v4/template-profiles/${encodeURIComponent(activeProfileId)}/visual-grid`);
                const result = await response.json();
                if (!response.ok || !result.success) {
                    v4VisualGrid = null;
                } else {
                    v4VisualGrid = result.visual_grid || null;
                }
                window.v4VisualGrid = v4VisualGrid;
                return v4VisualGrid;
            } catch (error) {
                v4VisualGrid = null;
                window.v4VisualGrid = v4VisualGrid;
                return null;
            }
        }

        async function loadV4TemplateLayout() {
            try {
                const response = await fetch("/api/v4/template-layout");
                const result = await response.json();
                if (!response.ok || !result.success) {
                    v4LayoutSections = [];
                    v4WorkspaceFields = [];
                } else {
                    v4LayoutSections = Array.isArray(result.layout_sections) ? result.layout_sections : [];
                    v4WorkspaceFields = Array.isArray(result.workspace_fields) ? result.workspace_fields : [];
                }
                window.v4LayoutSections = v4LayoutSections;
                window.v4WorkspaceFields = v4WorkspaceFields;
                await loadV4VisualGrid(activeV4Profile?.profile_id || "");
                renderConfigurationPreview();
            } catch (error) {
                v4LayoutSections = [];
                v4WorkspaceFields = [];
                v4VisualGrid = null;
                window.v4LayoutSections = v4LayoutSections;
                window.v4WorkspaceFields = v4WorkspaceFields;
                window.v4VisualGrid = v4VisualGrid;
                renderConfigurationPreview();
            }
        }

        async function setActiveV4Profile(profileId) {
            if (!profileId) {
                setStatus("v4ProfileStatus", "请选择系统模板", "warning");
                return;
            }

            try {
                setStatus("v4ProfileStatus", "正在切换系统模板...", "info");
                const response = await fetch("/api/v4/set-current-template-profile", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ profile_id: profileId })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "系统模板切换失败");
                }
                activeV4Profile = result.profile || {};
                v4WorkspaceFields = Array.isArray(result.workspace_fields) ? result.workspace_fields : v4WorkspaceFields;
                window.v4WorkspaceFields = v4WorkspaceFields;
                setStatus("v4ProfileStatus", `当前系统模板：${displaySystemTemplateName(activeV4Profile, profileId)}`, "success");
                await loadV4TemplateLayout();
                renderConfigurationPreview();
            } catch (error) {
                setStatus("v4ProfileStatus", error.message || "系统模板切换失败", "error");
            }
        }

        async function parseChatToConfirmation() {
            const chatText = document.getElementById("v4ChatText").value.trim();
            if (!chatText) {
                setStatus("v4ParseStatus", "请先输入客户聊天内容", "warning");
                return;
            }

            try {
                setStatus("v4ParseStatus", "AI 正在解析订单信息...", "info");
                document.getElementById("v4DownloadLink").style.display = "none";
                const response = await fetch("/api/v4/parse-chat-run-pipeline", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_text: chatText })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "AI解析失败");
                }
                latestV4ParseResult = result;
                v4WorkspaceFields = getWorkspaceFieldsFromResult(result);
                window.v4WorkspaceFields = v4WorkspaceFields;
                renderConfirmation(result);
                renderSmartMappingDebug(result);
                await loadV4TemplateLayout();
                setStatus("v4ParseStatus", "AI解析完成，请在右侧确认订单信息。", "success");
            } catch (error) {
                renderSmartMappingDebug(null);
                setStatus("v4ParseStatus", error.message || "AI解析失败", "error");
            }
        }

        function clearV4Chat() {
            document.getElementById("v4ChatText").value = "";
            document.getElementById("v4ConfirmationArea").innerHTML = '<div class="status warning">请先粘贴聊天内容并点击 AI解析。</div>';
            document.getElementById("v4DownloadLink").style.display = "none";
            confirmedCells = [];
            originalConfirmedCells = [];
            window.confirmedCells = confirmedCells;
            window.originalConfirmedCells = originalConfirmedCells;
            latestV4ParseResult = null;
            renderSmartMappingDebug(null);
            setStatus("v4ParseStatus", "等待输入客户聊天内容。", "info");
            setStatus("v4GenerateStatus", "确认信息后可生成 Excel。", "info");
            renderConfigurationPreview();
        }

        async function generateExcelFromConfirmation() {
            const chatText = document.getElementById("v4ChatText").value.trim();
            if (!chatText) {
                setStatus("v4GenerateStatus", "请先输入客户聊天内容", "warning");
                return;
            }

            syncConfirmedCellsFromInputs();
            const hasManualChanges = hasConfirmedCellChanges();
            if (hasManualChanges) {
                setStatus(
                    "v4GenerateStatus",
                    "检测到人工修改，正在使用确认值生成 Excel...",
                    "warning"
                );
            }
            try {
                if (!hasManualChanges) {
                    setStatus("v4GenerateStatus", "正在生成 Excel...", "info");
                }
                const formData = new FormData();
                formData.append("chat_text", chatText);
                formData.append("confirmed_cells_json", JSON.stringify(confirmedCells));
                const response = await fetch("/api/v4/export-confirmed-excel", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "Excel 生成失败");
                }

                const exportResult = result.export_result || {};
                const warnings = Array.isArray(exportResult.warnings) ? exportResult.warnings : [];
                const downloadUrl = exportResult.download_url || "";
                const overrideCount = result.confirmed_override_count || 0;
                const downloadLink = document.getElementById("v4DownloadLink");
                downloadLink.href = downloadUrl || "#";
                downloadLink.style.display = downloadUrl ? "inline-flex" : "none";
                window.lastExportConfirmedCells = confirmedCells.map(item => ({ ...item }));
                window.lastExportHadManualChanges = hasManualChanges;
                window.lastExportOverrideCount = overrideCount;
                let successMessage = `Excel 已生成：${exportResult.filename || "-"}，写入 ${exportResult.operations_written || 0} 项，人工确认覆盖 ${overrideCount} 项，warnings ${warnings.length} 个。`;
                if (hasManualChanges && overrideCount > 0) {
                    successMessage += " 人工修改已写入本次 Excel。";
                } else if (hasManualChanges) {
                    successMessage += " 但未找到可覆盖的目标单元格，请检查模板映射。";
                }
                setStatus(
                    "v4GenerateStatus",
                    successMessage,
                    "success"
                );
            } catch (error) {
                setStatus("v4GenerateStatus", error.message || "Excel 生成失败", "error");
            }
        }

        document.getElementById("v4ChatFileInput").addEventListener("change", async event => {
            const file = event.target.files && event.target.files.length ? event.target.files[0] : null;
            if (!file) return;
            try {
                const text = await file.text();
                document.getElementById("v4ChatText").value = text;
                setStatus("v4ParseStatus", `已导入聊天文件：${file.name}`, "success");
            } catch (error) {
                setStatus("v4ParseStatus", error.message || "聊天文件读取失败", "error");
            }
        });

        document.getElementById("v4ProfileSelect").addEventListener("change", event => {
            setActiveV4Profile(event.target.value);
        });

        document.addEventListener("DOMContentLoaded", async () => {
            renderSmartMappingDebug(null);
            await loadV4Profiles();
            await loadV4TemplateLayout();
        });
    </script>
</body>
</html>
