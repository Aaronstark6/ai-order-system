                        ${fields.map(item => item.type === "single_choice" || item.type === "option_group" ? renderBusinessOptionGroup(item) : renderBusinessFieldCard(item)).join("")}
                    </div>
                </div>
            `;
        }

        function renderBusinessFieldCard(item) {
            return renderWorkspaceRow(item, renderBusinessFieldControl(item));
        }

        function businessFieldDataAttributes(item) {
            return `
                data-cell="${escapeHtml(item.cell || "")}"
                data-display-cell="${escapeHtml(item.display_cell || item.cell || "")}"
                data-source-cell="${escapeHtml(item.source_cell || "")}"
                data-field-key="${escapeHtml(item.field_key || "")}"
                data-source="${escapeHtml(item.meta?.source || item.source || "Visual Mapping")}"
                data-label="${escapeHtml(item.label || "")}"
                data-required="${item.required ? "true" : "false"}"
                data-field-type="${escapeHtml(item.type || "text")}"
                data-write-mode="${escapeHtml(item.write_mode || "")}"
                data-intent-type="${escapeHtml(item.intent_type || "")}"
            `;
        }

        function renderBusinessFieldControl(item) {
            const value = item.value == null ? "" : String(item.value);
            const attrs = businessFieldDataAttributes(item);
            if (item.type === "readonly_note") {
                return `<div class="readonly-business-value">${escapeHtml(value || item.ai_extract_hint || item.label || "-")}</div>`;
            }
            if (item.type === "image_upload") {
                return `<div class="readonly-business-value">附件/图片上传区（后续支持）</div>`;
            }
            if (["readonly", "computed"].includes(item.type)) {
                return `<div class="readonly-business-value">${escapeHtml(value || item.option_value || "-")}</div>`;
            }
            if (item.type === "textarea") {
                return `
                    <textarea
                        ${attrs}
                        rows="3"
                        oninput="markWorkspaceFieldManual(this); syncConfirmedCellsFromInputs()"
                    >${escapeHtml(value)}</textarea>
                `;
            }
            const inputType = item.type === "number" ? "number" : (item.type === "date" ? "date" : "text");
            return `
                <input
                    type="${escapeHtml(inputType)}"
                    value="${escapeHtml(value)}"
                    ${attrs}
                    oninput="markWorkspaceFieldManual(this); syncConfirmedCellsFromInputs()"
                >
            `;
        }

        function renderBusinessOptionGroup(group) {
            const selectedValue = String(group.value || "").trim();
            const options = Array.isArray(group.options) ? group.options : (group.items || []);
            const status = group.status || workspaceFieldStatus(selectedValue, group.required, false);
            const source = group.meta?.source || group.source || options.find(option => option && option.source)?.source || "";
            const editorHtml = `
                <div class="business-option-group" data-field-id="${escapeHtml(group.id || group.group_key || "")}" data-required="${group.required ? "true" : "false"}" data-status="${escapeHtml(status)}">
                    <div class="business-option-list">
                        ${options.map(option => {
                            const value = option.option_value || option.label || "";
                            const checked = optionValueMatches(selectedValue, option) ? "checked" : "";
                            return `
                                <label class="business-option-item">
                                    <input
                                        type="radio"
                                        name="${escapeHtml(group.id || group.group_key || group.field_key || "workspace_option")}"
                                        value="${escapeHtml(value)}"
                                        data-cell="${escapeHtml(option.cell)}"
                                        data-display-cell="${escapeHtml(option.display_cell || option.cell)}"
                                        data-source-cell="${escapeHtml(option.source_cell || "")}"
                                        data-field-key="${escapeHtml(group.field_key || option.field_key || "")}"
                                        data-source="${escapeHtml(option.source || "Visual Mapping")}"
                                        data-label="${escapeHtml(group.label || "选择字段")}"
                                        data-option-value="${escapeHtml(value)}"
                                        data-required="${group.required ? "true" : "false"}"
                                        data-field-type="single_choice"
                                        data-write-mode="${escapeHtml(option.write_mode || group.write_mode || "")}"
                                        data-intent-type="${escapeHtml(option.intent_type || group.intent_type || "")}"
                                        ${checked}
                                        onchange="markWorkspaceFieldManual(this); syncConfirmedCellsFromInputs()"
                                    >
                                    <span>${escapeHtml(option.label || value)}</span>
                                </label>
                                ${isSmartDebugMode() ? `<div class="business-field-debug">${escapeHtml(option.cell || "-")} · ${escapeHtml(option.field_key || "-")} · ${escapeHtml(option.intent_type || "-")} · ${escapeHtml(option.write_mode || "-")}</div>` : ""}
                            `;
                        }).join("")}
                    </div>
                </div>
            `;
            return renderWorkspaceRow({ ...group, status, source }, editorHtml);
        }

        function renderPreviewSection(section) {
            return `
                <div class="confirmation-section-card" data-section="${escapeHtml(section.key)}">
                    <div class="confirmation-section-header">
                        <div class="confirmation-section-name">${escapeHtml(section.title)}</div>
                        <div class="confirmation-section-count">${section.items.length}项</div>
                    </div>
                    <div class="confirmation-section-body">
                        ${section.items.map(item => `
                            <div class="confirmation-form-row preview-form-row">
                                <label>${escapeHtml(item.label)}</label>
                                <div class="field-meta preview-field-meta">${escapeHtml(item.display_cell || item.cell || "-")}${item.section ? ` · ${escapeHtml(item.section)}` : ""}</div>
                            </div>
                        `).join("")}
                    </div>
                </div>
            `;
        }

        function getLayoutSectionByKey(sectionKey) {
            return Array.isArray(v4LayoutSections)
                ? v4LayoutSections.find(section => section && section.section_key === sectionKey)
                : null;
        }

        function sectionKeyForConfiguredCell(cell) {
            const item = { cell, display_cell: cell };
            const section = findLayoutSectionForItem(item);
            return section ? section.section_key || section.semantic_type || "other" : "other";
        }

        function buildConfigurationPreviewSections() {
            const workspaceSections = buildWorkspaceFieldSections(getWorkspaceFieldsFromResult(), {});
            if (workspaceSections.length) return workspaceSections;

            const configuration = getTemplateConfiguration();
            const sectionKeys = getConfirmationSectionOrder();
            const grouped = sectionKeys.reduce((result, key) => {
                result[key] = [];
                return result;
            }, {});

            Object.entries(configuration).forEach(([cell, config]) => {
                if (!config || config.show_in_workspace === false) return;
                const normalizedCell = normalizeConfigCell(cell);
                if (!normalizedCell) return;
                const sectionKey = sectionKeyForConfiguredCell(normalizedCell);
                if (!grouped[sectionKey]) {
                    grouped[sectionKey] = [];
                    sectionKeys.push(sectionKey);
                }
                const order = Number(config.display_order);
                grouped[sectionKey].push({
                    cell: normalizedCell,
                    display_cell: normalizedCell,
                    label: typeof config.label === "string" && config.label.trim() ? config.label.trim() : normalizedCell,
                    section: sectionTitle(sectionKey),
                    workspaceOrder: Number.isFinite(order) && order > 0 ? order : null,
                });
            });

            sectionKeys.forEach(key => {
                grouped[key].sort((left, right) => {
                    const leftOrder = Number(left.workspaceOrder || 0);
                    const rightOrder = Number(right.workspaceOrder || 0);
                    if (leftOrder && rightOrder && leftOrder !== rightOrder) return leftOrder - rightOrder;
                    if (leftOrder && !rightOrder) return -1;
                    if (!leftOrder && rightOrder) return 1;
                    return visualCellSort(left, right);
                });
            });

            const orderedSections = getConfirmationSectionOrder();
            const orderedSectionIndex = Object.fromEntries(orderedSections.map((key, index) => [key, index]));
            sectionKeys.sort((left, right) => {
                const leftOrder = getSectionDisplayOrder(left, orderedSections.indexOf(left));
                const rightOrder = getSectionDisplayOrder(right, orderedSections.indexOf(right));
                if (leftOrder !== rightOrder) return leftOrder - rightOrder;
                return (orderedSectionIndex[left] || 0) - (orderedSectionIndex[right] || 0);
            });

            return sectionKeys
                .map(key => ({ key, title: sectionTitle(key), items: grouped[key] || [] }))
                .filter(section => section.items.length);
        }

        function buildWorkspaceFieldSections(workspaceFields, parsedValues) {
            currentWorkspaceSchema = buildWorkspaceSchema(workspaceFields, parsedValues);
            return currentWorkspaceSchema.sections;
        }

        function hasSemanticWorkspaceSchema(schema) {
            return !!(schema
                && Array.isArray(schema.sections)
                && schema.sections.some(section => Array.isArray(section.fields) && section.fields.length));
        }

        function normalizeSemanticWorkspaceField(field, parsedValues, fallbackIndex = 0) {
            const rawValue = parsedValueForField(field.field_key, parsedValues);
            const hasAiValue = String(rawValue ?? "").trim() !== "";
            const value = hasAiValue ? String(rawValue) : String(field.value ?? "");
            const required = field.required === true || isWorkspaceFieldRequired(field);
            const normalized = {
                ...field,
                id: field.id || `${field.field_key || field.cell || "semantic"}_${field.cell || fallbackIndex}`,
                type: field.type || "text",
                label: field.label || field.field_key || field.cell || "字段",
                field_key: field.field_key || "",
                value,
                cell: field.cell || "",
                display_cell: field.display_cell || field.cell || "",
                source_cell: field.source_cell || "",
                intent_type: field.intent_type || "",
                write_mode: field.write_mode || "",
                option_value: field.option_value || "",
                options: Array.isArray(field.options) ? field.options : [],
                required,
                status: workspaceFieldStatus(value, required, hasAiValue),
                ai_extract_hint: field.ai_extract_hint || "",
                display_order: Number(field.display_order || fallbackIndex + 1),
                meta: {
                    ...(field.meta || {}),
                    source: field.meta?.source || field.source || "Semantic Workspace",
                    cell_meta: field.meta?.cell_meta || (field.source_cell && field.source_cell !== field.cell ? `${field.source_cell} → ${field.cell}` : field.cell),
                },
            };
            if (normalized.type === "single_choice") {
                const selected = normalized.options.find(option => optionValueMatches(value, option));
                normalized.value = selected ? (selected.option_value || selected.value || selected.label || value) : value;
                normalized.status = workspaceFieldStatus(normalized.value, required, hasAiValue);
                normalized.options = normalized.options.map(option => ({
                    ...option,
                    label: option.label || option.option_value || option.value || "选项",
                    value: option.value || option.option_value || option.label || "",
                    option_value: option.option_value || option.value || option.label || "",
                    cell: option.cell || normalized.cell,
                    display_cell: option.display_cell || option.cell || normalized.cell,
                    source_cell: option.source_cell || normalized.source_cell,
                    field_key: option.field_key || normalized.field_key,
                    source: option.source || normalized.meta.source,
                    intent_type: option.intent_type || normalized.intent_type,
                    write_mode: option.write_mode || normalized.write_mode,
                }));
            }
            return normalized;
        }

        function semanticSchemaWithParsedValues(schema, parsedValues) {
            if (!hasSemanticWorkspaceSchema(schema)) {
                return { sections: [], fields: [], errors: [], warnings: [] };
            }
            const fields = [];
            const sections = schema.sections
                .map((section, sectionIndex) => {
                    const normalizedFields = (Array.isArray(section.fields) ? section.fields : [])
                        .map((field, fieldIndex) => {
                            const normalized = normalizeSemanticWorkspaceField(
                                field,
                                parsedValues,
                                sectionIndex * 1000 + fieldIndex
                            );
                            normalized.section_key = field.section_key || section.key || "other";
                            normalized.section_title = field.section_title || section.title || "其他要求";
                            normalized.section_order = Number(field.section_order || section.order || 900);
                            fields.push(normalized);
                            return normalized;
                        });
                    return {
                        key: section.key || `semantic_section_${sectionIndex}`,
                        title: section.title || "其他要求",
                        order: Number(section.order || sectionIndex + 1),
                        fields: normalizedFields,
                    };
                })
                .filter(section => section.fields.length)
                .sort((left, right) => left.order - right.order);
            const warnings = fields
                .filter(field => field.status === "missing_required")
                .map(field => ({ field, message: "必填字段尚未填写" }));
            currentWorkspaceSchema = { sections, fields, errors: [], warnings };
            return currentWorkspaceSchema;
        }

        function getSemanticWorkspaceSchemaFromResult(result = null) {
            return result?.semantic_workspace_schema
                || result?.parse_result?.semantic_workspace_schema
                || v4SemanticWorkspaceSchema
                || null;
        }

        function getSemanticWorkspaceSections(result = null) {
            const schema = getSemanticWorkspaceSchemaFromResult(result);
            if (!hasSemanticWorkspaceSchema(schema)) return [];
            return semanticSchemaWithParsedValues(schema, getParsedFieldValues(result)).sections;
        }

        function renderConfigurationPreview() {
            if (latestV4ParseResult) return;

            confirmedCells = [];
            originalConfirmedCells = [];
            window.confirmedCells = confirmedCells;
            window.originalConfirmedCells = originalConfirmedCells;

            const workspaceFields = Array.isArray(v4WorkspaceFields) ? v4WorkspaceFields : [];
            let previewSections = [];
            if (workspaceFields.length) {
                previewSections = buildWorkspaceFieldSections(workspaceFields, {});
            } else {
                const sections = getSemanticWorkspaceSections(null);
                previewSections = sections.length ? sections : buildConfigurationPreviewSections();
            }
            const area = document.getElementById("v4ConfirmationArea");
            area.dataset.confirmedCellsCount = "0";
            area.dataset.hasManualChanges = "false";

            if (!previewSections.length) {
                area.innerHTML = `
                    <div class="preview-notice">当前为模板配置预览。AI解析后将在这里显示可确认和修改的订单信息。</div>
                    <div class="status warning">当前映射尚未生成可预览的模板配置。请先在模板映射管理中上传模板并保存配置。</div>
                `;
                currentWorkspaceSchema = { sections: [], fields: [], errors: [], warnings: [] };
                renderExportCheck();
                return;
            }

            area.innerHTML = `
                <div class="preview-notice">AI解析后会自动填入表单，可直接修改确认。</div>
                ${groupWorkspaceBusinessSections(previewSections).map(renderBusinessFormSection).join("")}
            `;
            initializeConfirmedCellsSnapshotFromInputs();
        }

        function hasConfirmedCellChanges() {
            if (!Array.isArray(confirmedCells) || !Array.isArray(originalConfirmedCells)) {
                return false;
            }
            if (confirmedCells.length !== originalConfirmedCells.length) {
                return true;
            }
            return confirmedCells.some((item, index) => {
                const original = originalConfirmedCells[index] || {};
                return String(item.value ?? "") !== String(original.value ?? "");
            });
        }

        function updateConfirmedEditNotice() {
            const changed = hasConfirmedCellChanges();
            const area = document.getElementById("v4GenerateStatus");
            const confirmationArea = document.getElementById("v4ConfirmationArea");
            if (confirmationArea) {
                confirmationArea.dataset.hasManualChanges = changed ? "true" : "false";
            }
            if (!area) return;

            if (changed) {
                setStatus(
                    "v4GenerateStatus",
                    "已检测到人工修改。生成 Excel 时将尝试把确认值写入对应模板单元格。",
                    "warning"
                );
            }
        }

        function markWorkspaceFieldManual(control) {
            const wrapper = control.closest(".workspace-row") || control.closest(".business-field-card, .business-option-group");
            if (!wrapper) return;
            wrapper.dataset.status = "manual";
            const badge = wrapper.querySelector(".field-status");
            if (badge) {
                badge.className = "field-status manual";
                badge.textContent = workspaceStatusLabel("manual");
            }
            const source = wrapper.querySelector(".workspace-source");
            if (source) source.textContent = "Manual";
        }

        function collectConfirmedCellsFromInputs() {
            const textItems = Array.from(document.querySelectorAll("#v4ConfirmationArea input[data-cell], #v4ConfirmationArea textarea[data-cell]"))
                .filter(input => input.type !== "radio")
                .map(input => ({
                cell: input.dataset.cell || "",
                display_cell: input.dataset.displayCell || input.dataset.cell || "",
                source_cell: input.dataset.sourceCell || "",
                field_key: input.dataset.fieldKey || "",
                source: input.dataset.source || "",
                label: input.dataset.label || "",
                write_mode: input.dataset.writeMode || "",
                intent_type: input.dataset.intentType || "",
                option_value: input.dataset.optionValue || "",
                value: input.value
            }));
            const radioItems = Array.from(document.querySelectorAll("#v4ConfirmationArea input[type='radio'][data-cell]:checked")).map(input => ({
                cell: input.dataset.cell || "",
                display_cell: input.dataset.displayCell || input.dataset.cell || "",
                source_cell: input.dataset.sourceCell || "",
                field_key: input.dataset.fieldKey || "",
                source: input.dataset.source || "",
                label: input.dataset.label || "",
                write_mode: input.dataset.writeMode || "",
                intent_type: input.dataset.intentType || "",
                option_value: input.dataset.optionValue || input.value,
                value: input.value
            }));
            return [...textItems, ...radioItems];
        }

        function getExportCheckState() {
            const normalControls = Array.from(document.querySelectorAll("#v4ConfirmationArea input[data-cell], #v4ConfirmationArea textarea[data-cell]"))
                .filter(input => input.type !== "radio");
            const optionGroups = Array.from(document.querySelectorAll("#v4ConfirmationArea .business-option-group"));
            const missing = [];
            let filled = 0;

            normalControls.forEach(input => {
                const value = String(input.value || "").trim();
                if (value) filled += 1;
                if (input.dataset.required === "true" && !value) {
                    missing.push({
                        label: input.dataset.label || "字段",
                        cell: input.dataset.cell || "",
                    });
                }
            });

            optionGroups.forEach(group => {
                const checked = group.querySelector("input[type='radio'][data-cell]:checked");
                if (checked) filled += 1;
                if (group.dataset.required === "true" && !checked) {
                    const title = group.querySelector(".business-option-title")?.textContent || "选择字段";
                    missing.push({
                        label: title,
                        cell: group.querySelector("input[data-cell]")?.dataset.cell || "",
                    });
                }
            });

            return { filled, missing, missingCount: missing.length };
        }

        function renderExportCheck() {
            const container = document.getElementById("v4ExportCheck");
            if (!container) return;
            const state = getExportCheckState();
            const ready = state.missingCount === 0;
            container.innerHTML = `
                <div class="export-check-header">
                    <div class="export-check-title">导出检查</div>
                    <span class="export-check-status ${ready ? "ready" : "need"}">${ready ? "可导出" : "需要补充"}</span>
                </div>
                <div class="export-check-stats">已填写 ${state.filled}，缺失 ${state.missingCount}</div>
                ${state.missingCount ? `
                    <div class="export-check-missing">
                        ${state.missing.map(item => `<div>${escapeHtml(item.label)}${item.cell ? ` · ${escapeHtml(item.cell)}` : ""}</div>`).join("")}
                    </div>
                ` : ""}
            `;
        }

        function syncConfirmedCellsFromInputs() {
            confirmedCells = collectConfirmedCellsFromInputs();
            window.confirmedCells = confirmedCells;
            const area = document.getElementById("v4ConfirmationArea");
            if (area) area.dataset.confirmedCellsCount = String(confirmedCells.length);
            renderExportCheck();
            updateConfirmedEditNotice();
        }

        function initializeConfirmedCellsSnapshotFromInputs() {
            confirmedCells = collectConfirmedCellsFromInputs();
            originalConfirmedCells = confirmedCells.map(item => ({ ...item }));
            window.confirmedCells = confirmedCells;
            window.originalConfirmedCells = originalConfirmedCells;
            const area = document.getElementById("v4ConfirmationArea");
            if (area) {
                area.dataset.confirmedCellsCount = String(confirmedCells.length);
                area.dataset.hasManualChanges = "false";
            }
            renderExportCheck();
        }

        function renderCellConfirmation(cells) {
            const sections = buildConfirmationSections(cells);
            if (!sections.length) return false;

            confirmedCells = sections.flatMap(section => section.items.map(item => ({
                cell: item.cell,
                display_cell: item.display_cell,
                source: item.source,
                label: item.label,
                value: item.value
            })));
            originalConfirmedCells = confirmedCells.map(item => ({ ...item }));
            window.originalConfirmedCells = originalConfirmedCells;

            document.getElementById("v4ConfirmationArea").innerHTML = sections.map(renderConfirmationSection).join("");
            syncConfirmedCellsFromInputs();
            return true;
        }

        function renderBusinessFormWorkspace(result) {
            const workspaceFields = getWorkspaceFieldsFromResult(result);
            if (workspaceFields.length) {
                const sections = buildWorkspaceFieldSections(workspaceFields, getParsedFieldValues(result));
                if (!sections.length) return false;

            document.getElementById("v4ConfirmationArea").innerHTML = `
                <div class="preview-notice">AI解析后会自动填入表单，可直接修改确认。</div>
                ${groupWorkspaceBusinessSections(sections).map(renderBusinessFormSection).join("")}
            `;
            initializeConfirmedCellsSnapshotFromInputs();
            return true;
        }

            const semanticSections = getSemanticWorkspaceSections(result);
            if (!semanticSections.length) return false;

            document.getElementById("v4ConfirmationArea").innerHTML = `
                <div class="preview-notice">AI解析后会自动填入表单，可直接修改确认。</div>
                ${groupWorkspaceBusinessSections(semanticSections).map(renderBusinessFormSection).join("")}
            `;
            initializeConfirmedCellsSnapshotFromInputs();
            return true;
        }

        function renderWorkspaceFieldConfirmation(result) {
            return renderBusinessFormWorkspace(result);
        }

        function flattenObject(prefix, value) {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
                return [{ label: prefix, value: value ?? "" }];
            }
            return Object.entries(value).flatMap(([key, nestedValue]) => flattenObject(key, nestedValue));
        }

        function renderOrderObjectFallback(orderObject) {
            const safeOrder = orderObject || {};
            const groups = [
                ["客户信息", safeOrder.customer || {}],
                ["订单信息", safeOrder.order || {}],
                ["产品信息", safeOrder.product || {}]
            ];
            confirmedCells = [];
            originalConfirmedCells = [];
            window.confirmedCells = confirmedCells;
            window.originalConfirmedCells = originalConfirmedCells;
            document.getElementById("v4ConfirmationArea").innerHTML = `
                <div class="fallback-grid">
                    ${groups.map(([title, data]) => `
                        <div class="fallback-card">
                            <h4>${escapeHtml(title)}</h4>
                            ${flattenObject("", data).map(item => `
                                <label>${escapeHtml(item.label)}</label>
                                <input type="text" value="${escapeHtml(item.value)}" oninput="syncConfirmedCellsFromInputs()">
                            `).join("") || '<div class="small">暂无数据</div>'}
                        </div>
                    `).join("")}
                </div>
            `;
            currentWorkspaceSchema = { sections: [], fields: [], errors: [], warnings: [] };
            renderExportCheck();
        }

        function renderConfirmation(result) {
            const parseResult = result.parse_result || {};
            const pipelineResult = result.pipeline_result || {};
            if (renderBusinessFormWorkspace(result)) return;
            const renderPreview = pipelineResult.render_preview || {};
            const cells = renderPreview.cells || renderPreview.cell_preview || [];
            if (renderCellConfirmation(cells)) return;
            renderOrderObjectFallback(parseResult.order_object || {});
        }

        async function loadV4Profiles() {
            try {
                const profilesResponse = await fetch("/api/v4/template-profiles");
                const profilesResult = await profilesResponse.json();
                if (!profilesResponse.ok || !profilesResult.success) {
                    throw new Error(profilesResult.error || "系统模板加载失败");
                }

                v4Profiles = Array.isArray(profilesResult.profiles) ? profilesResult.profiles : [];
                document.getElementById("v4ProfileSelect").innerHTML = v4Profiles.map(profile => {
                    const profileId = profile.profile_id || "";
                    const label = displaySystemTemplateName(profile, profileId);
                    return `<option value="${escapeHtml(profileId)}">${escapeHtml(label)}</option>`;
                }).join("");

                const currentResponse = await fetch("/api/v4/current-template-profile");
                const currentResult = await currentResponse.json();
                if (!currentResponse.ok || !currentResult.success) {
                    throw new Error(currentResult.error || "当前系统模板加载失败");
                }

                activeV4Profile = currentResult.profile || {};
                v4WorkspaceFields = Array.isArray(currentResult.workspace_fields) ? currentResult.workspace_fields : [];
                v4RuntimeMappingSource = currentResult.runtime_mapping_source || v4RuntimeMappingSource;
                window.v4WorkspaceFields = v4WorkspaceFields;
                window.v4RuntimeMappingSource = v4RuntimeMappingSource;
                if (activeV4Profile.profile_id) {
                    document.getElementById("v4ProfileSelect").value = activeV4Profile.profile_id;
                }
                setStatus("v4ProfileStatus", `当前系统模板：${displaySystemTemplateName(activeV4Profile)}`, "success");
                await loadWorkspaceMappingHealth(activeV4Profile.profile_id || "");
                renderConfigurationPreview();
            } catch (error) {
                setStatus("v4ProfileStatus", error.message || "系统模板加载失败", "error");
            }
        }

        async function loadV4VisualGrid(profileId) {
            const activeProfileId = profileId || activeV4Profile?.profile_id || "";
            if (!activeProfileId) {
                v4VisualGrid = null;
                window.v4VisualGrid = v4VisualGrid;
                return null;
            }
            try {
                const response = await fetch(`/api/v4/template-profiles/${encodeURIComponent(activeProfileId)}/visual-grid`);
                const result = await response.json();
                if (!response.ok || !result.success) {
                    v4VisualGrid = null;
                } else {
                    v4VisualGrid = result.visual_grid || null;
                }
                window.v4VisualGrid = v4VisualGrid;
                return v4VisualGrid;
            } catch (error) {
                v4VisualGrid = null;
                window.v4VisualGrid = v4VisualGrid;
                return null;
            }
        }

        async function loadV4TemplateLayout() {
            try {
                const response = await fetch("/api/v4/template-layout");
                const result = await response.json();
                if (!response.ok || !result.success) {
                    v4LayoutSections = [];
                    v4WorkspaceFields = [];
                    v4SemanticWorkspaceSchema = null;
                    v4RuntimeMappingSource = null;
                } else {
                    v4LayoutSections = Array.isArray(result.layout_sections) ? result.layout_sections : [];
                    v4WorkspaceFields = Array.isArray(result.workspace_fields) ? result.workspace_fields : [];
                    v4SemanticWorkspaceSchema = result.semantic_workspace_schema || null;
                    v4RuntimeMappingSource = result.runtime_mapping_source || null;
                }
                window.v4LayoutSections = v4LayoutSections;
                window.v4WorkspaceFields = v4WorkspaceFields;
                window.v4SemanticWorkspaceSchema = v4SemanticWorkspaceSchema;
                window.v4RuntimeMappingSource = v4RuntimeMappingSource;
                await loadV4VisualGrid(activeV4Profile?.profile_id || "");
                renderConfigurationPreview();
            } catch (error) {
                v4LayoutSections = [];
                v4WorkspaceFields = [];
                v4SemanticWorkspaceSchema = null;
                v4RuntimeMappingSource = null;
                v4VisualGrid = null;
                window.v4LayoutSections = v4LayoutSections;
                window.v4WorkspaceFields = v4WorkspaceFields;
                window.v4SemanticWorkspaceSchema = v4SemanticWorkspaceSchema;
                window.v4RuntimeMappingSource = v4RuntimeMappingSource;
                window.v4VisualGrid = v4VisualGrid;
                renderConfigurationPreview();
            }
        }

        async function setActiveV4Profile(profileId) {
            if (!profileId) {
                setStatus("v4ProfileStatus", "请选择系统模板", "warning");
                return;
            }

            try {
                setStatus("v4ProfileStatus", "正在切换系统模板...", "info");
                const response = await fetch("/api/v4/set-current-template-profile", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ profile_id: profileId })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "系统模板切换失败");
                }
                activeV4Profile = result.profile || {};
                v4WorkspaceFields = Array.isArray(result.workspace_fields) ? result.workspace_fields : v4WorkspaceFields;
                v4RuntimeMappingSource = result.runtime_mapping_source || v4RuntimeMappingSource;
                window.v4WorkspaceFields = v4WorkspaceFields;
                window.v4RuntimeMappingSource = v4RuntimeMappingSource;
                setStatus("v4ProfileStatus", `当前系统模板：${displaySystemTemplateName(activeV4Profile, profileId)}`, "success");
                await loadWorkspaceMappingHealth(activeV4Profile.profile_id || profileId);
                await loadV4TemplateLayout();
                renderConfigurationPreview();
            } catch (error) {
                setStatus("v4ProfileStatus", error.message || "系统模板切换失败", "error");
            }
        }

        async function parseChatToConfirmation() {
            const chatText = document.getElementById("v4ChatText").value.trim();
            if (!chatText) {
                setStatus("v4ParseStatus", "请先输入客户聊天内容", "warning");
                return;
            }

            try {
                setStatus("v4ParseStatus", "AI 正在解析订单信息...", "info");
                document.getElementById("v4DownloadLink").style.display = "none";
                const response = await fetch("/api/v4/parse-chat-run-pipeline", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_text: chatText })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "AI解析失败");
                }
                latestV4ParseResult = result;
                v4WorkspaceFields = getWorkspaceFieldsFromResult(result);
                v4SemanticWorkspaceSchema = result.semantic_workspace_schema || result.parse_result?.semantic_workspace_schema || v4SemanticWorkspaceSchema;
                v4RuntimeMappingSource = result.runtime_mapping_source || result.parse_result?.runtime_mapping_source || v4RuntimeMappingSource;
                window.v4WorkspaceFields = v4WorkspaceFields;
                window.v4SemanticWorkspaceSchema = v4SemanticWorkspaceSchema;
                window.v4RuntimeMappingSource = v4RuntimeMappingSource;
                renderConfirmation(result);
                renderSmartMappingDebug(result);
                await loadV4TemplateLayout();
                setStatus("v4ParseStatus", "AI解析完成，请在右侧确认订单信息。", "success");
            } catch (error) {
                renderSmartMappingDebug(null);
                setStatus("v4ParseStatus", error.message || "AI解析失败", "error");
            }
        }

        function clearV4Chat() {
            document.getElementById("v4ChatText").value = "";
            document.getElementById("v4ConfirmationArea").innerHTML = '<div class="status warning">请先粘贴聊天内容并点击 AI解析。</div>';
            document.getElementById("v4DownloadLink").style.display = "none";
            confirmedCells = [];
            originalConfirmedCells = [];
            window.confirmedCells = confirmedCells;
            window.originalConfirmedCells = originalConfirmedCells;
            latestV4ParseResult = null;
            renderSmartMappingDebug(null);
            setStatus("v4ParseStatus", "等待输入客户聊天内容。", "info");
            setStatus("v4GenerateStatus", "确认信息后可生成 Excel。", "info");
            renderConfigurationPreview();
        }

        function renderExportReadbackAudit(result) {
            const panel = document.getElementById("exportReadbackAuditPanel");
            if (!panel) return;

            const audit = result?.export_readback_audit || result?.export_result?.readback_audit || null;
            if (!audit) {
                panel.style.display = "none";
                panel.innerHTML = "";
                return;
            }

            panel.style.display = "";
            const summary = audit.summary || {};
            const success = audit.success !== false;
            const total = Number(summary.total || 0);
            const checked = Number(summary.checked || 0);
            const matched = Number(summary.matched || 0);
            const mismatched = Number(summary.mismatched || 0);
            const skipped = Number(summary.skipped || 0);
            const items = Array.isArray(audit.items) ? audit.items : [];
            const badItems = items
                .filter((item) => item.status === "mismatched" || item.status === "skipped" || item.matched === false)
                .slice(0, 8);

            const statusText = !success
                ? "检查失败"
                : (mismatched > 0 ? "发现不一致" : "检查通过");

            const badRowsHtml = badItems.length ? `
                <div class="smart-debug-section">
                    <div class="small"><strong>需要人工查看的单元格</strong></div>
                    ${renderSmartDebugTable(
                        ["Cell", "字段", "期望", "实际"],
                        badItems.map((item) => [
                            item.cell || "-",
                            item.label || item.field_key || "-",
                            item.expected || "",
                            item.actual || "",
                        ])
                    )}
                </div>
            ` : '<div class="small">Excel结果检查未发现明显不一致。</div>';

            panel.innerHTML = `
                <div class="smart-debug-title">Excel结果检查：${escapeHtml(statusText)}</div>
                <div class="smart-debug-grid">
                    <div class="smart-debug-metric"><span>总项</span><strong>${total}</strong></div>
                    <div class="smart-debug-metric"><span>已检查</span><strong>${checked}</strong></div>
                    <div class="smart-debug-metric"><span>一致</span><strong>${matched}</strong></div>
                    <div class="smart-debug-metric"><span>不一致</span><strong>${mismatched}</strong></div>
                    <div class="smart-debug-metric"><span>跳过</span><strong>${skipped}</strong></div>
                </div>
                ${audit.error ? `<div class="small">检查失败：${escapeHtml(audit.error)}</div>` : ""}
                ${badRowsHtml}
            `;
        }

        async function generateExcelFromConfirmation() {
            const chatText = document.getElementById("v4ChatText").value.trim();
            if (!chatText) {
                setStatus("v4GenerateStatus", "请先输入客户聊天内容", "warning");
                return;
            }

            syncConfirmedCellsFromInputs();
            const exportCheck = getExportCheckState();
            if (exportCheck.missingCount > 0) {
                const missingText = exportCheck.missing
                    .slice(0, 6)
                    .map(item => `${item.label}${item.cell ? ` (${item.cell})` : ""}`)
                    .join("、");
                const proceed = window.confirm(`导出检查发现 ${exportCheck.missingCount} 个必填字段需要补充：${missingText}。仍然继续生成 Excel 吗？`);
                if (!proceed) {
                    setStatus("v4GenerateStatus", "已取消生成，请先补充必填字段。", "warning");
                    return;
                }
            }
            const hasManualChanges = hasConfirmedCellChanges();
            if (hasManualChanges) {
                setStatus(
                    "v4GenerateStatus",
                    "检测到人工修改，正在使用确认值生成 Excel...",
                    "warning"
                );
            }
            try {
                if (!hasManualChanges) {
                    setStatus("v4GenerateStatus", "正在生成 Excel...", "info");
                }
                const formData = new FormData();
                formData.append("chat_text", chatText);
                formData.append("confirmed_cells_json", JSON.stringify(confirmedCells));
                const response = await fetch("/api/v4/export-confirmed-excel", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "Excel 生成失败");
                }

                const exportResult = result.export_result || {};
                const warnings = Array.isArray(exportResult.warnings) ? exportResult.warnings : [];
                const downloadUrl = exportResult.download_url || "";
                const overrideCount = result.confirmed_override_count || 0;
                const downloadLink = document.getElementById("v4DownloadLink");
                downloadLink.href = downloadUrl || "#";
                downloadLink.style.display = downloadUrl ? "inline-flex" : "none";
                renderExportReadbackAudit(result);
                window.lastExportConfirmedCells = confirmedCells.map(item => ({ ...item }));
                window.lastExportHadManualChanges = hasManualChanges;
                window.lastExportOverrideCount = overrideCount;
                let successMessage = `Excel 已生成：${exportResult.filename || "-"}，写入 ${exportResult.operations_written || 0} 项，人工确认覆盖 ${overrideCount} 项，warnings ${warnings.length} 个。`;
                if (hasManualChanges && overrideCount > 0) {
                    successMessage += " 人工修改已写入本次 Excel。";
                } else if (hasManualChanges) {
                    successMessage += " 但未找到可覆盖的目标单元格，请检查模板映射。";
                }
                setStatus(
                    "v4GenerateStatus",
                    successMessage,
                    "success"
                );
            } catch (error) {
                renderExportReadbackAudit(null);
                setStatus("v4GenerateStatus", error.message || "Excel 生成失败", "error");
            }
        }

        document.getElementById("v4ChatFileInput").addEventListener("change", async event => {
            const file = event.target.files && event.target.files.length ? event.target.files[0] : null;
            if (!file) return;
            try {
                const text = await file.text();
                document.getElementById("v4ChatText").value = text;
                setStatus("v4ParseStatus", `已导入聊天文件：${file.name}`, "success");
            } catch (error) {
                setStatus("v4ParseStatus", error.message || "聊天文件读取失败", "error");
            }
        });

        document.getElementById("v4ProfileSelect").addEventListener("change", event => {
            setActiveV4Profile(event.target.value);
        });

        document.addEventListener("DOMContentLoaded", async () => {
            renderSmartMappingDebug(null);
            await loadV4Profiles();
            await loadV4TemplateLayout();
        });
    </script>
</body>
</html>
