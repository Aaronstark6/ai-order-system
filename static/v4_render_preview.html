<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 Render Preview</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111820;
            color: #e6edf3;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }
        header { background: #1d2630; border-bottom: 1px solid #31404f; padding: 18px 24px; }
        .header-inner, main { margin: 0 auto; max-width: 1120px; }
        .header-inner { align-items: center; display: flex; gap: 16px; justify-content: space-between; }
        h1 { font-size: 24px; letter-spacing: 0; }
        a { color: #b8c7d6; font-size: 14px; text-decoration: none; }
        a:hover { color: #fff; }
        main { display: grid; gap: 16px; padding: 24px; }
        .panel {
            background: #18222d;
            border: 1px solid #31404f;
            border-radius: 8px;
            overflow: hidden;
        }
        .panel-header { border-bottom: 1px solid #31404f; padding: 14px 16px; }
        .panel-title { font-size: 16px; font-weight: 700; }
        .panel-body { display: grid; gap: 12px; padding: 16px; }
        .message {
            background: #4a3a13;
            border-radius: 7px;
            color: #ffd36a;
            font-size: 14px;
            line-height: 1.5;
            padding: 12px;
        }
        table { border-collapse: collapse; font-size: 13px; width: 100%; }
        th, td { border: 1px solid #31404f; padding: 8px 10px; text-align: left; vertical-align: top; }
        th { background: #111820; color: #fff; }
        pre {
            background: #101820;
            border: 1px solid #31404f;
            border-radius: 7px;
            color: #dfe7ee;
            line-height: 1.6;
            padding: 12px;
            white-space: pre-wrap;
        }
        .html-preview { background: #f8faf9; border-radius: 8px; color: #1f2933; padding: 16px; }
        .html-preview table { margin: 10px 0 16px; }
        .html-preview th, .html-preview td { border-color: #d9e1dc; }
        .badge {
            border-radius: 999px;
            display: inline-flex;
            font-size: 12px;
            margin: 0 4px 4px 0;
            padding: 2px 8px;
        }
        .badge-skipped { background: #5a2a2a; color: #ffd6d6; }
        .badge-conflict { background: #5d4817; color: #ffe6a8; }
        .badge-overwrite { background: #55346b; color: #f2dcff; }
        .badge-ok { background: #1f4b38; color: #b9f3d1; }
        .small { color: #b8c7d6; font-size: 12px; line-height: 1.4; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>V4 Render Preview</h1>
            <a href="/v4-core-pipeline">返回 Core Pipeline</a>
        </div>
    </header>

    <main>
        <section class="panel">
            <div class="panel-header"><div class="panel-title">Cell Preview</div></div>
            <div id="cellPreview" class="panel-body"></div>
        </section>

        <section class="panel">
            <div class="panel-header"><div class="panel-title">Table Preview</div></div>
            <div id="tablePreview" class="panel-body"></div>
        </section>

        <section class="panel">
            <div class="panel-header"><div class="panel-title">Block Preview</div></div>
            <div id="blockPreview" class="panel-body"></div>
        </section>

        <section class="panel">
            <div class="panel-header"><div class="panel-title">HTML Preview</div></div>
            <div id="htmlPreview" class="panel-body"></div>
        </section>
    </main>

    <script>
        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        function columnIndex(column) {
            return String(column || "").split("").reduce((total, char) => total * 26 + char.charCodeAt(0) - 64, 0);
        }

        function badges(item) {
            const labels = [];
            if (item?.skipped) labels.push('<span class="badge badge-skipped">skipped</span>');
            if (item?.conflict) labels.push('<span class="badge badge-conflict">conflict</span>');
            if (item?.overwrite_warning) labels.push('<span class="badge badge-overwrite">overwrite_warning</span>');
            if (!labels.length) labels.push('<span class="badge badge-ok">ok</span>');
            return labels.join("");
        }

        function cellValue(value) {
            return value && typeof value === "object" ? value.value : value;
        }

        function renderCellPreview(items) {
            if (!Array.isArray(items) || !items.length) {
                document.getElementById("cellPreview").innerHTML = '<div class="message">暂无 Cell Preview</div>';
                return;
            }
            document.getElementById("cellPreview").innerHTML = `
                <table>
                    <thead><tr><th>cell</th><th>display cell</th><th>merged range</th><th>preview value</th><th>operation type</th><th>source</th><th>display note</th><th>safety</th><th>reason</th></tr></thead>
                    <tbody>
                        ${items.map(item => `
                            <tr>
                                <td>${escapeHtml(item.cell)}</td>
                                <td>${escapeHtml(item.display_cell || item.cell || "")}</td>
                                <td>${escapeHtml(item.merged_range || "")}</td>
                                <td>${escapeHtml(item.value)}</td>
                                <td>${escapeHtml(item.operation_type || item.op_type)}</td>
                                <td>${escapeHtml(item.source)}</td>
                                <td>${escapeHtml(item.display_note || "")}</td>
                                <td>${badges(item)}</td>
                                <td>${escapeHtml(item.skip_reason || "")}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        function renderTablePreview(tables) {
            if (!Array.isArray(tables) || !tables.length) {
                document.getElementById("tablePreview").innerHTML = '<div class="message">暂无 Table Preview</div>';
                return;
            }
            document.getElementById("tablePreview").innerHTML = tables.map(table => {
                const rows = Array.isArray(table.rows) ? table.rows : [];
                const columns = Array.from(new Set(rows.flatMap(row => Object.keys(row.cells || {}))))
                    .sort((left, right) => columnIndex(left) - columnIndex(right));
                return `
                    <h3>${escapeHtml(table.table_name || "未命名表格")}</h3>
                    <table>
                        <thead><tr><th>row_number</th>${columns.map(column => `<th>${escapeHtml(column)}<br><span class="small">display / merged</span></th>`).join("")}</tr></thead>
                        <tbody>
                            ${rows.map(row => `
                                <tr>
                                    <td>${escapeHtml(row.row_number)}</td>
                                    ${columns.map(column => {
                                        const item = (row.cells || {})[column];
                                        const displayText = item?.display_note || "";
                                        const mergedText = item?.merged_range ? `merged: ${item.merged_range}` : "";
                                        return `<td>${escapeHtml(cellValue(item) || "")}${displayText ? `<div class="small">${escapeHtml(displayText)}</div>` : ""}${mergedText ? `<div class="small">${escapeHtml(mergedText)}</div>` : ""}<div>${badges(item || {})}</div></td>`;
                                    }).join("")}
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                `;
            }).join("");
        }

        function renderBlockPreview(blocks) {
            if (!Array.isArray(blocks) || !blocks.length) {
                document.getElementById("blockPreview").innerHTML = '<div class="message">暂无 Block Preview</div>';
                return;
            }
            document.getElementById("blockPreview").innerHTML = blocks.map(block => `
                <article>
                    <h3>${escapeHtml(block.block_name || "未命名区块")} · ${escapeHtml(block.target_cell || "")}</h3>
                    <div>${badges(block)}</div>
                    <pre>${escapeHtml(block.value || "")}</pre>
                </article>
            `).join("");
        }

        async function loadPreview() {
            try {
                const response = await fetch("/api/v4/render-preview");
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "Render Preview 加载失败");
                }
                const preview = result.render_preview || {};
                renderCellPreview(preview.cells || preview.cell_preview || []);
                renderTablePreview(preview.table_preview || []);
                renderBlockPreview(preview.block_preview || []);
                document.getElementById("htmlPreview").innerHTML = result.html_preview
                    ? `<div class="html-preview">${result.html_preview}</div>`
                    : '<div class="message">暂无 HTML Preview</div>';
            } catch (error) {
                document.getElementById("htmlPreview").innerHTML = `<div class="message">${escapeHtml(error.message || error)}</div>`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadPreview);
    </script>
</body>
</html>
