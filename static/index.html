<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>外贸订单解析系统</title>
    <style>
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            padding: 24px;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 0 0 auto;
            margin-bottom: 16px;
        }

        h1 {
            color: #333;
            margin: 0;
            font-size: 30px;
            line-height: 1.2;
        }

        .config-link {
            color: #1677ff;
            text-decoration: none;
            font-size: 15px;
            white-space: nowrap;
        }

        .config-link:hover {
            text-decoration: underline;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
            gap: 25px;
            align-items: stretch;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-height: 620px;
            box-sizing: border-box;
        }

        .layout > .card {
            height: 100%;
            min-height: 0;
        }

        .left-panel {
            position: sticky;
            top: 20px;
            align-self: stretch;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .left-panel h2 {
            flex: 0 0 auto;
            margin: 0 0 12px;
        }

        .right-panel {
            height: 100%;
            min-height: 0;
            max-height: none;
            overflow-y: auto;
        }

        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 220px;
            line-height: 1.6;
        }

        #message {
            flex: 1 1 auto;
            min-height: 260px;
            max-height: none;
            resize: none;
        }

        .chat-import-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 6px;
            margin: 2px 0 10px;
        }

        .chat-import-row input[type="file"] {
            margin: 0;
        }

        .chat-import-tip {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        .profile-compact-card {
            border: 1px solid #e0e4ec;
            border-radius: 10px;
            padding: 14px 16px 16px;
            margin-bottom: 18px;
            background: #fafbfd;
        }

        .profile-compact-card > h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #222;
            border-top: none;
            padding-top: 0;
        }

        .profile-compact-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .profile-compact-row select {
            flex: 0 1 360px;
            width: auto;
            height: 36px;
            margin: 0;
            padding: 7px 10px;
        }

        .profile-compact-tip {
            flex: 1 1 auto;
            min-width: 160px;
            color: #666;
            font-size: 13px;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-copy-tip {
            display: none;
            margin-top: -8px;
            margin-bottom: 12px;
            color: #1677ff;
            font-size: 13px;
            line-height: 1.4;
        }

        .chat-copy-tip.visible {
            display: block;
        }

        .description-textarea {
            min-height: 260px;
            font-family: Consolas, "Microsoft YaHei", monospace;
            white-space: pre-wrap;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: #1677ff;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button.secondary {
            background: #52c41a;
        }

        .chat-action-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
            flex: 0 0 auto;
        }

        .chat-action-row #parseBtn {
            flex: 2 1 0;
        }

        .chat-action-row #clearChatBtn {
            flex: 1 1 0;
            background: #6b7280;
        }

        .chat-action-row #clearChatBtn:hover {
            background: #4b5563;
        }

        button:disabled {
            background: #aaa;
            color: #777;
            cursor: not-allowed;
        }

        .field-key {
            color: #999;
            font-size: 13px;
            margin-left: 6px;
        }

        .info-box {
            background: #f7f9fc;
            border: 1px solid #e6edf7;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .section-title {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #333;
        }

        .error {
            color: red;
            margin-top: 12px;
            word-break: break-word;
        }

        .success {
            color: green;
            margin-top: 12px;
        }

        #submitResult {
            flex: 1 1 auto;
            min-width: 240px;
            margin: 0;
            max-width: none;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        #submitResult p {
            margin: 0;
        }

        .empty-form {
            color: #999;
            background: #fafafa;
            border: 1px dashed #ddd;
            padding: 18px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .normal-fields-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .normal-field-item {
            min-width: 0;
        }

        .normal-field-item label {
            margin-top: 0;
        }

        .normal-field-item input {
            margin-bottom: 0;
        }

        .image-upload-card {
            border: 1px solid #e0e4ec;
            border-radius: 10px;
            padding: 14px 16px 16px;
            margin-top: 20px;
            background: #fafbfd;
        }

        .image-upload-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .image-upload-item {
            min-width: 0;
        }

        .image-upload-item label {
            margin-top: 0;
        }

        .image-upload-item input[type="file"] {
            margin-bottom: 6px;
        }

        .image-file-name {
            min-height: 18px;
            color: #666;
            font-size: 13px;
            word-break: break-all;
        }

        .image-pool-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .image-pool-toolbar input[type="file"] {
            max-width: 360px;
            margin-bottom: 0;
        }

        .image-pool-list {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .image-pool-item {
            border: 1px solid #e0e4ec;
            border-radius: 8px;
            background: #fff;
            padding: 8px;
            cursor: grab;
            min-width: 0;
        }

        .image-pool-item.dragging {
            opacity: 0.45;
        }

        .image-pool-thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 6px;
            background: #f2f4f7;
            display: block;
        }

        .image-pool-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .image-pool-name {
            flex: 1 1 auto;
            min-width: 0;
            color: #555;
            font-size: 13px;
            word-break: break-all;
        }

        .image-pool-delete {
            flex: 0 0 auto;
            padding: 5px 8px;
            background: #ff4d4f;
            font-size: 12px;
        }

        .image-pool-paste-tip {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
            margin: -4px 0 12px;
        }

        .image-pool-card {
            outline: none;
            transition: border-color 0.18s ease, background-color 0.18s ease;
        }

        .image-pool-card.paste-active {
            border-color: #1677ff;
            background: #f0f7ff;
        }

        .doc-no-card {
            border: 1px solid #e0e4ec;
            border-radius: 10px;
            padding: 14px 16px 16px;
            margin-bottom: 18px;
            background: #fafbfd;
        }

        .doc-no-card > h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #222;
            border-top: none;
            padding-top: 0;
        }

        .doc-no-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            align-items: end;
            margin-bottom: 12px;
        }

        .doc-no-grid-row2 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .doc-no-cell {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .doc-no-cell label {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.2;
            min-height: 20px;
            color: #555;
            margin-top: 0;
            margin-bottom: 0;
        }

        .doc-no-card input,
        .doc-no-card select {
            width: 100%;
            height: 42px;
            box-sizing: border-box;
            padding: 8px 10px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            margin: 0;
        }

        .doc-no-dosage-hint {
            font-size: 13px;
            color: #666;
            margin: 0 0 12px 0;
        }

        .doc-no-dosage-hint strong {
            color: #333;
            font-family: Consolas, "Courier New", monospace;
        }

        .ingredient-initials-warning {
            display: none;
            margin: -2px 0 2px;
            padding: 8px 10px;
            border: 1px solid #ffe58f;
            border-radius: 6px;
            background: #fffbe6;
            color: #8a6d1d;
            font-size: 12px;
            line-height: 1.4;
        }

        .doc-preview-block {
            border-top: 1px dashed #dde1ea;
            padding-top: 12px;
            margin-top: 4px;
        }

        .doc-preview-line {
            font-family: Consolas, "Microsoft YaHei", monospace;
            font-size: 14px;
            color: #1a1a1a;
            margin: 6px 0;
            word-break: break-all;
        }

        .doc-preview-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 2px;
        }

        .doc-no-final-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 10px;
        }

        .doc-no-final-row .doc-no-final-input-wrap {
            flex: 1 1 auto;
            min-width: 180px;
        }

        .doc-no-final-row .doc-no-final-input-wrap input {
            margin-bottom: 0;
        }

        button.doc-no-regen {
            background: #1677ff;
            font-size: 14px;
            padding: 9px 14px;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .generate-tip {
            margin: 8px 0 0;
            color: #8a6d1d;
            font-size: 13px;
        }

        .excel-action-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: nowrap;
        }

        .excel-action-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 0 0 auto;
        }

        .action-btn {
            background: #1677ff;
            border: 1px solid #1677ff;
            color: #fff;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #0958d9;
            border-color: #0958d9;
        }

        .action-btn:disabled,
        .action-btn.disabled {
            background: #d1d5db !important;
            border-color: #d1d5db !important;
            color: #6b7280 !important;
            cursor: not-allowed !important;
            opacity: 1 !important;
            box-shadow: none !important;
        }

        .action-btn:disabled:hover,
        .action-btn.disabled:hover {
            background: #d1d5db !important;
            border-color: #d1d5db !important;
            color: #6b7280 !important;
        }

        .excel-result-message {
            color: green;
            margin: 0;
        }

        .sync-path {
            margin: 3px 0 0;
            color: #555;
            word-break: break-all;
        }

        .sync-error {
            color: #d46b08;
            margin: 3px 0 0;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: auto;
            }

            .left-panel {
                position: static;
                overflow: visible;
            }

            .right-panel {
                max-height: none;
                overflow-y: auto;
            }

            .excel-action-row {
                flex-wrap: wrap;
            }

            .excel-action-buttons {
                flex-wrap: wrap;
            }

            .doc-no-grid,
            .doc-no-grid-row2 {
                grid-template-columns: 1fr;
            }

            .doc-no-final-row {
                flex-direction: column;
                align-items: stretch;
            }

            .normal-fields-grid {
                grid-template-columns: 1fr;
            }

            .image-upload-grid {
                grid-template-columns: 1fr;
            }

            .image-pool-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .profile-compact-row {
                align-items: stretch;
                flex-direction: column;
            }

            .profile-compact-row select,
            .profile-compact-tip {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>

<header class="app-header">
    <h1>外贸订单解析系统</h1>
    <a href="/config" class="config-link">进入配置中心</a>
</header>

<div class="layout">

    <div class="card left-panel">
        <h2>客户聊天内容</h2>

        <textarea id="message" placeholder="例如：客户小李要订购5000盒固体饮料，电话是13800138000，下周发货"></textarea>
        <div id="messageCopyTip" class="chat-copy-tip">已复制选中内容</div>

        <div class="chat-import-row">
            <input id="chatImportInput" type="file" accept=".txt,.html,.htm,text/plain,text/html">
            <div class="chat-import-tip">支持导入 txt/html 聊天记录，导入后仍需点击 AI解析。</div>
        </div>

        <div class="chat-action-row">
            <button id="parseBtn" onclick="parseMessage()">AI解析</button>
            <button id="clearChatBtn" type="button" onclick="clearChatMessage()">清空</button>
        </div>

        <div id="parseError" class="error"></div>
    </div>

    <div class="card right-panel">
        <h2>订单信息确认</h2>

        <div class="profile-compact-card">
            <h3>选择模板映射</h3>
            <div class="profile-compact-row">
                <select id="profileSelect">
                    <option value="">请选择模板映射</option>
                </select>

                <div id="profileTips" class="profile-compact-tip">
                    请选择本次要使用的 Excel 模板映射。
                </div>
            </div>
        </div>

        <div id="documentNoConfirmArea"></div>

        <form id="confirmForm"></form>

        <div id="descriptionConfirmArea"></div>

        <div id="imageUploadArea"></div>

        <div class="excel-action-row">
            <div class="excel-action-buttons">
                <button id="generateBtn" class="secondary" onclick="submitOrder()" type="button">
                    确认生成Excel
                </button>
                <button id="downloadExcelBtn" class="action-btn" onclick="openOutputFolder()" type="button" disabled>
                    打开订单目录
                </button>
            </div>
            <div id="submitResult"></div>
        </div>
        <p class="generate-tip">部分字段为空时仍可导出，请人工确认内容完整性。</p>
    </div>

</div>

<script>
    const DOC_SECTION_KEYS = [
        "document_no",
        "sales_name",
        "salesperson_code",
        "company_code",
        "deal_date",
        "sequence",
        "ingredient_initials",
        "product_index_or_day",
        "product_abbr",
        "product_form",
        "dosage_form_code",
        "product_code"
    ];
    const DOC_FIXED_DEFAULT_KEYS = new Set([
        "sales_name",
        "salesperson_code",
        "sales_code",
        "company_code",
        "company_short_name",
        "sequence",
        "serial_prefix",
        "default_sales_name",
        "default_salesperson_code",
        "default_company_code",
        "default_sequence"
    ]);
    let allFields = [];
    let visibleFields = [];
    let profiles = [];
    let parsedData = {};
    let appSettings = {
        default_sales_name: "Anna",
        default_salesperson_code: "AN",
        default_company_code: "GS",
        default_sequence: "A01",
        export_sync_dir: ""
    };
    let currentGeneratedFilename = "";
    let currentDownloadUrl = "";
    let lastGeneratedFilePath = "";
    let currentDescriptionFields = {};
    let imageFields = [];
    let imagePoolItems = [];
    let draggedImagePoolKey = "";
    let ingredientInitialsManuallyEdited = false;
    let currentIngredientInitialsMessage = "";
    let descriptionIsComposing = false;
    let chatCopyTipTimer = null;

    function showMessageCopyTip() {
        const tip = document.getElementById("messageCopyTip");
        if (!tip) {
            return;
        }

        tip.classList.add("visible");
        if (chatCopyTipTimer) {
            clearTimeout(chatCopyTipTimer);
        }
        chatCopyTipTimer = setTimeout(() => {
            tip.classList.remove("visible");
            chatCopyTipTimer = null;
        }, 1500);
    }

    function fallbackCopyText(text, sourceTextarea) {
        const helper = document.createElement("textarea");
        const selectionStart = sourceTextarea.selectionStart;
        const selectionEnd = sourceTextarea.selectionEnd;

        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.left = "-9999px";
        helper.style.top = "0";
        document.body.appendChild(helper);
        helper.select();

        const copied = document.execCommand("copy");
        document.body.removeChild(helper);
        sourceTextarea.focus();
        sourceTextarea.setSelectionRange(selectionStart, selectionEnd);
        return copied;
    }

    async function copySelectedMessageText(textarea) {
        const selectedText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd);
        if (!selectedText.trim()) {
            return;
        }

        try {
            let copied = true;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(selectedText);
            } else {
                copied = fallbackCopyText(selectedText, textarea);
            }
            if (copied) {
                showMessageCopyTip();
            }
        } catch (error) {
            try {
                if (!fallbackCopyText(selectedText, textarea)) {
                    return;
                }
                showMessageCopyTip();
            } catch (fallbackError) {
                console.warn("Copy selected chat text failed", fallbackError);
            }
        }
    }

    function initChatAutoCopy() {
        const textarea = document.getElementById("message");
        if (!textarea || textarea.dataset.autoCopyReady === "true") {
            return;
        }

        textarea.dataset.autoCopyReady = "true";
        textarea.addEventListener("mouseup", () => {
            copySelectedMessageText(textarea);
        });
    }

    function readChatFileAsText(file) {
        if (!file) {
            return Promise.reject(new Error("未选择聊天文件"));
        }
        if (typeof file.text === "function") {
            return file.text();
        }

        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || ""));
            reader.onerror = () => reject(reader.error || new Error("读取文件失败"));
            reader.readAsText(file);
        });
    }

    function htmlToPlainText(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(html || ""), "text/html");
        doc.querySelectorAll("script, style, noscript").forEach(node => node.remove());

        const body = doc.body || doc.documentElement;
        const text = body ? (body.innerText || body.textContent || "") : "";
        return String(text || "")
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .replace(/[ \t]+\n/g, "\n")
            .replace(/\n{3,}/g, "\n\n")
            .trim();
    }

    function isSupportedChatFile(file) {
        const name = String(file && file.name || "").toLowerCase();
        return name.endsWith(".txt") || name.endsWith(".html") || name.endsWith(".htm");
    }

    async function importChatFile(file) {
        const errorDiv = document.getElementById("parseError");
        const messageTextarea = document.getElementById("message");

        if (errorDiv) {
            errorDiv.innerText = "";
        }

        if (!file) {
            return;
        }
        if (!isSupportedChatFile(file)) {
            throw new Error("只支持导入 txt/html 聊天记录");
        }

        const rawText = await readChatFileAsText(file);
        if (!String(rawText || "").trim()) {
            throw new Error("聊天文件为空");
        }

        const lowerName = String(file.name || "").toLowerCase();
        const text = lowerName.endsWith(".html") || lowerName.endsWith(".htm")
            ? htmlToPlainText(rawText)
            : String(rawText || "");

        if (!String(text || "").trim()) {
            throw new Error("聊天文件为空");
        }

        if (messageTextarea) {
            messageTextarea.value = text;
        }
        if (errorDiv) {
            errorDiv.innerText = "";
        }
        resetExcelActions();
    }

    function initChatImport() {
        const input = document.getElementById("chatImportInput");
        const errorDiv = document.getElementById("parseError");
        if (!input || input.dataset.importReady === "true") {
            return;
        }

        input.dataset.importReady = "true";
        input.addEventListener("change", async () => {
            const file = input.files && input.files[0] ? input.files[0] : null;
            try {
                await importChatFile(file);
            } catch (error) {
                if (errorDiv) {
                    const message = error && error.message ? error.message : "读取失败";
                    errorDiv.innerText = message === "只支持导入 txt/html 聊天记录" || message === "聊天文件为空"
                        ? message
                        : `聊天记录导入失败：${message}`;
                }
            } finally {
                input.value = "";
            }
        });
    }

    async function loadInitialData() {
        initChatAutoCopy();
        initChatImport();
        await loadFields();
        await loadImageFields();
        await loadAppSettings();
        await loadProfiles();
        updateVisibleFields();
        renderDocumentNoSection({});

    function updateVisibleFields() {
        const profile = getSelectedProfile();

        if (!profile) {
            visibleFields = [];
            return;
        }

        const usedKeys = new Set();
        const docKeySet = new Set(DOC_SECTION_KEYS);

        const mappings = profile.mappings || {};
        Object.keys(mappings).forEach(key => usedKeys.add(key));

        const mappingOrder = Array.isArray(profile.mapping_order) ? profile.mapping_order : [];
        const orderIndex = new Map(mappingOrder.map((key, index) => [key, index]));

        visibleFields = allFields.filter(
            field => usedKeys.has(field.key) && !docKeySet.has(field.key)
        ).sort((a, b) => {
            const aMapped = mappings[a.key] ? 0 : 1;
            const bMapped = mappings[b.key] ? 0 : 1;
            if (aMapped !== bMapped) {
                return aMapped - bMapped;
            }
            const aOrder = orderIndex.has(a.key) ? orderIndex.get(a.key) : 9999;
            const bOrder = orderIndex.has(b.key) ? orderIndex.get(b.key) : 9999;
            if (aOrder !== bOrder) {
                return aOrder - bOrder;
            }
            return allFields.findIndex(field => field.key === a.key) - allFields.findIndex(field => field.key === b.key);
        });
    }

        return `${compact.slice(0, 4)}-${compact.slice(4, 6)}-${compact.slice(6, 8)}`;

    function syncOrderAndDealDates(data) {
        const out = Object.assign({}, data || {});
        const orderDate = formatCompactDate(out.order_date);
        const dealDate = formatCompactDate(out.deal_date);

        if (orderDate && !dealDate) {
            out.order_date = orderDate;
            out.deal_date = orderDate;
        } else if (dealDate && !orderDate) {
            out.deal_date = dealDate;
            out.order_date = dealDate;
        } else {
            if (orderDate) {
                out.order_date = orderDate;
            }
            if (dealDate) {
                out.deal_date = dealDate;
            }
        }

        return out;
    }

    const FORMULA_FIELD_PRIORITY = ["配方要求", "配方", "Formula", "Ingredients"];
    const IGNORED_INGREDIENT_LINE_RE = /(serving size|servings per container|other ingredients|suggested use|warning)/i;
    const AMOUNT_RE = /(\d+(?:\.\d+)?)\s*(mg|mcg|μg|ug|g|ml|iu)\b/ig;
    const IGNORED_INGREDIENT_PREFIXES = new Set([
        "organic",
        "pure",
        "natural",
        "extract",
        "standardized",
        "standardised",
        "total"
    ]);

    function getFormulaTextFromDescriptionFields(descriptionFields) {
        const fields = descriptionFields || {};
        for (const key of FORMULA_FIELD_PRIORITY) {
            const value = fields[key];
            if (value !== null && value !== undefined && String(value).trim()) {
                return String(value).trim();
            }
        }
        return "";
    }

    function normalizeIngredientAmount(value, unit) {
        const amount = Number(value);
        const unitText = String(unit || "").toLowerCase();
        if (!Number.isFinite(amount)) {
            return 0;
        }
        if (unitText === "g") {
            return amount * 1000;
        }
        if (unitText === "mg") {
            return amount;
        }
        if (unitText === "mcg" || unitText === "μg" || unitText === "ug") {
            return amount / 1000;
        }
        return amount;
    }

    function stripFormulaFieldPrefix(line) {
        let text = stripDescriptionSourceMarks(line).trim();
        for (const sep of ["：", ":"]) {
            const index = text.indexOf(sep);
            if (index < 0) {
                continue;
            }
            const prefix = text.slice(0, index).trim();
            if (FORMULA_FIELD_PRIORITY.includes(prefix)) {
                return text.slice(index + 1).trim();
            }
        }
        return text;
    }

    function isNonIngredientLine(line) {
        const text = String(line || "").trim().toLowerCase();
        return !text || IGNORED_INGREDIENT_LINE_RE.test(text) || text.startsWith("total ") || text.startsWith("total:");
    }

    function ingredientInitialFromName(name) {
        let text = String(name || "").trim();
        while (text) {
            const match = text.match(/^([A-Za-z][A-Za-z'-]*)\b/);
            if (!match) {
                return "";
            }
            const word = match[1].replace(/^[-']+|[-']+$/g, "").toLowerCase();
            if (!IGNORED_INGREDIENT_PREFIXES.has(word)) {
                return word.charAt(0).toUpperCase();
            }
            text = text.slice(match[0].length).trim();
        }
        return "";
    }

    function extractIngredientInitialsFromFormulaText(formulaText) {
        const ingredients = [];
        String(formulaText || "").split(/\r?\n/).forEach((rawLine, index) => {
            const line = stripFormulaFieldPrefix(rawLine);
            if (/[\u4e00-\u9fff]/.test(line) || isNonIngredientLine(line)) {
                return;
            }

            AMOUNT_RE.lastIndex = 0;
            const matches = Array.from(line.matchAll(AMOUNT_RE));
            AMOUNT_RE.lastIndex = 0;
            if (matches.length === 0) {
                return;
            }

            const amountMatch = matches[matches.length - 1];
            const amountStart = amountMatch.index || 0;
            const amountEnd = amountStart + amountMatch[0].length;
            const name = (amountStart <= 1 ? line.slice(amountEnd) : line.slice(0, amountStart))
                .replace(/^[\s,;:/\-–—]+|[\s,;:/\-–—]+$/g, "")
                .replace(/\s+/g, " ")
                .trim();
            const initial = ingredientInitialFromName(name);
            if (!initial) {
                return;
            }

            ingredients.push({
                amount: normalizeIngredientAmount(amountMatch[1], amountMatch[2]),
                index,
                initial
            });
        });

        return ingredients
            .sort((a, b) => b.amount - a.amount || a.index - b.index)
            .slice(0, 3)
            .map(item => item.initial)
            .sort()
            .join("");
    }

    function extractIngredientInitialsFromDescriptionFields(descriptionFields) {

    function createImagePoolCard() {
        const card = document.createElement("div");
        card.className = "image-upload-card image-pool-card";
        card.tabIndex = 0;
        card.innerHTML = `
            <h3 class="section-title">&#22270;&#29255;&#32032;&#26448;&#27744;&#65288;&#21487;&#36873;&#65289;</h3>

            </div>
            <div id="imagePoolList" class="image-pool-list"></div>
        `;

        const input = card.querySelector("#imagePoolInput");
        input.addEventListener("change", async function () {
            const files = Array.from(input.files || []);
            input.value = "";
            if (!files.length) {
                return;
            }
            try {
                await uploadPoolImages(files);
            } catch (error) {
                showImagePoolUploadError(error);
            }
        });
        card.addEventListener("click", function () {
            card.focus();
        });
        card.addEventListener("paste", async function (event) {
            const files = getPastedImageFiles(event);
            if (!files.length) {
                return;
            }

            event.preventDefault();
            flashImagePoolPasteActive(card);
            try {
                await uploadPoolImages(files);
            } catch (error) {
                showImagePoolUploadError(error);
            }
        });
        card.addEventListener("dragover", function (event) {
            if (event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files.length) {
                event.preventDefault();
                card.classList.add("paste-active");
            }
        });
        card.addEventListener("dragleave", function () {
            card.classList.remove("paste-active");
        });
        card.addEventListener("drop", async function (event) {
            const files = Array.from(event.dataTransfer && event.dataTransfer.files || []);
            if (!files.length) {
                card.classList.remove("paste-active");
                return;
            }

            event.preventDefault();
            flashImagePoolPasteActive(card);
            try {
                await uploadPoolImages(files);
            } catch (error) {
                showImagePoolUploadError(error);
            }
        });

        return card;
    }

    function showImagePoolUploadError(error) {

    function getClipboardImageExtension(type) {
        const lower = String(type || "").toLowerCase();
        if (lower.includes("jpeg") || lower.includes("jpg")) {
            return "jpg";
        }
        return "png";
    }

    function normalizePastedImageFile(file, index) {
        const name = String(file && file.name || "").trim();
        if (name && isAllowedImageFile(file)) {
            return file;
        }

        const type = file && file.type ? file.type : "image/png";
        const extension = getClipboardImageExtension(type);
        return new File([file], `pasted-image-${Date.now()}-${index + 1}.${extension}`, { type });
    }

    function getPastedImageFiles(event) {
        const data = event && event.clipboardData ? event.clipboardData : null;
        const items = data && data.items ? Array.from(data.items) : [];
        const files = [];

        items.forEach(item => {
            if (!item || !String(item.type || "").toLowerCase().startsWith("image/")) {
                return;
            }

            const file = item.getAsFile ? item.getAsFile() : null;
            if (file) {
                files.push(normalizePastedImageFile(file, files.length));
            }
        });

        return files;
    }

    async function uploadPoolImages(files) {
        for (const file of files) {
            if (!isAllowedImageFile(file)) {
                throw new Error(`Image pool ${file.name || ""} only supports JPG, JPEG, PNG`);
            }

            const formData = new FormData();
            formData.append("file", file);

            const response = await fetch("/api/image-pool/upload", {
                method: "POST",
                body: formData
            });
            const result = await response.json();

            if (!result.success || !result.item) {
                throw new Error(result.error || `Image pool ${file.name} upload failed`);
            }

            imagePoolItems.push(result.item);
        }
        renderImagePoolList();
    }

        const list = document.getElementById("imagePoolList");

        list.innerHTML = "";

            row.addEventListener("dragstart", function () {

            row.querySelector(".image-pool-delete").addEventListener("click", function () {

                renderImagePoolList();

    }

    function moveImagePoolItem(sourceKey, targetKey) {
        if (!sourceKey || !targetKey || sourceKey === targetKey) {
            return;
        }
        const fromIndex = imagePoolItems.findIndex(item => String(item.key || "") === sourceKey);
        const toIndex = imagePoolItems.findIndex(item => String(item.key || "") === targetKey);
        if (fromIndex < 0 || toIndex < 0) {
            return;
        }
        const nextItems = imagePoolItems.slice();
        const [item] = nextItems.splice(fromIndex, 1);
        nextItems.splice(toIndex, 0, item);
        imagePoolItems = nextItems;
        renderImagePoolList();
    }

    function getImagePoolPayload() {

    function stripDescriptionSourceMarks(text) {
        return String(text || "").replace(DESCRIPTION_SOURCE_MARK_RE, "");
    }

    function replaceDescriptionLineSource(line, source) {
        const marker = `[${source}]`;
        const cleanLine = stripDescriptionSourceMarks(line);
        const chineseColonIndex = cleanLine.indexOf("：");
        const asciiColonIndex = cleanLine.indexOf(":");
        let colonIndex = -1;
        if (chineseColonIndex >= 0 && asciiColonIndex >= 0) {
            colonIndex = Math.min(chineseColonIndex, asciiColonIndex);
        } else {
            colonIndex = Math.max(chineseColonIndex, asciiColonIndex);
        }
        if (colonIndex >= 0) {
            const sep = cleanLine.charAt(colonIndex);
            const prefix = cleanLine.slice(0, colonIndex);
            const value = cleanLine.slice(colonIndex + 1).trim();
            return `${prefix}${sep}${marker}${value ? " " + value : ""}`;
        }
        return cleanLine.trim() ? `${marker} ${cleanLine.trim()}` : cleanLine;
    }

    function setDescriptionValue(textarea, value) {
        if (!textarea) {
            return;
        }
        const nextValue = value || "";
        if (textarea.value === nextValue) {
            textarea.dataset.lastValue = textarea.value;
            return;
        }
        const selectionStart = textarea.selectionStart;
        const selectionEnd = textarea.selectionEnd;
        textarea.dataset.internalUpdate = "true";
        textarea.value = nextValue;
        textarea.dataset.lastValue = textarea.value;
        delete textarea.dataset.internalUpdate;
        if (
            typeof selectionStart === "number" &&
            typeof selectionEnd === "number" &&
            document.activeElement === textarea
        ) {
            const start = Math.min(selectionStart, textarea.value.length);
            const end = Math.min(selectionEnd, textarea.value.length);
            textarea.setSelectionRange(start, end);
        }
    }

    function extractDocumentProductCode() {
        const dnInput = document.getElementById("doc_field_document_no");
        const documentNo = dnInput ? String(dnInput.value || "").trim() : "";
        const parts = documentNo.split("-");
        return parts.length >= 3 ? parts[2].trim() : "";
    }

    function syncDescriptionProductCodeFromDocumentNo() {
        const textarea = document.getElementById("description_text");
        if (!textarea) {
            return;
        }

        const productCode = extractDocumentProductCode();
        if (!productCode) {
            return;
        }

        const replacement = `代号：[系统] ${productCode}`;
        const lines = String(textarea.value || "").split("\n");
        let changed = false;
        let found = false;

        for (let i = 0; i < lines.length; i += 1) {
            if (!lines[i].includes("代号")) {
                continue;
            }

            found = true;
            let nextLine = replacement;
            if (lines[i].includes("：")) {
                nextLine = `${lines[i].split("：", 1)[0]}：[系统] ${productCode}`;
            } else if (lines[i].includes(":")) {
                nextLine = `${lines[i].split(":", 1)[0]}:[系统] ${productCode}`;
            }
            if (lines[i] !== nextLine) {
                lines[i] = nextLine;
                changed = true;
            }
            break;
        }

        if (!found) {
            lines.unshift(replacement);
            changed = true;
        }

        if (changed) {
            setDescriptionValue(textarea, lines.join("\n"));
        }
    }

    function markEditedDescriptionLine(textarea) {
        if (!textarea || textarea.dataset.internalUpdate === "true") {
            return;
        }
        if (descriptionIsComposing) {
            return;
        }

        const oldValue = textarea.dataset.lastValue || "";
        const newValue = textarea.value || "";
        const oldLines = oldValue.split("\n");
        const newLines = newValue.split("\n");
        const selectionStart = textarea.selectionStart == null ? newValue.length : textarea.selectionStart;
        const selectionEnd = textarea.selectionEnd == null ? selectionStart : textarea.selectionEnd;
        const cursor = selectionStart;
        const lineIndex = newValue.slice(0, cursor).split("\n").length - 1;

        if (oldLines[lineIndex] === newLines[lineIndex]) {
            textarea.dataset.lastValue = newValue;
            return;
        }

        const originalLine = newLines[lineIndex] || "";
        const markedLine = replaceDescriptionLineSource(originalLine, "人工");
        if (markedLine === originalLine) {
            textarea.dataset.lastValue = newValue;
            return;
        }

        newLines[lineIndex] = markedLine;
        const markedValue = newLines.join("\n");
        if (markedValue === newValue) {
            textarea.dataset.lastValue = newValue;
            return;
        }

        const delta = markedValue.length - newValue.length;
        setDescriptionValue(textarea, markedValue);
        if (document.activeElement === textarea) {
            const nextStart = Math.max(0, Math.min(selectionStart + delta, textarea.value.length));
            const nextEnd = Math.max(0, Math.min(selectionEnd + delta, textarea.value.length));
            textarea.setSelectionRange(nextStart, nextEnd);
        }
    }

    async function parseMessage() {
        const message = document.getElementById("message").value.trim();
        const errorDiv = document.getElementById("parseError");
        const submitResult = document.getElementById("submitResult");
        const parseBtn = document.getElementById("parseBtn");

        errorDiv.innerText = "";
        submitResult.innerHTML = "";
        resetExcelActions();

        if (!profiles.length) {
            errorDiv.innerText = "请先在配置中心创建模板映射";
            return;
        }

        if (!message) {
            errorDiv.innerText = "请输入客户聊天内容";
            return;
        }

        parseBtn.disabled = true;
        parseBtn.innerText = "解析中...";

        const response = await fetch("/api/parse", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const result = await response.json();

        parseBtn.disabled = false;
        parseBtn.innerText = "AI解析";

        if (!result.success) {
            errorDiv.innerText = result.error || "解析失败";
            return;
        }

        if (result.data.error) {
            errorDiv.innerText = result.data.error;
            return;
        }

        ingredientInitialsManuallyEdited = false;
        currentIngredientInitialsMessage = "";
        currentDescriptionFields = {};
        parsedData = syncOrderAndDealDates(stripDocumentDefaultFields(result.data));

        const productForm = normalizeProductForm(extractParsedProductForm(parsedData));
        if (productForm) {
            parsedData.product_form = productForm;
        }

        const autoSelected = productForm
            ? await autoSelectProfileByProductForm(productForm)
            : false;

        if (!autoSelected) {
            updateVisibleFields();
            renderDocumentNoSection(parsedData, { preserveFixedDefaults: true });
            renderForm(parsedData);
            await renderDescriptionArea(mergeDataWithMappingDefaults(parsedData), { useAi: true });
            renderImageUploadArea();
        }
    }

    function collectDocNoFormData() {
        const data = {};

        DOC_SECTION_KEYS.forEach(key => {
            const input = document.getElementById("doc_field_" + key);
            if (input && (input.type === "date" || isCompactDateFieldKey(key))) {
                data[key] = formatCompactDate(input.value);
            } else {
                data[key] = input ? input.value : "";
            }
        });

        data.product_form = normalizeProductForm(data.product_form);
        return data;
    }

    function collectFormData() {
        const data = {};

        visibleFields.forEach(field => {
            const input = document.getElementById("field_" + field.key);
            if (input && (input.type === "date" || isCompactDateFieldKey(field.key))) {
                data[field.key] = formatCompactDate(input.value);
            } else {
                data[field.key] = input ? input.value : null;
            }
        });

        return data;
    }

    function collectAllOrderData() {
        return syncOrderAndDealDates(Object.assign({}, collectDocNoFormData(), collectFormData()));
    }

    function resetExcelActions() {
        currentGeneratedFilename = "";
        currentDownloadUrl = "";
        lastGeneratedFilePath = "";

        const downloadBtn = document.getElementById("downloadExcelBtn");

        if (downloadBtn) {
            downloadBtn.disabled = true;
            downloadBtn.classList.add("disabled");
            downloadBtn.setAttribute("aria-disabled", "true");
        }
    }

    function enableExcelActions(result) {
        lastGeneratedFilePath = result.lastGeneratedFilePath || result.output_path || result.file_path || "";
        currentGeneratedFilename = lastGeneratedFilePath ? getFilenameFromPath(lastGeneratedFilePath) : (result.filename || "");
        currentDownloadUrl = result.download_url || "";

        const downloadBtn = document.getElementById("downloadExcelBtn");

        if (downloadBtn && lastGeneratedFilePath) {
            downloadBtn.disabled = false;
            downloadBtn.classList.remove("disabled");
            downloadBtn.setAttribute("aria-disabled", "false");
        }
    }

    function getFilenameFromPath(path) {
        const text = String(path || "").trim();
        if (!text) {
            return "";
        }
        const parts = text.split(/[\\/]+/);
        return parts[parts.length - 1] || text;
    }

    async function openOutputFolder() {
        const submitResult = document.getElementById("submitResult");

        if (!lastGeneratedFilePath) {
            if (submitResult) {
                submitResult.innerHTML = `<p class="error">请先生成Excel</p>`;
            }
            return;
        }

        const response = await fetch("/api/open-output-folder", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                lastGeneratedFilePath: lastGeneratedFilePath
            })
        });
        const result = await response.json();

        if (!submitResult) {
            return;
        }

        if (!result.success) {
            submitResult.innerHTML = `<p class="sync-error">${escapeHtml(result.error || "打开订单目录失败")}</p>`;
            return;
        }

        submitResult.innerHTML = `
            <p class="success excel-result-message">已打开订单目录</p>
            <p class="sync-path">文件名：${escapeHtml(getFilenameFromPath(lastGeneratedFilePath))}</p>
        `;
    }

    function collectDescriptionText() {
        const textarea = document.getElementById("description_text");
        return textarea ? textarea.value : "";
    }

    function isAllowedImageFile(file) {
        const name = file ? String(file.name || "").toLowerCase() : "";
        return name.endsWith(".png") || name.endsWith(".jpg") || name.endsWith(".jpeg");
    }

    async function uploadSelectedImages() {
        const imageData = {};
        const inputs = Array.from(document.querySelectorAll(".image-upload-input"));

        for (const input of inputs) {
            const file = input.files && input.files[0] ? input.files[0] : null;
            if (!file) {
                continue;
            }

            if (!isAllowedImageFile(file)) {
                throw new Error(`图片字段 ${input.dataset.fieldKey || ""} 仅支持 JPG、JPEG、PNG`);
            }

            const formData = new FormData();
            formData.append("field_key", input.dataset.fieldKey || "");
            formData.append("file", file);

            const response = await fetch("/api/upload-image", {
                method: "POST",
                body: formData
            });
            const result = await response.json();

            if (!result.success) {
                throw new Error(result.error || `图片 ${file.name} 上传失败`);
            }

            imageData[input.dataset.fieldKey || result.field_key] = {
                image_path: result.image_path
            };
        }

        return imageData;
    }

    async function submitOrder() {
        const profileId = document.getElementById("profileSelect").value;
        const data = collectAllOrderData();
        const descriptionText = collectDescriptionText();
        const submitResult = document.getElementById("submitResult");
        const generateBtn = document.getElementById("generateBtn");

        submitResult.innerHTML = "";
        resetExcelActions();

        if (!profileId) {
            submitResult.innerHTML = `<p class="error">请先选择模板映射</p>`;
            return;
        }

        const profile = getSelectedProfile();
        if (!profile || !profile.template_file) {
            submitResult.innerHTML = `<p class="error">请先在配置中心上传当前映射的 Excel 模板</p>`;
            return;
        }

        const descSettings = profile.description_settings || {};
        const descriptionWarning = descSettings.enabled === true && !descSettings.template_name
            ? `<p class="error">当前未设置产品描述模板，产品描述将为空。</p>`
            : "";

        generateBtn.disabled = true;
        generateBtn.innerText = "生成中...";

        try {
            const imageData = await uploadSelectedImages();
            const response = await fetch("/api/generate-excel", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    profile_id: profileId,
                    data: data,
                    description_fields: currentDescriptionFields || {},
                    description_text: descriptionText,
                    image_data: imageData,
                    image_pool: getImagePoolPayload()
                })
            });

            const result = await response.json();

            if (!result.success) {
                submitResult.innerHTML = `
                    <p class="error">生成失败：${escapeHtml(result.error || "")}</p>
                `;
                return;
            }

            enableExcelActions(result);

            const filename = getFilenameFromPath(lastGeneratedFilePath);
            const filenameHtml = filename
                ? `<p class="sync-path">文件名：${escapeHtml(filename)}</p>`
                : "";
            const syncStatusHtml = result.synced && result.sync_path
                ? `<p class="sync-path">已同步到：${escapeHtml(result.sync_path)}</p>`
                : result.sync_error
                    ? `<p class="sync-error">同步失败：${escapeHtml(result.sync_error)}</p>`
                    : `<p class="sync-path">未配置同步目录</p>`;

            submitResult.innerHTML = `
                <p class="success excel-result-message">Excel生成成功！</p>
                ${filenameHtml}
                ${descriptionWarning}
                ${syncStatusHtml}
            `;
        } catch (error) {
            submitResult.innerHTML = `<p class="error">${escapeHtml(error.message || "生成失败")}</p>`;
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerText = "确认生成Excel";
        }
    }

    async function syncCurrentExcel() {
        const submitResult = document.getElementById("submitResult");
        const syncBtn = document.getElementById("syncExcelBtn");

        if (!lastGeneratedFilePath) {
            if (submitResult) {
                submitResult.innerHTML = `<p class="error">请先生成 Excel</p>`;
            }
            return;
        }

        if (syncBtn) {
            syncBtn.disabled = true;
            syncBtn.innerText = "同步中...";
        }

        const response = await fetch("/api/sync-output", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                lastGeneratedFilePath: lastGeneratedFilePath
            })
        });
        const result = await response.json();

        if (syncBtn) {
            syncBtn.disabled = false;
            syncBtn.innerText = "同步";
        }

        if (!submitResult) {
            return;
        }

        if (!result.success) {
            submitResult.innerHTML = `<p class="sync-error">${escapeHtml(result.error || "同步失败")}</p>`;
            return;
        }

        lastGeneratedFilePath = result.lastGeneratedFilePath || result.sync_path || lastGeneratedFilePath;
        currentGeneratedFilename = getFilenameFromPath(lastGeneratedFilePath);

        submitResult.innerHTML = `
            <p class="success excel-result-message">同步成功！</p>
            <p class="sync-path">已同步到：${escapeHtml(result.sync_path || "")}</p>
        `;
    }

    function escapeHtml(text) {
        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    loadInitialData();
</script>

</body>
</html>
