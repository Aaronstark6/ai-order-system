<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>外贸订单解析系统 V2</title>
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            padding: 30px;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-top: 0;
        }

        .nav {
            margin-bottom: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: stretch;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-height: 620px;
            box-sizing: border-box;
        }

        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 220px;
            line-height: 1.6;
        }

        .composite-textarea {
            min-height: 160px;
            font-family: Consolas, "Microsoft YaHei", monospace;
            white-space: pre-wrap;
        }

        .description-textarea {
            min-height: 260px;
            font-family: Consolas, "Microsoft YaHei", monospace;
            white-space: pre-wrap;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: #1677ff;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button.secondary {
            background: #52c41a;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .field-key {
            color: #999;
            font-size: 13px;
            margin-left: 6px;
        }

        .required {
            color: red;
            margin-left: 4px;
        }

        .tips {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .info-box {
            background: #f7f9fc;
            border: 1px solid #e6edf7;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .section-title {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #333;
        }

        .composite-box {
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .composite-cell {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .error {
            color: red;
            margin-top: 12px;
            word-break: break-word;
        }

        .success {
            color: green;
            margin-top: 12px;
        }

        #submitResult {
            margin-top: 15px;
            max-width: 100%;
            word-break: break-word;
        }

        .download-link {
            display: inline-block;
            margin-top: 8px;
            padding: 9px 14px;
            background: #1677ff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }

        .empty-form {
            color: #999;
            background: #fafafa;
            border: 1px dashed #ddd;
            padding: 18px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .doc-no-card {
            border: 1px solid #e0e4ec;
            border-radius: 10px;
            padding: 14px 16px 16px;
            margin-bottom: 18px;
            background: #fafbfd;
        }

        .doc-no-card > h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #222;
            border-top: none;
            padding-top: 0;
        }

        .doc-no-card .tips {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .doc-no-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px 12px;
            margin-bottom: 12px;
        }

        .doc-no-grid-row2 {
            grid-template-columns: repeat(4, 1fr);
        }

        .doc-no-cell label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-top: 0;
            margin-bottom: 4px;
        }

        .doc-no-cell input {
            width: 100%;
            margin-top: 0;
            margin-bottom: 0;
            padding: 8px 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .doc-no-dosage-hint {
            font-size: 13px;
            color: #666;
            margin: 0 0 12px 0;
        }

        .doc-no-dosage-hint strong {
            color: #333;
            font-family: Consolas, "Courier New", monospace;
        }

        .doc-preview-block {
            border-top: 1px dashed #dde1ea;
            padding-top: 12px;
            margin-top: 4px;
        }

        .doc-preview-line {
            font-family: Consolas, "Microsoft YaHei", monospace;
            font-size: 14px;
            color: #1a1a1a;
            margin: 6px 0;
            word-break: break-all;
        }

        .doc-preview-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 2px;
        }

        .doc-no-final-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
            margin-top: 10px;
        }

        .doc-no-final-row .doc-no-final-input-wrap {
            flex: 1 1 220px;
            min-width: 180px;
        }

        .doc-no-final-row .doc-no-final-input-wrap input {
            margin-bottom: 0;
        }

        button.doc-no-regen {
            background: #1677ff;
            font-size: 14px;
            padding: 9px 14px;
            white-space: nowrap;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: auto;
            }

            .doc-no-grid,
            .doc-no-grid-row2 {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<h1>外贸订单解析系统 V2</h1>

<div class="nav">
    <a href="/config">进入配置中心</a>
</div>

<div class="layout">

    <div class="card">
        <h2>客户聊天内容</h2>

        <textarea id="message" placeholder="例如：客户小李要订购5000盒固体饮料，电话是13800138000，下周发货"></textarea>

        <label>选择模板映射</label>
        <select id="profileSelect">
            <option value="">请选择模板映射</option>
        </select>

        <div class="info-box" id="profileTips">
            请选择本次要使用的 Excel 模板映射。
        </div>

        <button id="parseBtn" onclick="parseMessage()">AI解析</button>

        <div id="parseError" class="error"></div>
    </div>

    <div class="card">
        <h2>订单信息确认</h2>

        <p class="tips">
            普通字段和组合单元格都可以在这里确认、修改。组合单元格会按这里编辑后的格式写入 Excel。
            文档编号相关字段请在下方的「文档编号信息」中填写；未填项将使用模板映射中的默认值（如 Anna、GS、A01 等）。
        </p>

        <div id="documentNoConfirmArea"></div>

        <form id="confirmForm"></form>

        <div id="descriptionConfirmArea"></div>

        <div id="compositeConfirmArea"></div>

        <button id="generateBtn" class="secondary" onclick="submitOrder()" type="button">
            确认生成Excel
        </button>

        <div id="submitResult"></div>
    </div>

</div>

<script>
    const DOC_SECTION_KEYS = [
        "document_no",
        "sales_name",
        "salesperson_code",
        "company_code",
        "deal_date",
        "sequence",
        "product_index_or_day",
        "product_abbr",
        "product_form",
        "dosage_form_code",
        "product_code"
    ];
    let allFields = [];
    let visibleFields = [];
    let profiles = [];
    let parsedData = {};

    async function loadInitialData() {
        await loadFields();
        await loadProfiles();
        updateVisibleFields();
        renderDocumentNoSection({});
        renderForm({});
        renderDescriptionArea(mergeDataWithMappingDefaults({}));
        renderCompositeArea(mergeDataWithMappingDefaults({}));
    }

    async function loadFields() {
        const response = await fetch("/api/fields");
        const result = await response.json();

        if (!result.success) {
            alert("字段库加载失败");
            return;
        }

        allFields = (result.fields || []).filter(field => field.enabled !== false);
    }

    async function loadProfiles() {
        const response = await fetch("/api/template-profiles");
        const result = await response.json();

        if (!result.success) {
            alert("模板映射加载失败");
            return;
        }

        profiles = result.profiles || [];

        const select = document.getElementById("profileSelect");
        select.innerHTML = `<option value="">请选择模板映射</option>`;

        profiles.forEach(profile => {
            const option = document.createElement("option");
            option.value = profile.id;
            option.textContent = profile.name;
            select.appendChild(option);
        });

        select.onchange = function () {
            updateProfileTips();
            updateVisibleFields();
            renderDocumentNoSection(parsedData);
            renderForm(parsedData);
            renderDescriptionArea(mergeDataWithMappingDefaults(parsedData), {
                useAi: Boolean((document.getElementById("message").value || "").trim())
            });
            renderCompositeArea(mergeDataWithMappingDefaults(parsedData));
            document.getElementById("submitResult").innerHTML = "";
        };

        if (profiles.length > 0) {
            select.value = profiles[0].id;
        }

        updateProfileTips();
    }

    function getSelectedProfile() {
        const profileId = document.getElementById("profileSelect").value;
        return profiles.find(p => p.id === profileId) || null;
    }

    function mergeDataWithMappingDefaults(data) {
        const profile = getSelectedProfile();
        const defs = profile && profile.mapping_defaults ? profile.mapping_defaults : {};
        const out = Object.assign({}, data || {});
        Object.keys(defs).forEach(k => {
            const v = out[k];
            if (v === null || v === undefined || String(v).trim() === "") {
                const dv = defs[k];
                if (dv != null && String(dv).trim() !== "") {
                    out[k] = dv;
                }
            }
        });
        return out;
    }

    function extractKeysFromCompositeTemplates(profile) {
        const keys = new Set();
        const compositeMappings = profile && profile.composite_mappings ? profile.composite_mappings : [];

        compositeMappings.forEach(item => {
            const template = item.template || "";
            const matches = template.matchAll(/\{([^{}]+)\}/g);

            for (const match of matches) {
                const key = match[1].trim();

                if (key) {
                    keys.add(key);
                }
            }
        });

        return keys;
    }

    function updateVisibleFields() {
        const profile = getSelectedProfile();

        if (!profile) {
            visibleFields = [];
            return;
        }

        const usedKeys = new Set();
        const docKeySet = new Set(DOC_SECTION_KEYS);

        const mappings = profile.mappings || {};
        Object.keys(mappings).forEach(key => usedKeys.add(key));

        const compositeKeys = extractKeysFromCompositeTemplates(profile);
        compositeKeys.forEach(key => usedKeys.add(key));

        visibleFields = allFields.filter(
            field => usedKeys.has(field.key) && !docKeySet.has(field.key)
        );
    }

    function updateProfileTips() {
        const profile = getSelectedProfile();
        const tips = document.getElementById("profileTips");

        if (!profile) {
            tips.innerText = "请选择本次要使用的 Excel 模板映射。";
            return;
        }

        const templateText = profile.template_file ? "已上传" : "未上传模板";
        const mappingCount = profile.mappings ? Object.keys(profile.mappings).length : 0;
        const compositeCount = profile.composite_mappings ? profile.composite_mappings.length : 0;

        tips.innerText = `当前映射：${profile.name}；模板状态：${templateText}；普通字段：${mappingCount}；组合单元格：${compositeCount}`;
    }

    function getTodayISODate() {
        const d = new Date();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${d.getFullYear()}-${m}-${day}`;
    }

    function formatDealDateYyyymmdd(value) {
        let text = String(value || "").trim().replace(/\//g, "-");
        const digits = text.replace(/\D/g, "");
        if (digits.length === 8) {
            return digits;
        }
        return "";
    }

    function getDosageFormCode(productForm) {
        const map = {
            "硬胶囊": "C",
            "胶囊": "C",
            "软胶囊": "S",
            "软糖": "G",
            "滴剂": "D",
            "压片": "T",
            "固体饮料": "P",
            "粉末": "P",
            "精油": "O",
            "凝胶": "N"
        };
        return map[String(productForm || "").trim()] || "";
    }

    function resolveDocInputOrDefault(elId, settingKey, fallback) {
        const profile = getSelectedProfile();
        const st = profile && profile.document_no_settings ? profile.document_no_settings : {};
        const el = document.getElementById(elId);
        let v = el && el.value != null ? String(el.value).trim() : "";
        if (!v && settingKey && st[settingKey] != null && String(st[settingKey]).trim() !== "") {
            v = String(st[settingKey]).trim();
        }
        if (!v) {
            v = fallback || "";
        }
        return v;
    }

    function getDocNoPreviewComputations() {
        const salesName = resolveDocInputOrDefault("doc_field_sales_name", "default_sales_name", "Anna");
        const salesCode = resolveDocInputOrDefault("doc_field_salesperson_code", "default_salesperson_code", "AN");
        const companyCode = resolveDocInputOrDefault("doc_field_company_code", "default_company_code", "GS");
        const sequence = resolveDocInputOrDefault("doc_field_sequence", "default_sequence", "A01");

        const dealEl = document.getElementById("doc_field_deal_date");
        let dealRaw = dealEl && dealEl.value != null ? String(dealEl.value).trim() : "";
        if (!dealRaw) {
            dealRaw = getTodayISODate();
        }

        const yyyymmdd = formatDealDateYyyymmdd(dealRaw);
        const idxEl = document.getElementById("doc_field_product_index_or_day");
        const abbrEl = document.getElementById("doc_field_product_abbr");
        const formEl = document.getElementById("doc_field_product_form");
        const pcEl = document.getElementById("doc_field_product_code");

        const indexOrDay = idxEl ? String(idxEl.value || "").trim() : "";
        const abbr = abbrEl ? String(abbrEl.value || "").trim() : "";
        const productForm = formEl ? String(formEl.value || "").trim() : "";
        const manualPc = pcEl ? String(pcEl.value || "").trim() : "";

        const dosageCode = getDosageFormCode(productForm);
        const dosageHidden = document.getElementById("doc_field_dosage_form_code");
        if (dosageHidden) {
            dosageHidden.value = dosageCode;
        }

        const computedPc = `${salesCode}${indexOrDay}${abbr}${dosageCode}`;
        const effectivePc = manualPc || computedPc;

        const ruleDocNo = yyyymmdd
            ? `${salesName}-${companyCode}${yyyymmdd}${sequence}-${effectivePc}`
            : "";

        return {
            salesName,
            salesCode,
            companyCode,
            sequence,
            yyyymmdd,
            dosageCode,
            productForm,
            computedPc,
            effectivePc,
            ruleDocNo
        };
    }

    function updateDocNoPreviews() {
        const c = getDocNoPreviewComputations();

        const elDosageHint = document.getElementById("docPreviewDosage");
        if (elDosageHint) {
            elDosageHint.innerHTML = c.dosageCode
                ? `<strong>${escapeHtml(c.dosageCode)}</strong>（根据「${escapeHtml(c.productForm || "（未填）")}」）`
                : "（请先填写产品形式）";
        }

        const elPc = document.getElementById("docPreviewProductCode");
        if (elPc) {
            elPc.textContent = c.effectivePc || "（尚不完整）";
        }

        const elRuleDn = document.getElementById("docPreviewRuleDocumentNo");
        if (elRuleDn) {
            elRuleDn.textContent = c.ruleDocNo || "（请填写有效成交日期）";
        }

        refreshCompositeFromCurrentFields();
        refreshDescriptionFromCurrentFields();
    }

    function bindDocNoSyncInputs() {
        document.querySelectorAll(".doc-no-sync").forEach(el => {
            el.addEventListener("input", function () {
                updateDocNoPreviews();
            });
            el.addEventListener("change", function () {
                updateDocNoPreviews();
            });
        });
    }

    function regenerateDocumentNoFromRule() {
        updateDocNoPreviews();
        const c = getDocNoPreviewComputations();
        const dnInput = document.getElementById("doc_field_document_no");
        if (dnInput) {
            dnInput.value = c.ruleDocNo || "";
        }
        refreshCompositeFromCurrentFields();
    }

    function renderDocumentNoSection(data) {
        const area = document.getElementById("documentNoConfirmArea");
        if (!area) {
            return;
        }

        const profile = getSelectedProfile();
        area.innerHTML = "";

        if (!profile) {
            return;
        }

        const s = profile.document_no_settings || {};
        const today = getTodayISODate();
        const d = data || {};

        const v = function (key, fallbackSetting, fallbackLiteral) {
            let raw = d[key] != null && String(d[key]).trim() !== "" ? String(d[key]).trim() : "";
            if (!raw && fallbackSetting && s[fallbackSetting]) {
                raw = String(s[fallbackSetting]).trim();
            }
            if (!raw && fallbackLiteral) {
                raw = fallbackLiteral;
            }
            return raw;
        };

        const initSales = v("sales_name", "default_sales_name", "Anna");
        const initCode = v("salesperson_code", "default_salesperson_code", "AN");
        const initCompany = v("company_code", "default_company_code", "GS");
        const initSeq = v("sequence", "default_sequence", "A01");
        let initDeal = d.deal_date != null && String(d.deal_date).trim() !== "" ? String(d.deal_date).trim() : "";
        if (!initDeal) {
            initDeal = today;
        }

        const initIdx = d.product_index_or_day != null ? String(d.product_index_or_day) : "";
        const initAbbr = d.product_abbr != null ? String(d.product_abbr) : "";
        const initForm = d.product_form != null ? String(d.product_form) : "";
        const initPc = d.product_code != null ? String(d.product_code) : "";
        const initDn = d.document_no != null ? String(d.document_no) : "";

        const initDosage = getDosageFormCode(initForm);

        area.innerHTML = `
            <div class="doc-no-card">
                <h3>文档编号信息</h3>
                <p class="tips">
                    紧凑编辑区；「计算产品编码」「规则生成文档编号」会随上方字段实时变化。
                    「最终文档编号」可留空（导出时由后端按规则生成），或手动填写/点「重新按规则生成」填入当前规则结果。
                </p>
                <div class="doc-no-grid">
                    <div class="doc-no-cell">
                        <label for="doc_field_sales_name">业务员英文名</label>
                        <input class="doc-no-sync" id="doc_field_sales_name" type="text" value="${escapeHtml(initSales)}" placeholder="Anna" autocomplete="off">
                    </div>
                    <div class="doc-no-cell">
                        <label for="doc_field_salesperson_code">业务员代号</label>
                        <input class="doc-no-sync" id="doc_field_salesperson_code" type="text" value="${escapeHtml(initCode)}" placeholder="AN" autocomplete="off">
                    </div>
                    <div class="doc-no-cell">
                        <label for="doc_field_company_code">公司简称</label>
                        <input class="doc-no-sync" id="doc_field_company_code" type="text" value="${escapeHtml(initCompany)}" placeholder="GS" autocomplete="off">
                    </div>
                    <div class="doc-no-cell">
                        <label for="doc_field_deal_date">成交日期</label>
                        <input class="doc-no-sync" id="doc_field_deal_date" type="date" value="${escapeHtml(initDeal)}" autocomplete="off">
                    </div>
                    <div class="doc-no-cell">
                        <label for="doc_field_sequence">序号</label>
                        <input class="doc-no-sync" id="doc_field_sequence" type="text" value="${escapeHtml(initSeq)}" placeholder="A01" autocomplete="off">
                    </div>
                </div>
                <div class="doc-no-grid doc-no-grid-row2">
                    <div class="doc-no-cell">
                        <label for="doc_field_product_index_or_day">中间数字</label>
                        <input class="doc-no-sync" id="doc_field_product_index_or_day" type="text" value="${escapeHtml(initIdx)}" placeholder="1" autocomplete="off">
                    </div>
                    <div class="doc-no-cell">
                        <label for="doc_field_product_abbr">产品代号</label>
                        <input class="doc-no-sync" id="doc_field_product_abbr" type="text" value="${escapeHtml(initAbbr)}" placeholder="MV" autocomplete="off">
                    </div>
                    <div class="doc-no-cell">
                        <label for="doc_field_product_form">产品形式</label>
                        <input class="doc-no-sync" id="doc_field_product_form" type="text" value="${escapeHtml(initForm)}" placeholder="滴剂" list="doc_product_form_list" autocomplete="off">
                    </div>
                    <div class="doc-no-cell">
                        <label for="doc_field_product_code">产品编码</label>
                        <input class="doc-no-sync" id="doc_field_product_code" type="text" value="${escapeHtml(initPc)}" placeholder="留空则按规则拼接" autocomplete="off">
                    </div>
                </div>
                <datalist id="doc_product_form_list">
                    <option value="硬胶囊"><option value="胶囊"><option value="软胶囊"><option value="软糖">
                    <option value="滴剂"><option value="压片"><option value="固体饮料"><option value="粉末">
                    <option value="精油"><option value="凝胶">
                </datalist>
                <p class="doc-no-dosage-hint">剂型代号（自动）：<span id="docPreviewDosage"></span></p>
                <input type="hidden" id="doc_field_dosage_form_code" value="${escapeHtml(initDosage)}">
                <div class="doc-preview-block">
                    <div class="doc-preview-label">计算产品编码（实时）</div>
                    <div class="doc-preview-line" id="docPreviewProductCode"></div>
                    <div class="doc-preview-label">规则生成文档编号（实时）</div>
                    <div class="doc-preview-line" id="docPreviewRuleDocumentNo"></div>
                    <div class="doc-preview-label">最终文档编号（可修改；留空则导出时由后端生成）</div>
                    <div class="doc-no-final-row">
                        <div class="doc-no-final-input-wrap">
                            <input id="doc_field_document_no" type="text" value="${escapeHtml(initDn)}" placeholder="例如 Anna-GS20260511A01-AN1MVD" autocomplete="off">
                        </div>
                        <button type="button" class="doc-no-regen" id="docNoRegenBtn">重新按规则生成</button>
                    </div>
                </div>
            </div>
        `;

        const regenBtn = document.getElementById("docNoRegenBtn");
        if (regenBtn) {
            regenBtn.addEventListener("click", regenerateDocumentNoFromRule);
        }

        const dnInput = document.getElementById("doc_field_document_no");
        if (dnInput) {
            dnInput.addEventListener("input", function () {
                refreshCompositeFromCurrentFields();
            });
        }

        bindDocNoSyncInputs();
        updateDocNoPreviews();
    }

    function renderForm(data) {
        const form = document.getElementById("confirmForm");
        form.innerHTML = "";

        if (!getSelectedProfile()) {
            form.innerHTML = `<div class="empty-form">请先选择模板映射。</div>`;
            return;
        }

        if (visibleFields.length === 0) {
            form.innerHTML = `<div class="empty-form">当前模板映射还没有选择任何字段，请先到配置中心设置。</div>`;
            return;
        }

        const profile = getSelectedProfile();
        const mappingDefaults = profile && profile.mapping_defaults ? profile.mapping_defaults : {};

        const title = document.createElement("h3");
        title.className = "section-title";
        title.innerText = "普通字段确认";
        form.appendChild(title);

        visibleFields.forEach(field => {
            const label = document.createElement("label");

            label.innerHTML = `
                ${field.label}
                <span class="field-key">(${field.key})</span>
                ${field.required ? '<span class="required">*</span>' : ''}
            `;

            const input = document.createElement("input");
            input.id = "field_" + field.key;
            input.name = field.key;
            input.type = getInputType(field.type);

            let raw = data[field.key];
            if (raw === null || raw === undefined || String(raw).trim() === "") {
                const dv = mappingDefaults[field.key];
                if (dv != null && String(dv).trim() !== "") {
                    raw = dv;
                } else {
                    raw = "";
                }
            }
            input.value = raw !== null && raw !== undefined ? String(raw) : "";

            input.oninput = function () {
                refreshCompositeFromCurrentFields();
                refreshDescriptionFromCurrentFields();
            };

            form.appendChild(label);
            form.appendChild(input);
        });
    }

    function renderCompositeArea(data) {
        const area = document.getElementById("compositeConfirmArea");
        area.innerHTML = "";

        const profile = getSelectedProfile();

        if (!profile) {
            return;
        }

        const compositeMappings = profile.composite_mappings || [];

        if (compositeMappings.length === 0) {
            return;
        }

        const title = document.createElement("h3");
        title.className = "section-title";
        title.innerText = "组合单元格确认";
        area.appendChild(title);

        const tip = document.createElement("p");
        tip.className = "tips";
        tip.innerText = "这里显示的是将写入 Excel 组合单元格的最终内容，可以按实际情况手动修改。换行格式会保留。";
        area.appendChild(tip);

        compositeMappings.forEach(item => {
            const cell = String(item.cell || "").trim().toUpperCase();
            const template = item.template || "";
            const renderedText = renderTemplate(template, data);

            const box = document.createElement("div");
            box.className = "composite-box";

            box.innerHTML = `
                <div class="composite-cell">目标单元格：${cell}</div>
                <textarea
                    class="composite-textarea"
                    id="composite_${cell}"
                >${escapeHtml(renderedText)}</textarea>
            `;

            area.appendChild(box);
        });
    }

    async function renderDescriptionArea(data, options) {
        options = options || {};
        const area = document.getElementById("descriptionConfirmArea");
        if (!area) {
            return;
        }

        area.innerHTML = "";

        const profile = getSelectedProfile();
        if (!profile) {
            return;
        }

        const settings = profile.description_settings || {};
        if (settings.enabled !== true) {
            return;
        }

        const title = document.createElement("h3");
        title.className = "section-title";
        title.innerText = "产品描述";
        area.appendChild(title);

        const tip = document.createElement("p");
        tip.className = "tips";
        tip.innerText = "这里是将写入 Excel 产品描述大单元格的最终文本，可以人工修改。";
        area.appendChild(tip);

        const textarea = document.createElement("textarea");
        textarea.id = "description_text";
        textarea.className = "description-textarea";
        textarea.placeholder = "产品描述生成中...";
        area.appendChild(textarea);

        if (!settings.template_name) {
            textarea.placeholder = "当前模板映射未选择产品描述模板";
            return;
        }

        const response = await fetch("/api/generate-description", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                profile_id: profile.id,
                template_name: settings.template_name,
                data: data || {},
                message: options.useAi ? (document.getElementById("message").value || "") : ""
            })
        });
        const result = await response.json();

        if (!result.success) {
            textarea.placeholder = result.error || "产品描述生成失败";
            return;
        }

        textarea.value = result.description_text || "";
        if (result.used_ai) {
            textarea.dataset.generatedByAi = "true";
        }
    }

    function refreshCompositeFromCurrentFields() {
        const profile = getSelectedProfile();

        if (!profile) {
            return;
        }

        const data = collectAllOrderData();
        const compositeMappings = profile.composite_mappings || [];

        compositeMappings.forEach(item => {
            const cell = String(item.cell || "").trim().toUpperCase();
            const textarea = document.getElementById("composite_" + cell);

            if (textarea && !textarea.dataset.manuallyEdited) {
                textarea.value = renderTemplate(item.template || "", data);
            }
        });
    }

    async function refreshDescriptionFromCurrentFields() {
        const textarea = document.getElementById("description_text");
        if (!textarea || textarea.dataset.manuallyEdited || textarea.dataset.generatedByAi) {
            return;
        }
        await renderDescriptionArea(mergeDataWithMappingDefaults(collectAllOrderData()));
    }

    document.addEventListener("input", function (event) {
        if (event.target && event.target.classList.contains("composite-textarea")) {
            event.target.dataset.manuallyEdited = "true";
        }
        if (event.target && event.target.id === "description_text") {
            event.target.dataset.manuallyEdited = "true";
        }
    });

    function renderTemplate(template, data) {
        return String(template || "").replace(/\{([^{}]+)\}/g, function (match, key) {
            key = key.trim();
            const value = data[key];

            if (value === null || value === undefined) {
                return "";
            }

            return String(value);
        });
    }

    function getInputType(type) {
        if (type === "number") {
            return "number";
        }
        if (type === "date") {
            return "date";
        }

        return "text";
    }

    async function parseMessage() {
        const message = document.getElementById("message").value.trim();
        const errorDiv = document.getElementById("parseError");
        const submitResult = document.getElementById("submitResult");
        const parseBtn = document.getElementById("parseBtn");

        errorDiv.innerText = "";
        submitResult.innerHTML = "";

        if (!message) {
            errorDiv.innerText = "请输入客户聊天内容";
            return;
        }

        parseBtn.disabled = true;
        parseBtn.innerText = "解析中...";

        const response = await fetch("/api/parse", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const result = await response.json();

        parseBtn.disabled = false;
        parseBtn.innerText = "AI解析";

        if (!result.success) {
            errorDiv.innerText = result.error || "解析失败";
            return;
        }

        if (result.data.error) {
            errorDiv.innerText = result.data.error;
            return;
        }

        parsedData = result.data;
        updateVisibleFields();
        renderDocumentNoSection(parsedData);
        renderForm(parsedData);
        await renderDescriptionArea(mergeDataWithMappingDefaults(parsedData), { useAi: true });
        renderCompositeArea(mergeDataWithMappingDefaults(parsedData));
    }

    function collectDocNoFormData() {
        const data = {};

        DOC_SECTION_KEYS.forEach(key => {
            const input = document.getElementById("doc_field_" + key);
            data[key] = input ? input.value : "";
        });

        return data;
    }

    function collectFormData() {
        const data = {};

        visibleFields.forEach(field => {
            const input = document.getElementById("field_" + field.key);
            data[field.key] = input ? input.value : null;
        });

        return data;
    }

    function collectAllOrderData() {
        return Object.assign({}, collectDocNoFormData(), collectFormData());
    }

    function collectCompositeValues() {
        const values = {};
        const profile = getSelectedProfile();

        if (!profile) {
            return values;
        }

        const compositeMappings = profile.composite_mappings || [];

        compositeMappings.forEach(item => {
            const cell = String(item.cell || "").trim().toUpperCase();
            const textarea = document.getElementById("composite_" + cell);

            if (cell && textarea) {
                values[cell] = textarea.value;
            }
        });

        return values;
    }

    function collectDescriptionText() {
        const textarea = document.getElementById("description_text");
        return textarea ? textarea.value : "";
    }

    function validateRequiredFields(data) {
        const missing = [];

        visibleFields.forEach(field => {
            if (field.required) {
                const value = data[field.key];

                if (value === null || value === undefined || String(value).trim() === "") {
                    missing.push(field.label);
                }
            }
        });

        return missing;
    }

    async function submitOrder() {
        const profileId = document.getElementById("profileSelect").value;
        const data = collectAllOrderData();
        const compositeValues = collectCompositeValues();
        const descriptionText = collectDescriptionText();
        const submitResult = document.getElementById("submitResult");
        const generateBtn = document.getElementById("generateBtn");

        submitResult.innerHTML = "";

        if (!profileId) {
            submitResult.innerHTML = `<p class="error">请先选择模板映射</p>`;
            return;
        }

        const missing = validateRequiredFields(data);

        if (missing.length > 0) {
            submitResult.innerHTML = `
                <p class="error">以下必填字段不能为空：${missing.join("、")}</p>
            `;
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerText = "生成中...";

        const response = await fetch("/api/generate-excel", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                profile_id: profileId,
                data: data,
                composite_values: compositeValues,
                description_text: descriptionText
            })
        });

        const result = await response.json();

        generateBtn.disabled = false;
        generateBtn.innerText = "确认生成Excel";

        if (!result.success) {
            submitResult.innerHTML = `
                <p class="error">生成失败：${result.error}</p>
            `;
            return;
        }

        submitResult.innerHTML = `
            <p class="success">Excel生成成功！</p>
            <a class="download-link" href="${result.download_url}" target="_blank">点击下载Excel</a>
        `;
    }

    function escapeHtml(text) {
        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    loadInitialData();
</script>

</body>
</html>
