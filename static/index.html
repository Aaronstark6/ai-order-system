<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>外贸订单解析系统 V2</title>
    <style>
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            padding: 30px;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #333;
            margin-top: 0;
        }

        .nav {
            margin-bottom: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
            gap: 25px;
            align-items: start;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-height: 620px;
            box-sizing: border-box;
        }

        .layout > .card {
            height: 100%;
            min-height: 0;
        }

        .left-panel {
            position: sticky;
            top: 20px;
            align-self: flex-start;
            min-height: 0;
        }

        .right-panel {
            height: 100%;
            min-height: 0;
            max-height: none;
            overflow-y: auto;
        }

        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 220px;
            line-height: 1.6;
        }

        #message {
            min-height: 290px;
            max-height: 340px;
        }

        .description-textarea {
            min-height: 260px;
            font-family: Consolas, "Microsoft YaHei", monospace;
            white-space: pre-wrap;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: #1677ff;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button.secondary {
            background: #52c41a;
        }

        button:disabled {
            background: #aaa;
            color: #777;
            cursor: not-allowed;
        }

        .field-key {
            color: #999;
            font-size: 13px;
            margin-left: 6px;
        }

        .info-box {
            background: #f7f9fc;
            border: 1px solid #e6edf7;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .section-title {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #333;
        }

        .error {
            color: red;
            margin-top: 12px;
            word-break: break-word;
        }

        .success {
            color: green;
            margin-top: 12px;
        }

        #submitResult {
            flex: 1 1 auto;
            min-width: 240px;
            margin: 0;
            max-width: none;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        #submitResult p {
            margin: 0;
        }

        .empty-form {
            color: #999;
            background: #fafafa;
            border: 1px dashed #ddd;
            padding: 18px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .normal-fields-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .normal-field-item {
            min-width: 0;
        }

        .normal-field-item label {
            margin-top: 0;
        }

        .normal-field-item input {
            margin-bottom: 0;
        }

        .doc-no-card {
            border: 1px solid #e0e4ec;
            border-radius: 10px;
            padding: 14px 16px 16px;
            margin-bottom: 18px;
            background: #fafbfd;
        }

        .doc-no-card > h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #222;
            border-top: none;
            padding-top: 0;
        }

        .doc-no-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            align-items: end;
            margin-bottom: 12px;
        }

        .doc-no-grid-row2 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .doc-no-cell {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .doc-no-cell label {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.2;
            min-height: 20px;
            color: #555;
            margin-top: 0;
            margin-bottom: 0;
        }

        .doc-no-card input,
        .doc-no-card select {
            width: 100%;
            height: 42px;
            box-sizing: border-box;
            padding: 8px 10px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            margin: 0;
        }

        .doc-no-dosage-hint {
            font-size: 13px;
            color: #666;
            margin: 0 0 12px 0;
        }

        .doc-no-dosage-hint strong {
            color: #333;
            font-family: Consolas, "Courier New", monospace;
        }

        .doc-preview-block {
            border-top: 1px dashed #dde1ea;
            padding-top: 12px;
            margin-top: 4px;
        }

        .doc-preview-line {
            font-family: Consolas, "Microsoft YaHei", monospace;
            font-size: 14px;
            color: #1a1a1a;
            margin: 6px 0;
            word-break: break-all;
        }

        .doc-preview-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 2px;
        }

        .doc-no-final-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 10px;
        }

        .doc-no-final-row .doc-no-final-input-wrap {
            flex: 1 1 auto;
            min-width: 180px;
        }

        .doc-no-final-row .doc-no-final-input-wrap input {
            margin-bottom: 0;
        }

        button.doc-no-regen {
            background: #1677ff;
            font-size: 14px;
            padding: 9px 14px;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .generate-tip {
            margin: 8px 0 0;
            color: #8a6d1d;
            font-size: 13px;
        }

        .excel-action-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: nowrap;
        }

        .excel-action-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 0 0 auto;
        }

        .action-btn {
            background: #1677ff;
            border: 1px solid #1677ff;
            color: #fff;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #0958d9;
            border-color: #0958d9;
        }

        .action-btn:disabled,
        .action-btn.disabled {
            background: #d1d5db !important;
            border-color: #d1d5db !important;
            color: #6b7280 !important;
            cursor: not-allowed !important;
            opacity: 1 !important;
            box-shadow: none !important;
        }

        .action-btn:disabled:hover,
        .action-btn.disabled:hover {
            background: #d1d5db !important;
            border-color: #d1d5db !important;
            color: #6b7280 !important;
        }

        .excel-result-message {
            color: green;
            margin: 0;
        }

        .sync-path {
            margin: 3px 0 0;
            color: #555;
            word-break: break-all;
        }

        .sync-error {
            color: #d46b08;
            margin: 3px 0 0;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: auto;
            }

            .left-panel {
                position: static;
            }

            .right-panel {
                max-height: none;
                overflow-y: auto;
            }

            .excel-action-row {
                flex-wrap: wrap;
            }

            .excel-action-buttons {
                flex-wrap: wrap;
            }

            .doc-no-grid,
            .doc-no-grid-row2 {
                grid-template-columns: 1fr;
            }

            .doc-no-final-row {
                flex-direction: column;
                align-items: stretch;
            }

            .normal-fields-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>外贸订单解析系统 V2</h1>

<div class="nav">
    <a href="/config">进入配置中心</a>
</div>

<div class="layout">

    <div class="card left-panel">
        <h2>客户聊天内容</h2>

        <textarea id="message" placeholder="例如：客户小李要订购5000盒固体饮料，电话是13800138000，下周发货"></textarea>

        <label>选择模板映射</label>
        <select id="profileSelect">
            <option value="">请选择模板映射</option>
        </select>

        <div class="info-box" id="profileTips">
            请选择本次要使用的 Excel 模板映射。
        </div>

        <button id="parseBtn" onclick="parseMessage()">AI解析</button>

        <div id="parseError" class="error"></div>
    </div>

    <div class="card right-panel">
        <h2>订单信息确认</h2>

        <div id="documentNoConfirmArea"></div>

        <form id="confirmForm"></form>

        <div id="descriptionConfirmArea"></div>

        <div class="excel-action-row">
            <div class="excel-action-buttons">
                <button id="generateBtn" class="secondary" onclick="submitOrder()" type="button">
                    确认生成Excel
                </button>
                <button id="downloadExcelBtn" class="action-btn" onclick="openOutputFolder()" type="button" disabled>
                    打开订单目录
                </button>
            </div>
            <div id="submitResult"></div>
        </div>
        <p class="generate-tip">部分字段为空时仍可导出，请人工确认内容完整性。</p>
    </div>

</div>

<script>
    const DOC_SECTION_KEYS = [
        "document_no",
        "sales_name",
        "salesperson_code",
        "company_code",
        "deal_date",
        "sequence",
        "ingredient_initials",
        "product_index_or_day",
        "product_abbr",
        "product_form",
        "dosage_form_code",
        "product_code"
    ];
    let allFields = [];
    let visibleFields = [];
    let profiles = [];
    let parsedData = {};
    let appSettings = {
        default_sales_name: "Anna",
        default_salesperson_code: "AN",
        default_company_code: "GS",
        default_sequence: "A01",
        export_sync_dir: ""
    };
    let currentGeneratedFilename = "";
    let currentDownloadUrl = "";
    let currentDescriptionFields = {};
    let ingredientInitialsManuallyEdited = false;
    let descriptionIsComposing = false;

    async function loadInitialData() {
        await loadFields();
        await loadAppSettings();
        await loadProfiles();
        updateVisibleFields();
        renderDocumentNoSection({});
        renderForm({});
        renderDescriptionArea(mergeDataWithMappingDefaults({}));
        resetExcelActions();
    }

    async function loadFields() {
        const response = await fetch("/api/fields");
        const result = await response.json();

        if (!result.success) {
            alert("字段库加载失败");
            return;
        }

        allFields = result.fields || [];
    }

    async function loadProfiles() {
        const response = await fetch("/api/template-profiles");
        const result = await response.json();

        if (!result.success) {
            alert("模板映射加载失败");
            return;
        }

        profiles = result.profiles || [];

        const select = document.getElementById("profileSelect");
        select.innerHTML = `<option value="">请选择模板映射</option>`;

        profiles.forEach(profile => {
            const option = document.createElement("option");
            option.value = profile.id;
            option.textContent = profile.name;
            select.appendChild(option);
        });

        select.onchange = function () {
            updateProfileTips();
            updateVisibleFields();
            renderDocumentNoSection(parsedData);
            renderForm(parsedData);
            renderDescriptionArea(mergeDataWithMappingDefaults(parsedData), {
                useAi: Boolean((document.getElementById("message").value || "").trim())
            });
            document.getElementById("submitResult").innerHTML = "";
            resetExcelActions();
        };

        if (profiles.length > 0) {
            select.value = profiles[0].id;
        }

        updateProfileTips();
    }

    async function loadAppSettings() {
        try {
            const response = await fetch("/api/app-settings");
            const result = await response.json();
            if (result.success && result.settings) {
                appSettings = Object.assign(appSettings, result.settings);
            }
        } catch (e) {
            appSettings = appSettings || {};
        }
    }

    function getSelectedProfile() {
        const profileId = document.getElementById("profileSelect").value;
        return profiles.find(p => p.id === profileId) || null;
    }

    function mergeDataWithMappingDefaults(data) {
        const profile = getSelectedProfile();
        const defs = profile && profile.mapping_defaults ? profile.mapping_defaults : {};
        const out = syncOrderAndDealDates(data);
        Object.keys(defs).forEach(k => {
            const v = out[k];
            if (v === null || v === undefined || String(v).trim() === "") {
                const dv = defs[k];
                if (dv != null && String(dv).trim() !== "") {
                    out[k] = dv;
                }
            }
        });
        return syncOrderAndDealDates(out);
    }

    function extractParsedProductForm(data) {
        const source = data || {};
        const keys = ["product_form", "产品形式", "dosage form", "dosage_form"];

        for (const key of keys) {
            const value = source[key];
            if (value != null && String(value).trim() !== "") {
                return String(value).trim();
            }
        }

        return "";
    }

    const STANDARD_PRODUCT_FORMS = ["硬胶囊", "软胶囊", "软糖", "滴剂", "片剂", "固体饮料", "凝胶"];

    function normalizeProductForm(value) {
        const text = String(value || "").trim();
        const lowerText = text.toLowerCase();

        if (!text) {
            return "";
        }

        const aliasMap = {
            "硬胶囊": "硬胶囊",
            "软胶囊": "软胶囊",
            "爆珠": "软胶囊",
            "软糖": "软糖",
            "滴剂": "滴剂",
            "液体饮料": "滴剂",
            "液体": "滴剂",
            "片剂": "片剂",
            "压片": "片剂",
            "泡腾片": "片剂",
            "固体饮料": "固体饮料",
            "粉末": "固体饮料",
            "粉剂": "固体饮料",
            "powder": "固体饮料",
            "凝胶": "凝胶",
            "果冻": "凝胶",
            "果冻和凝胶": "凝胶",
            "jelly": "凝胶",
            "gel": "凝胶"
        };

        return aliasMap[text] || aliasMap[lowerText] || text;
    }

    function getProductFormFromProfileName(profileName) {
        const name = String(profileName || "").trim();
        if (!name) {
            return "";
        }

        const rules = [
            { keywords: ["硬胶囊"], productForm: "硬胶囊" },
            { keywords: ["软胶囊", "爆珠"], productForm: "软胶囊" },
            { keywords: ["软糖"], productForm: "软糖" },
            { keywords: ["滴剂", "液体饮料"], productForm: "滴剂" },
            { keywords: ["片剂", "压片", "泡腾片"], productForm: "片剂" },
            { keywords: ["固体饮料", "粉末"], productForm: "固体饮料" },
            { keywords: ["凝胶", "果冻"], productForm: "凝胶" }
        ];

        const matchedRule = rules.find(rule =>
            rule.keywords.some(keyword => name.includes(keyword))
        );
        return matchedRule ? matchedRule.productForm : "";
    }

    function findProfileByProductForm(productForm) {
        const normalizedForm = normalizeProductForm(productForm);
        if (!normalizedForm || !Array.isArray(profiles) || profiles.length === 0) {
            return null;
        }

        const rules = {
            "硬胶囊": ["硬胶囊"],
            "软胶囊": ["软胶囊", "爆珠"],
            "软糖": ["软糖"],
            "滴剂": ["滴剂", "液体饮料"],
            "片剂": ["片剂", "压片", "泡腾片"],
            "固体饮料": ["固体饮料", "粉末"],
            "凝胶": ["凝胶", "果冻"]
        };
        const keywords = rules[normalizedForm];

        if (!keywords) {
            return null;
        }

        return profiles.find(profile => {
            const name = String(profile.name || "");
            return keywords.some(keyword => name.includes(keyword));
        }) || null;
    }

    async function autoSelectProfileByProductForm(productForm) {
        const select = document.getElementById("profileSelect");

        if (!select || !Array.isArray(profiles) || profiles.length === 0) {
            return false;
        }

        const matchedProfile = findProfileByProductForm(productForm);
        if (!matchedProfile) {
            return false;
        }

        select.value = matchedProfile.id;
        updateProfileTips();

        const tips = document.getElementById("profileTips");
        if (tips) {
            tips.innerText = `已根据产品形式自动选择模板：${matchedProfile.name}`;
        }

        updateVisibleFields();
        renderDocumentNoSection(parsedData);
        renderForm(parsedData);
        await renderDescriptionArea(mergeDataWithMappingDefaults(parsedData), { useAi: true });
        return true;
    }

    function updateVisibleFields() {
        const profile = getSelectedProfile();

        if (!profile) {
            visibleFields = [];
            return;
        }

        const usedKeys = new Set();
        const docKeySet = new Set(DOC_SECTION_KEYS);

        const mappings = profile.mappings || {};
        Object.keys(mappings).forEach(key => usedKeys.add(key));

        const mappingOrder = Array.isArray(profile.mapping_order) ? profile.mapping_order : [];
        const orderIndex = new Map(mappingOrder.map((key, index) => [key, index]));

        visibleFields = allFields.filter(
            field => usedKeys.has(field.key) && !docKeySet.has(field.key)
        ).sort((a, b) => {
            const aMapped = mappings[a.key] ? 0 : 1;
            const bMapped = mappings[b.key] ? 0 : 1;
            if (aMapped !== bMapped) {
                return aMapped - bMapped;
            }
            const aOrder = orderIndex.has(a.key) ? orderIndex.get(a.key) : 9999;
            const bOrder = orderIndex.has(b.key) ? orderIndex.get(b.key) : 9999;
            if (aOrder !== bOrder) {
                return aOrder - bOrder;
            }
            return allFields.findIndex(field => field.key === a.key) - allFields.findIndex(field => field.key === b.key);
        });
    }

    function updateProfileTips() {
        const profile = getSelectedProfile();
        const tips = document.getElementById("profileTips");

        if (!profile) {
            tips.innerText = "请选择本次要使用的 Excel 模板映射。";
            return;
        }

        const templateText = profile.template_file ? "已上传" : "未上传模板";
        tips.innerText = `当前映射：${profile.name}；模板状态：${templateText}`;
    }

    function getTodayISODate() {
        const d = new Date();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${d.getFullYear()}-${m}-${day}`;
    }

    function formatCompactDate(value) {
        const digits = String(value || "").trim().replace(/\D/g, "");
        return digits.length === 8 ? digits : "";
    }

    function formatDateInputValue(value) {
        const compact = formatCompactDate(value);
        if (!compact) {
            return "";
        }
        return `${compact.slice(0, 4)}-${compact.slice(4, 6)}-${compact.slice(6, 8)}`;
    }

    function formatDealDateYyyymmdd(value) {
        return formatCompactDate(value);
    }

    function isCompactDateFieldKey(key) {
        const text = String(key || "").trim().toLowerCase();
        return text === "date" || text === "order_date" || text === "deal_date" || text.endsWith("_date");
    }

    function syncOrderAndDealDates(data) {
        const out = Object.assign({}, data || {});
        const orderDate = formatCompactDate(out.order_date);
        const dealDate = formatCompactDate(out.deal_date);

        if (orderDate && !dealDate) {
            out.order_date = orderDate;
            out.deal_date = orderDate;
        } else if (dealDate && !orderDate) {
            out.deal_date = dealDate;
            out.order_date = dealDate;
        } else {
            if (orderDate) {
                out.order_date = orderDate;
            }
            if (dealDate) {
                out.deal_date = dealDate;
            }
        }

        return out;
    }

    const FORMULA_FIELD_PRIORITY = ["配方要求", "配方", "Formula", "Ingredients"];
    const IGNORED_INGREDIENT_LINE_RE = /(serving size|servings per container|other ingredients|suggested use|warning)/i;
    const AMOUNT_RE = /(\d+(?:\.\d+)?)\s*(mg|mcg|μg|ug|g|ml|iu)\b/ig;
    const IGNORED_INGREDIENT_PREFIXES = new Set([
        "organic",
        "pure",
        "natural",
        "extract",
        "standardized",
        "standardised",
        "total"
    ]);

    function getFormulaTextFromDescriptionFields(descriptionFields) {
        const fields = descriptionFields || {};
        for (const key of FORMULA_FIELD_PRIORITY) {
            const value = fields[key];
            if (value !== null && value !== undefined && String(value).trim()) {
                return String(value).trim();
            }
        }
        return "";
    }

    function normalizeIngredientAmount(value, unit) {
        const amount = Number(value);
        const unitText = String(unit || "").toLowerCase();
        if (!Number.isFinite(amount)) {
            return 0;
        }
        if (unitText === "g") {
            return amount * 1000;
        }
        if (unitText === "mg") {
            return amount;
        }
        if (unitText === "mcg" || unitText === "μg" || unitText === "ug") {
            return amount / 1000;
        }
        return amount;
    }

    function stripFormulaFieldPrefix(line) {
        let text = stripDescriptionSourceMarks(line).trim();
        for (const sep of ["：", ":"]) {
            const index = text.indexOf(sep);
            if (index < 0) {
                continue;
            }
            const prefix = text.slice(0, index).trim();
            if (FORMULA_FIELD_PRIORITY.includes(prefix)) {
                return text.slice(index + 1).trim();
            }
        }
        return text;
    }

    function isNonIngredientLine(line) {
        const text = String(line || "").trim().toLowerCase();
        return !text || IGNORED_INGREDIENT_LINE_RE.test(text) || text.startsWith("total ") || text.startsWith("total:");
    }

    function ingredientInitialFromName(name) {
        let text = String(name || "").trim();
        while (text) {
            const match = text.match(/^([A-Za-z][A-Za-z'-]*)\b/);
            if (!match) {
                return "";
            }
            const word = match[1].replace(/^[-']+|[-']+$/g, "").toLowerCase();
            if (!IGNORED_INGREDIENT_PREFIXES.has(word)) {
                return word.charAt(0).toUpperCase();
            }
            text = text.slice(match[0].length).trim();
        }
        return "";
    }

    function extractIngredientInitialsFromFormulaText(formulaText) {
        const ingredients = [];
        String(formulaText || "").split(/\r?\n/).forEach((rawLine, index) => {
            const line = stripFormulaFieldPrefix(rawLine);
            if (/[\u4e00-\u9fff]/.test(line) || isNonIngredientLine(line)) {
                return;
            }

            AMOUNT_RE.lastIndex = 0;
            const matches = Array.from(line.matchAll(AMOUNT_RE));
            AMOUNT_RE.lastIndex = 0;
            if (matches.length === 0) {
                return;
            }

            const amountMatch = matches[matches.length - 1];
            const amountStart = amountMatch.index || 0;
            const amountEnd = amountStart + amountMatch[0].length;
            const name = (amountStart <= 1 ? line.slice(amountEnd) : line.slice(0, amountStart))
                .replace(/^[\s,;:/\-–—]+|[\s,;:/\-–—]+$/g, "")
                .replace(/\s+/g, " ")
                .trim();
            const initial = ingredientInitialFromName(name);
            if (!initial) {
                return;
            }

            ingredients.push({
                amount: normalizeIngredientAmount(amountMatch[1], amountMatch[2]),
                index,
                initial
            });
        });

        return ingredients
            .sort((a, b) => b.amount - a.amount || a.index - b.index)
            .slice(0, 3)
            .map(item => item.initial)
            .sort()
            .join("");
    }

    function stripDescriptionSourceMarks(text) {

    }

    function replaceDescriptionLineSource(line, source) {
        const marker = `[${source}]`;
        const cleanLine = stripDescriptionSourceMarks(line);
        const chineseColonIndex = cleanLine.indexOf("：");
        const asciiColonIndex = cleanLine.indexOf(":");
        let colonIndex = -1;
        if (chineseColonIndex >= 0 && asciiColonIndex >= 0) {
            colonIndex = Math.min(chineseColonIndex, asciiColonIndex);
        } else {
            colonIndex = Math.max(chineseColonIndex, asciiColonIndex);
        }
        if (colonIndex >= 0) {
            const sep = cleanLine.charAt(colonIndex);
            const prefix = cleanLine.slice(0, colonIndex);
            const value = cleanLine.slice(colonIndex + 1).trim();
            return `${prefix}${sep}${marker}${value ? " " + value : ""}`;
        }
        return cleanLine.trim() ? `${marker} ${cleanLine.trim()}` : cleanLine;
    }

    function setDescriptionValue(textarea, value) {
        if (!textarea) {
            return;
        }
        const nextValue = value || "";
        if (textarea.value === nextValue) {
            textarea.dataset.lastValue = textarea.value;
            return;
        }
        const selectionStart = textarea.selectionStart;
        const selectionEnd = textarea.selectionEnd;
        textarea.dataset.internalUpdate = "true";
        textarea.value = nextValue;
        textarea.dataset.lastValue = textarea.value;
        delete textarea.dataset.internalUpdate;
        if (
            typeof selectionStart === "number" &&
            typeof selectionEnd === "number" &&
            document.activeElement === textarea
        ) {
            const start = Math.min(selectionStart, textarea.value.length);
            const end = Math.min(selectionEnd, textarea.value.length);
            textarea.setSelectionRange(start, end);
        }
    }

    function syncDescriptionProductCodeFromDocumentNo() {
        const textarea = document.getElementById("description_text");
        if (!textarea) {
            return;
        }

        const productCode = extractDocumentProductCode();
        if (!productCode) {
            return;
        }

        const replacement = `代号：[系统] ${productCode}`;
        const lines = String(textarea.value || "").split("\n");
        let changed = false;
        let found = false;

        for (let i = 0; i < lines.length; i += 1) {
            if (!lines[i].includes("代号")) {
                continue;
            }

            found = true;
            let nextLine = replacement;
            if (lines[i].includes("：")) {
                nextLine = `${lines[i].split("：", 1)[0]}：[系统] ${productCode}`;
            } else if (lines[i].includes(":")) {
                nextLine = `${lines[i].split(":", 1)[0]}:[系统] ${productCode}`;
            }
            if (lines[i] !== nextLine) {
                lines[i] = nextLine;
                changed = true;
            }
            break;
        }

        if (!found) {
            lines.unshift(replacement);
            changed = true;
        }

        if (changed) {
            setDescriptionValue(textarea, lines.join("\n"));
        }
    }

    function markEditedDescriptionLine(textarea) {
        if (!textarea || textarea.dataset.internalUpdate === "true") {
            return;
        }
        if (descriptionIsComposing) {
            return;
        }

        const oldValue = textarea.dataset.lastValue || "";
        const newValue = textarea.value || "";
        const oldLines = oldValue.split("\n");
        const newLines = newValue.split("\n");
        const selectionStart = textarea.selectionStart == null ? newValue.length : textarea.selectionStart;
        const selectionEnd = textarea.selectionEnd == null ? selectionStart : textarea.selectionEnd;
        const cursor = selectionStart;
        const lineIndex = newValue.slice(0, cursor).split("\n").length - 1;

        if (oldLines[lineIndex] === newLines[lineIndex]) {
            textarea.dataset.lastValue = newValue;
            return;
        }

        const originalLine = newLines[lineIndex] || "";
        const markedLine = replaceDescriptionLineSource(originalLine, "人工");
        if (markedLine === originalLine) {
            textarea.dataset.lastValue = newValue;
            return;
        }

        newLines[lineIndex] = markedLine;
        const markedValue = newLines.join("\n");
        if (markedValue === newValue) {
            textarea.dataset.lastValue = newValue;
            return;
        }

        const delta = markedValue.length - newValue.length;
        setDescriptionValue(textarea, markedValue);
        if (document.activeElement === textarea) {
            const nextStart = Math.max(0, Math.min(selectionStart + delta, textarea.value.length));
            const nextEnd = Math.max(0, Math.min(selectionEnd + delta, textarea.value.length));
            textarea.setSelectionRange(nextStart, nextEnd);
        }
    }

        ingredientInitialsManuallyEdited = false;
        currentDescriptionFields = {};
        parsedData = syncOrderAndDealDates(result.data);

        const productForm = normalizeProductForm(extractParsedProductForm(parsedData));
        if (productForm) {
            parsedData.product_form = productForm;
        }

        const autoSelected = productForm
            ? await autoSelectProfileByProductForm(productForm)
            : false;

        if (!autoSelected) {
            updateVisibleFields();
            renderDocumentNoSection(parsedData);
            renderForm(parsedData);
            await renderDescriptionArea(mergeDataWithMappingDefaults(parsedData), { useAi: true });
        }
    }

    function collectDocNoFormData() {
        const data = {};

        DOC_SECTION_KEYS.forEach(key => {
            const input = document.getElementById("doc_field_" + key);
            if (input && (input.type === "date" || isCompactDateFieldKey(key))) {
                data[key] = formatCompactDate(input.value);
            } else {
                data[key] = input ? input.value : "";
            }
        });

        data.product_form = normalizeProductForm(data.product_form);
        return data;
    }

    function collectFormData() {
        const data = {};

        visibleFields.forEach(field => {
            const input = document.getElementById("field_" + field.key);
            if (input && (input.type === "date" || isCompactDateFieldKey(field.key))) {
                data[field.key] = formatCompactDate(input.value);
            } else {
                data[field.key] = input ? input.value : null;
            }
        });

        return data;
    }

    function collectAllOrderData() {
        return syncOrderAndDealDates(Object.assign({}, collectDocNoFormData(), collectFormData()));
    }

    function resetExcelActions() {
        currentGeneratedFilename = "";
        currentDownloadUrl = "";

        const downloadBtn = document.getElementById("downloadExcelBtn");

        if (downloadBtn) {
            downloadBtn.disabled = true;
            downloadBtn.classList.add("disabled");
            downloadBtn.setAttribute("aria-disabled", "true");
        }
    }

    function enableExcelActions(result) {
        currentGeneratedFilename = result.filename || "";
        currentDownloadUrl = result.download_url || "";

        const downloadBtn = document.getElementById("downloadExcelBtn");

        if (downloadBtn && currentGeneratedFilename) {
            downloadBtn.disabled = false;
            downloadBtn.classList.remove("disabled");
            downloadBtn.setAttribute("aria-disabled", "false");
        }
    }

    async function openOutputFolder() {
        const submitResult = document.getElementById("submitResult");

        if (!currentGeneratedFilename) {
            if (submitResult) {
                submitResult.innerHTML = `<p class="error">请先生成Excel</p>`;
            }
            return;
        }

        const response = await fetch("/api/open-output-folder", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                filename: currentGeneratedFilename
            })
        });
        const result = await response.json();

        if (!submitResult) {
            return;
        }

        if (!result.success) {
            submitResult.innerHTML = `<p class="sync-error">${escapeHtml(result.error || "打开订单目录失败")}</p>`;
            return;
        }

        submitResult.innerHTML = `
            <p class="success excel-result-message">已打开订单目录</p>
            <p class="sync-path">文件名：${escapeHtml(currentGeneratedFilename)}</p>
        `;
    }

    function collectDescriptionText() {
        const textarea = document.getElementById("description_text");
        return textarea ? textarea.value : "";
    }

    async function submitOrder() {
        const profileId = document.getElementById("profileSelect").value;
        const data = collectAllOrderData();
        const descriptionText = collectDescriptionText();
        const submitResult = document.getElementById("submitResult");
        const generateBtn = document.getElementById("generateBtn");

        submitResult.innerHTML = "";
        resetExcelActions();

        if (!profileId) {
            submitResult.innerHTML = `<p class="error">请先选择模板映射</p>`;
            return;
        }

        const profile = getSelectedProfile();
        if (!profile || !profile.template_file) {
            submitResult.innerHTML = `<p class="error">请先在配置中心上传当前映射的 Excel 模板</p>`;
            return;
        }

        const descSettings = profile.description_settings || {};
        const descriptionWarning = descSettings.enabled === true && !descSettings.template_name
            ? `<p class="error">当前未设置产品描述模板，产品描述将为空。</p>`
            : "";

        generateBtn.disabled = true;
        generateBtn.innerText = "生成中...";

        const response = await fetch("/api/generate-excel", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                profile_id: profileId,
                data: data,
                description_fields: currentDescriptionFields || {},
                description_text: descriptionText
            })
        });

        const result = await response.json();

        generateBtn.disabled = false;
        generateBtn.innerText = "确认生成Excel";

        if (!result.success) {
            submitResult.innerHTML = `
                <p class="error">生成失败：${result.error}</p>
            `;
            return;
        }

        enableExcelActions(result);

        const filenameHtml = result.filename
            ? `<p class="sync-path">文件名：${escapeHtml(result.filename)}</p>`
            : "";
        const syncStatusHtml = result.synced && result.sync_path
            ? `<p class="sync-path">已同步到：${escapeHtml(result.sync_path)}</p>`
            : result.sync_error
                ? `<p class="sync-error">同步失败：${escapeHtml(result.sync_error)}</p>`
                : `<p class="sync-path">未配置同步目录</p>`;

        submitResult.innerHTML = `
            <p class="success excel-result-message">Excel生成成功！</p>
            ${filenameHtml}
            ${descriptionWarning}
            ${syncStatusHtml}
        `;
    }

    async function syncCurrentExcel() {
        const submitResult = document.getElementById("submitResult");
        const syncBtn = document.getElementById("syncExcelBtn");

        if (!currentGeneratedFilename) {
            if (submitResult) {
                submitResult.innerHTML = `<p class="error">请先生成 Excel</p>`;
            }
            return;
        }

        if (syncBtn) {
            syncBtn.disabled = true;
            syncBtn.innerText = "同步中...";
        }

        const response = await fetch("/api/sync-output", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                filename: currentGeneratedFilename
            })
        });
        const result = await response.json();

        if (syncBtn) {
            syncBtn.disabled = false;
            syncBtn.innerText = "同步";
        }

        if (!submitResult) {
            return;
        }

        if (!result.success) {
            submitResult.innerHTML = `<p class="sync-error">${escapeHtml(result.error || "同步失败")}</p>`;
            return;
        }

        submitResult.innerHTML = `
            <p class="success excel-result-message">同步成功！</p>
            <p class="sync-path">已同步到：${escapeHtml(result.sync_path || "")}</p>
        `;
    }

    function escapeHtml(text) {
        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    loadInitialData();
</script>

</body>
</html>
