<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>外贸订单解析系统 V2</title>
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            padding: 30px;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-top: 0;
        }

        .nav {
            margin-bottom: 20px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: stretch;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-height: 620px;
            box-sizing: border-box;
        }

        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 220px;
            line-height: 1.6;
        }

        .composite-textarea {
            min-height: 160px;
            font-family: Consolas, "Microsoft YaHei", monospace;
            white-space: pre-wrap;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: #1677ff;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button.secondary {
            background: #52c41a;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .field-key {
            color: #999;
            font-size: 13px;
            margin-left: 6px;
        }

        .required {
            color: red;
            margin-left: 4px;
        }

        .tips {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .info-box {
            background: #f7f9fc;
            border: 1px solid #e6edf7;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .section-title {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #333;
        }

        .composite-box {
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .composite-cell {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .error {
            color: red;
            margin-top: 12px;
            word-break: break-word;
        }

        .success {
            color: green;
            margin-top: 12px;
        }

        #submitResult {
            margin-top: 15px;
            max-width: 100%;
            word-break: break-word;
        }

        .download-link {
            display: inline-block;
            margin-top: 8px;
            padding: 9px 14px;
            background: #1677ff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }

        .empty-form {
            color: #999;
            background: #fafafa;
            border: 1px dashed #ddd;
            padding: 18px;
            border-radius: 6px;
            margin-top: 15px;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .card {
                min-height: auto;
            }
        }
    </style>
</head>
<body>

<h1>外贸订单解析系统 V2</h1>

<div class="nav">
    <a href="/config">进入配置中心</a>
</div>

<div class="layout">

    <div class="card">
        <h2>客户聊天内容</h2>

        <textarea id="message" placeholder="例如：客户小李要订购5000盒固体饮料，电话是13800138000，下周发货"></textarea>

        <label>选择模板映射</label>
        <select id="profileSelect">
            <option value="">请选择模板映射</option>
        </select>

        <div class="info-box" id="profileTips">
            请选择本次要使用的 Excel 模板映射。
        </div>

        <button id="parseBtn" onclick="parseMessage()">AI解析</button>

        <div id="parseError" class="error"></div>
    </div>

    <div class="card">
        <h2>订单信息确认</h2>

        <p class="tips">
            普通字段和组合单元格都可以在这里确认、修改。组合单元格会按这里编辑后的格式写入 Excel。
            文档编号相关字段请在下方的「文档编号信息」中填写；未填项将使用模板映射中的默认值（如 Anna、GS、A01 等）。
        </p>

        <div id="documentNoConfirmArea"></div>

        <form id="confirmForm"></form>

        <div id="compositeConfirmArea"></div>

        <button id="generateBtn" class="secondary" onclick="submitOrder()" type="button">
            确认生成Excel
        </button>

        <div id="submitResult"></div>
    </div>

</div>

<script>
    const DOC_SECTION_KEYS = [
        "document_no",
        "sales_name",
        "salesperson_code",
        "company_code",
        "deal_date",
        "sequence",
        "product_index_or_day",
        "product_abbr",
        "product_form",
        "dosage_form_code",
        "product_code"
    ];
    let allFields = [];
    let visibleFields = [];
    let profiles = [];
    let parsedData = {};

    async function loadInitialData() {
        await loadFields();
        await loadProfiles();
        updateVisibleFields();
        renderDocumentNoSection({});
        renderForm({});
        renderCompositeArea({});
    }

    async function loadFields() {
        const response = await fetch("/api/fields");
        const result = await response.json();

        if (!result.success) {
            alert("字段库加载失败");
            return;
        }

        allFields = (result.fields || []).filter(field => field.enabled !== false);
    }

    async function loadProfiles() {
        const response = await fetch("/api/template-profiles");
        const result = await response.json();

        if (!result.success) {
            alert("模板映射加载失败");
            return;
        }

        profiles = result.profiles || [];

        const select = document.getElementById("profileSelect");
        select.innerHTML = `<option value="">请选择模板映射</option>`;

        profiles.forEach(profile => {
            const option = document.createElement("option");
            option.value = profile.id;
            option.textContent = profile.name;
            select.appendChild(option);
        });

        select.onchange = function () {
            updateProfileTips();
            updateVisibleFields();
            renderDocumentNoSection(parsedData);
            renderForm(parsedData);
            renderCompositeArea(parsedData);
            document.getElementById("submitResult").innerHTML = "";
        };

        if (profiles.length > 0) {
            select.value = profiles[0].id;
        }

        updateProfileTips();
    }

    function getSelectedProfile() {
        const profileId = document.getElementById("profileSelect").value;
        return profiles.find(p => p.id === profileId) || null;
    }

    function extractKeysFromCompositeTemplates(profile) {
        const keys = new Set();
        const compositeMappings = profile && profile.composite_mappings ? profile.composite_mappings : [];

        compositeMappings.forEach(item => {
            const template = item.template || "";
            const matches = template.matchAll(/\{([^{}]+)\}/g);

            for (const match of matches) {
                const key = match[1].trim();

                if (key) {
                    keys.add(key);
                }
            }
        });

        return keys;
    }

    function updateVisibleFields() {
        const profile = getSelectedProfile();

        if (!profile) {
            visibleFields = [];
            return;
        }

        const usedKeys = new Set();
        const docKeySet = new Set(DOC_SECTION_KEYS);

        const mappings = profile.mappings || {};
        Object.keys(mappings).forEach(key => usedKeys.add(key));

        const compositeKeys = extractKeysFromCompositeTemplates(profile);
        compositeKeys.forEach(key => usedKeys.add(key));

        visibleFields = allFields.filter(
            field => usedKeys.has(field.key) && !docKeySet.has(field.key)
        );
    }

    function updateProfileTips() {
        const profile = getSelectedProfile();
        const tips = document.getElementById("profileTips");

        if (!profile) {
            tips.innerText = "请选择本次要使用的 Excel 模板映射。";
            return;
        }

        const templateText = profile.template_file ? "已上传" : "未上传模板";
        const mappingCount = profile.mappings ? Object.keys(profile.mappings).length : 0;
        const compositeCount = profile.composite_mappings ? profile.composite_mappings.length : 0;

        tips.innerText = `当前映射：${profile.name}；模板状态：${templateText}；普通字段：${mappingCount}；组合单元格：${compositeCount}`;
    }

    function getTodayISODate() {
        const d = new Date();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${d.getFullYear()}-${m}-${day}`;
    }

    function renderDocumentNoSection(data) {
        const area = document.getElementById("documentNoConfirmArea");
        if (!area) {
            return;
        }

        const profile = getSelectedProfile();
        area.innerHTML = "";

        if (!profile) {
            return;
        }

        const s = profile.document_no_settings || {};
        const today = getTodayISODate();
        const d = data || {};

        const title = document.createElement("h3");
        title.className = "section-title";
        title.innerText = "文档编号信息";
        area.appendChild(title);

        const tip = document.createElement("p");
        tip.className = "tips";
        tip.innerText = "「文档编号」留空时由系统按规则自动生成；若填写了文档编号（含 AI 解析结果），导出时将优先使用该值。";
        area.appendChild(tip);

        DOC_SECTION_KEYS.forEach(key => {
            const fieldMeta = allFields.find(f => f.key === key);
            const label = document.createElement("label");
            label.innerHTML = `
                ${fieldMeta ? fieldMeta.label : key}
                <span class="field-key">(${key})</span>
            `;

            const input = document.createElement("input");
            input.id = "doc_field_" + key;
            input.name = key;
            input.type = key === "deal_date" ? "date" : "text";

            let val = d[key] != null && String(d[key]).trim() !== "" ? String(d[key]).trim() : "";

            if (!val) {
                if (key === "sales_name") {
                    val = s.default_sales_name || "Anna";
                } else if (key === "salesperson_code") {
                    val = s.default_salesperson_code || "AN";
                } else if (key === "company_code") {
                    val = s.default_company_code || "GS";
                } else if (key === "sequence") {
                    val = s.default_sequence || "A01";
                } else if (key === "deal_date") {
                    val = today;
                }
            }

            if (key === "document_no") {
                val = d[key] != null ? String(d[key]) : "";
            }

            input.value = val;
            input.oninput = function () {
                refreshCompositeFromCurrentFields();
            };

            area.appendChild(label);
            area.appendChild(input);
        });
    }

    function renderForm(data) {
        const form = document.getElementById("confirmForm");
        form.innerHTML = "";

        if (!getSelectedProfile()) {
            form.innerHTML = `<div class="empty-form">请先选择模板映射。</div>`;
            return;
        }

        if (visibleFields.length === 0) {
            form.innerHTML = `<div class="empty-form">当前模板映射还没有选择任何字段，请先到配置中心设置。</div>`;
            return;
        }

        const title = document.createElement("h3");
        title.className = "section-title";
        title.innerText = "普通字段确认";
        form.appendChild(title);

        visibleFields.forEach(field => {
            const label = document.createElement("label");

            label.innerHTML = `
                ${field.label}
                <span class="field-key">(${field.key})</span>
                ${field.required ? '<span class="required">*</span>' : ''}
            `;

            const input = document.createElement("input");
            input.id = "field_" + field.key;
            input.name = field.key;
            input.type = getInputType(field.type);
            input.value = data[field.key] || "";
            input.oninput = function () {
                refreshCompositeFromCurrentFields();
            };

            form.appendChild(label);
            form.appendChild(input);
        });
    }

    function renderCompositeArea(data) {
        const area = document.getElementById("compositeConfirmArea");
        area.innerHTML = "";

        const profile = getSelectedProfile();

        if (!profile) {
            return;
        }

        const compositeMappings = profile.composite_mappings || [];

        if (compositeMappings.length === 0) {
            return;
        }

        const title = document.createElement("h3");
        title.className = "section-title";
        title.innerText = "组合单元格确认";
        area.appendChild(title);

        const tip = document.createElement("p");
        tip.className = "tips";
        tip.innerText = "这里显示的是将写入 Excel 组合单元格的最终内容，可以按实际情况手动修改。换行格式会保留。";
        area.appendChild(tip);

        compositeMappings.forEach(item => {
            const cell = String(item.cell || "").trim().toUpperCase();
            const template = item.template || "";
            const renderedText = renderTemplate(template, data);

            const box = document.createElement("div");
            box.className = "composite-box";

            box.innerHTML = `
                <div class="composite-cell">目标单元格：${cell}</div>
                <textarea
                    class="composite-textarea"
                    id="composite_${cell}"
                >${escapeHtml(renderedText)}</textarea>
            `;

            area.appendChild(box);
        });
    }

    function refreshCompositeFromCurrentFields() {
        const profile = getSelectedProfile();

        if (!profile) {
            return;
        }

        const data = collectAllOrderData();
        const compositeMappings = profile.composite_mappings || [];

        compositeMappings.forEach(item => {
            const cell = String(item.cell || "").trim().toUpperCase();
            const textarea = document.getElementById("composite_" + cell);

            if (textarea && !textarea.dataset.manuallyEdited) {
                textarea.value = renderTemplate(item.template || "", data);
            }
        });
    }

    document.addEventListener("input", function (event) {
        if (event.target && event.target.classList.contains("composite-textarea")) {
            event.target.dataset.manuallyEdited = "true";
        }
    });

    function renderTemplate(template, data) {
        return String(template || "").replace(/\{([^{}]+)\}/g, function (match, key) {
            key = key.trim();
            const value = data[key];

            if (value === null || value === undefined) {
                return "";
            }

            return String(value);
        });
    }

    function getInputType(type) {
        if (type === "number") {
            return "number";
        }
        if (type === "date") {
            return "date";
        }

        return "text";
    }

    async function parseMessage() {
        const message = document.getElementById("message").value.trim();
        const errorDiv = document.getElementById("parseError");
        const submitResult = document.getElementById("submitResult");
        const parseBtn = document.getElementById("parseBtn");

        errorDiv.innerText = "";
        submitResult.innerHTML = "";

        if (!message) {
            errorDiv.innerText = "请输入客户聊天内容";
            return;
        }

        parseBtn.disabled = true;
        parseBtn.innerText = "解析中...";

        const response = await fetch("/api/parse", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const result = await response.json();

        parseBtn.disabled = false;
        parseBtn.innerText = "AI解析";

        if (!result.success) {
            errorDiv.innerText = result.error || "解析失败";
            return;
        }

        if (result.data.error) {
            errorDiv.innerText = result.data.error;
            return;
        }

        parsedData = result.data;
        updateVisibleFields();
        renderDocumentNoSection(parsedData);
        renderForm(parsedData);
        renderCompositeArea(parsedData);
    }

    function collectDocNoFormData() {
        const data = {};

        DOC_SECTION_KEYS.forEach(key => {
            const input = document.getElementById("doc_field_" + key);
            data[key] = input ? input.value : "";
        });

        return data;
    }

    function collectFormData() {
        const data = {};

        visibleFields.forEach(field => {
            const input = document.getElementById("field_" + field.key);
            data[field.key] = input ? input.value : null;
        });

        return data;
    }

    function collectAllOrderData() {
        return Object.assign({}, collectDocNoFormData(), collectFormData());
    }

    function collectCompositeValues() {
        const values = {};
        const profile = getSelectedProfile();

        if (!profile) {
            return values;
        }

        const compositeMappings = profile.composite_mappings || [];

        compositeMappings.forEach(item => {
            const cell = String(item.cell || "").trim().toUpperCase();
            const textarea = document.getElementById("composite_" + cell);

            if (cell && textarea) {
                values[cell] = textarea.value;
            }
        });

        return values;
    }

    function validateRequiredFields(data) {
        const missing = [];

        visibleFields.forEach(field => {
            if (field.required) {
                const value = data[field.key];

                if (value === null || value === undefined || String(value).trim() === "") {
                    missing.push(field.label);
                }
            }
        });

        return missing;
    }

    async function submitOrder() {
        const profileId = document.getElementById("profileSelect").value;
        const data = collectAllOrderData();
        const compositeValues = collectCompositeValues();
        const submitResult = document.getElementById("submitResult");
        const generateBtn = document.getElementById("generateBtn");

        submitResult.innerHTML = "";

        if (!profileId) {
            submitResult.innerHTML = `<p class="error">请先选择模板映射</p>`;
            return;
        }

        const missing = validateRequiredFields(data);

        if (missing.length > 0) {
            submitResult.innerHTML = `
                <p class="error">以下必填字段不能为空：${missing.join("、")}</p>
            `;
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerText = "生成中...";

        const response = await fetch("/api/generate-excel", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                profile_id: profileId,
                data: data,
                composite_values: compositeValues
            })
        });

        const result = await response.json();

        generateBtn.disabled = false;
        generateBtn.innerText = "确认生成Excel";

        if (!result.success) {
            submitResult.innerHTML = `
                <p class="error">生成失败：${result.error}</p>
            `;
            return;
        }

        submitResult.innerHTML = `
            <p class="success">Excel生成成功！</p>
            <a class="download-link" href="${result.download_url}" target="_blank">点击下载Excel</a>
        `;
    }

    function escapeHtml(text) {
        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    loadInitialData();
</script>

</body>
</html>
