<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 智能模板工作台</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #172033;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(244, 247, 251, 0.96)),
                radial-gradient(circle at 20% 0%, rgba(36, 99, 235, 0.14), transparent 34%),
                #f4f7fb;
        }

        .page {
            width: min(1040px, calc(100% - 36px));
            margin: 0 auto;
            padding: 34px 0 46px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 28px;
        }

        .home-link {
            color: #1d4ed8;
            font-size: 14px;
            text-decoration: none;
            white-space: nowrap;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        h1 {
            margin: 0;
            color: #0f172a;
            font-size: 34px;
            line-height: 1.18;
            letter-spacing: 0;
        }

        .intro {
            max-width: 780px;
            margin: 0 0 24px;
            color: #475569;
            font-size: 16px;
            line-height: 1.75;
        }

        .flow-list {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin: 0 0 24px;
            padding: 0;
            list-style: none;
        }

        .flow-list li {
            min-height: 70px;
            padding: 13px 14px;
            border: 1px solid #dbe4ef;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.82);
            color: #24324a;
            font-size: 15px;
            line-height: 1.45;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
        }

        .work-panel {
            padding: 24px;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.09);
        }

        .upload-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
        }

        .file-label {
            display: block;
            min-height: 54px;
            padding: 15px 16px;
            border: 1px dashed #93a4bb;
            border-radius: 8px;
            background: #f8fafc;
            color: #334155;
            cursor: pointer;
        }

        .file-label:hover {
            border-color: #2563eb;
            background: #f1f6ff;
        }

        .file-label input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .file-name {
            display: block;
            margin-top: 4px;
            color: #64748b;
            font-size: 13px;
            word-break: break-word;
        }

        .button {
            min-width: 150px;
            height: 46px;
            padding: 0 18px;
            border: 1px solid #1d4ed8;
            border-radius: 7px;
            background: #1d4ed8;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background: #1e40af;
            border-color: #1e40af;
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.62;
        }

        .state {
            margin-top: 16px;
            padding: 13px 14px;
            border: 1px solid #dbe4ef;
            border-radius: 8px;
            background: #f8fafc;
            color: #475569;
            line-height: 1.6;
        }

        .state.success {
            border-color: #bbf7d0;
            background: #f0fdf4;
            color: #15803d;
        }

        .state.warning {
            border-color: #fde68a;
            background: #fffbeb;
            color: #92400e;
        }

        .state.error {
            border-color: #fecaca;
            background: #fff5f5;
            color: #b91c1c;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .result-card {
            min-height: 122px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
        }

        .result-title {
            margin: 0 0 10px;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .result-value {
            margin: 0;
            color: #0f172a;
            font-size: 22px;
            line-height: 1.25;
            word-break: break-word;
        }

        .result-note {
            margin-top: 8px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.45;
        }

        .export-panel {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid #dbe4ef;
            border-radius: 8px;
            background: #f8fafc;
        }

        .export-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 10px;
        }

        .export-title {
            margin: 0;
            color: #0f172a;
            font-size: 18px;
        }

        .export-text {
            margin: 0;
            color: #475569;
            line-height: 1.6;
        }

        .download-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            margin-top: 12px;
            padding: 0 16px;
            border-radius: 7px;
            background: #15803d;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        .download-link:hover {
            background: #166534;
        }

        .history-panel {
            margin-top: 22px;
            padding: 22px;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.06);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
        }

        .history-title {
            margin: 0;
            color: #0f172a;
            font-size: 20px;
        }

        .secondary-button {
            min-width: 96px;
            height: 38px;
            border-color: #cbd5e1;
            background: #fff;
            color: #1e293b;
            font-size: 14px;
        }

        .secondary-button:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .history-table-wrap {
            overflow-x: auto;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        .history-table th,
        .history-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #edf2f7;
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
        }

        .history-table th {
            color: #64748b;
            font-size: 13px;
            font-weight: 700;
            background: #f8fafc;
        }

        .history-table td {
            color: #1f2937;
            font-size: 14px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #ecfdf5;
            color: #15803d;
            font-size: 12px;
            font-weight: 700;
        }

        .quality-pill-excellent {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 2px 10px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-size: 12px;
            font-weight: 700;
        }

        .quality-pill-usable {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 2px 10px;
            border-radius: 999px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            font-weight: 700;
        }

        .quality-pill-check {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 2px 10px;
            border-radius: 999px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 12px;
            font-weight: 700;
        }

        .table-action-button {
            height: 30px;
            min-width: 80px;
            padding: 0 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #1d4ed8;
            font-size: 13px;
            cursor: pointer;
        }

        .table-action-button:hover {
            border-color: #1d4ed8;
            background: #eff6ff;
        }

        .delete-cache-button {
            margin-left: 8px;
            border-color: #fecaca;
            color: #b91c1c;
        }

        .delete-cache-button:hover {
            border-color: #dc2626;
            background: #fff5f5;
        }

        .inline-edit-group {
            margin-bottom: 12px;
        }

        .inline-edit-label {
            display: block;
            margin-bottom: 6px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
        }

        .inline-edit-input {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            color: #0f172a;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
        }

        .inline-edit-input:focus {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .inline-edit-textarea {
            min-height: 70px;
            resize: vertical;
        }

        .save-info-button {
            margin-top: 4px;
            height: 34px;
            min-width: 100px;
            padding: 0 12px;
            border: 1px solid #1d4ed8;
            border-radius: 6px;
            background: #1d4ed8;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-info-button:hover {
            background: #1e40af;
            border-color: #1e40af;
        }

        .save-info-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .search-filter-panel {
            margin-bottom: 16px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
        }

        .search-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }

        .search-input-group {
            flex: 1;
            min-width: 200px;
        }

        .search-input-label {
            display: block;
            margin-bottom: 6px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
        }

        .search-input {
            width: 100%;
            height: 36px;
            padding: 0 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #0f172a;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .filter-select-group {
            min-width: 140px;
        }

        .filter-select-label {
            display: block;
            margin-bottom: 6px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
        }

        .filter-select {
            width: 100%;
            height: 36px;
            padding: 0 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #0f172a;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .search-button {
            height: 36px;
            min-width: 80px;
            padding: 0 14px;
            border: 1px solid #1d4ed8;
            border-radius: 6px;
            background: #1d4ed8;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-button:hover {
            background: #1e40af;
            border-color: #1e40af;
        }

        .clear-search-button {
            height: 36px;
            min-width: 70px;
            padding: 0 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #1e293b;
            font-size: 14px;
            cursor: pointer;
        }

        .clear-search-button:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .detail-panel {
            margin-top: 16px;
            padding: 18px;
            border: 1px solid #dbe4ef;
            border-radius: 8px;
            background: #fff;
        }

        .detail-title {
            margin: 0 0 14px;
            color: #0f172a;
            font-size: 18px;
        }

        .detail-section {
            margin-top: 16px;
        }

        .detail-section h3 {
            margin: 0 0 10px;
            color: #334155;
            font-size: 15px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .detail-item {
            padding: 10px 12px;
            border: 1px solid #edf2f7;
            border-radius: 7px;
            background: #f8fafc;
            min-width: 0;
        }

        .detail-label {
            margin-bottom: 4px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
        }

        .detail-value {
            color: #0f172a;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
        }

        .rule-summary-list {
            margin: 0;
            padding-left: 20px;
            color: #334155;
            line-height: 1.7;
        }

        details {
            margin-top: 18px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
        }

        summary {
            padding: 13px 15px;
            color: #334155;
            font-weight: 600;
            cursor: pointer;
        }

        .advanced-body {
            padding: 0 15px 15px;
        }

        .advanced-item {
            margin: 0 0 12px;
            color: #475569;
            line-height: 1.55;
            word-break: break-word;
        }

        .json-preview {
            max-height: 300px;
            margin: 0;
            padding: 12px;
            overflow: auto;
            border-radius: 7px;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Consolas, "Microsoft YaHei", monospace;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 820px) {
            .flow-list,
            .result-grid,
            .upload-row,
            .export-header,
            .history-header,
            .detail-grid {
                grid-template-columns: 1fr;
                display: grid;
            }

            h1 {
                font-size: 28px;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="topbar">
            <h1>V4 智能模板工作台</h1>
            <a class="home-link" href="/">返回首页</a>
        </div>

        <p class="intro">
            上传 Excel 模板，系统会自动识别模板、检查缓存、AI 自动解析、生成规则，并自动学习模板。用户无需手动配置。
        </p>

        <ul class="flow-list" aria-label="系统自动流程">
            <li>识别模板结构</li>
            <li>检查历史缓存</li>
            <li>AI 自动解析</li>
            <li>自动学习模板</li>
        </ul>

        <section class="work-panel">
            <div class="upload-row">
                <label class="file-label" for="templateFile">
                    选择 Excel 模板
                    <span id="fileName" class="file-name">尚未选择文件</span>
                    <input id="templateFile" type="file" accept=".xlsx,.xlsm,.xltx,.xltm">
                </label>
                <button id="startButton" class="button" type="button">开始智能解析</button>
            </div>

            <div id="message" class="state" style="display: none;"></div>
            <div id="resultArea" style="display: none;"></div>
        </section>

        <section class="history-panel">
            <div class="history-header">
                <h2 class="history-title">已学习模板</h2>
                <button id="refreshTemplateHistoryButton" class="button secondary-button" type="button">刷新列表</button>
            </div>
            <div class="search-filter-panel">
                <div class="search-filter-row">
                    <div class="search-input-group">
                        <label class="search-input-label" for="searchKeywordInput">搜索模板名称 / 模板编号</label>
                        <input id="searchKeywordInput" class="search-input" type="text" placeholder="输入模板名称或编号">
                    </div>
                    <div class="filter-select-group">
                        <label class="filter-select-label" for="sourceFilterSelect">来源筛选</label>
                        <select id="sourceFilterSelect" class="filter-select">
                            <option value="">全部来源</option>
                            <option value="ai_template_parser">AI自动解析</option>
                            <option value="cache">缓存</option>
                        </select>
                    </div>
                    <div class="filter-select-group">
                        <label class="filter-select-label" for="statusFilterSelect">状态筛选</label>
                        <select id="statusFilterSelect" class="filter-select">
                            <option value="">全部状态</option>
                            <option value="learned">已学习</option>
                            <option value="warning">需检查</option>
                        </select>
                    </div>
                    <button id="applySearchButton" class="search-button" type="button">搜索</button>
                    <button id="clearSearchButton" class="clear-search-button" type="button">清空</button>
                </div>
            </div>
            <div id="templateHistoryMessage" class="state" style="display: none;"></div>
            <div id="templateHistoryContent"></div>
            <div id="templateDetailArea" style="display: none;"></div>
        </section>
    </main>

    <script>
        const fileInput = document.getElementById("templateFile");
        const fileName = document.getElementById("fileName");
        const startButton = document.getElementById("startButton");
        const message = document.getElementById("message");
        const resultArea = document.getElementById("resultArea");
        const templateHistoryMessage = document.getElementById("templateHistoryMessage");
        const templateHistoryContent = document.getElementById("templateHistoryContent");
        const templateDetailArea = document.getElementById("templateDetailArea");
        const refreshTemplateHistoryButton = document.getElementById("refreshTemplateHistoryButton");
        const searchKeywordInput = document.getElementById("searchKeywordInput");
        const sourceFilterSelect = document.getElementById("sourceFilterSelect");
        const statusFilterSelect = document.getElementById("statusFilterSelect");
        const applySearchButton = document.getElementById("applySearchButton");
        const clearSearchButton = document.getElementById("clearSearchButton");
        let currentWorkbenchResult = null;
        let currentExportResult = null;
        let allTemplatesData = [];
        let currentSearchKeyword = "";
        let currentSourceFilter = "";
        let currentStatusFilter = "";

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function setMessage(text, type) {
            message.className = `state ${type || ""}`.trim();
            message.textContent = text;
            message.style.display = "block";
        }

        function selectedFile() {
            if (!fileInput.files || !fileInput.files.length) {
                throw new Error("请先选择 Excel 模板");
            }
            return fileInput.files[0];
        }

        function sourceLabel(source) {
            return source === "cache" ? "缓存" : "AI解析";
        }

        function templateSourceLabel(source) {
            if (source === "cache") {
                return "缓存";
            }
            if (source === "ai_template_parser") {
                return "AI自动解析";
            }
            return source ? String(source) : "-";
        }

        function setTemplateHistoryMessage(text, type) {
            templateHistoryMessage.className = `state ${type || ""}`.trim();
            templateHistoryMessage.textContent = text;
            templateHistoryMessage.style.display = "block";
        }

        function hideTemplateHistoryMessage() {
            templateHistoryMessage.textContent = "";
            templateHistoryMessage.style.display = "none";
        }

        function filterTemplates(templates, keyword, sourceFilter, statusFilter) {
            const rows = Array.isArray(templates) ? templates : [];
            const kw = String(keyword || "").trim().toLowerCase();
            const srcFilter = String(sourceFilter || "").trim();
            const stFilter = String(statusFilter || "").trim();

            return rows.filter(item => {
                const templateName = String(item.template_name || `模板-${item.short_hash || ""}`).toLowerCase();
                const shortHash = String(item.short_hash || "").toLowerCase();
                const source = String(item.source || "");
                const hasWarning = Boolean(item.warning);

                if (kw) {
                    const matchName = templateName.includes(kw);
                    const matchHash = shortHash.includes(kw);
                    if (!matchName && !matchHash) {
                        return false;
                    }
                }

                if (srcFilter && source !== srcFilter) {
                    return false;
                }

                if (stFilter === "learned" && hasWarning) {
                    return false;
                }
                if (stFilter === "warning" && !hasWarning) {
                    return false;
                }

                return true;
            });
        }

        function applyCurrentFilters() {
            const filtered = filterTemplates(allTemplatesData, currentSearchKeyword, currentSourceFilter, currentStatusFilter);
            renderTemplateHistory(filtered, true);
        }

        function renderTemplateHistory(templates, isFilteredResult = false) {
            const rows = Array.isArray(templates) ? templates : [];
            if (!rows.length) {
                if (isFilteredResult) {
                    templateHistoryContent.innerHTML = `
                        <div class="state">没有找到匹配的模板。</div>
                    `;
                } else {
                    templateHistoryContent.innerHTML = `
                        <div class="state">暂无已学习模板，请先上传模板进行智能解析。</div>
                    `;
                }
                return;
            }

            function getQualityPillClass(qualityLevel) {
                if (qualityLevel === "优秀") {
                    return "quality-pill-excellent";
                } else if (qualityLevel === "可用") {
                    return "quality-pill-usable";
                } else {
                    return "quality-pill-check";
                }
            }

            templateHistoryContent.innerHTML = `
                <div class="history-table-wrap">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>模板名称</th>
                                <th>模板编号</th>
                                <th>规则数量</th>
                                <th>解析质量</th>
                                <th>使用次数</th>
                                <th>最近使用</th>
                                <th>来源</th>
                                <th>创建时间</th>
                                <th>更新时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(item => `
                                <tr>
                                    <td>${escapeHtml(item.template_name || `模板-${item.short_hash || "-"}`)}</td>
                                    <td>${escapeHtml(item.short_hash || "-")}</td>
                                    <td>${Number(item.rules_count || 0)}</td>
                                    <td><span class="${getQualityPillClass(item.quality_level)}">${escapeHtml(item.quality_level || "-")}</span></td>
                                    <td>${Number(item.usage_count || 0)}</td>
                                    <td>${escapeHtml(item.last_used_at || "暂无使用记录")}</td>
                                    <td>${escapeHtml(templateSourceLabel(item.source))}</td>
                                    <td>${escapeHtml(item.created_at || "-")}</td>
                                    <td>${escapeHtml(item.updated_at || "-")}</td>
                                    <td><span class="status-pill">${item.warning ? "需检查" : "已学习"}</span></td>
                                    <td>
                                        <button class="table-action-button" type="button" data-cache-action="detail" data-layout-hash="${escapeHtml(item.layout_hash || "")}">
                                            查看详情
                                        </button>
                                        <button class="table-action-button delete-cache-button" type="button" data-cache-action="delete" data-layout-hash="${escapeHtml(item.layout_hash || "")}">
                                            删除缓存
                                        </button>
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function ruleTargetCell(rule) {
            if (!rule || typeof rule !== "object") {
                return "-";
            }
            if (rule.target && typeof rule.target === "object" && rule.target.cell) {
                return rule.target.cell;
            }
            return rule.target_cell || rule.cell || "-";
        }

        function renderDetailItem(label, value) {
            return `
                <div class="detail-item">
                    <div class="detail-label">${escapeHtml(label)}</div>
                    <div class="detail-value">${escapeHtml(value || "-")}</div>
                </div>
            `;
        }

        function renderTemplateDetail(detail) {
            const meta = detail && typeof detail.meta === "object" ? detail.meta : {};
            const fingerprint = detail && typeof detail.fingerprint === "object" ? detail.fingerprint : {};
            const rules = Array.isArray(detail.rules) ? detail.rules : [];
            const sheetNames = Array.isArray(fingerprint.sheet_names) ? fingerprint.sheet_names : [];
            const mergedRanges = Array.isArray(fingerprint.merged_ranges) ? fingerprint.merged_ranges : [];
            const rulePreview = rules.slice(0, 5);
            const ruleSummary = rulePreview.length
                ? `<ol class="rule-summary-list">${rulePreview.map((rule, index) => `
                    <li>${escapeHtml(rule.id || `规则 ${index + 1}`)}：${escapeHtml(ruleTargetCell(rule))}</li>
                `).join("")}</ol>`
                : `<div class="state">暂无规则摘要</div>`;
            const warningHtml = detail.warning
                ? `<div class="state warning">${escapeHtml(detail.warning)}</div>`
                : "";
            const currentTemplateName = meta.template_name || `模板-${detail.short_hash}`;
            const currentTemplateNote = meta.template_note || "";

            function getQualityPillClass(qualityLevel) {
                if (qualityLevel === "优秀") {
                    return "quality-pill-excellent";
                } else if (qualityLevel === "可用") {
                    return "quality-pill-usable";
                } else {
                    return "quality-pill-check";
                }
            }

            templateDetailArea.innerHTML = `
                <section class="detail-panel">
                    <h2 class="detail-title">模板详情</h2>
                    ${warningHtml}

                    <div class="detail-section">
                        <h3>模板信息</h3>
                        <div class="inline-edit-group">
                            <label class="inline-edit-label" for="templateNameInput">模板名称</label>
                            <input id="templateNameInput" class="inline-edit-input" type="text" value="${escapeHtml(currentTemplateName)}" maxlength="100">
                        </div>
                        <div class="inline-edit-group">
                            <label class="inline-edit-label" for="templateNoteInput">模板备注</label>
                            <textarea id="templateNoteInput" class="inline-edit-input inline-edit-textarea" maxlength="500">${escapeHtml(currentTemplateNote)}</textarea>
                        </div>
                        <button id="saveTemplateInfoButton" class="save-info-button" type="button" data-layout-hash="${escapeHtml(detail.layout_hash || "")}">
                            保存模板信息
                        </button>
                        <div id="templateInfoMessage" class="state" style="display: none; margin-top: 10px;"></div>
                    </div>

                    <div class="detail-section">
                        <h3>解析质量说明</h3>
                        <div class="detail-grid">
                            ${renderDetailItem("质量等级", `<span class="${getQualityPillClass(detail.quality_level)}">${escapeHtml(detail.quality_level || "-")}</span>`)}
                            ${renderDetailItem("警告数量", String(detail.warning_count ?? 0))}
                        </div>
                        <div class="state" style="margin-top: 8px; background: #f8fafc;">
                            ${escapeHtml(detail.quality_message || "-")}
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>模板使用统计</h3>
                        <div class="detail-grid">
                            ${renderDetailItem("使用次数", String(detail.meta?.usage_count ?? 0))}
                            ${renderDetailItem("最近使用时间", detail.meta?.last_used_at || "暂无使用记录")}
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>基础信息</h3>
                        <div class="detail-grid">
                            ${renderDetailItem("模板编号", detail.short_hash)}
                            ${renderDetailItem("完整 layout_hash", detail.layout_hash)}
                            ${renderDetailItem("来源", templateSourceLabel(meta.source))}
                            ${renderDetailItem("parser_version", meta.parser_version)}
                            ${renderDetailItem("创建时间", meta.created_at)}
                            ${renderDetailItem("更新时间", meta.updated_at)}
                            ${renderDetailItem("规则数量", String(detail.rules_count ?? rules.length))}
                            ${renderDetailItem("sheet 数量", String(detail.sheet_count ?? sheetNames.length))}
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>结构摘要</h3>
                        <div class="detail-grid">
                            ${renderDetailItem("sheet 名称", sheetNames.length ? sheetNames.join("、") : "-")}
                            ${renderDetailItem("合并单元格数量", String(mergedRanges.length))}
                            ${renderDetailItem("非空单元格数量", String(fingerprint.non_empty_cells_count ?? 0))}
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>规则摘要</h3>
                        <div class="detail-grid">
                            ${renderDetailItem("rules 数量", String(rules.length))}
                        </div>
                        ${ruleSummary}
                    </div>

                    <details>
                        <summary>高级信息</summary>
                        <div class="advanced-body">
                            <p class="advanced-item">fingerprint JSON：</p>
                            <pre class="json-preview">${escapeHtml(JSON.stringify(fingerprint, null, 2))}</pre>
                            <p class="advanced-item">rules JSON：</p>
                            <pre class="json-preview">${escapeHtml(JSON.stringify(rules, null, 2))}</pre>
                            <p class="advanced-item">meta JSON：</p>
                            <pre class="json-preview">${escapeHtml(JSON.stringify(meta, null, 2))}</pre>
                        </div>
                    </details>
                </section>
            `;
            templateDetailArea.style.display = "block";
        }

        async function loadTemplateDetail(layoutHash) {
            if (!layoutHash) {
                return;
            }

            templateDetailArea.innerHTML = `<div class="state">正在加载模板详情...</div>`;
            templateDetailArea.style.display = "block";

            try {
                const response = await fetch(`/api/v4/template/cache-detail/${encodeURIComponent(layoutHash)}`);
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "模板详情读取失败");
                }
                renderTemplateDetail(result.detail || {});
            } catch (error) {
                templateDetailArea.innerHTML = `<div class="state error">模板详情读取失败：${escapeHtml(error.message || error)}</div>`;
                templateDetailArea.style.display = "block";
            }
        }

        function resetWorkbenchAfterCacheDelete() {
            currentWorkbenchResult = null;
            currentExportResult = null;
            resultArea.innerHTML = "";
            resultArea.style.display = "none";
            templateDetailArea.innerHTML = "";
            templateDetailArea.style.display = "none";
            startButton.disabled = false;
            startButton.textContent = "开始智能解析";
            setMessage("该模板缓存已删除，可重新进行智能解析。", "success");
        }

        function setTemplateInfoMessage(text, type) {
            const box = document.getElementById("templateInfoMessage");
            if (!box) {
                return;
            }
            box.className = `state ${type || ""}`.trim();
            box.textContent = text;
            box.style.display = "block";
        }

        function hideTemplateInfoMessage() {
            const box = document.getElementById("templateInfoMessage");
            if (box) {
                box.style.display = "none";
                box.textContent = "";
            }
        }

        async function saveTemplateInfo(layoutHash) {
            if (!layoutHash) {
                return;
            }

            const nameInput = document.getElementById("templateNameInput");
            const noteInput = document.getElementById("templateNoteInput");
            const saveButton = document.getElementById("saveTemplateInfoButton");

            if (!nameInput || !noteInput || !saveButton) {
                return;
            }

            const templateName = nameInput.value.trim();
            const templateNote = noteInput.value.trim();

            saveButton.disabled = true;
            saveButton.textContent = "保存中...";
            hideTemplateInfoMessage();

            try {
                const response = await fetch(`/api/v4/template/cache-update/${encodeURIComponent(layoutHash)}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        template_name: templateName,
                        template_note: templateNote
                    })
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "模板信息保存失败");
                }

                setTemplateInfoMessage("模板信息已保存。", "success");
                await loadTemplateHistory();
                await loadTemplateDetail(layoutHash);
            } catch (error) {
                setTemplateInfoMessage(`模板信息保存失败：${error.message || error}`, "error");
            } finally {
                const buttonAfter = document.getElementById("saveTemplateInfoButton");
                if (buttonAfter) {
                    buttonAfter.disabled = false;
                    buttonAfter.textContent = "保存模板信息";
                }
            }
        }

        async function deleteTemplateCache(layoutHash) {
            if (!layoutHash) {
                return;
            }

            const confirmed = window.confirm("确定要删除该模板缓存吗？\n删除后，下次上传同一模板将重新进行 AI 自动解析。");
            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(`/api/v4/template/cache/${encodeURIComponent(layoutHash)}`, {
                    method: "DELETE"
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "模板缓存删除失败");
                }
                resetWorkbenchAfterCacheDelete();
                await loadTemplateHistory();
                setTemplateHistoryMessage("模板缓存已删除。\n下次上传同一模板时，系统会重新进行 AI 自动解析。", "success");
            } catch (error) {
                setTemplateHistoryMessage(`模板缓存删除失败：${error.message || error}`, "error");
            }
        }

        async function loadTemplateHistory() {
            hideTemplateHistoryMessage();
            templateDetailArea.innerHTML = "";
            templateDetailArea.style.display = "none";
            refreshTemplateHistoryButton.disabled = true;
            refreshTemplateHistoryButton.textContent = "刷新中...";

            try {
                const response = await fetch("/api/v4/template/cache-list");
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "已学习模板列表加载失败");
                }
                allTemplatesData = Array.isArray(result.templates) ? result.templates : [];
                applyCurrentFilters();
            } catch (error) {
                allTemplatesData = [];
                templateHistoryContent.innerHTML = "";
                setTemplateHistoryMessage(`已学习模板列表加载失败：${error.message || error}`, "error");
            } finally {
                refreshTemplateHistoryButton.disabled = false;
                refreshTemplateHistoryButton.textContent = "刷新列表";
            }
        }

        function renderResult(data) {
            currentWorkbenchResult = data;
            currentExportResult = null;
            const rules = Array.isArray(data.rules) ? data.rules : [];
            const warnings = Array.isArray(data.warnings) ? data.warnings : [];
            const layoutHash = String(data.layout_hash || "");
            const shortHash = layoutHash ? layoutHash.slice(0, 8) : "-";
            const cacheHit = Boolean(data.cache_hit);
            const statusText = cacheHit ? "已自动识别历史模板" : "系统已学习该模板，下次会更快";
            const advancedWarnings = warnings.length
                ? `<pre class="json-preview">${escapeHtml(JSON.stringify(warnings, null, 2))}</pre>`
                : `<div class="advanced-item">暂无警告详情</div>`;

            resultArea.innerHTML = `
                <div class="result-grid">
                    <article class="result-card">
                        <h2 class="result-title">模板识别结果</h2>
                        <p class="result-value">${cacheHit ? "命中缓存" : "首次解析"}</p>
                        <div class="result-note">来源：${sourceLabel(data.source)}；模板编号：${escapeHtml(shortHash)}</div>
                    </article>
                    <article class="result-card">
                        <h2 class="result-title">规则结果</h2>
                        <p class="result-value">${rules.length} 条规则</p>
                        <div class="result-note">警告数量：${warnings.length}</div>
                    </article>
                    <article class="result-card">
                        <h2 class="result-title">系统状态</h2>
                        <p class="result-value">${escapeHtml(statusText)}</p>
                    </article>
                </div>
                <section class="export-panel">
                    <div class="export-header">
                        <div>
                            <h2 class="export-title">生成 Excel</h2>
                            <p class="export-text">当前模板已解析完成。规则数量：${rules.length}；警告数量：${warnings.length}。</p>
                        </div>
                        <button id="generateExcelButton" class="button" type="button">生成 Excel 文件</button>
                    </div>
                    <div id="exportMessage" class="state" style="display: none;"></div>
                    <div id="exportResult" style="display: none;"></div>
                </section>
                <details>
                    <summary>高级信息（开发调试）</summary>
                    <div id="advancedInfo" class="advanced-body">
                        <p class="advanced-item">layout_hash：${escapeHtml(layoutHash || "-")}</p>
                        <p class="advanced-item">操作数量：尚未生成 Excel</p>
                        <p class="advanced-item">download_url：尚未生成 Excel</p>
                        <p class="advanced-item">警告详情：</p>
                        ${advancedWarnings}
                        <p class="advanced-item">规则 JSON：</p>
                        <pre class="json-preview">${escapeHtml(JSON.stringify(rules, null, 2))}</pre>
                    </div>
                </details>
            `;
            resultArea.style.display = "block";
            setMessage(cacheHit ? "已自动识别历史模板" : "系统已学习该模板，下次会更快", "success");
        }

        function setExportMessage(text, type) {
            const box = document.getElementById("exportMessage");
            if (!box) {
                return;
            }
            box.className = `state ${type || ""}`.trim();
            box.textContent = text;
            box.style.display = "block";
        }

        function hideExportMessage() {
            const box = document.getElementById("exportMessage");
            if (box) {
                box.style.display = "none";
                box.textContent = "";
            }
        }

        function refreshAdvancedInfo() {
            const advancedInfo = document.getElementById("advancedInfo");
            if (!advancedInfo || !currentWorkbenchResult) {
                return;
            }

            const rules = Array.isArray(currentWorkbenchResult.rules) ? currentWorkbenchResult.rules : [];
            const parseWarnings = Array.isArray(currentWorkbenchResult.warnings) ? currentWorkbenchResult.warnings : [];
            const exportWarnings = currentExportResult && Array.isArray(currentExportResult.warnings)
                ? currentExportResult.warnings
                : [];
            const allWarnings = parseWarnings.concat(exportWarnings);
            const warningsHtml = allWarnings.length
                ? `<pre class="json-preview">${escapeHtml(JSON.stringify(allWarnings, null, 2))}</pre>`
                : `<div class="advanced-item">暂无警告详情</div>`;
            const operationsCount = currentExportResult ? currentExportResult.operations_count : "尚未生成 Excel";
            const downloadUrl = currentExportResult ? currentExportResult.download_url : "尚未生成 Excel";

            advancedInfo.innerHTML = `
                <p class="advanced-item">layout_hash：${escapeHtml(currentWorkbenchResult.layout_hash || "-")}</p>
                <p class="advanced-item">操作数量：${escapeHtml(operationsCount)}</p>
                <p class="advanced-item">download_url：${escapeHtml(downloadUrl || "-")}</p>
                <p class="advanced-item">警告详情：</p>
                ${warningsHtml}
                <p class="advanced-item">规则 JSON：</p>
                <pre class="json-preview">${escapeHtml(JSON.stringify(rules, null, 2))}</pre>
            `;
        }

        function renderExportResult(result) {
            currentExportResult = result;
            const exportResult = document.getElementById("exportResult");
            if (!exportResult) {
                return;
            }

            const warnings = Array.isArray(result.warnings) ? result.warnings : [];
            hideExportMessage();
            exportResult.innerHTML = `
                <div class="state success">Excel 已生成。操作数量：${Number(result.operations_count || 0)}；警告数量：${warnings.length}。</div>
                <a class="download-link" href="${escapeHtml(result.download_url || "#")}" target="_blank" rel="noopener">下载生成的 Excel 文件</a>
            `;
            exportResult.style.display = "block";
            refreshAdvancedInfo();
        }

        async function exportExcelFile() {
            if (!fileInput.files || !fileInput.files.length) {
                setMessage("尚未上传模板", "error");
                return;
            }
            if (!currentWorkbenchResult) {
                setMessage("尚未完成智能解析", "error");
                return;
            }

            const rules = Array.isArray(currentWorkbenchResult.rules) ? currentWorkbenchResult.rules : [];
            if (!rules.length) {
                setExportMessage("规则为空", "error");
                return;
            }

            const button = document.getElementById("generateExcelButton");
            let exported = false;
            if (button) {
                button.disabled = true;
                button.textContent = "正在生成...";
            }
            setExportMessage("正在生成 Excel 文件，请稍候。", "");

            try {
                const formData = new FormData();
                formData.append("file", selectedFile());
                formData.append("rules", JSON.stringify(rules));
                const response = await fetch("/api/v4/workbench/export", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "Excel 生成失败");
                }
                renderExportResult(result);
                exported = true;
            } catch (error) {
                setExportMessage(`Excel 生成失败：${error.message || error}`, "error");
            } finally {
                if (button) {
                    button.disabled = false;
                    button.textContent = exported ? "重新生成 Excel" : "生成 Excel 文件";
                }
            }
        }

        async function startSmartParse() {
            resultArea.style.display = "none";
            currentWorkbenchResult = null;
            currentExportResult = null;
            startButton.disabled = true;
            startButton.textContent = "正在解析...";
            setMessage("系统正在自动处理模板，请稍候。", "");

            try {
                const formData = new FormData();
                formData.append("file", selectedFile());
                const response = await fetch("/api/v4/template/match-or-parse", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "智能解析失败");
                }
                renderResult(result.data || result);
                loadTemplateHistory();
            } catch (error) {
                setMessage(`智能解析失败：${error.message || error}`, "error");
            } finally {
                startButton.disabled = false;
                startButton.textContent = "开始智能解析";
            }
        }

        fileInput.addEventListener("change", () => {
            const file = fileInput.files && fileInput.files[0];
            fileName.textContent = file ? file.name : "尚未选择文件";
            resultArea.style.display = "none";
            message.style.display = "none";
            currentWorkbenchResult = null;
            currentExportResult = null;
        });

        resultArea.addEventListener("click", event => {
            if (event.target && event.target.id === "generateExcelButton") {
                exportExcelFile();
            }
        });

        templateHistoryContent.addEventListener("click", event => {
            const detailButton = event.target && event.target.closest
                ? event.target.closest(".table-action-button")
                : null;
            if (!detailButton) {
                return;
            }

            const action = detailButton.dataset.cacheAction;
            if (action === "delete") {
                deleteTemplateCache(detailButton.dataset.layoutHash);
            } else {
                loadTemplateDetail(detailButton.dataset.layoutHash);
            }
        });

        templateDetailArea.addEventListener("click", event => {
            const saveButton = event.target && event.target.id === "saveTemplateInfoButton"
                ? event.target
                : null;
            if (!saveButton) {
                return;
            }
            saveTemplateInfo(saveButton.dataset.layoutHash);
        });

        applySearchButton.addEventListener("click", () => {
            currentSearchKeyword = searchKeywordInput.value.trim();
            currentSourceFilter = sourceFilterSelect.value;
            currentStatusFilter = statusFilterSelect.value;
            applyCurrentFilters();
        });

        clearSearchButton.addEventListener("click", () => {
            searchKeywordInput.value = "";
            sourceFilterSelect.value = "";
            statusFilterSelect.value = "";
            currentSearchKeyword = "";
            currentSourceFilter = "";
            currentStatusFilter = "";
            applyCurrentFilters();
        });

        searchKeywordInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                currentSearchKeyword = searchKeywordInput.value.trim();
                currentSourceFilter = sourceFilterSelect.value;
                currentStatusFilter = statusFilterSelect.value;
                applyCurrentFilters();
            }
        });

        refreshTemplateHistoryButton.addEventListener("click", loadTemplateHistory);
        startButton.addEventListener("click", startSmartParse);
        loadTemplateHistory();
    </script>
</body>
</html>
