<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统模板管理</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f5f6f8;
            color: #333;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 24px;
        }
        .page {
            margin: 0 auto;
            max-width: 1120px;
        }
        .header {
            align-items: center;
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
        }
        h1 {
            flex: 1 1 auto;
            font-size: 28px;
            margin: 0;
        }
        h2 {
            color: #222;
            font-size: 20px;
            margin: 0 0 14px;
        }
        a {
            color: #1677ff;
            text-decoration: none;
            white-space: nowrap;
        }
        a:hover { text-decoration: underline; }
        .panel {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 16px;
            padding: 20px;
        }
        .status {
            border-radius: 7px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            min-height: 22px;
            padding: 10px 12px;
        }
        .status.info { background: #f2f6ff; color: #315c9c; }
        .status.success { background: #e9f8ef; color: #16713b; }
        .status.warning { background: #fff7db; color: #8a6100; }
        .status.error { background: #ffe9e7; color: #b42318; }
        .form-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .summary-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .summary-card {
            background: #fafbfd;
            border: 1px solid #e6eaf0;
            border-radius: 9px;
            padding: 14px;
        }
        .summary-label {
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .summary-value {
            color: #222;
            font-size: 16px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        label {
            color: #333;
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
        }
        input, select {
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 14px;
            min-height: 40px;
            padding: 9px 10px;
            width: 100%;
        }
        .actions {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }
        button {
            background: #1677ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            min-height: 38px;
            padding: 9px 16px;
        }
        button.secondary {
            background: #eef2f7;
            color: #344054;
        }
        button.danger {
            background: #f04438;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }
        .small {
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }
        .config-empty {
            background: #fafbfd;
            border: 1px dashed #d8dee8;
            border-radius: 9px;
            color: #666;
            line-height: 1.6;
            padding: 18px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border-bottom: 1px solid #edf0f4;
            font-size: 14px;
            padding: 10px 8px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #fafbfd;
            color: #555;
            font-weight: 700;
        }
        td {
            color: #333;
            overflow-wrap: anywhere;
        }
        @media (max-width: 900px) {
            body { padding: 16px; }
            .header { align-items: flex-start; flex-direction: column; gap: 8px; }
            .form-grid, .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>系统模板管理</h1>
            <a href="/v4-order-workspace">订单工作台</a>
            <a href="/v4-core-pipeline">V4 Core Pipeline</a>
        </header>

        <section class="panel">
            <h2>系统模板</h2>
            <div id="settingsStatus" class="status info">正在加载系统模板...</div>
            <div class="form-grid" style="margin-top: 14px;">
                <div>
                    <label for="templateSelect">选择系统模板</label>
                    <select id="templateSelect" onchange="selectSystemTemplate(this.value)"></select>
                </div>
                <div>
                    <label for="newSystemTemplateNameInput">新建系统模板名称</label>
                    <input id="newSystemTemplateNameInput" type="text" placeholder="例如 Anna 固体饮料模板">
                </div>
                <div>
                    <label for="companyTemplateFileInput">公司 Excel 模板文件</label>
                    <input id="companyTemplateFileInput" type="file" accept=".xlsx,.xlsm,.xltx,.xltm">
                </div>
            </div>
            <div class="actions">
                <button type="button" onclick="createSystemTemplateFromCompanyTemplate()">生成系统模板</button>
                <button type="button" class="secondary" onclick="loadTemplateProfiles()">刷新</button>
                <span id="createStatus" class="small">填写名称并选择公司模板文件后生成新的系统模板。</span>
            </div>
        </section>

        <section class="panel">
            <h2>当前系统模板状态</h2>
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-label">当前系统模板</div>
                    <div id="currentTemplateName" class="summary-value">未选择</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">模板文件</div>
                    <div id="currentTemplateFile" class="summary-value">未上传</div>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2>模板文件操作</h2>
            <div class="form-grid">
                <div>
                    <label for="replaceTemplateFileInput">选择新的模板文件</label>
                    <input id="replaceTemplateFileInput" type="file" accept=".xlsx,.xlsm,.xltx,.xltm">
                </div>
            </div>
            <div class="actions">
                <button type="button" onclick="replaceCurrentTemplateFile()">上传/替换模板</button>
                <button type="button" class="danger" onclick="deleteCurrentTemplateFile()">删除模板文件</button>
                <span id="fileActionStatus" class="small"></span>
            </div>
        </section>

        <section class="panel">
            <h2>模板配置</h2>
            <div id="templateConfigArea" class="config-empty">
                当前阶段将显示模板分析识别出的可填写单元格。下一步将支持字段名、分组、顺序、是否显示到工作页配置。
            </div>
        </section>
    </main>

    <script>
        let templateProfiles = [];
        let selectedTemplateId = "";
        let selectedTemplateDetail = null;
        let configByTemplateId = {};

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        function setStatus(text, type = "info") {
            const element = document.getElementById("settingsStatus");
            element.textContent = text;
            element.className = `status ${type}`;
        }

        function setInlineStatus(id, text) {
            const element = document.getElementById(id);
            if (element) element.textContent = text;
        }

        function templateName(profile) {
            return profile?.profile_name || profile?.template_name || "未命名系统模板";
        }

        function templateFilename(profile) {
            return profile?.template_filename || "未上传";
        }

        function selectedProfile() {
            return selectedTemplateDetail || templateProfiles.find(item => item.profile_id === selectedTemplateId) || null;
        }

        function renderTemplateSelector() {
            const select = document.getElementById("templateSelect");
            if (!templateProfiles.length) {
                select.innerHTML = '<option value="">暂无系统模板</option>';
                select.value = "";
                selectedTemplateId = "";
                return;
            }

            select.innerHTML = templateProfiles.map(profile => {
                const id = profile.profile_id || "";
                return `<option value="${escapeHtml(id)}">${escapeHtml(templateName(profile))}</option>`;
            }).join("");

            if (!selectedTemplateId || !templateProfiles.some(item => item.profile_id === selectedTemplateId)) {
                selectedTemplateId = templateProfiles[0].profile_id || "";
            }
            select.value = selectedTemplateId;
        }

        function renderCurrentTemplateStatus() {
            const profile = selectedProfile();
            document.getElementById("currentTemplateName").textContent = profile ? templateName(profile) : "未选择";
            document.getElementById("currentTemplateFile").textContent = profile ? templateFilename(profile) : "未上传";
        }

        function rowIndexFromCell(cell) {
            const match = String(cell || "").match(/\d+/);
            return match ? Number(match[0]) : 999999;
        }

        function columnIndexFromCell(cell) {
            const letters = String(cell || "").match(/[A-Z]+/i);
            if (!letters) return 999999;
            return letters[0].toUpperCase().split("").reduce((sum, ch) => sum * 26 + ch.charCodeAt(0) - 64, 0);
        }

        function sectionForLabel(label, layoutSections) {
            const cell = label?.cell || "";
            const row = rowIndexFromCell(cell);
            const col = columnIndexFromCell(cell);
            const section = (layoutSections || []).find(item => {
                const bounds = item.bounds || {};
                const startRow = Number(bounds.start_row || 0);
                const endRow = Number(bounds.end_row || 0);
                const startCol = Number(bounds.start_col || 0);
                const endCol = Number(bounds.end_col || 0);
                return startRow && endRow && startCol && endCol
                    && row >= startRow && row <= endRow
                    && col >= startCol && col <= endCol;
            });
            return section?.title || "普通字段";
        }

        function renderTemplateConfigFromResult(result) {
            const labels = Array.isArray(result?.template_labels) ? result.template_labels : [];
            const sections = Array.isArray(result?.layout_sections) ? result.layout_sections : [];
            const area = document.getElementById("templateConfigArea");

            if (!labels.length) {
                area.className = "config-empty";
                area.innerHTML = "当前阶段将显示模板分析识别出的可填写单元格。下一步将支持字段名、分组、顺序、是否显示到工作页配置。";
                return;
            }

            const rows = labels
                .slice()
                .sort((left, right) => {
                    const rowDiff = rowIndexFromCell(left.cell) - rowIndexFromCell(right.cell);
                    if (rowDiff) return rowDiff;
                    return columnIndexFromCell(left.cell) - columnIndexFromCell(right.cell);
                })
                .slice(0, 120)
                .map(label => {
                    const text = label.label || label.text || label.value || "";
                    const valueType = label.value_type || label.type || "文本";
                    return `
                        <tr>
                            <td>${escapeHtml(label.cell || "")}</td>
                            <td>${escapeHtml(text)}</td>
                            <td>${escapeHtml(sectionForLabel(label, sections))}</td>
                            <td>${escapeHtml(valueType)}</td>
                        </tr>
                    `;
                }).join("");

            area.className = "";
            area.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>单元格</th>
                            <th>可填写内容</th>
                            <th>所属区域</th>
                            <th>类型</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function renderStoredTemplateConfig() {
            renderTemplateConfigFromResult(configByTemplateId[selectedTemplateId] || {});
        }

        async function fetchTemplateDetail(profileId) {
            if (!profileId) return null;
            const response = await fetch(`/api/v4/template-profiles/${encodeURIComponent(profileId)}`);
            const result = await response.json();
            if (!response.ok || !result.success) {
                throw new Error(result.error || "系统模板加载失败");
            }
            return result.profile || null;
        }

        async function selectSystemTemplate(profileId) {
            selectedTemplateId = profileId || "";
            selectedTemplateDetail = null;
            try {
                if (selectedTemplateId) {
                    selectedTemplateDetail = await fetchTemplateDetail(selectedTemplateId);
                    await fetch("/api/v4/set-current-template-profile", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ profile_id: selectedTemplateId })
                    });
                }
                renderCurrentTemplateStatus();
                renderStoredTemplateConfig();
            } catch (error) {
                setStatus(error.message || "系统模板加载失败", "error");
            }
        }

        async function loadTemplateProfiles(preferredId = "") {
            try {
                setStatus("正在加载系统模板...", "info");
                const response = await fetch("/api/v4/template-profiles");
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "系统模板加载失败");
                }

                templateProfiles = Array.isArray(result.profiles) ? result.profiles : [];
                selectedTemplateId = preferredId || selectedTemplateId || "";
                renderTemplateSelector();
                await selectSystemTemplate(selectedTemplateId);
                setStatus(`已加载 ${templateProfiles.length} 个系统模板。`, "success");
            } catch (error) {
                setStatus(error.message || "系统模板加载失败", "error");
            }
        }

        async function createSystemTemplateFromCompanyTemplate() {
            const nameInput = document.getElementById("newSystemTemplateNameInput");
            const fileInput = document.getElementById("companyTemplateFileInput");
            const profileName = nameInput ? nameInput.value.trim() : "";
            const templateFile = fileInput && fileInput.files && fileInput.files.length ? fileInput.files[0] : null;

            if (!profileName) {
                setStatus("请填写新建系统模板名称。", "warning");
                setInlineStatus("createStatus", "请填写新建系统模板名称。");
                return;
            }
            if (!templateFile) {
                setStatus("请选择公司 Excel 模板文件。", "warning");
                setInlineStatus("createStatus", "请选择公司 Excel 模板文件。");
                return;
            }

            try {
                setStatus("正在生成系统模板...", "info");
                setInlineStatus("createStatus", "正在上传并分析模板...");
                const formData = new FormData();
                formData.append("profile_name", profileName);
                formData.append("template_file", templateFile);

                const response = await fetch("/api/v4/template-profiles/analyze-template", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "系统模板生成失败");
                }

                const newId = result.profile?.profile_id || "";
                if (newId) configByTemplateId[newId] = result;
                if (nameInput) nameInput.value = "";
                if (fileInput) fileInput.value = "";
                setInlineStatus("createStatus", "系统模板已生成。");
                await loadTemplateProfiles(newId);
                renderTemplateConfigFromResult(result);
            } catch (error) {
                setStatus(error.message || "系统模板生成失败", "error");
                setInlineStatus("createStatus", error.message || "系统模板生成失败");
            }
        }

        async function replaceCurrentTemplateFile() {
            if (!selectedTemplateId) {
                setStatus("请先选择系统模板。", "warning");
                return;
            }
            const fileInput = document.getElementById("replaceTemplateFileInput");
            const templateFile = fileInput && fileInput.files && fileInput.files.length ? fileInput.files[0] : null;
            if (!templateFile) {
                setStatus("请选择新的模板文件。", "warning");
                setInlineStatus("fileActionStatus", "请选择新的模板文件。");
                return;
            }

            try {
                setStatus("正在上传并分析模板文件...", "info");
                setInlineStatus("fileActionStatus", "正在上传并分析模板文件...");
                const formData = new FormData();
                formData.append("template_file", templateFile);
                const response = await fetch(`/api/v4/template-profiles/${encodeURIComponent(selectedTemplateId)}/replace-template-file`, {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "模板文件更新失败");
                }

                configByTemplateId[selectedTemplateId] = result;
                if (fileInput) fileInput.value = "";
                setInlineStatus("fileActionStatus", "模板文件已更新。");
                await loadTemplateProfiles(selectedTemplateId);
                renderTemplateConfigFromResult(result);
                setStatus("模板文件已更新。", "success");
            } catch (error) {
                setStatus(error.message || "模板文件更新失败", "error");
                setInlineStatus("fileActionStatus", error.message || "模板文件更新失败");
            }
        }

        async function deleteCurrentTemplateFile() {
            if (!selectedTemplateId) {
                setStatus("请先选择系统模板。", "warning");
                return;
            }
            if (!confirm("确定删除当前模板文件吗？系统模板会保留。")) {
                return;
            }

            try {
                setStatus("正在删除模板文件...", "info");
                setInlineStatus("fileActionStatus", "正在删除模板文件...");
                const response = await fetch(`/api/v4/template-profiles/${encodeURIComponent(selectedTemplateId)}/delete-template-file`, {
                    method: "POST"
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || "模板文件删除失败");
                }

                delete configByTemplateId[selectedTemplateId];
                setInlineStatus("fileActionStatus", "模板文件已删除。");
                await loadTemplateProfiles(selectedTemplateId);
                renderStoredTemplateConfig();
                setStatus("模板文件已删除。", "success");
            } catch (error) {
                setStatus(error.message || "模板文件删除失败", "error");
                setInlineStatus("fileActionStatus", error.message || "模板文件删除失败");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadTemplateProfiles();
        });
    </script>
</body>
</html>
