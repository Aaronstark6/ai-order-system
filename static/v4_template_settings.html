<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板映射管理</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f5f6f8;
            color: #222;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            padding: 24px;
        }
        .page {
            margin: 0 auto;
            max-width: 1120px;
        }
        .header {
            align-items: center;
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
        }
        h1 {
            flex: 1 1 auto;
            font-size: 28px;
            margin: 0;
        }
        h2 {
            font-size: 20px;
            margin: 0 0 14px;
        }
        h3 {
            color: #333;
            font-size: 16px;
            margin: 18px 0 10px;
        }
        a {
            color: #1677ff;
            text-decoration: none;
            white-space: nowrap;
        }
        a:hover { text-decoration: underline; }
        .panel {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(16,24,40,0.08);
            margin-bottom: 16px;
            padding: 20px;
        }
        .status {
            border-radius: 6px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            min-height: 22px;
            padding: 10px 12px;
        }
        .status.info { background: #f2f6ff; color: #315c9c; }
        .status.success { background: #e9f8ef; color: #16713b; }
        .status.warning { background: #fff7db; color: #8a6100; }
        .status.error { background: #ffe9e7; color: #b42318; }
        .row {
            align-items: end;
            display: grid;
            gap: 12px;
            grid-template-columns: minmax(240px, 1fr) minmax(280px, 1fr) auto;
            margin-top: 12px;
        }
        .file-row {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .summary-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .summary-item {
            background: #fafbfd;
            border: 1px solid #e6eaf0;
            border-radius: 8px;
            padding: 14px;
        }
        .summary-label {
            color: #667085;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .summary-value {
            color: #1d2939;
            font-size: 16px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        label {
            color: #344054;
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        input, select {
            border: 1px solid #cfd6e0;
            border-radius: 6px;
            color: #222;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 14px;
            min-height: 40px;
            padding: 9px 10px;
            width: 100%;
        }
        input[type="file"] {
            max-width: 420px;
            width: auto;
        }
        .config-actions {
            align-items: center;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .field-input {
            min-width: 150px;
        }
        .order-input {
            max-width: 86px;
        }
        .show-checkbox {
            min-height: auto;
            width: auto;
        }
        button {
            background: #1677ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            min-height: 40px;
            padding: 9px 16px;
            white-space: nowrap;
        }
        button.danger { background: #d92d20; }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }
        .small {
            color: #667085;
            font-size: 13px;
            line-height: 1.5;
        }
        .config-empty {
            background: #fafbfd;
            border: 1px dashed #d8dee8;
            border-radius: 8px;
            color: #667085;
            line-height: 1.6;
            padding: 18px;
        }
        .mapping-status-inline {
            align-items: center;
            background: #fafbfd;
            border: 1px solid #e6eaf0;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 14px 18px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border-bottom: 1px solid #edf0f4;
            font-size: 14px;
            padding: 10px 8px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #fafbfd;
            color: #475467;
            font-weight: 700;
        }
        td {
            color: #333;
            overflow-wrap: anywhere;
        }
        @media (max-width: 860px) {
            body { padding: 16px; }
            .header { align-items: flex-start; flex-direction: column; gap: 8px; }
            .row, .summary-grid { grid-template-columns: 1fr; }
            input[type="file"] { width: 100%; }
            button { width: 100%; }
            .config-actions { align-items: stretch; flex-direction: column; }
            .field-input, .order-input { max-width: none; width: 100%; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>模板映射管理</h1>
            <a href="/">返回首页</a>
            <a href="/v4-order-workspace">订单工作台</a>
            <a href="/v4-core-pipeline">V4结构模型</a>
        </header>

        <section class="panel">
            <h2>映射与模板管理</h2>
            <div id="settingsStatus" class="status info">正在加载映射...</div>

            <h3>映射选择</h3>
            <div class="row">
                <div>
                    <label for="mappingSelect">选择映射</label>
                    <select id="mappingSelect" onchange="selectMapping(this.value)"></select>
                </div>
                <div>
                    <label for="newMappingNameInput">新建映射名称</label>
                    <input id="newMappingNameInput" type="text" placeholder="新建映射名称，例如：固体饮料">
                </div>
                <button type="button" onclick="createMapping()">新建映射</button>
            </div>

            <h3>当前映射状态</h3>
            <div class="mapping-status-inline">
                <div>
                    <span style="color: #667085; font-size: 13px;">当前映射：</span>
                    <span id="currentMappingName" style="color: #1d2939; font-size: 16px; font-weight: 700;">未选择</span>
                </div>
                <div>
                    <span style="color: #667085; font-size: 13px;">模板文件：</span>
                    <span id="currentTemplateFile" style="color: #1d2939; font-size: 16px; font-weight: 700;">未上传</span>
                </div>
            </div>

            <h3>模板文件操作</h3>
            <div class="file-row">
                <input id="templateFileInput" type="file" accept=".xlsx,.xlsm,.xltx,.xltm">
                <button type="button" onclick="uploadTemplateFile()">上传模板</button>
                <button type="button" class="danger" onclick="deleteTemplateFile()">删除当前模板文件</button>
                <button type="button" class="danger" onclick="deleteMapping()">删除当前映射</button>
                <span id="fileActionStatus" class="small"></span>
            </div>
        </section>

        <section class="panel">
            <h2>模板配置</h2>
            <div id="templateConfigArea" class="config-empty">
                当前映射尚未生成模板配置。上传模板后，系统会分析模板结构，并在这里显示可填写单元格。
            </div>
        </section>
    </main>

    <script>
        let mappings = [];
        let selectedMappingId = "";
        let selectedMapping = null;
        let configByMappingId = {};

        function profileKey() {
            return "profile" + "_id";
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        function setStatus(text, type = "info") {
            const element = document.getElementById("settingsStatus");
            element.textContent = text;
            element.className = `status ${type}`;
        }

        function setInlineStatus(text) {
            document.getElementById("fileActionStatus").textContent = text || "";
        }

        function getMappingId(mapping) {
            return mapping?.[profileKey()] || "";
        }

        function getMappingName(mapping) {
            return mapping?.profile_name || mapping?.template_name || "未命名映射";
        }

        function getTemplateFilename(mapping) {
            return mapping?.template_filename || "";
        }

        function updateCurrentState() {
            document.getElementById("currentMappingName").textContent = selectedMapping ? getMappingName(selectedMapping) : "未选择";
            document.getElementById("currentTemplateFile").textContent = getTemplateFilename(selectedMapping) || "未上传";
        }

        function setSelectOptions() {
            const select = document.getElementById("mappingSelect");
            if (!mappings.length) {
                select.innerHTML = '<option value="">暂无映射</option>';
                selectedMappingId = "";
                selectedMapping = null;
                updateCurrentState();
                renderConfig();
                return;
            }

            select.innerHTML = mappings.map((mapping) => {
                const id = getMappingId(mapping);
                const name = getMappingName(mapping);
                return `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`;
            }).join("");
            select.value = selectedMappingId;
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) {
                throw new Error(result.error || "操作失败");
            }
            return result;
        }

        async function loadMappingDetail(mappingId) {
            if (!mappingId) return null;
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(mappingId)}`);
            return result.profile || null;
        }

        async function loadMappingConfiguration(mappingId) {
            if (!mappingId) return { labels: [], structureLabels: [], sections: [], analysis: {}, savedConfiguration: {} };
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(mappingId)}/configuration`);
            const analysis = result.template_analysis && typeof result.template_analysis === "object" ? result.template_analysis : {};
            const structure = analysis.template_structure && typeof analysis.template_structure === "object" ? analysis.template_structure : {};
            const labels = Array.isArray(result.template_labels) ? result.template_labels : (
                Array.isArray(analysis.labels) ? analysis.labels : []
            );
            const structureLabels = Array.isArray(structure.labels) ? structure.labels : [];
            const sections = Array.isArray(result.layout_sections) ? result.layout_sections : [];
            const savedConfiguration = result.template_configuration && typeof result.template_configuration === "object"
                ? result.template_configuration
                : {};
            const config = { labels, structureLabels, sections, analysis, savedConfiguration };
            configByMappingId[mappingId] = config;
            return config;
        }

        async function loadMappings(preferredId = "") {
            setStatus("正在加载映射...", "info");
            const result = await fetchJson("/api/v4/template-profiles");
            mappings = Array.isArray(result.profiles) ? result.profiles : [];

            if (preferredId && mappings.some((item) => getMappingId(item) === preferredId)) {
                selectedMappingId = preferredId;
            } else if (!selectedMappingId || !mappings.some((item) => getMappingId(item) === selectedMappingId)) {
                selectedMappingId = getMappingId(mappings[0]) || "";
            }

            setSelectOptions();
            if (selectedMappingId) {
                await selectMapping(selectedMappingId, false);
                setStatus(`已加载 ${mappings.length} 个映射。`, "success");
            } else {
                setStatus("暂无映射，请先新建映射。", "warning");
            }
        }

        async function selectMapping(mappingId, showLoading = true) {
            selectedMappingId = mappingId || "";
            document.getElementById("mappingSelect").value = selectedMappingId;
            if (!selectedMappingId) {
                selectedMapping = null;
                updateCurrentState();
                renderConfig();
                return;
            }

            if (showLoading) setStatus("正在切换映射...", "info");
            const body = {};
            body[profileKey()] = selectedMappingId;
            const result = await fetchJson("/api/v4/set-current-template-profile", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });

            selectedMapping = result.profile || await loadMappingDetail(selectedMappingId);
            mappings = mappings.map((item) => getMappingId(item) === selectedMappingId ? selectedMapping : item);
            await loadMappingConfiguration(selectedMappingId);
            updateCurrentState();
            renderConfig();
            if (showLoading) setStatus("已切换映射。", "success");
        }

        async function createMapping() {
            const input = document.getElementById("newMappingNameInput");
            const profileName = input.value.trim();
            if (!profileName) {
                setStatus("请填写新建映射名称。", "warning");
                input.focus();
                return;
            }

            setStatus("正在新建映射...", "info");
            const result = await fetchJson("/api/v4/template-profiles/create-empty", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ profile_name: profileName }),
            });

            input.value = "";
            const newId = getMappingId(result.profile);
            configByMappingId[newId] = { labels: [], structureLabels: [], sections: [], analysis: {}, savedConfiguration: {} };
            await loadMappings(newId);
            setStatus("映射已创建。", "success");
        }

        async function uploadTemplateFile() {
            if (!selectedMappingId) {
                setStatus("请先选择映射。", "warning");
                return;
            }
            const input = document.getElementById("templateFileInput");
            const file = input.files && input.files[0];
            if (!file) {
                setStatus("请选择要上传的模板文件。", "warning");
                return;
            }

            setStatus("正在上传并分析模板文件...", "info");
            setInlineStatus("上传中...");
            const formData = new FormData();
            formData.append("template_file", file);
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(selectedMappingId)}/replace-template-file`, {
                method: "POST",
                body: formData,
            });

            input.value = "";
            selectedMapping = result.profile || selectedMapping;
            mappings = mappings.map((item) => getMappingId(item) === selectedMappingId ? selectedMapping : item);
            await loadMappingConfiguration(selectedMappingId);
            updateCurrentState();
            renderConfig();
            setInlineStatus("模板文件已上传。");
            setStatus("模板文件已上传并完成分析。", "success");
        }

        async function deleteTemplateFile() {
            if (!selectedMappingId) {
                setStatus("请先选择映射。", "warning");
                return;
            }
            if (!confirm("确定删除当前模板文件吗？映射会保留。")) return;

            setStatus("正在删除模板文件...", "info");
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(selectedMappingId)}/delete-template-file`, {
                method: "POST",
            });

            selectedMapping = result.profile || await loadMappingDetail(selectedMappingId);
            mappings = mappings.map((item) => getMappingId(item) === selectedMappingId ? selectedMapping : item);
            configByMappingId[selectedMappingId] = { labels: [], structureLabels: [], sections: [], analysis: {}, savedConfiguration: {} };
            updateCurrentState();
            renderConfig();
            setInlineStatus("模板文件已删除。");
            setStatus("模板文件已删除。", "success");
        }

        async function deleteMapping() {
            if (!selectedMappingId) {
                setStatus("请先选择映射。", "warning");
                return;
            }
            const name = selectedMapping ? getMappingName(selectedMapping) : "当前映射";
            if (!confirm(`确定删除“${name}”吗？对应模板文件也会一并删除。`)) return;

            setStatus("正在删除映射...", "info");
            await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(selectedMappingId)}/delete`, {
                method: "POST",
            });
            delete configByMappingId[selectedMappingId];
            selectedMappingId = "";
            selectedMapping = null;
            await loadMappings();
            setInlineStatus("映射已删除。");
            setStatus("映射已删除。", "success");
        }

        function normalizeCell(value) {
            return String(value || "").trim().toUpperCase();
        }

        function readCell(item) {
            return item?.cell || item?.display_cell || item?.target_cell || item?.address || item?.range || "";
        }

        function readText(item) {
            return item?.field_name || item?.label || item?.text || item?.raw_text || item?.name || item?.value || "";
        }

        function readType(item) {
            return item?.type || item?.field_type || item?.label_type || item?.kind || "";
        }

        function readSectionName(section) {
            return section?.title || section?.section_name || section?.name || section?.source_region_name || section?.section_key || "";
        }

        function cellToPoint(cell) {
            const match = String(cell || "").trim().match(/^([A-Z]+)(\d+)$/i);
            if (!match) return null;
            const letters = match[1].toUpperCase();
            let col = 0;
            for (const char of letters) {
                col = col * 26 + char.charCodeAt(0) - 64;
            }
            return { row: Number(match[2]), col };
        }

        function sectionContainsCell(section, cell) {
            const point = cellToPoint(cell);
            const bounds = section?.bounds || {};
            const startRow = Number(bounds.start_row);
            const endRow = Number(bounds.end_row);
            const startCol = Number(bounds.start_col);
            const endCol = Number(bounds.end_col);
            if (!point || !startRow || !endRow || !startCol || !endCol) return false;
            return point.row >= startRow && point.row <= endRow && point.col >= startCol && point.col <= endCol;
        }

        function findSectionForCell(sections, cell) {
            const match = sections.find((section) => sectionContainsCell(section, cell));
            return match ? readSectionName(match) : "";
        }

        function mergeLabelSources(labels, structureLabels) {
            const byCell = new Map();
            structureLabels.forEach((item) => {
                const cell = readCell(item);
                if (cell) byCell.set(normalizeCell(cell), { ...item });
            });
            labels.forEach((item) => {
                const cell = readCell(item);
                if (!cell) return;
                const key = normalizeCell(cell);
                byCell.set(key, { ...(byCell.get(key) || {}), ...item });
            });
            return Array.from(byCell.values());
        }

        function collectSectionCells(section) {
            const values = [];
            const pools = [section?.cells, section?.items, section?.labels, section?.fields];
            pools.forEach((pool) => {
                if (!Array.isArray(pool)) return;
                pool.forEach((item) => {
                    if (typeof item === "string") values.push(item);
                    else values.push(readCell(item));
                });
            });
            return values.map(normalizeCell).filter(Boolean);
        }

        function buildSectionLookup(sections) {
            const lookup = {};
            sections.forEach((section) => {
                const name = readSectionName(section);
                collectSectionCells(section).forEach((cell) => {
                    if (!lookup[cell]) lookup[cell] = name;
                });
            });
            return lookup;
        }

        function rowsFromSections(sections) {
            const rows = [];
            sections.forEach((section) => {
                const sectionName = readSectionName(section);
                const pools = [section?.cells, section?.items, section?.labels, section?.fields];
                pools.forEach((pool) => {
                    if (!Array.isArray(pool)) return;
                    pool.forEach((item) => {
                        if (typeof item === "string") {
                            rows.push({ cell: item, text: "", section: sectionName, type: "" });
                        } else {
                            rows.push({
                                cell: readCell(item),
                                text: readText(item),
                                section: item?.section || item?.section_name || sectionName,
                                type: readType(item),
                            });
                        }
                    });
                });
                if (!rows.some((row) => row.section === sectionName)) {
                    rows.push({
                        cell: "",
                        text: section?.source_region_name || "",
                        section: sectionName,
                        type: section?.section_type || section?.semantic_type || "",
                    });
                }
            });
            return rows;
        }

        function buildConfigRows(labels, structureLabels, sections) {
            const sectionLookup = buildSectionLookup(sections);
            const mergedLabels = mergeLabelSources(labels, structureLabels);
            const labelRows = mergedLabels.map((item) => {
                const cell = readCell(item);
                return {
                    cell,
                    text: readText(item),
                    section: item?.section || item?.section_name || sectionLookup[normalizeCell(cell)] || findSectionForCell(sections, cell),
                    type: readType(item),
                };
            }).filter((row) => row.cell || row.text);

            const rows = labelRows.length ? labelRows : rowsFromSections(sections);
            const seen = new Set();
            return rows.filter((row) => {
                const key = `${normalizeCell(row.cell)}|${row.text}|${row.section}|${row.type}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return row.cell || row.text;
            });
        }

        function applySavedConfiguration(rows, savedConfiguration) {
            const saved = savedConfiguration && typeof savedConfiguration === "object" ? savedConfiguration : {};
            let naturalOrder = 0;
            return rows.map((row) => {
                naturalOrder += 1;
                const key = normalizeCell(row.cell);
                const item = key ? saved[key] || {} : {};
                const savedOrder = Number(item.display_order);
                return {
                    ...row,
                    configLabel: typeof item.label === "string" && item.label.trim() ? item.label : row.text,
                    showInWorkspace: typeof item.show_in_workspace === "boolean" ? item.show_in_workspace : true,
                    displayOrder: Number.isFinite(savedOrder) && savedOrder > 0 ? savedOrder : naturalOrder,
                };
            });
        }

        function collectEditableConfiguration() {
            return Array.from(document.querySelectorAll("#templateConfigArea tbody tr[data-cell]")).map((row) => {
                const cell = row.dataset.cell || "";
                const labelInput = row.querySelector("input[data-config-field='label']");
                const showInput = row.querySelector("input[data-config-field='show']");
                const orderInput = row.querySelector("input[data-config-field='order']");
                return {
                    cell,
                    label: labelInput ? labelInput.value.trim() : "",
                    show_in_workspace: showInput ? showInput.checked : true,
                    display_order: orderInput ? Number(orderInput.value || 0) : 0,
                };
            }).filter((item) => item.cell);
        }

        async function saveTemplateConfiguration() {
            if (!selectedMappingId) {
                setStatus("请先选择映射。", "warning");
                return;
            }
            const items = collectEditableConfiguration();
            if (!items.length) {
                setStatus("当前没有可保存的模板配置。", "warning");
                return;
            }

            setStatus("正在保存模板配置...", "info");
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(selectedMappingId)}/configuration`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ items }),
            });
            const cached = configByMappingId[selectedMappingId] || {};
            configByMappingId[selectedMappingId] = {
                ...cached,
                savedConfiguration: result.template_configuration || {},
            };
            if (result.profile) {
                selectedMapping = result.profile;
                mappings = mappings.map((item) => getMappingId(item) === selectedMappingId ? selectedMapping : item);
            }
            setStatus("模板配置已保存。", "success");
        }

        function renderConfig() {
            const area = document.getElementById("templateConfigArea");
            const cached = selectedMappingId ? configByMappingId[selectedMappingId] : null;
            const labels = Array.isArray(cached?.labels) ? cached.labels : (
                Array.isArray(selectedMapping?.template_labels) ? selectedMapping.template_labels : []
            );
            const structureLabels = Array.isArray(cached?.structureLabels) ? cached.structureLabels : [];
            const sections = Array.isArray(cached?.sections) ? cached.sections : (
                Array.isArray(selectedMapping?.layout_sections) ? selectedMapping.layout_sections : []
            );
            const rows = applySavedConfiguration(
                buildConfigRows(labels, structureLabels, sections),
                cached?.savedConfiguration
            );

            if (!rows.length) {
                area.className = "config-empty";
                area.textContent = "当前映射尚未生成模板配置。上传模板后，系统会分析模板结构，并在这里显示可填写单元格。";
                return;
            }

            area.className = "";
            area.innerHTML = `
                <div class="config-actions">
                    <button type="button" onclick="saveTemplateConfiguration()">保存配置</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>单元格</th>
                            <th>字段名/识别文本</th>
                            <th>区域</th>
                            <th>类型</th>
                            <th>字段名称</th>
                            <th>工作页显示</th>
                            <th>顺序</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows.map((row) => `
                            <tr ${row.cell ? `data-cell="${escapeHtml(normalizeCell(row.cell))}"` : ""}>
                                <td>${escapeHtml(row.cell || "-")}</td>
                                <td>${escapeHtml(row.text || "-")}</td>
                                <td>${escapeHtml(row.section || "-")}</td>
                                <td>${escapeHtml(row.type || "-")}</td>
                                <td>
                                    <input class="field-input" data-config-field="label" type="text" value="${escapeHtml(row.configLabel || "")}" ${row.cell ? "" : "disabled"}>
                                </td>
                                <td>
                                    <input class="show-checkbox" data-config-field="show" type="checkbox" ${row.showInWorkspace ? "checked" : ""} ${row.cell ? "" : "disabled"}>
                                </td>
                                <td>
                                    <input class="order-input" data-config-field="order" type="number" min="1" value="${escapeHtml(row.displayOrder || 1)}" ${row.cell ? "" : "disabled"}>
                                </td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadMappings().catch((error) => {
                setStatus(error.message || "映射加载失败", "error");
                updateCurrentState();
                renderConfig();
            });
        });

        window.addEventListener("unhandledrejection", (event) => {
            setInlineStatus("");
            setStatus(event.reason?.message || "操作失败", "error");
        });
    </script>
</body>
</html>
