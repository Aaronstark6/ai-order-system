<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板映射管理</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f5f6f8;
            color: #222;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            padding: 24px;
        }
        .page {
            margin: 0 auto;
            max-width: min(1680px, calc(100vw - 48px));
            width: 100%;
        }
        .header {
            align-items: center;
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
        }
        h1 { flex: 1 1 auto; font-size: 28px; margin: 0; }
        h2 { font-size: 20px; margin: 0 0 14px; }
        h3 { color: #333; font-size: 16px; margin: 18px 0 10px; }
        a { color: #1677ff; text-decoration: none; white-space: nowrap; }
        a:hover { text-decoration: underline; }
        .panel {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(16,24,40,0.08);
            margin-bottom: 16px;
            padding: 20px;
        }
        .status {
            border-radius: 6px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            min-height: 22px;
            padding: 10px 12px;
        }
        .status.info { background: #f2f6ff; color: #315c9c; }
        .status.success { background: #e9f8ef; color: #16713b; }
        .status.warning { background: #fff7db; color: #8a6100; }
        .status.error { background: #ffe9e7; color: #b42318; }
        .row {
            align-items: end;
            display: grid;
            gap: 12px;
            grid-template-columns: minmax(240px, 1fr) minmax(280px, 1fr) auto;
            margin-top: 12px;
        }
        .file-row {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .mapping-status-inline {
            align-items: center;
            background: #fafbfd;
            border: 1px solid #e6eaf0;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 14px 18px;
        }
        input, select {
            border: 1px solid #cfd6e0;
            border-radius: 6px;
            color: #222;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 14px;
            min-height: 40px;
            padding: 9px 10px;
            width: 100%;
        }
        input[type="file"] { max-width: 420px; width: auto; }
        button {
            background: #1677ff;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            min-height: 40px;
            padding: 9px 16px;
            white-space: nowrap;
        }
        button.danger { background: #d92d20; }
        button.danger.fixed-danger {
            min-width: 138px;
        }
        button:disabled { cursor: not-allowed; opacity: 0.55; }
        button.small {
            color: #fff;
            min-height: 32px;
            padding: 5px 12px;
            font-size: 13px;
        }
        .small { color: #667085; font-size: 13px; line-height: 1.5; }
        .config-empty {
            background: #fafbfd;
            border: 1px dashed #d8dee8;
            border-radius: 8px;
            color: #667085;
            line-height: 1.6;
            padding: 18px;
        }
        .config-actions {
            align-items: center;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 16px;
        }
        .config-section {
            border: 1px solid #e6eaf0;
            border-radius: 8px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .config-section-header {
            align-items: center;
            background: #fafbfd;
            cursor: pointer;
            display: flex;
            gap: 16px;
            padding: 14px 16px;
            user-select: none;
        }
        .config-section-header:hover { background: #f0f3f7; }
        .config-section-header .toggle-icon {
            font-size: 12px;
            transition: transform 0.2s;
        }
        .config-section-header.collapsed .toggle-icon { transform: rotate(-90deg); }
        .config-section-title {
            color: #1d2939;
            font-size: 15px;
            font-weight: 700;
            flex: 1;
        }
        .config-section-count {
            color: #667085;
            font-size: 13px;
        }
        .config-section-body { display: block; }
        .config-section-body.collapsed { display: none; }
        .config-table {
            border-collapse: collapse;
            width: 100%;
        }
        .config-table th, .config-table td {
            border-bottom: 1px solid #edf0f4;
            font-size: 13px;
            padding: 10px 12px;
            text-align: left;
            vertical-align: middle;
        }
        .config-table th {
            background: #fafbfd;
            color: #475467;
            font-weight: 700;
            white-space: nowrap;
        }
        .config-table td { color: #333; }
        .config-table .cell-col { min-width: 70px; }
        .config-table .field-col { min-width: 140px; }
        .config-table .key-col { min-width: 130px; }
        .config-table .show-col { min-width: 80px; text-align: center; }
        .config-table .action-col { min-width: 60px; text-align: center; }
        .field-input, .candidate-input { min-width: 120px; }
        .show-checkbox { min-height: auto; width: auto; }
        .debug-details {
            background: #fafbfd;
            border-top: 1px solid #edf0f4;
            padding: 12px 16px;
        }
        .debug-details summary {
            color: #667085;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .debug-details summary:hover { color: #333; }
        .debug-grid {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }
        .debug-item {
            background: #fff;
            border: 1px solid #e6eaf0;
            border-radius: 4px;
            padding: 8px 10px;
        }
        .debug-label { color: #667085; font-size: 11px; margin-bottom: 2px; }
        .debug-value { color: #1d2939; font-size: 12px; word-break: break-all; }
        .visual-workbench {
            border: 1px solid #e6eaf0;
            border-radius: 8px;
            margin-bottom: 18px;
            overflow: hidden;
        }
        .visual-workbench-title {
            background: #fafbfd;
            border-bottom: 1px solid #e6eaf0;
            color: #1d2939;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 14px;
        }
        .visual-workbench-hint {
            background: #fffbe6;
            border-bottom: 1px solid #ffe58f;
            color: #d48806;
            font-size: 13px;
            padding: 10px 14px;
        }
        .visual-workbench-body {
            display: grid;
            gap: 24px;
            grid-template-columns: minmax(0, 1fr) 360px;
            align-items: start;
            padding: 14px;
        }
        .visual-grid-wrap {
            border: 1px solid #e6eaf0;
            border-radius: 6px;
            min-height: 760px;
            max-height: none;
            overflow: auto;
        }
        .visual-grid {
            border-collapse: collapse;
            font-size: 12px;
            min-width: 100%;
        }
        .visual-grid th,
        .visual-grid td {
            border: 1px solid #edf0f4;
            height: 28px;
            max-width: 160px;
            min-width: 70px;
            padding: 4px 6px;
            vertical-align: middle;
            white-space: nowrap;
        }
        .visual-grid th {
            background: #f2f4f7;
            color: #667085;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .visual-grid .corner-cell,
        .visual-grid .row-head {
            background: #f2f4f7;
            color: #667085;
            left: 0;
            min-width: 42px;
            position: sticky;
            text-align: center;
            z-index: 2;
        }
        .visual-cell {
            background: #fff;
            color: #1d2939;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .visual-cell.has-text { border-color: #b8c4d4; font-weight: 600; }
        .visual-cell.has-v4 { box-shadow: inset 0 -2px 0 #1677ff; }
        .visual-cell.selected {
            background: #e6f7ff;
            border: 2px solid #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2), 0 4px 12px rgba(24, 144, 255, 0.3);
            outline: none;
        }
        .visual-cell.merged-cell { background-clip: padding-box; }
        .visual-detail {
            background: #fafbfd;
            border: 1px solid #e6eaf0;
            border-radius: 6px;
            padding: 12px;
        }
        .visual-detail-row {
            border-bottom: 1px solid #edf0f4;
            padding: 7px 0;
        }
        .visual-detail-row:last-child { border-bottom: none; }
        .visual-detail-label { color: #667085; font-size: 12px; }
        .visual-detail-value { color: #1d2939; font-size: 13px; margin-top: 2px; word-break: break-all; }
        @media (max-width: 860px) {
            body { padding: 16px; }
            .page { max-width: 100%; }
            .header { align-items: flex-start; flex-direction: column; gap: 8px; }
            .row { grid-template-columns: 1fr; }
            input[type="file"] { width: 100%; }
            button { width: 100%; }
            .config-section-header { flex-wrap: wrap; }
            .debug-grid { grid-template-columns: 1fr; }
            .visual-workbench-body { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>模板映射管理</h1>
            <a href="/">返回首页</a>
            <a href="/v4-order-workspace">订单工作台</a>
            <a href="/v4-core-pipeline">V4结构模型</a>
        </header>

        <section class="panel">
            <h2>映射与模板管理</h2>
            <div id="settingsStatus" class="status info" style="display:none;"></div>

            <h3>映射选择</h3>
            <div class="row">
                <div>
                    <select id="mappingSelect" onchange="selectMapping(this.value)"></select>
                </div>
                <div>
                    <input id="newMappingNameInput" type="text" placeholder="新建映射名称，例如：固体饮料">
                </div>
                <button type="button" onclick="createMapping()">新建映射</button>
            </div>

            <div class="mapping-status-inline">
                <div>
                    <span style="color: #667085; font-size: 13px;">当前映射：</span>
                    <span id="currentMappingName" style="color: #1d2939; font-size: 16px; font-weight: 700;">未选择</span>
                </div>
                <div>
                    <span style="color: #667085; font-size: 13px;">模板文件：</span>
                    <span id="currentTemplateFile" style="color: #1d2939; font-size: 16px; font-weight: 700;">未上传</span>
                </div>
            </div>

            <h3>模板文件操作</h3>
            <div class="file-row">
                <input id="templateFileInput" type="file" accept=".xlsx,.xlsm,.xltx,.xltm" onchange="uploadTemplateFile()">
                <button type="button" class="danger fixed-danger" onclick="deleteTemplateFile()">删除当前模板文件</button>
                <button type="button" class="danger fixed-danger" onclick="deleteMapping()">删除当前映射</button>
                <span id="fileActionStatus" class="small"></span>
            </div>
        </section>

        <section class="panel">
            <h2>模板配置</h2>
            <div id="visualWorkbench" class="visual-workbench">
                <div class="visual-workbench-title">可视化模板配置</div>
                <div class="visual-workbench-hint">提示：点击左侧模板单元格，查看 V4 对模板结构的理解与推荐配置。</div>
                <div class="visual-workbench-body">
                    <div id="visualGridArea" class="config-empty">当前映射尚未绑定模板文件。</div>
                    <div id="visualCellDetail" class="visual-detail">
                        <div class="small">点击左侧模板单元格查看 V4 判断。</div>
                    </div>
                </div>
            </div>
            <div id="templateConfigArea" class="config-empty">
                当前映射尚未生成模板配置。上传模板后，系统会分析模板结构，并在这里显示可填写单元格。
            </div>
        </section>
    </main>

    <script>
        let mappings = [];
        let selectedMappingId = "";
        let selectedMapping = null;
        let configByMappingId = {};
        let visualGridByMappingId = {};
        let selectedVisualCell = "";

        function profileKey() { return "profile" + "_id"; }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        function setStatus(text, type = "info") {
            const element = document.getElementById("settingsStatus");
            if (!element) return;
            element.textContent = text || "";
            element.className = `status ${type}`;
            element.style.display = type === "error" || type === "warning" ? "block" : "none";
        }

        function setInlineStatus(text) {
            document.getElementById("fileActionStatus").textContent = text || "";
        }

        function getMappingId(mapping) { return mapping?.[profileKey()] || ""; }
        function getMappingName(mapping) { return mapping?.profile_name || mapping?.template_name || "未命名映射"; }
        function getTemplateFilename(mapping) { return mapping?.template_filename || ""; }

        function updateCurrentState() {
            document.getElementById("currentMappingName").textContent = selectedMapping ? getMappingName(selectedMapping) : "未选择";
            document.getElementById("currentTemplateFile").textContent = getTemplateFilename(selectedMapping) || "未上传";
        }

        function setSelectOptions() {
            const select = document.getElementById("mappingSelect");
            if (!mappings.length) {
                select.innerHTML = '<option value="">暂无映射</option>';
                selectedMappingId = "";
                selectedMapping = null;
                updateCurrentState();
                selectedVisualCell = "";
                renderVisualWorkbench();
                renderConfig();
                return;
            }
            select.innerHTML = mappings.map((mapping) => {
                const id = getMappingId(mapping);
                const name = getMappingName(mapping);
                return `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`;
            }).join("");
            select.value = selectedMappingId;
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, options);
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) {
                throw new Error(result.error || "操作失败");
            }
            return result;
        }

        async function loadMappingDetail(mappingId) {
            if (!mappingId) return null;
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(mappingId)}`);
            return result.profile || null;
        }

        async function loadMappingConfiguration(mappingId) {
            if (!mappingId) return { labels: [], structureLabels: [], sections: [], analysis: {}, candidates: [], savedConfiguration: {}, savedSectionConfiguration: {} };
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(mappingId)}/configuration`);
            const analysis = result.template_analysis && typeof result.template_analysis === "object" ? result.template_analysis : {};
            const structure = analysis.template_structure && typeof analysis.template_structure === "object" ? analysis.template_structure : {};
            const labels = Array.isArray(result.template_labels) ? result.template_labels : (Array.isArray(analysis.labels) ? analysis.labels : []);
            const structureLabels = Array.isArray(structure.labels) ? structure.labels : [];
            const sections = Array.isArray(result.layout_sections) ? result.layout_sections : [];
            const savedConfiguration = result.template_configuration && typeof result.template_configuration === "object" ? result.template_configuration : {};
            const savedSectionConfiguration = result.section_configuration && typeof result.section_configuration === "object" ? result.section_configuration : {};
            const candidates = Array.isArray(result.mapping_candidates) ? result.mapping_candidates : [];
            const config = { labels, structureLabels, sections, analysis, candidates, savedConfiguration, savedSectionConfiguration };
            configByMappingId[mappingId] = config;
            return config;
        }

        async function loadVisualGrid(mappingId) {
            selectedVisualCell = "";
            if (!mappingId) {
                visualGridByMappingId[mappingId || ""] = { rows: 0, cols: 0, cells: [], merges: [], message: "当前映射尚未绑定模板文件。" };
                renderVisualWorkbench();
                return null;
            }
            try {
                const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(mappingId)}/visual-grid`);
                const visualGrid = result.visual_grid || { rows: 0, cols: 0, cells: [], merges: [] };
                visualGridByMappingId[mappingId] = { ...visualGrid, message: "" };
                renderVisualWorkbench();
                return visualGrid;
            } catch (error) {
                visualGridByMappingId[mappingId] = { rows: 0, cols: 0, cells: [], merges: [], message: error.message || "当前映射尚未绑定模板文件。" };
                renderVisualWorkbench();
                return null;
            }
        }

        async function loadMappings(preferredId = "") {
            setStatus("正在加载映射...", "info");
            const result = await fetchJson("/api/v4/template-profiles");
            mappings = Array.isArray(result.profiles) ? result.profiles : [];
            if (preferredId && mappings.some((item) => getMappingId(item) === preferredId)) {
                selectedMappingId = preferredId;
            } else if (!selectedMappingId || !mappings.some((item) => getMappingId(item) === selectedMappingId)) {
                selectedMappingId = getMappingId(mappings[0]) || "";
            }
            setSelectOptions();
            if (selectedMappingId) {
                await selectMapping(selectedMappingId, false);
                setStatus(`已加载 ${mappings.length} 个映射。`, "success");
            } else {
                setStatus("暂无映射，请先新建映射。", "warning");
            }
        }

        async function selectMapping(mappingId, showLoading = true) {
            selectedMappingId = mappingId || "";
            document.getElementById("mappingSelect").value = selectedMappingId;
            if (!selectedMappingId) {
                selectedMapping = null;
                updateCurrentState();
                selectedVisualCell = "";
                renderVisualWorkbench();
                renderConfig();
                return;
            }
            if (showLoading) setStatus("正在切换映射...", "info");
            const body = {};
            body[profileKey()] = selectedMappingId;
            const result = await fetchJson("/api/v4/set-current-template-profile", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            selectedMapping = result.profile || await loadMappingDetail(selectedMappingId);
            mappings = mappings.map((item) => getMappingId(item) === selectedMappingId ? selectedMapping : item);
            await loadMappingConfiguration(selectedMappingId);
            await loadVisualGrid(selectedMappingId);
            updateCurrentState();
            renderConfig();
            if (showLoading) setStatus("已切换映射。", "success");
        }

        async function createMapping() {
            const input = document.getElementById("newMappingNameInput");
            const profileName = input.value.trim();
            if (!profileName) {
                setStatus("请填写新建映射名称。", "warning");
                input.focus();
                return;
            }
            setStatus("正在新建映射...", "info");
            const result = await fetchJson("/api/v4/template-profiles/create-empty", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ profile_name: profileName }),
            });
            input.value = "";
            const newId = getMappingId(result.profile);
            configByMappingId[newId] = { labels: [], structureLabels: [], sections: [], analysis: {}, candidates: [], savedConfiguration: {}, savedSectionConfiguration: {} };
            visualGridByMappingId[newId] = { rows: 0, cols: 0, cells: [], merges: [], message: "当前映射尚未绑定模板文件。" };
            await loadMappings(newId);
            setStatus("映射已创建。", "success");
        }

        async function uploadTemplateFile() {
            if (!selectedMappingId) { setStatus("请先选择映射。", "warning"); return; }
            const input = document.getElementById("templateFileInput");
            const file = input.files && input.files[0];
            if (!file) { setStatus("请选择要上传的模板文件。", "warning"); return; }
            setStatus("正在上传并分析模板文件...", "info");
            setInlineStatus("上传中...");
            const formData = new FormData();
            formData.append("template_file", file);
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(selectedMappingId)}/replace-template-file`, {
                method: "POST",
                body: formData,
            });
            input.value = "";
            selectedMapping = result.profile || selectedMapping;
            mappings = mappings.map((item) => getMappingId(item) === selectedMappingId ? selectedMapping : item);
            await loadMappingConfiguration(selectedMappingId);
            await loadVisualGrid(selectedMappingId);
            updateCurrentState();
            renderConfig();
            setInlineStatus("模板文件已上传。");
            setStatus("模板文件已上传并完成分析。", "success");
        }

        async function deleteTemplateFile() {
            if (!selectedMappingId) { setStatus("请先选择映射。", "warning"); return; }
            if (!confirm("确定删除当前模板文件吗？映射会保留。")) return;
            setStatus("正在删除模板文件...", "info");
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(selectedMappingId)}/delete-template-file`, { method: "POST" });
            selectedMapping = result.profile || await loadMappingDetail(selectedMappingId);
            mappings = mappings.map((item) => getMappingId(item) === selectedMappingId ? selectedMapping : item);
            configByMappingId[selectedMappingId] = { labels: [], structureLabels: [], sections: [], analysis: {}, candidates: [], savedConfiguration: {}, savedSectionConfiguration: {} };
            visualGridByMappingId[selectedMappingId] = { rows: 0, cols: 0, cells: [], merges: [], message: "当前映射尚未绑定模板文件。" };
            selectedVisualCell = "";
            updateCurrentState();
            renderVisualWorkbench();
            renderConfig();
            setInlineStatus("模板文件已删除。");
            setStatus("模板文件已删除。", "success");
        }

        async function deleteMapping() {
            if (!selectedMappingId) { setStatus("请先选择映射。", "warning"); return; }
            const name = selectedMapping ? getMappingName(selectedMapping) : "当前映射";
            if (!confirm(`确定删除"${name}"吗？对应模板文件也会一并删除。`)) return;
            setStatus("正在删除映射...", "info");
            await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(selectedMappingId)}/delete`, { method: "POST" });
            delete configByMappingId[selectedMappingId];
            delete visualGridByMappingId[selectedMappingId];
            selectedMappingId = "";
            selectedMapping = null;
            await loadMappings();
            setInlineStatus("映射已删除。");
            setStatus("映射已删除。", "success");
        }

        function normalizeCell(value) { return String(value || "").trim().toUpperCase(); }
        function readCell(item) { return item?.cell || item?.display_cell || item?.target_cell || item?.address || item?.range || ""; }
        function readText(item) { return item?.field_name || item?.label || item?.text || item?.raw_text || item?.name || item?.value || ""; }
        function readType(item) { return item?.type || item?.field_type || item?.label_type || item?.kind || ""; }
        function readSectionName(section) { return section?.title || section?.section_name || section?.name || section?.source_region_name || section?.section_key || ""; }
        function readSectionKey(section) { return section?.section_key || section?.semantic_type || section?.key || section?.title || section?.source_region_name || "other"; }

        function cellToPoint(cell) {
            const match = String(cell || "").trim().match(/^([A-Z]+)(\d+)$/i);
            if (!match) return null;
            const letters = match[1].toUpperCase();
            let col = 0;
            for (const char of letters) { col = col * 26 + char.charCodeAt(0) - 64; }
            return { row: Number(match[2]), col };
        }

        function columnName(index) {
            let value = Number(index || 0);
            let letters = "";
            while (value > 0) {
                const remainder = (value - 1) % 26;
                letters = String.fromCharCode(65 + remainder) + letters;
                value = Math.floor((value - 1) / 26);
            }
            return letters || "";
        }

        function visualCellStyle(cell) {
            const styles = [];
            if (cell.font_bold) styles.push("font-weight:700");
            if (cell.align) styles.push(`text-align:${escapeHtml(cell.align)}`);
            const color = String(cell.fill_color || "");
            if (/^[A-Fa-f0-9]{8}$/.test(color) && color !== "00000000") {
                styles.push(`background-color:#${color.slice(2)}`);
            } else if (/^[A-Fa-f0-9]{6}$/.test(color)) {
                styles.push(`background-color:#${color}`);
            }
            return styles.join(";");
        }

        function getCurrentVisualGrid() {
            return selectedMappingId ? visualGridByMappingId[selectedMappingId] : null;
        }

        function findVisualCell(cellRef) {
            const grid = getCurrentVisualGrid();
            const cells = Array.isArray(grid?.cells) ? grid.cells : [];
            return cells.find((cell) => cell.cell === cellRef) || null;
        }

        function parseCellRange(rangeText) {
            const parts = String(rangeText || "").split(":");
            if (parts.length !== 2) return null;
            const start = cellToPoint(parts[0]);
            const end = cellToPoint(parts[1]);
            if (!start || !end) return null;
            return {
                startCell: normalizeCell(parts[0]),
                startRow: Math.min(start.row, end.row),
                startCol: Math.min(start.col, end.col),
                endRow: Math.max(start.row, end.row),
                endCol: Math.max(start.col, end.col),
            };
        }

        function buildMergeLookup(grid) {
            const skip = new Set();
            const start = {};
            const merges = Array.isArray(grid?.merges) ? grid.merges : [];
            const cells = Array.isArray(grid?.cells) ? grid.cells : [];

            function addMerge(range) {
                if (!range) return;
                const startCell = normalizeCell(range.start_cell || range.startCell || columnName(range.start_col || range.startCol) + (range.start_row || range.startRow || ""));
                const startRow = Number(range.start_row || range.startRow || 0);
                const startCol = Number(range.start_col || range.startCol || 0);
                const endRow = Number(range.end_row || range.endRow || 0);
                const endCol = Number(range.end_col || range.endCol || 0);
                if (!startCell || !startRow || !startCol || !endRow || !endCol) return;
                const rowspan = Math.max(1, endRow - startRow + 1);
                const colspan = Math.max(1, endCol - startCol + 1);
                if (rowspan <= 1 && colspan <= 1) return;
                start[startCell] = { rowspan, colspan };
                for (let row = startRow; row <= endRow; row += 1) {
                    for (let col = startCol; col <= endCol; col += 1) {
                        const cellRef = `${columnName(col)}${row}`;
                        if (cellRef !== startCell) skip.add(cellRef);
                    }
                }
            }

            merges.forEach((merge) => addMerge(merge));
            cells.forEach((cell) => {
                if (!cell?.is_merged || !cell?.merged_range) return;
                const parsed = parseCellRange(cell.merged_range);
                if (parsed) {
                    addMerge({
                        start_cell: parsed.startCell,
                        start_row: parsed.startRow,
                        start_col: parsed.startCol,
                        end_row: parsed.endRow,
                        end_col: parsed.endCol,
                    });
                }
            });

            return { skip, start };
        }

        const INTENT_LABELS = {
            "title": "标题",
            "section_header": "分组标题",
            "label_fill_right": "标签右侧填写",
            "label_fill_below": "标签下方填写",
            "inline_fill_after_colon": "冒号后直接填写",
            "option_checkbox": "勾选项",
            "option_text_choice": "文本选项",
            "table_column_header": "表格列标题",
            "table_row_field": "表格字段",
            "note_instruction": "说明备注",
            "image_area": "图片区域",
            "attachment_hint": "附件区域",
            "readonly_example": "示例文本",
            "unknown": "未知"
        };

        const WRITE_MODE_LABELS = {
            "none": "无",
            "write_right_cell": "写入右侧单元格",
            "write_below_cell": "写入下方单元格",
            "append_after_colon": "冒号后追加",
            "check_option": "勾选选项",

        function renderVisualDetail(cell) {
            const area = document.getElementById("visualCellDetail");
            if (!area) return;
            if (!cell) {
                area.innerHTML = '<div class="small">点击左侧模板单元格查看 V4 判断。</div>';
                return;
            }
            const fields = [
                ["单元格", cell.cell],
                ["识别文本", cell.display_value || cell.value || "-"],
                ["V4推荐字段", cell.candidate_field_key || "-"],
                ["候选字段名", cell.candidate_field_label || "-"],
                ["匹配可信度", cell.candidate_confidence ? Number(cell.candidate_confidence).toFixed(2) : "-"],
                ["推荐原因", cell.candidate_reason || "-"],
                ["填写意图", INTENT_LABELS[cell.intent_type] || cell.intent_type || "-"],
                ["写入策略", WRITE_MODE_LABELS[cell.write_mode] || cell.write_mode || "-"],
                ["目标写入单元格", cell.target_cell || "-"],
                ["选项值", cell.option_value || "-"],
                ["意图可信度", cell.intent_confidence ? Number(cell.intent_confidence).toFixed(2) : "-"],
                ["意图判断原因", cell.intent_reason || "-"],
            ];
            area.innerHTML = fields.map(([label, value]) => `
                <div class="visual-detail-row">
                    <div class="visual-detail-label">${escapeHtml(label)}</div>
                    <div class="visual-detail-value">${escapeHtml(value)}</div>
                </div>
            `).join("");
        }

        function selectVisualCell(cellRef) {
            selectedVisualCell = cellRef || "";
            renderVisualWorkbench();
        }

        function renderVisualWorkbench() {
            const gridArea = document.getElementById("visualGridArea");
            if (!gridArea) return;
            const grid = getCurrentVisualGrid();
            const message = grid?.message || "";
            const rows = Number(grid?.rows || 0);
            const cols = Number(grid?.cols || 0);
            const cells = Array.isArray(grid?.cells) ? grid.cells : [];
            if (!rows || !cols || !cells.length) {
                gridArea.className = "config-empty";
                gridArea.innerHTML = escapeHtml(message || "当前映射尚未绑定模板文件。");
                renderVisualDetail(null);
                return;
            }

            const byCell = {};
            cells.forEach((cell) => { byCell[cell.cell] = cell; });
            const mergeLookup = buildMergeLookup(grid);
            const header = Array.from({ length: cols }, (_, index) => `<th>${columnName(index + 1)}</th>`).join("");
            const bodyRows = [];
            for (let row = 1; row <= rows; row += 1) {
                const tds = [];
                for (let col = 1; col <= cols; col += 1) {
                    const cellRef = `${columnName(col)}${row}`;
                    if (mergeLookup.skip.has(cellRef)) continue;
                    const cell = byCell[cellRef] || { cell: cellRef, display_value: "" };
                    const hasText = Boolean(cell.display_value || cell.value);
                    const hasV4 = Boolean(cell.candidate_field_key || cell.intent_type);
                    const mergeSize = mergeLookup.start[cellRef] || {};
                    const rowspan = Number(mergeSize.rowspan || 1);
                    const colspan = Number(mergeSize.colspan || 1);
                    const classes = [
                        "visual-cell",
                        hasText ? "has-text" : "",
                        hasV4 ? "has-v4" : "",
                        cell.is_merged ? "merged-cell" : "",
                        selectedVisualCell === cellRef ? "selected" : "",
                    ].filter(Boolean).join(" ");
                    const spanAttrs = `${rowspan > 1 ? ` rowspan="${rowspan}"` : ""}${colspan > 1 ? ` colspan="${colspan}"` : ""}`;
                    tds.push(`<td class="${classes}"${spanAttrs} style="${visualCellStyle(cell)}" onclick="selectVisualCell('${escapeHtml(cellRef)}')" title="${escapeHtml(cellRef)}">${escapeHtml(cell.display_value || "")}</td>`);
                }
                bodyRows.push(`<tr><th class="row-head">${row}</th>${tds.join("")}</tr>`);
            }

            gridArea.className = "visual-grid-wrap";
            gridArea.innerHTML = `
                <table class="visual-grid">
                    <thead><tr><th class="corner-cell"></th>${header}</tr></thead>
                    <tbody>${bodyRows.join("")}</tbody>
                </table>
            `;
            renderVisualDetail(findVisualCell(selectedVisualCell));
        }

        function sectionContainsCell(section, cell) {
            const point = cellToPoint(cell);
            const bounds = section?.bounds || {};
            const startRow = Number(bounds.start_row);
            const endRow = Number(bounds.end_row);
            const startCol = Number(bounds.start_col);
            const endCol = Number(bounds.end_col);
            if (!point || !startRow || !endRow || !startCol || !endCol) return false;
            return point.row >= startRow && point.row <= endRow && point.col >= startCol && point.col <= endCol;
        }

        function findSectionForCell(sections, cell) {
            return sections.find((section) => sectionContainsCell(section, cell)) || null;
        }

        function mergeLabelSources(labels, structureLabels) {
            const byCell = new Map();
            structureLabels.forEach((item) => {
                const cell = readCell(item);
                if (cell) byCell.set(normalizeCell(cell), { ...item });
            });
            labels.forEach((item) => {
                const cell = readCell(item);
                if (!cell) return;
                const key = normalizeCell(cell);
                byCell.set(key, { ...(byCell.get(key) || {}), ...item });
            });
            return Array.from(byCell.values());
        }

        function collectSectionCells(section) {
            const values = [];
            const pools = [section?.cells, section?.items, section?.labels, section?.fields];
            pools.forEach((pool) => {
                if (!Array.isArray(pool)) return;
                pool.forEach((item) => {
                    if (typeof item === "string") values.push(item);
                    else values.push(readCell(item));
                });
            });
            return values.map(normalizeCell).filter(Boolean);
        }

        function buildSectionLookup(sections) {
            const lookup = {};
            sections.forEach((section) => {
                collectSectionCells(section).forEach((cell) => {
                    if (!lookup[cell]) lookup[cell] = section;
                });
            });
            return lookup;
        }

        function rowsFromSections(sections) {
            const rows = [];
            sections.forEach((section) => {
                const sectionName = readSectionName(section);
                const sectionKey = readSectionKey(section);
                const pools = [section?.cells, section?.items, section?.labels, section?.fields];
                pools.forEach((pool) => {
                    if (!Array.isArray(pool)) return;
                    pool.forEach((item) => {
                        if (typeof item === "string") {
                            rows.push({ cell: item, text: "", section: sectionName, sectionKey, type: "" });
                        } else {
                            rows.push({ cell: readCell(item), text: readText(item), section: item?.section || item?.section_name || sectionName, sectionKey: item?.section_key || sectionKey, type: readType(item) });
                        }
                    });
                });
                if (!rows.some((row) => row.section === sectionName)) {
                    rows.push({ cell: "", text: section?.source_region_name || "", section: sectionName, sectionKey, type: section?.section_type || section?.semantic_type || "" });
                }
            });
            return rows;
        }

        function buildConfigRows(labels, structureLabels, sections) {
            const sectionLookup = buildSectionLookup(sections);
            const mergedLabels = mergeLabelSources(labels, structureLabels);
            const labelRows = mergedLabels.map((item) => {
                const cell = readCell(item);
                const sectionMatch = sectionLookup[normalizeCell(cell)] || findSectionForCell(sections, cell);
                const sectionKey = item?.section_key || readSectionKey(sectionMatch || {});
                return { cell, text: readText(item), section: item?.section || item?.section_name || readSectionName(sectionMatch || {}), sectionKey, type: readType(item) };
            }).filter((row) => row.cell || row.text);
            const rows = labelRows.length ? labelRows : rowsFromSections(sections);
            const seen = new Set();
            return rows.filter((row) => {
                const key = `${normalizeCell(row.cell)}|${row.text}|${row.section}|${row.type}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return row.cell || row.text;
            });
        }

        function applySavedConfiguration(rows, savedConfiguration, mappingCandidates) {
            const saved = savedConfiguration && typeof savedConfiguration === "object" ? savedConfiguration : {};
            const candidatesByCell = {};
            (Array.isArray(mappingCandidates) ? mappingCandidates : []).forEach((candidate) => {
                const key = normalizeCell(candidate?.cell);
                if (key) candidatesByCell[key] = candidate;
            });
            let naturalOrder = 0;
            return rows.map((row) => {
                naturalOrder += 1;
                const key = normalizeCell(row.cell);
                const item = key ? saved[key] || {} : {};
                const candidate = key ? candidatesByCell[key] || {} : {};
                const savedOrder = Number(item.display_order);
                const confidence = Number(item.candidate_confidence || candidate.confidence || 0);
                const confidenceBreakdown = item.confidence_breakdown && typeof item.confidence_breakdown === "object"
                    ? item.confidence_breakdown
                    : (candidate.confidence_breakdown && typeof candidate.confidence_breakdown === "object" ? candidate.confidence_breakdown : {});
                return {
                    ...row,
                    configLabel: typeof item.label === "string" && item.label.trim() ? item.label : row.text,
                    showInWorkspace: typeof item.show_in_workspace === "boolean" ? item.show_in_workspace : true,
                    displayOrder: Number.isFinite(savedOrder) && savedOrder > 0 ? savedOrder : naturalOrder,
                    candidateFieldKey: item.candidate_field_key || candidate.field_key || "",
                    candidateFieldLabel: item.candidate_field_label || candidate.field_label || "",
                    candidateConfidence: Number.isFinite(confidence) && confidence > 0 ? confidence : 0,
                    candidateSource: item.candidate_source || candidate.source || "",
                    candidateReason: item.candidate_reason || candidate.candidate_reason || "",
                    confidenceBreakdown,
                    intentType: item.intent_type || candidate.intent_type || "unknown",
                    writeMode: item.write_mode || candidate.write_mode || "skip",
                    labelCell: item.label_cell || candidate.label_cell || row.cell || "",
                    targetCell: item.target_cell || candidate.target_cell || "",
                    optionValue: item.option_value || candidate.option_value || "",
                    intentConfidence: Number(item.intent_confidence || candidate.intent_confidence || 0),
                    intentReason: item.intent_reason || candidate.intent_reason || "",
                    aiExtractHint: item.ai_extract_hint || candidate.ai_extract_hint || "",
                };
            });
        }

        function parseObjectJson(value) {
            try { return JSON.parse(value || "{}"); } catch (_) { return {}; }
        }

        function formatConfidenceBreakdown(breakdown) {
            const data = breakdown && typeof breakdown === "object" ? breakdown : {};
            const labels = { keyword: "keyword", section: "section", neighbor: "neighbor", reading_order: "reading" };
            const parts = Object.entries(labels).map(([key, label]) => {
                const value = Number(data[key] || 0);
                return value > 0 ? `${label}:${value.toFixed(2)}` : "";
            }).filter(Boolean);
            return parts.join(" / ") || "-";
        }

        const INTENT_TYPE_OPTIONS = [
            "title", "section_header", "label_fill_right", "label_fill_below", "inline_fill_after_colon",
            "option_checkbox", "option_text_choice", "table_column_header", "table_row_field",
            "note_instruction", "image_area", "attachment_hint", "readonly_example", "unknown"
        ];
        const WRITE_MODE_OPTIONS = [
            "none", "write_right_cell", "write_below_cell", "append_after_colon", "check_option",
            "select_option_text", "write_table_column", "write_row_field", "skip"
        ];

        function renderSelectOptions(options, selectedValue, labels = {}) {
            const selected = String(selectedValue || "");
            return options.map((option) => {
                const label = labels[option] || option;
                return `<option value="${escapeHtml(option)}" ${option === selected ? "selected" : ""}>${escapeHtml(label)}</option>`;
            }).join("");
        }

        function collectEditableConfiguration() {
            return Array.from(document.querySelectorAll("#templateConfigArea tbody tr[data-cell]")).map((row) => {
                const cell = row.dataset.cell || "";
                const labelInput = row.querySelector("input[data-config-field='label']");
                const showInput = row.querySelector("input[data-config-field='show']");
                const orderInput = row.querySelector("input[data-config-field='order']");
                const fieldKeyInput = row.querySelector("input[data-config-field='field_key']");
                const debugRow = row.nextElementSibling && row.nextElementSibling.classList.contains("debug-row")
                    ? row.nextElementSibling
                    : null;
                const detailRoot = debugRow || row;
                const hintInput = detailRoot.querySelector("input[data-config-field='ai_extract_hint']");
                const intentTypeInput = detailRoot.querySelector("[data-config-field='intent_type']");
                const writeModeInput = detailRoot.querySelector("[data-config-field='write_mode']");
                const targetCellInput = detailRoot.querySelector("input[data-config-field='target_cell']");
                const optionValueInput = detailRoot.querySelector("input[data-config-field='option_value']");
                return {
                    cell, label: labelInput ? labelInput.value.trim() : "",
                    show_in_workspace: showInput ? showInput.checked : true,
                    display_order: orderInput ? Number(orderInput.value || 0) : 0,
                    candidate_field_key: fieldKeyInput ? fieldKeyInput.value.trim() : "",
                    candidate_confidence: Number(row.dataset.candidateConfidence || 0),
                    candidate_source: row.dataset.candidateSource || "",
                    candidate_reason: row.dataset.candidateReason || "",
                    confidence_breakdown: parseObjectJson(row.dataset.confidenceBreakdown || "{}"),
                    intent_type: intentTypeInput ? intentTypeInput.value.trim() : (row.dataset.intentType || ""),
                    write_mode: writeModeInput ? writeModeInput.value.trim() : (row.dataset.writeMode || ""),
                    label_cell: row.dataset.labelCell || "",
                    target_cell: targetCellInput ? targetCellInput.value.trim() : (row.dataset.targetCell || ""),
                    option_value: optionValueInput ? optionValueInput.value.trim() : (row.dataset.optionValue || ""),
                    intent_confidence: Number(row.dataset.intentConfidence || 0),
                    intent_reason: row.dataset.intentReason || "",
                    ai_extract_hint: hintInput ? hintInput.value.trim() : "",
                };
            }).filter((item) => item.cell);
        }

        function buildConfigSections(rows, layoutSections, savedSectionConfiguration) {
            const saved = savedSectionConfiguration && typeof savedSectionConfiguration === "object" ? savedSectionConfiguration : {};
            const layoutByKey = {};
            layoutSections.forEach((section, index) => {
                const key = readSectionKey(section);
                if (!layoutByKey[key]) { layoutByKey[key] = { section, naturalOrder: Number(section?.order || index + 1) }; }
            });
            const groups = {};
            rows.forEach((row, index) => {
                const key = row.sectionKey || "other";
                if (!groups[key]) {
                    const layout = layoutByKey[key] || {};
                    const section = layout.section || {};
                    const sectionConfig = saved[key] || {};
                    const savedOrder = Number(sectionConfig.section_order);
                    groups[key] = {
                        key,
                        title: row.section || readSectionName(section) || "其他字段",
                        sectionLabel: typeof sectionConfig.section_label === "string" && sectionConfig.section_label.trim()
                            ? sectionConfig.section_label
                            : (row.section || readSectionName(section) || "其他字段"),
                        sectionOrder: Number.isFinite(savedOrder) && savedOrder > 0 ? savedOrder : Number(layout.naturalOrder || index + 1),
                        rows: [],
                    };
                }
                groups[key].rows.push(row);
            });
            return Object.values(groups).sort((left, right) => {
                if (left.sectionOrder !== right.sectionOrder) return left.sectionOrder - right.sectionOrder;
                return String(left.title || "").localeCompare(String(right.title || ""), "zh-CN");
            });
        }

        function collectEditableSectionConfiguration() {
            return Array.from(document.querySelectorAll("#templateConfigArea .config-section[data-section-key]")).map((section) => {
                const sectionKey = section.dataset.sectionKey || "";
                const labelInput = section.querySelector("input[data-section-field='label']");
                const orderInput = section.querySelector("input[data-section-field='order']");
                return { section_key: sectionKey, section_label: labelInput ? labelInput.value.trim() : "", section_order: orderInput ? Number(orderInput.value || 0) : 0 };
            }).filter((item) => item.section_key);
        }

        async function saveTemplateConfiguration() {
            if (!selectedMappingId) { setStatus("请先选择映射。", "warning"); return; }
            const items = collectEditableConfiguration();
            const sections = collectEditableSectionConfiguration();
            if (!items.length) { setStatus("当前没有可保存的模板配置。", "warning"); return; }
            setStatus("正在保存模板配置...", "info");
            const result = await fetchJson(`/api/v4/template-profiles/${encodeURIComponent(selectedMappingId)}/configuration`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ items, sections }),
            });
            const cached = configByMappingId[selectedMappingId] || {};
            configByMappingId[selectedMappingId] = { ...cached, savedConfiguration: result.template_configuration || {}, savedSectionConfiguration: result.section_configuration || {} };
            if (result.profile) {
                selectedMapping = result.profile;
                mappings = mappings.map((item) => getMappingId(item) === selectedMappingId ? selectedMapping : item);
            }
            await loadVisualGrid(selectedMappingId);
            setStatus("模板配置已保存。", "success");
        }

        function toggleSection(headerEl) {
            const section = headerEl.closest(".config-section");
            const body = section.querySelector(".config-section-body");
            headerEl.classList.toggle("collapsed");
            body.classList.toggle("collapsed");
        }

        function renderConfig() {

            const structureLabels = Array.isArray(cached?.structureLabels) ? cached.structureLabels : [];
            const sections = Array.isArray(cached?.sections) ? cached.sections : (Array.isArray(selectedMapping?.layout_sections) ? selectedMapping.layout_sections : []);
            const rows = applySavedConfiguration(buildConfigRows(labels, structureLabels, sections), cached?.savedConfiguration, cached?.candidates);
            const configSections = buildConfigSections(rows, sections, cached?.savedSectionConfiguration);

            if (!rows.length) {
                area.className = "config-empty";
                area.textContent = "当前映射尚未生成模板配置。上传模板后，系统会分析模板结构，并在这里显示可填写单元格。";

            area.className = "";
            area.innerHTML = `

                        <div class="config-section-header collapsed" onclick="toggleSection(this)">
                            <span class="toggle-icon">▼</span>
                            <span class="config-section-title">${escapeHtml(section.title || section.key)}</span>
                            <span class="config-section-count">${section.rows.length}项</span>
                        </div>
                        <div class="config-section-body collapsed">
                            <table class="config-table">
                                <thead>
                                    <tr>
                                        <th class="cell-col">单元格</th>
                                        <th class="field-col">字段名</th>
                                        <th class="key-col">字段标识</th>
                                        <th class="show-col">显示</th>
                                        <th class="action-col">详情</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${section.rows.map((row) => `
                                        <tr ${row.cell ? `data-cell="${escapeHtml(normalizeCell(row.cell))}" data-candidate-confidence="${escapeHtml(row.candidateConfidence || 0)}" data-candidate-source="${escapeHtml(row.candidateSource || "")}" data-candidate-reason="${escapeHtml(row.candidateReason || "")}" data-confidence-breakdown="${escapeHtml(JSON.stringify(row.confidenceBreakdown || {}))}" data-intent-type="${escapeHtml(row.intentType || "")}" data-write-mode="${escapeHtml(row.writeMode || "")}" data-label-cell="${escapeHtml(row.labelCell || "")}" data-target-cell="${escapeHtml(row.targetCell || "")}" data-option-value="${escapeHtml(row.optionValue || "")}" data-intent-confidence="${escapeHtml(row.intentConfidence || 0)}" data-intent-reason="${escapeHtml(row.intentReason || "")}"` : ""}>
                                            <td>${escapeHtml(row.cell || "-")}</td>
                                            <td><input class="field-input" data-config-field="label" type="text" value="${escapeHtml(row.configLabel || "")}" ${row.cell ? "" : "disabled"}></td>
                                            <td><input class="candidate-input" data-config-field="field_key" type="text" value="${escapeHtml(row.candidateFieldKey || "")}" ${row.cell ? "" : "disabled"}></td>
                                            <td class="show-col"><input class="show-checkbox" data-config-field="show" type="checkbox" ${row.showInWorkspace ? "checked" : ""} ${row.cell ? "" : "disabled"}></td>
                                            <td class="action-col"><button class="small" type="button">详情</button></td>
                                        </tr>
                                        <tr class="debug-row" style="display:none;">
                                            <td colspan="5">
                                                <details class="debug-details" open>
                                                    <summary>智能推荐详情</summary>
                                                    <div class="debug-grid">
                                                        <div class="debug-item"><div class="debug-label">匹配可信度</div><div class="debug-value">${row.candidateConfidence ? row.candidateConfidence.toFixed(2) : "-"}</div></div>
                                                        <div class="debug-item"><div class="debug-label">推荐原因</div><div class="debug-value">${escapeHtml(row.candidateReason || "-")}</div></div>
                                                        <div class="debug-item"><div class="debug-label">可信度分析</div><div class="debug-value">${escapeHtml(formatConfidenceBreakdown(row.confidenceBreakdown))}</div></div>
                                                        <div class="debug-item"><div class="debug-label">AI提取提示</div><div class="debug-value">${escapeHtml(row.aiExtractHint || "-")}</div></div>
                                                        <div class="debug-item"><div class="debug-label">候选来源</div><div class="debug-value">${escapeHtml(row.candidateSource || "-")}</div></div>
                                                        <div class="debug-item"><div class="debug-label">标签单元格</div><div class="debug-value">${escapeHtml(row.labelCell || row.cell || "-")}</div></div>
                                                        <div class="debug-item"><div class="debug-label">意图可信度</div><div class="debug-value">${row.intentConfidence ? Number(row.intentConfidence).toFixed(2) : "-"}</div></div>
                                                        <div class="debug-item"><div class="debug-label">意图判断原因</div><div class="debug-value">${escapeHtml(row.intentReason || "-")}</div></div>
                                                        <div class="debug-item"><div class="debug-label">区域</div><div class="debug-value">${escapeHtml(row.section || "-")}</div></div>
                                                        <div class="debug-item"><div class="debug-label">类型</div><div class="debug-value">${escapeHtml(row.type || "-")}</div></div>
                                                        <div class="debug-item"><div class="debug-label">候选字段名</div><div class="debug-value">${escapeHtml(row.candidateFieldLabel || "-")}</div></div>
                                                    </div>
                                                    <div class="small" style="margin-top:10px;">系统自动判断仅供参考，可人工修正。</div>
                                                    <div class="debug-grid" style="margin-top:10px;">
                                                        <div class="debug-item">
                                                            <div class="debug-label">填写意图</div>
                                                            <select data-config-field="intent_type" ${row.cell ? "" : "disabled"}>${renderSelectOptions(INTENT_TYPE_OPTIONS, row.intentType || "unknown", INTENT_LABELS)}</select>
                                                        </div>
                                                        <div class="debug-item">
                                                            <div class="debug-label">写入策略</div>
                                                            <select data-config-field="write_mode" ${row.cell ? "" : "disabled"}>${renderSelectOptions(WRITE_MODE_OPTIONS, row.writeMode || "skip", WRITE_MODE_LABELS)}</select>
                                                        </div>
                                                        <div class="debug-item">
                                                            <div class="debug-label">目标单元格</div>
                                                            <input data-config-field="target_cell" type="text" value="${escapeHtml(row.targetCell || "")}" ${row.cell ? "" : "disabled"}>
                                                        </div>
                                                        <div class="debug-item">
                                                            <div class="debug-label">选项值</div>
                                                            <input data-config-field="option_value" type="text" value="${escapeHtml(row.optionValue || "")}" ${row.cell ? "" : "disabled"}>
                                                        </div>
                                                    </div>
                                                    <div style="margin-top:10px;"><label style="font-size:12px;color:#667085;margin-bottom:4px;">AI提取提示</label><input data-config-field="ai_extract_hint" type="text" value="${escapeHtml(row.aiExtractHint || "")}" style="min-height:32px;font-size:13px;" ${row.cell ? "" : "disabled"}></div>
                                                    <div style="margin-top:8px;display:none;"><input data-config-field="order" type="number" min="1" value="${escapeHtml(row.displayOrder || 1)}" ${row.cell ? "" : "disabled"}></div>
                                                </details>
                                            </td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `).join("")}
            `;

            area.querySelectorAll("button.small").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const tr = btn.closest("tr");
                    const debugRow = tr.nextElementSibling;
                    if (debugRow && debugRow.classList.contains("debug-row")) {
                        const shouldOpen = debugRow.style.display === "none";
                        debugRow.style.display = shouldOpen ? "table-row" : "none";
                        const details = debugRow.querySelector("details.debug-details");
                        if (details) details.open = shouldOpen;
                    }
                });
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            loadMappings().catch((error) => {
                setStatus(error.message || "映射加载失败", "error");
                updateCurrentState();
                renderConfig();
            });
        });

        window.addEventListener("unhandledrejection", (event) => {
            setInlineStatus("");
            setStatus(event.reason?.message || "操作失败", "error");
        });
    </script>
</body>
</html>
